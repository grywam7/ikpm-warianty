<template x-if="q">
<div class="wz" :class="step === 'wykonawcy' ? 'wz-wide' : ''">
  <!-- lista kroków: telefon — krok bieżący + „Kroki”; tablet — pasek kroków nad treścią; laptop i PC — kolumna po lewej -->
  <nav class="wz-steps" aria-label="Kroki wyceny">
    <div class="wz-compact d-md-none">
      <div>
        <span class="ikpm-meta">Krok <span x-text="stepIndex + 1"></span> z 8</span>
        <strong class="d-block" x-text="stepLabel"></strong>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" x-show="step !== 'sprawdz' && !isNew" @click="go('sprawdz')"><i class="bi bi-clipboard-check" aria-hidden="true"></i>Sprawdź</button>
        <button type="button" class="btn btn-outline-secondary" @click="showSteps = !showSteps" :aria-expanded="showSteps" aria-controls="wz-steplist">Kroki</button>
      </div>
      <div class="progress" role="progressbar" aria-label="Postęp kreatora" aria-valuemin="0" aria-valuemax="8" :aria-valuenow="stepIndex + 1">
        <div class="progress-bar" :style="`width: ${(stepIndex + 1) * 12.5}%`"></div>
      </div>
    </div>
    <ol class="ikpm-steps" id="wz-steplist" :class="showSteps ? '' : 'collapsed-sm'">
      <template x-for="(s, i) in STEPS" :key="s.key">
        <li>
          <button type="button" class="ikpm-step" :class="stepClass(s.key)" @click="go(s.key)" :aria-current="step === s.key ? 'step' : null" :disabled="isNew && s.key !== 'klient'">
            <span class="ikpm-step-num" aria-hidden="true" x-text="i + 1"></span>
            <span x-text="s.label"></span>
            <span class="visually-hidden" x-text="stepStateText(s.key)"></span>
          </button>
        </li>
      </template>
    </ol>
  </nav>

  <section class="wz-main" aria-labelledby="wz-h1">
    <p class="wz-lead" x-text="heading"></p>
    <h1 id="wz-h1" class="wz-h1" tabindex="-1" x-text="question"></h1>

    <template x-if="hasComments() && ['sprawdz', 'prace', 'wymiary', 'klient', 'pokoje'].includes(step)">
      <div class="alert alert-warning d-flex gap-2" role="note">
        <i class="bi bi-chat-left-text" aria-hidden="true"></i>
        <div class="flex-grow-1">
          <strong class="d-block">Uwagi klienta</strong>
          <p class="mb-1 text-pre" x-text="q.client_general_comment || '(brak komentarza ogólnego — sprawdź komentarze przy pokojach)'"></p>
          <template x-for="r in commentRooms" :key="r.id">
            <p class="mb-1"><strong x-text="r.name + ':'"></strong> <span x-text="r.client_comment"></span>
              <button type="button" class="btn btn-link p-0 align-baseline" x-show="step !== 'prace' || room?.id !== r.id" @click="roomId = r.id; go('prace', { fromCheck: step === 'sprawdz' })">Zmień prace w tym pokoju</button></p>
          </template>
        </div>
      </div>
    </template>

    <!-- ===================== 1. Klient ===================== -->
    <template x-if="step === 'klient'">
      <div>
        <p class="step-intro">Wybierz klienta z bazy albo dodaj nowego. Możesz przypisać klienta później.</p>
        <template x-if="q.client && clientRecord">
          <p class="step-intro">Aktualny klient: <a :href="link('screens/client-form.html?id=' + clientRecord.id + '&powrot=' + encodeURIComponent(location.href))" x-text="q.client.name"></a>
            <span class="ikpm-meta" x-text="' · ' + (q.client.email || 'bez adresu e-mail')"></span></p>
        </template>
        <label class="form-label" for="client-search">Szukaj klienta</label>
        <input id="client-search" class="form-control mb-3" type="search" x-model="clientSearch" autocomplete="off">
        <div class="ikpm-grid" style="--ikpm-grid-min: 16rem">
          <template x-for="c in clientList" :key="c.id">
            <button type="button" class="ikpm-choice" :aria-pressed="q.client?.name === c.name ? 'true' : 'false'" @click="pickClient(c)">
              <i class="bi bi-person" aria-hidden="true"></i>
              <span class="min-w-0"><strong class="d-block" x-text="c.name"></strong><span class="ikpm-meta d-block text-truncate" x-text="c.email || 'bez adresu e-mail'"></span></span>
            </button>
          </template>
        </div>
        <p class="mt-2 mb-0" x-show="!clientList.length">Brak klientów pasujących do wyszukiwania.</p>
        <div class="ikpm-grid mt-3" style="--ikpm-grid-min: 16rem">
          <button type="button" class="ikpm-choice" :aria-pressed="!q.client && laterPicked ? 'true' : 'false'" @click="pickClient(null)"><i class="bi bi-clock" aria-hidden="true"></i>Wybierz później</button>
          <button type="button" class="ikpm-choice" @click="newClientOpen = !newClientOpen" :aria-expanded="newClientOpen" aria-controls="new-client"><i class="bi bi-person-plus" aria-hidden="true"></i>Dodaj nowego klienta</button>
        </div>
        <div id="new-client" class="box mt-3" x-show="newClientOpen">
          <h2 class="box-title">Dodaj nowego klienta</h2>
          <div class="alert alert-danger d-flex gap-2" role="alert" x-show="newClientError"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="newClientError"></span></div>
          <div class="ikpm-grid" style="--ikpm-grid-min: 15rem">
            <div><label class="form-label" for="nc-name">Nazwa *</label><input id="nc-name" class="form-control" x-model="newClient.name" maxlength="100" required></div>
            <div><label class="form-label" for="nc-email">Email</label><input id="nc-email" class="form-control" type="email" x-model="newClient.email" maxlength="254"></div>
            <div><label class="form-label" for="nc-phone">Telefon</label><input id="nc-phone" class="form-control" type="tel" x-model="newClient.phone" placeholder="+48 600 000 000"></div>
            <div class="ikpm-span-all"><label class="form-label" for="nc-notes">Notatki</label><textarea id="nc-notes" class="form-control" x-model="newClient.notes"></textarea></div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-3 justify-content-end">
            <button type="button" class="btn btn-outline-secondary" @click="newClientOpen = false">Wróć</button>
            <button type="button" class="btn btn-primary" @click="addClient()">Utwórz i przypisz</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===================== 2. Pokoje ===================== -->
    <template x-if="step === 'pokoje'">
      <div>
        <template x-if="isWholeObject">
          <div class="alert alert-info d-flex gap-2"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Tryb prosty — wycena bez podziału na pokoje. Wszystkie prace są w jednym „wirtualnym” pokoju „Cały obiekt”.</span></div>
        </template>
        <ul class="ikpm-list" x-show="q.rooms.length">
          <template x-for="room in q.rooms" :key="room.id">
            <li class="room-edit">
              <div class="form-row">
                <div class="field">
                  <label class="form-label" :for="'room-name-' + room.id">Nazwa pokoju</label>
                  <input class="form-control" :id="'room-name-' + room.id" :value="room.name" maxlength="100" @change="renameRoom(room, $event.target.value)">
                </div>
                <button type="button" class="btn btn-outline-danger" @click="removeRoom(room)" :aria-label="'Usuń pokój: ' + room.name"><i class="bi bi-trash" aria-hidden="true"></i>Usuń pokój</button>
              </div>
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-2">
                <span class="ikpm-meta" x-text="roomInfo(room)"></span>
                <details class="save-template">
                  <summary>Zapisz jako szablon</summary>
                  <div class="form-row pt-1">
                    <div class="field"><label class="form-label" :for="'tpl-' + room.id">Nazwa szablonu</label>
                      <input class="form-control" :id="'tpl-' + room.id" :value="room.name" maxlength="100" :aria-describedby="'tpl-hint-' + room.id"></div>
                    <button type="button" class="btn btn-outline-primary" @click="saveRoomTemplate(room, document.getElementById('tpl-' + room.id).value)">Zapisz szablon</button>
                    <p class="form-text w-100 mb-0" :id="'tpl-hint-' + room.id">Nowy szablon z wymiarami i pracami pokoju (ilości tylko prac ręcznych).</p>
                  </div>
                </details>
              </div>
            </li>
          </template>
        </ul>
        <div class="ikpm-empty" x-show="!q.rooms.length"><i class="bi bi-door-open" aria-hidden="true"></i><p class="ikpm-empty-title">Brak pokoi</p><p>Dodaj pierwszy pokój, aby rozpocząć wycenę.</p></div>
        <h2 class="ikpm-section-title">Dodaj pokój</h2>
        <p class="ikpm-meta">Szablon pokoju wpisze typowe wymiary w puste pola i doda swoje prace.</p>
        <div class="ikpm-grid" style="--ikpm-grid-min: 17rem">
          <template x-for="t in templates" :key="t.key">
            <button type="button" class="ikpm-choice" @click="addRoomFromTemplate(t)">
              <i class="bi bi-grid-1x2" aria-hidden="true"></i>
              <span class="min-w-0 flex-grow-1"><strong class="d-block" x-text="'Szablon: ' + t.name"></strong><span class="ikpm-meta d-block" x-text="templateInfo(t)"></span></span>
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
          </template>
          <button type="button" class="ikpm-choice" @click="addEmptyRoom()"><i class="bi bi-square" aria-hidden="true"></i><span class="flex-grow-1"><strong class="d-block">Nowy pokój</strong><span class="ikpm-meta">bez prac, wymiary wpiszesz w następnym kroku</span></span><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
          <button type="button" class="ikpm-choice" x-show="!q.rooms.length" @click="addWholeObject()"><i class="bi bi-house" aria-hidden="true"></i><span><strong class="d-block">Cały obiekt (tryb prosty)</strong><span class="ikpm-meta">Wycena bez podziału na pokoje. Wszystkie prace będą przypisane do jednego „wirtualnego” pokoju.</span></span></button>
        </div>
      </div>
    </template>

    <!-- ===================== 3. Wymiary ===================== -->
    <template x-if="step === 'wymiary'">
      <div>
        <div class="ikpm-empty" x-show="!q.rooms.length"><i class="bi bi-door-open" aria-hidden="true"></i><p class="ikpm-empty-title">Brak pokoi</p><p>Dodaj pierwszy pokój, aby rozpocząć wycenę.</p><button type="button" class="btn btn-primary" @click="go('pokoje')">Przejdź do kroku „Pokoje”</button></div>
        <div class="room-chips" role="group" aria-label="Pokój" x-show="q.rooms.length > 1">
          <template x-for="r in q.rooms" :key="r.id">
            <button type="button" class="btn" :class="r.id === room?.id ? 'btn-primary' : 'btn-outline-primary'" :aria-pressed="r.id === room?.id ? 'true' : 'false'" @click="selectRoom(r.id)">
              <span x-text="r.name"></span><template x-if="r.client_comment"><span><i class="bi bi-chat-left-text" aria-hidden="true"></i><span class="visually-hidden">Komentarz klienta</span></span></template>
            </button>
          </template>
        </div>
        <template x-for="room in roomList" :key="room.id">
          <div>
            <p class="ikpm-meta">Pokój <span x-text="roomIndex + 1"></span> z <span x-text="q.rooms.length"></span></p>
            <template x-if="room.client_comment">
              <div class="alert alert-warning d-flex gap-2"><i class="bi bi-chat-left-text" aria-hidden="true"></i><span><strong>Komentarz klienta:</strong> <span x-text="room.client_comment"></span></span></div>
            </template>
            <div class="ikpm-grid" style="--ikpm-grid-min: 9rem">
              <template x-for="f in DIMENSIONS" :key="f">
                <div>
                  <label class="form-label" :for="'dim-' + f" x-text="DIM_LABELS[f]"></label>
                  <input class="form-control ikpm-num" :id="'dim-' + f" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" x-init="$el.value = room[f] ?? ''" @input="setDim(room, f, $el)">
                </div>
              </template>
            </div>
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" role="switch" id="irregular" :checked="room._irregular" @change="setIrregular(room, $el.checked)">
              <label class="form-check-label" for="irregular">Pokój nieregularny</label>
            </div>
            <div x-show="room._irregular" class="mt-2">
              <div class="ikpm-grid" style="--ikpm-grid-min: 9rem">
                <template x-for="f in OVERRIDES" :key="f">
                  <div>
                    <label class="form-label" :for="'ovr-' + f" x-text="OVERRIDE_LABELS[f]"></label>
                    <input class="form-control ikpm-num" :id="'ovr-' + f" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" :placeholder="computedArea(room, f)" aria-describedby="ovr-hint" x-init="$el.value = room[f] ?? ''" x-effect="if (!room._irregular) $el.value = ''" @input="setDim(room, f, $el)">
                  </div>
                </template>
              </div>
              <p class="form-text ikpm-measure" id="ovr-hint">Puste pole — wartość z wymiarów (podpowiedź w polu); sufit jak podłoga, ściany: obwód × wysokość − otwory. Wpisane ściany to powierzchnia netto — otworów się od nich nie odejmuje.</p>
            </div>
            <div class="box mt-3" aria-live="polite">
              <strong class="d-block mb-1">Z wymiarów wychodzi</strong>
              <ul class="list-inline mb-0"><template x-for="a in areaPreview(room)"><li class="list-inline-item me-3" x-text="a"></li></template></ul>
            </div>
            <template x-for="e in roomErrors(room)"><div class="alert alert-danger d-flex gap-2 mt-3 mb-0" role="alert"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="e"></span></div></template>
            <div class="mt-3">
              <label class="form-label" for="room-note">Notatka</label>
              <textarea class="form-control" id="room-note" placeholder="Np. stan ścian, ustalenia z klientem" aria-describedby="room-note-hint" x-init="$el.value = room.notes ?? ''" @change="room.notes = $el.value || null; save()"></textarea>
              <p class="form-text" id="room-note-hint"><i class="bi bi-lock" aria-hidden="true"></i> Wewnętrzna — nie trafia do oferty dla klienta.</p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ===================== 4. Prace ===================== -->
    <template x-if="step === 'prace'">
      <div>
        <div class="ikpm-empty" x-show="!q.rooms.length"><i class="bi bi-door-open" aria-hidden="true"></i><p class="ikpm-empty-title">Brak pokoi</p><p>Dodaj pierwszy pokój, aby rozpocząć wycenę.</p><button type="button" class="btn btn-primary" @click="go('pokoje')">Przejdź do kroku „Pokoje”</button></div>
        <div class="room-chips" role="group" aria-label="Pokój" x-show="q.rooms.length > 1">
          <template x-for="r in q.rooms" :key="r.id">
            <button type="button" class="btn" :class="r.id === room?.id ? 'btn-primary' : 'btn-outline-primary'" :aria-pressed="r.id === room?.id ? 'true' : 'false'" @click="selectRoom(r.id)">
              <span x-text="r.name"></span><span class="ikpm-chip" x-text="jobsText(r.jobs.length)"></span><template x-if="r.client_comment"><span><i class="bi bi-chat-left-text" aria-hidden="true"></i><span class="visually-hidden">Komentarz klienta</span></span></template>
            </button>
          </template>
        </div>
        <template x-for="room in roomList" :key="room.id">
          <div>
            <p class="d-flex flex-wrap align-items-center gap-1 column-gap-3 ikpm-meta">
              <span>Pokój <span x-text="roomIndex + 1"></span> z <span x-text="q.rooms.length"></span><span x-show="roomSize(room)" x-text="' · ' + roomSize(room)"></span></span>
              <button type="button" class="btn btn-link p-0" @click="go('wymiary', { fromCheck })" x-show="!isWholeObject"><i class="bi bi-rulers" aria-hidden="true"></i>Zmień wymiary</button>
              <button type="button" class="btn btn-link p-0" @click="toAddJob()"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj pracę</button>
            </p>
            <template x-if="room.client_comment">
              <div class="alert alert-warning d-flex gap-2"><i class="bi bi-chat-left-text" aria-hidden="true"></i><span><strong>Komentarz klienta:</strong> <span x-text="room.client_comment"></span></span></div>
            </template>
            <p x-show="!room.jobs.length">Brak prac w tym pokoju — dodaj je niżej.</p>
            <template x-for="g in roomGroups" :key="g.stage">
              <section class="stage-group" :aria-label="g.stage">
                <h2 x-text="g.stage"></h2>
                <ul class="ikpm-list">
                  <template x-for="job in g.jobs" :key="job.id">
                    <li class="job-row" :id="'job-' + job.id">
                      <div class="job-row-name">
                        <span x-text="job.name"></span>
                        <div class="chips">
                          <span class="ikpm-chip ikpm-chip-lg" x-show="isAuto(job)" title="Wyliczane automatycznie z wymiarów"><i class="bi bi-rulers" aria-hidden="true"></i><span x-text="job.area_type_label"></span></span>
                          <span class="ikpm-chip ikpm-chip-lg" x-show="!isAuto(job)"><i class="bi bi-pencil" aria-hidden="true"></i>Ręcznie</span>
                          <span class="ikpm-chip ikpm-chip-lg ikpm-tone-warning" x-show="changedJob(job)"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>Ilość zmieniona po doborze</span>
                        </div>
                      </div>
                      <div class="job-row-qty">
                        <div>
                          <label class="form-label mb-1" :for="'qty-' + job.id">Ilość (<span x-text="job.unit"></span>)</label>
                          <input class="form-control ikpm-num" :id="'qty-' + job.id" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" x-init="$el.value = job.quantity ?? ''" @input="setQty(job, $el)" @change="fixQty(job, $el)">
                        </div>
                      </div>
                      <div class="job-row-value">
                        <span class="ikpm-meta d-block">Wartość</span>
                        <strong class="ikpm-amount" title="Wartość dla klienta (z narzutem)" x-text="pln(line(job))"></strong>
                      </div>
                      <button type="button" class="btn btn-outline-secondary ikpm-btn-icon job-row-del" @click="removeJob(job)" :aria-label="'Usuń pracę: ' + job.name"><i class="bi bi-trash" aria-hidden="true"></i></button>
                      <!-- węższy wiersz: rozwijane „Cena ekipy i wykonawca”; szeroki (PC): to samo w wierszu, bez rozwijania -->
                      <div class="job-row-more" x-data="{ more: false }">
                        <button type="button" class="job-row-more-btn" :aria-expanded="more" :aria-controls="'more-' + job.id" @click="more = !more">Cena ekipy i wykonawca</button>
                        <div class="job-row-more-body" :id="'more-' + job.id" x-show="more">
                          <div class="job-row-price">
                            <label class="form-label mb-1" :for="'price-' + job.id">Cena ekipy za jednostkę (zł)</label>
                            <input class="form-control ikpm-num" :id="'price-' + job.id" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" :placeholder="'śr. ' + dec(job.average_price)" :aria-describedby="'price-hint-' + job.id" x-init="$el.value = job.contractor_price ?? ''" @change="setPrice(job, $el)">
                          </div>
                          <p class="job-row-crew ikpm-meta"><span x-text="materialPerUnit(job)"></span> · Wykonawca: <span x-text="job.contractor || '—'"></span></p>
                          <p class="form-text job-row-hint" :id="'price-hint-' + job.id">Puste pole — cena z cennika.</p>
                        </div>
                      </div>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
            <p class="d-flex justify-content-between border-top pt-2 mb-4"><span>Suma pokoju:</span><strong class="ikpm-amount" x-text="pln(roomSum(room))"></strong></p>

            <section id="add-job" class="box" aria-labelledby="h-add-job">
              <h2 class="box-title" id="h-add-job">Dodaj pracę</h2>
              <label class="form-label" for="job-search">Szukaj pracy</label>
              <input class="form-control mb-2" id="job-search" type="search" x-model="jobSearch" autocomplete="off" aria-describedby="job-search-hint">
              <p class="form-text" id="job-search-hint">Nazwa pracy albo etapu. Pokój ma każdą pracę najwyżej raz — prace, które już są w pokoju, nie pojawiają się na liście.</p>
              <template x-if="jobSearch.trim()">
                <ul class="ikpm-list">
                  <template x-for="j in availableJobs.slice(0, 40)" :key="j.id">
                    <li><button type="button" class="ikpm-row" @click="addJob(j)">
                      <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="j.name + ' (' + j.unit + ')'"></span><span class="ikpm-row-meta" x-text="j.stage + ' · ' + j.area_type_label"></span></span>
                      <span class="ikpm-row-end"><span class="text-primary fw-semibold"><i class="bi bi-plus-lg" aria-hidden="true"></i> Dodaj</span></span></button></li>
                  </template>
                  <li x-show="!availableJobs.length" class="ikpm-row">Brak prac pasujących do wyszukiwania.</li>
                </ul>
              </template>
              <template x-if="!jobSearch.trim()">
                <div>
                  <template x-for="g in availableGroups" :key="g.stage">
                    <details class="add-group">
                      <summary><span x-text="g.stage"></span><span class="ikpm-meta fw-normal" x-text="'(' + jobsText(g.jobs.length) + ' do wyboru)'"></span></summary>
                      <ul class="ikpm-list mb-2">
                        <template x-for="j in g.jobs" :key="j.id">
                          <li><button type="button" class="ikpm-row" @click="addJob(j)">
                            <span class="ikpm-row-main"><span class="ikpm-row-title fw-normal" x-text="j.name + ' (' + j.unit + ')'"></span><span class="ikpm-row-meta" x-text="j.area_type_label"></span></span>
                            <span class="ikpm-row-end"><span class="text-primary fw-semibold"><i class="bi bi-plus-lg" aria-hidden="true"></i> Dodaj</span></span></button></li>
                        </template>
                      </ul>
                    </details>
                  </template>
                  <template x-for="s in stagesFull" :key="s"><p class="ikpm-meta mb-1" x-text="s + ': Wszystkie prace etapu są w pokoju'"></p></template>
                </div>
              </template>
              <h3 class="h6 mt-3">Prace z szablonu</h3>
              <div class="d-flex flex-wrap gap-2">
                <template x-for="t in templates" :key="t.key">
                  <button type="button" class="btn btn-outline-primary" @click="addTemplateJobs(t)"><i class="bi bi-grid-1x2" aria-hidden="true"></i><span x-text="t.name + ' (' + jobsText(t.jobs.length) + ')'"></span></button>
                </template>
              </div>
            </section>
          </div>
        </template>
      </div>
    </template>

    <!-- ===================== 5. Wykonawcy ===================== -->
    <template x-if="step === 'wykonawcy'">
      <div>
        <div class="ikpm-empty" x-show="!jobsCount"><i class="bi bi-list-task" aria-hidden="true"></i><p class="ikpm-empty-title">Brak prac</p><p>Wycena nie ma jeszcze żadnych prac. Dodaj prace w edytorze.</p><button type="button" class="btn btn-primary" @click="go('prace')">Przejdź do kroku „Prace”</button></div>
        <template x-if="jobsCount && !plans">
          <div class="alert alert-secondary d-flex gap-2"><i class="bi bi-info-circle" aria-hidden="true"></i><span><strong>Prototyp:</strong> plany doboru są tu tylko gotowymi planami z danych aplikacji (szkice demonstracyjne i oferta po poprawce klienta). Dla tej wyceny i tych ilości prototyp nie ma planu — w aplikacji policzy go serwer.</span></div>
        </template>
        <template x-if="plans">
          <div>
            <template x-if="changedNames.length">
              <div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 column-gap-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                <span class="flex-grow-1" style="flex-basis: 20rem">Prace ze zmienioną ilością po doborze wykonawców: <span x-text="changedNames.join(', ')"></span>. Zastosuj plan ponownie — bez tego wyceny nie da się wysłać.
                  <template x-if="appliedPlan"><strong class="d-block mt-1" x-text="'Zastosowany: „' + appliedPlan.plan.label + '”'"></strong></template></span>
                <template x-if="appliedPlan"><button type="button" class="btn btn-primary" @click="askPlan(appliedPlan.key, appliedPlan.plan)">Zastosuj ponownie</button></template>
              </div>
            </template>
            <p class="ikpm-meta ikpm-measure">Plany pomijają ekipy o nietypowej dla danej pracy cenie, tempie lub jakości. Każdy plan zachowuje kolejność etapów; po zastosowaniu planu ceny ekip są zamrożone w wycenie.</p>
            <!-- tablet i szerzej: plany jako kolumny jednej tabeli (wiersze wyrównane, „Zastosuj” na górze); telefon: karty -->
            <div class="ikpm-table-box plan-compare d-none d-md-block" role="region" aria-labelledby="plan-compare-cap" tabindex="0">
              <table class="table">
                <caption class="visually-hidden" id="plan-compare-cap">Plany doboru wykonawców — porównanie</caption>
                <thead>
                  <tr>
                    <td></td>
                    <template x-for="p in plans" :key="p.key">
                      <th scope="col" :class="planColClass(p.key)" :id="'pc-' + p.key">
                        <span class="plan-name"><i class="bi text-primary" :class="'bi-' + PROFILE_ICONS[p.key]" aria-hidden="true"></i><span x-text="p.plan.label"></span></span>
                        <span class="d-flex flex-wrap gap-1 mt-1">
                          <span class="ikpm-chip ikpm-chip-lg ikpm-tone-accent" x-show="q.applied_profile_name === p.key"><i class="bi bi-check-circle" aria-hidden="true"></i>Zastosowany</span>
                          <span class="ikpm-chip ikpm-chip-lg" :title="'Pokrycie: ' + p.plan.summary.coverage_pct + '%'" x-text="p.plan.summary.coverage_pct + '%'"></span>
                        </span>
                      </th>
                    </template>
                  </tr>
                  <tr class="plan-apply">
                    <td></td>
                    <template x-for="p in plans" :key="p.key">
                      <td :class="planColClass(p.key)"><button type="button" class="btn" :class="planButtonClass(p.key)" @click="askPlan(p.key, p.plan)" :aria-label="planButtonText(p.key) + ': ' + p.plan.label" x-text="planButtonText(p.key)"></button></td>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <tr><th scope="row">Koszt ekip:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num fw-semibold" :class="planColClass(p.key)" x-text="pln(p.plan.summary.total_cost)"></td></template></tr>
                  <tr><th scope="row">Liczba ekip:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" :class="planColClass(p.key)" x-text="p.plan.summary.contractor_count"></td></template></tr>
                  <tr><th scope="row">Czas realizacji:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" :class="planColClass(p.key)"><span x-text="hours(p.plan.summary.makespan_hours)"></span><span class="d-block ikpm-meta text-wrap" x-text="workDays(p.plan.work_days) + ' z odbiorami etapów'"></span></td></template></tr>
                  <tr><th scope="row">Łącznie roboczogodzin:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" :class="planColClass(p.key)" x-text="hours(p.plan.summary.total_work_hours)"></td></template></tr>
                  <tr><th scope="row">Śr. jakość:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" :class="planColClass(p.key)" x-text="oneDec(p.plan.summary.avg_quality) + ' /10'"></td></template></tr>
                  <tr><th scope="row">Pokrycie:</th><template x-for="p in plans" :key="p.key"><td :class="planColClass(p.key)">
                    <div class="ikpm-progress"><div class="ikpm-num mb-1" x-text="p.plan.summary.coverage_pct + '%'"></div>
                      <div class="progress" role="progressbar" :aria-label="'Pokrycie: ' + p.plan.label" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="p.plan.summary.coverage_pct"><div class="progress-bar" :style="`width: ${p.plan.summary.coverage_pct}%`"></div></div></div>
                  </td></template></tr>
                  <tr><th scope="row">Wykonawcy:</th><template x-for="p in plans" :key="p.key"><td :class="planColClass(p.key)"><div class="d-flex flex-wrap gap-1"><template x-for="c in p.plan.summary.contractors_used" :key="c"><span class="ikpm-chip ikpm-chip-lg" x-text="c"></span></template></div></td></template></tr>
                  <template x-if="plans.some((p) => p.plan.summary.unassigned_job_names.length)">
                    <tr><th scope="row">Bez wykonawcy (brak w cenniku ekipy z ceną):</th><template x-for="p in plans" :key="p.key"><td :class="planColClass(p.key)" x-text="p.plan.summary.unassigned_job_names.join(', ') || '—'"></td></template></tr>
                  </template>
                  <tr><th scope="row">Harmonogram etapów:</th><template x-for="p in plans" :key="p.key"><td :class="planColClass(p.key)">
                    <ul class="stage-list"><template x-for="(s, i) in p.plan.stage_schedule" :key="s.stage">
                      <li><span x-text="s.stage + ': ' + hours(s.duration_hours) + ' → ' + hours(cumulative(p.plan)[i])"></span><div class="stage-bar" :style="`width: ${barWidth(p.plan, s)}`"></div></li>
                    </template></ul>
                  </td></template></tr>
                </tbody>
              </table>
            </div>
            <div class="ikpm-grid plan-grid d-md-none">
              <template x-for="p in plans" :key="p.key">
                <article class="card plan-card" :class="q.applied_profile_name === p.key ? 'ikpm-selected' : ''" :aria-labelledby="'plan-' + p.key">
                  <div class="card-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                      <h2 class="h3 mb-0 d-flex align-items-center gap-2" :id="'plan-' + p.key"><i class="bi text-primary" :class="'bi-' + PROFILE_ICONS[p.key]" aria-hidden="true"></i><span x-text="p.plan.label"></span></h2>
                      <div class="d-flex gap-1 flex-wrap">
                        <span class="ikpm-chip ikpm-chip-lg ikpm-tone-accent" x-show="q.applied_profile_name === p.key"><i class="bi bi-check-circle" aria-hidden="true"></i>Zastosowany</span>
                        <span class="ikpm-chip ikpm-chip-lg" :title="'Pokrycie: ' + p.plan.summary.coverage_pct + '%'" x-text="p.plan.summary.coverage_pct + '%'"></span>
                      </div>
                    </div>
                    <dl class="ikpm-dl ikpm-dl-num mb-0">
                      <dt>Koszt ekip:</dt><dd class="fw-semibold" x-text="pln(p.plan.summary.total_cost)"></dd>
                      <dt>Liczba ekip:</dt><dd x-text="p.plan.summary.contractor_count"></dd>
                      <dt>Czas realizacji:</dt><dd><span x-text="hours(p.plan.summary.makespan_hours)"></span><span class="d-block ikpm-meta" x-text="workDays(p.plan.work_days) + ' z odbiorami etapów'"></span></dd>
                      <dt>Łącznie roboczogodzin:</dt><dd x-text="hours(p.plan.summary.total_work_hours)"></dd>
                      <dt>Śr. jakość:</dt><dd x-text="oneDec(p.plan.summary.avg_quality) + ' /10'"></dd>
                    </dl>
                    <div class="ikpm-progress">
                      <div class="ikpm-progress-head"><span :id="'cov-' + p.key">Pokrycie:</span><span x-text="p.plan.summary.coverage_pct + '%'"></span></div>
                      <div class="progress" role="progressbar" :aria-labelledby="'cov-' + p.key" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="p.plan.summary.coverage_pct"><div class="progress-bar" :style="`width: ${p.plan.summary.coverage_pct}%`"></div></div>
                    </div>
                    <details>
                      <summary>Harmonogram etapów:</summary>
                      <ul class="list-unstyled ikpm-meta mb-0">
                        <template x-for="(s, i) in p.plan.stage_schedule" :key="s.stage">
                          <li class="mb-2"><span x-text="s.stage + ': ' + hours(s.duration_hours) + ' → ' + hours(cumulative(p.plan)[i])"></span><div class="stage-bar" :style="`width: ${barWidth(p.plan, s)}`"></div></li>
                        </template>
                      </ul>
                    </details>
                    <p class="ikpm-meta mb-0" x-show="p.plan.summary.unassigned_job_names.length">Bez wykonawcy (brak w cenniku ekipy z ceną): <span x-text="p.plan.summary.unassigned_job_names.join(', ')"></span></p>
                    <div>
                      <p class="ikpm-meta mb-1">Wykonawcy:</p>
                      <div class="d-flex flex-wrap gap-1"><template x-for="c in p.plan.summary.contractors_used" :key="c"><span class="ikpm-chip ikpm-chip-lg" x-text="c"></span></template></div>
                    </div>
                    <button type="button" class="btn btn-lg" :class="planButtonClass(p.key)" @click="askPlan(p.key, p.plan)" x-text="planButtonText(p.key)"></button>
                  </div>
                </article>
              </template>
            </div>
            <details class="box mt-4">
              <summary>Porównanie planów — harmonogram i kto robi co</summary>
              <h3 class="h6 mt-2">Harmonogram etapów — porównanie planów</h3>
              <div class="ikpm-table-box mb-3" tabindex="0" role="region" aria-label="Harmonogram etapów — porównanie planów">
                <table class="table">
                  <thead><tr><th scope="col">Etap</th><template x-for="p in plans" :key="p.key"><th scope="col" class="ikpm-num" x-text="p.plan.label"></th></template></tr></thead>
                  <tbody>
                    <template x-for="s in compareStages" :key="s"><tr><th scope="row" x-text="s"></th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" x-text="crewHours(p.plan, s) !== undefined ? hours(crewHours(p.plan, s)) : '—'"></td></template></tr></template>
                    <tr class="ikpm-total-row"><th scope="row">RAZEM</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num" x-text="hours(p.plan.summary.makespan_hours)"></td></template></tr>
                  </tbody>
                </table>
              </div>
              <h3 class="h6">Porównanie — kto robi co w każdym planie</h3>
              <div class="ikpm-table-box" tabindex="0" role="region" aria-label="Porównanie — kto robi co w każdym planie">
                <table class="table">
                  <thead><tr><th scope="col">Pokój</th><th scope="col">Praca</th><th scope="col" class="ikpm-num">Ilość</th><template x-for="p in plans" :key="p.key"><th scope="col" x-text="p.plan.label"></th></template></tr></thead>
                  <tbody><template x-for="r in compareRows" :key="r.id"><tr><td x-text="r.room"></td><td x-text="r.name"></td><td class="ikpm-num" x-text="r.qty"></td><template x-for="c in r.cells" :key="c.key"><td x-text="c.text"></td></template></tr></template></tbody>
                </table>
              </div>
            </details>
          </div>
        </template>
      </div>
    </template>

    <!-- ===================== 6. Termin ===================== -->
    <template x-if="step === 'termin'">
      <div>
        <div class="ikpm-grid" style="--ikpm-grid-min: 13rem">
          <div>
            <label class="form-label" for="start-on">Planowany start:</label>
            <input class="form-control" id="start-on" type="date" min="2000-01-01" max="2099-12-31" :value="term.start" @input="term.start = $event.target.value; termDirty = true">
          </div>
          <div>
            <label class="form-label" for="end-on">Termin zakończenia:</label>
            <input class="form-control" id="end-on" type="date" :min="term.start || '2000-01-01'" max="2099-12-31" :value="term.end" @input="term.end = $event.target.value; termDirty = true">
          </div>
        </div>
        <div class="alert alert-danger d-flex gap-2 mt-3" role="alert" x-show="dateError"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="dateError"></span></div>
        <div class="box mt-3 d-flex flex-wrap align-items-center gap-3">
          <template x-if="q.suggested_work_days && suggestedEnd">
            <p class="mb-0 flex-grow-1">Sugerowany: <strong x-text="dateText(suggestedEnd)"></strong> (<span x-text="workDays(q.suggested_work_days)"></span>)</p>
          </template>
          <template x-if="q.suggested_work_days && !suggestedEnd">
            <p class="mb-0 flex-grow-1" x-text="term.start ? 'Zapisz start, żeby przeliczyć sugestię' : workDays(q.suggested_work_days) + ' od startu'"></p>
          </template>
          <template x-if="!q.suggested_work_days">
            <p class="mb-0 flex-grow-1">Dobierz wykonawców, żeby dostać sugestię. <button type="button" class="btn btn-link p-0 align-baseline" @click="go('wykonawcy')">Przejdź do kroku „Wykonawcy”</button></p>
          </template>
          <button type="button" class="btn btn-primary btn-lg" x-show="suggestedEnd" :disabled="term.end === suggestedEnd" @click="useSuggested()">Użyj</button>
        </div>
        <div class="mt-3">
          <label class="form-label" for="site-address">Adres inwestycji:</label>
          <input class="form-control" id="site-address" :value="term.address" @input="term.address = $event.target.value; termDirty = true">
        </div>
        <div class="d-flex flex-wrap align-items-center gap-3 mt-3">
          <button type="button" class="btn btn-outline-primary" @click="saveTerm()">Zapisz</button>
          <span class="ikpm-save" :data-state="termDirty ? 'dirty' : 'saved'" aria-live="polite" x-show="termDirty || savedAt" x-text="termDirty ? 'Niezapisane zmiany' : 'Zapisano ' + savedAt"></span>
        </div>
        <p class="form-text">„Dalej” też zapisuje termin i adres.</p>
      </div>
    </template>

    <!-- ===================== 7. Sprawdź ===================== -->
    <template x-if="step === 'sprawdz'">
      <div>
        <section class="mb-4" aria-labelledby="chk-gates">
          <h2 class="ikpm-section-title" id="chk-gates">Przed wysłaniem</h2>
          <template x-if="!problems.length"><div class="alert alert-success d-flex gap-2 mb-0"><i class="bi bi-check-circle-fill" aria-hidden="true"></i><span>Wszystko gotowe do wysłania.</span></div></template>
          <template x-if="problems.length">
            <ul class="list-unstyled mb-0">
              <template x-for="p in problems" :key="p.msg">
                <li class="alert alert-danger d-flex flex-wrap gap-2 align-items-center"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span class="flex-grow-1" style="flex-basis: 16rem" x-text="p.msg"></span><button type="button" class="btn btn-outline-danger bg-white" @click="change(p.step)">Popraw</button></li>
              </template>
            </ul>
          </template>
        </section>
        <p class="ikpm-meta">Każdą część zmienisz przyciskiem „Zmień” — wrócisz tu jednym kliknięciem.</p>
        <div class="ikpm-grid" style="--ikpm-grid-min: 20rem">
          <section class="box" aria-labelledby="chk-client">
            <div class="box-head"><h2 class="box-title" id="chk-client">Klient</h2><button type="button" class="btn btn-outline-primary btn-sm" @click="change('klient')" aria-label="Zmień: Klient">Zmień</button></div>
            <p class="mb-0" x-show="q.client"><span x-text="q.client?.name"></span><span class="d-block ikpm-meta" x-text="[q.client?.email || 'bez adresu e-mail', q.client?.phone].filter(Boolean).join(' · ')"></span></p>
            <p class="mb-0" x-show="!q.client">(nie przypisano)</p>
          </section>
          <section class="box" aria-labelledby="chk-term">
            <div class="box-head"><h2 class="box-title" id="chk-term">Termin</h2><button type="button" class="btn btn-outline-primary btn-sm" @click="change('termin')" aria-label="Zmień: Termin">Zmień</button></div>
            <dl class="ikpm-dl">
              <dt>Planowany start</dt><dd x-text="dateText(q.planned_start_on)"></dd>
              <dt>Termin zakończenia</dt><dd x-text="dateText(q.planned_end_on)"></dd>
              <dt>Adres inwestycji</dt><dd x-text="q.site_address || '—'"></dd>
            </dl>
          </section>
          <section class="box" aria-labelledby="chk-rooms">
            <div class="box-head"><h2 class="box-title" id="chk-rooms">Pokoje i wymiary</h2><button type="button" class="btn btn-outline-primary btn-sm" @click="change(isWholeObject ? 'pokoje' : 'wymiary')" aria-label="Zmień: Pokoje i wymiary">Zmień</button></div>
            <ul class="mb-0 ps-3"><template x-for="r in q.rooms" :key="r.id"><li><span x-text="r.name"></span><span x-show="roomSize(r)" class="ikpm-meta" x-text="' — ' + roomSize(r)"></span><span x-show="r.notes" class="ikpm-meta" x-text="' · Notatka: ' + r.notes"></span></li></template></ul>
          </section>
          <section class="box" aria-labelledby="chk-crews">
            <div class="box-head"><h2 class="box-title" id="chk-crews">Wykonawcy</h2><button type="button" class="btn btn-outline-primary btn-sm" @click="change('wykonawcy')" aria-label="Zmień: Wykonawcy">Zmień</button></div>
            <p class="mb-0"><span x-text="appliedLabel ? 'Plan doboru wykonawców: ' + appliedLabel : 'Nie dobrano wykonawców'"></span><span x-show="withoutCrew" x-text="' · bez wykonawcy: ' + jobsText(withoutCrew)"></span></p>
            <template x-if="changedNames.length">
              <p class="mb-0 mt-2"><span class="ikpm-chip ikpm-chip-lg ikpm-tone-warning"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>Ilość zmieniona po doborze</span> <span class="ikpm-meta" x-text="changedNames.join(', ')"></span></p>
            </template>
          </section>
        </div>
        <section class="box mt-3" aria-labelledby="chk-jobs">
          <div class="box-head"><h2 class="box-title" id="chk-jobs">Prace</h2><button type="button" class="btn btn-outline-primary btn-sm" @click="change('prace')" aria-label="Zmień: Prace">Zmień</button></div>
          <ul class="mb-2 ps-3"><template x-for="r in q.rooms" :key="r.id"><li><span x-text="r.name + ': ' + jobsText(r.jobs.length)"></span> — <span class="ikpm-amount" x-text="pln(roomSum(r))"></span></li></template></ul>
          <details>
            <summary>Wszystkie prace w wycenie</summary>
            <dl class="ikpm-dl mb-3">
              <dt>Pokoje</dt><dd x-text="q.rooms.length"></dd>
              <dt>Prace</dt><dd x-text="jobsCount"></dd>
              <dt>m² łącznie</dt><dd x-text="dec(floorTotal)"></dd>
              <dt>Wartość</dt><dd class="ikpm-amount" x-text="pln(sums.net)"></dd>
            </dl>
            <template x-for="g in allStages" :key="g.stage">
              <div class="ikpm-table-box mb-3">
                <table class="table ikpm-stack">
                  <caption class="visually-hidden" x-text="g.stage"></caption>
                  <thead><tr><th scope="col" x-text="g.stage"></th><th scope="col">Pokój</th><th scope="col" class="ikpm-num">Ilość</th><th scope="col" class="ikpm-num">Cena/j.</th><th scope="col" class="ikpm-num">Wartość</th></tr></thead>
                  <tbody><template x-for="j in g.jobs" :key="j.id"><tr><td class="ikpm-cell-lead" x-text="j.name"></td><td data-label="Pokój" x-text="j.room"></td><td class="ikpm-num" data-label="Ilość" x-text="qtyText(j.quantity, j.unit)"></td><td class="ikpm-num" data-label="Cena/j." x-text="pln(unitPrice(j))"></td><td class="ikpm-num" data-label="Wartość" x-text="pln(line(j))"></td></tr></template></tbody>
                  <tfoot><tr><th scope="row" colspan="4">Suma etapu:</th><td class="ikpm-num" x-text="pln(stageSum(g))"></td></tr></tfoot>
                </table>
              </div>
            </template>
          </details>
        </section>
        <section class="box mt-3" aria-labelledby="chk-sums">
          <h2 class="box-title" id="chk-sums">Kwoty</h2>
          <div class="ikpm-grid" style="--ikpm-grid-min: 11rem">
            <div>
              <label class="form-label" for="markup">Narzut (%)</label>
              <input class="form-control ikpm-num" id="markup" type="number" inputmode="decimal" step="0.01" min="0" max="1000" aria-describedby="markup-hint" x-init="$el.value = Number(q.markup_percent)" @input="setMarkup($el)">
              <span class="form-text d-block" id="markup-hint" title="Marża jako % ceny dla klienta — wynika z narzutu" x-text="marginLine"></span>
            </div>
            <div>
              <label class="form-label" for="vat">VAT:</label>
              <select class="form-select" id="vat" @change="setVat($event.target.value)">
                <template x-for="v in kit.labels.vat_rates" :key="v"><option :value="v" :selected="Number(q.vat_rate) === v" x-text="v + '%'"></option></template>
              </select>
            </div>
          </div>
          <div class="ikpm-grid mt-3" style="--ikpm-grid-min: 16rem">
            <dl class="ikpm-dl ikpm-dl-num">
              <dt>Koszt:</dt><dd x-text="pln(sums.cost)"></dd>
              <dt>Marża:</dt><dd x-text="pln(sums.margin)"></dd>
            </dl>
            <dl class="ikpm-totals">
              <div><dt>Razem netto</dt><dd x-text="pln(sums.net)"></dd></div>
              <div><dt x-text="vatLabel()"></dt><dd x-text="pln(sums.vat)"></dd></div>
              <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="pln(sums.gross)"></dd></div>
            </dl>
          </div>
        </section>
        <section class="box mt-3">
          <label class="form-label" for="quote-notes">Notatki (klient ich nie widzi)</label>
          <textarea class="form-control" id="quote-notes" x-init="$el.value = q.notes ?? ''" @change="q.notes = $el.value || null; save()"></textarea>
        </section>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <a class="btn btn-outline-secondary" :href="link('screens/quote-show.html?id=' + q.id)"><i class="bi bi-eye" aria-hidden="true"></i>Podgląd</a>
          <a class="btn btn-outline-secondary" :href="link('screens/quote-pdf.html?id=' + q.id)" target="_blank"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>PDF</a>
        </div>
      </div>
    </template>

    <!-- ===================== 8. Wyślij ===================== -->
    <template x-if="step === 'wyslij'">
      <div>
        <template x-if="problems.length">
          <div>
            <p>Tej wyceny nie da się jeszcze wysłać:</p>
            <ul class="list-unstyled">
              <template x-for="p in problems" :key="p.msg">
                <li class="alert alert-danger d-flex flex-wrap gap-2 align-items-center"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span class="flex-grow-1" style="flex-basis: 16rem" x-text="p.msg"></span><button type="button" class="btn btn-outline-danger bg-white" @click="change(p.step)">Popraw</button></li>
              </template>
            </ul>
          </div>
        </template>
        <template x-if="!problems.length">
          <div class="ikpm-grid" style="--ikpm-grid-min: 20rem; align-items: start">
            <div>
              <p class="fs-5">Termin zakończenia: <strong x-text="dateText(q.planned_end_on)"></strong>.<span x-show="hasComments()"> Uwagi klienta trafią do notatek wyceny.</span></p>
              <h2 class="h3">Co się stanie</h2>
              <ul class="ikpm-dialog-consequences mb-0">
                <li>Klient dostanie e-mail z PDF „wycena-<span x-text="q.id"></span>.pdf” i linkiem do oferty — link działa 30 dni od wysyłki.</li>
                <li>Ceny zostaną zamrożone — późniejsze zmiany cennika nie zmienią oferty.</li>
                <li>Status zmieni się na „Wysłana”. Wycenę zmienisz dopiero po „Przywróć do edycji”.</li>
                <li x-show="hasComments()">Uwagi klienta przejdą do notatek wyceny i znikną z pokoi.</li>
              </ul>
            </div>
            <div class="card"><div class="card-body">
              <h2 class="card-title h3">Klient zobaczy w ofercie:</h2>
              <dl class="ikpm-totals">
                <div><dt>Razem netto</dt><dd x-text="pln(sums.net)"></dd></div>
                <div><dt x-text="vatLabel()"></dt><dd x-text="pln(sums.vat)"></dd></div>
                <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="pln(sums.gross)"></dd></div>
              </dl>
            </div></div>
          </div>
        </template>
      </div>
    </template>

    <div class="alert alert-danger d-flex gap-2 mt-3" role="alert" x-show="stepError"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="stepError"></span></div>

    <div class="ikpm-actionbar">
      <div class="ikpm-actionbar-total"><span>Razem netto</span><span class="ikpm-amount-lg" x-text="pln(sums.net)"></span></div>
      <div class="ikpm-actionbar-actions">
        <button type="button" class="btn btn-outline-secondary btn-lg" @click="back()"><i class="bi bi-arrow-left" aria-hidden="true"></i>Wstecz</button>
        <button type="button" class="btn btn-lg" :class="nextPrimary ? 'btn-primary' : 'btn-outline-primary'" @click="next()" :disabled="step === 'wyslij' && problems.length > 0">
          <span x-text="nextLabel"></span><i class="bi" :class="step === 'wyslij' ? 'bi-send' : 'bi-arrow-right'" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- podsumowanie na żywo: kwoty na górze, żeby komunikat w prawym dolnym rogu ich nie zasłaniał -->
  <aside class="wz-aside" aria-label="Podsumowanie wyceny">
    <div class="box" tabindex="0">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
        <h2 class="h3 mb-0" x-text="q.id ? 'Wycena #' + q.id : 'Nowa wycena'"></h2>
        <span x-html="badge('quote', q.status)"></span>
      </div>
      <p class="mb-3 ikpm-meta" x-text="q.client ? q.client.name : '(brak klienta)'"></p>
      <div class="live-total" aria-live="polite">
        <span class="fw-semibold">Suma netto</span><span class="ikpm-amount-lg" x-text="pln(sums.net)"></span>
      </div>
      <dl class="ikpm-dl ikpm-dl-num mt-1 mb-3">
        <dt x-text="vatLabel()"></dt><dd x-text="pln(sums.vat)"></dd>
        <dt>Brutto:</dt><dd class="fw-semibold" x-text="pln(sums.gross)"></dd>
      </dl>
      <dl class="ikpm-dl ikpm-dl-num mb-3">
        <dt>Pokoje:</dt><dd x-text="q.rooms.length"></dd>
        <dt>Prace:</dt><dd x-text="jobsCount"></dd>
        <dt>Koszt:</dt><dd x-text="pln(sums.cost)"></dd>
        <dt>Narzut:</dt><dd x-text="percentText(q.markup_percent)"></dd>
        <dt>Marża:</dt><dd x-text="pln(sums.margin)"></dd>
        <dt>Plan doboru:</dt><dd x-text="appliedLabel || '—'"></dd>
        <dt>Termin:</dt><dd x-text="dateText(q.planned_end_on)"></dd>
      </dl>
      <ul class="live-rooms">
        <template x-for="r in q.rooms" :key="r.id">
          <li><span class="min-w-0"><span x-text="r.name"></span><span class="d-block ikpm-meta" x-text="[roomSize(r), jobsText(r.jobs.length)].filter(Boolean).join(' · ')"></span></span><span x-text="pln(roomSum(r))"></span></li>
        </template>
        <li x-show="!q.rooms.length">Brak pokoi.</li>
      </ul>
      <p class="mt-2 mb-0" x-show="savedAt"><span class="ikpm-save" data-state="saved" x-text="'Zapisano ' + savedAt"></span></p>
    </div>
  </aside>
</div>
</template>
