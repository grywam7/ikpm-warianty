<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oferta — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="public">
  <!-- Strona klienta /q/:token — bez logowania; klient nigdy nie widzi kosztu, narzutu, ekip ani notatek. -->
  <header class="public-bar"><div class="container-xxl"><strong class="fs-4">IKPM</strong></div></header>
  <main id="main"><div id="app" class="container-xxl" x-data="page" x-cloak style="max-width: 960px">
    <template x-if="q && q.status === 'draft'">
      <div class="list-card mt-4"><h1 class="h3">Oferta jest aktualizowana</h1><p class="mb-0">Otrzymają Państwo nową wiadomość, gdy będzie gotowa.</p></div>
    </template>
    <template x-if="q && q.status !== 'draft'">
      <div>
        <div class="alert alert-success mt-3" role="status" x-show="message" x-text="message"></div>
        <h1 class="page-title mb-1">Wycena #<span x-text="q.id"></span></h1>
        <p class="mb-3">Wysłana: <span x-text="dateTimeText(q.sent_at)"></span></p>
        <div class="row g-3">
          <div class="col-md-6"><div class="list-card h-100">
            <p class="mb-0"><strong x-text="from?.display_name || 'Zespół IKPM'"></strong><span class="d-block" x-show="from" x-text="from?.email"></span></p>
          </div></div>
          <div class="col-md-6"><div class="list-card h-100">
            <h2 class="h6">Klient</h2>
            <p class="mb-2"><span x-text="q.client?.name"></span><span class="d-block" x-text="q.client?.email"></span></p>
            <h2 class="h6 mb-1">Status</h2>
            <span x-html="badge('quote', q.status, kit.labels.quote_client_status[q.status])"></span>
          </div></div>
        </div>
        <div class="list-card mt-3" x-show="q.site_address || q.planned_start_on || q.planned_end_on">
          <div class="row g-2">
            <div class="col-sm-4" x-show="q.site_address"><div class="small">Adres inwestycji</div><div x-text="q.site_address"></div></div>
            <div class="col-sm-4" x-show="q.planned_start_on"><div class="small">Planowany start</div><div x-text="dateText(q.planned_start_on)"></div></div>
            <div class="col-sm-4" x-show="q.planned_end_on"><div class="small">Termin zakończenia</div><div x-text="dateText(q.planned_end_on)"></div></div>
          </div>
        </div>
        <template x-if="realization">
          <div class="alert alert-info mt-3"><span x-text="realization.status === 'done' ? 'Prace z tej wyceny zostały zakończone —' : 'Prace z tej wyceny są w realizacji —'"></span>
            <a class="btn btn-primary ms-sm-2 mt-2 mt-sm-0" :href="link('screens/public-realization.html?id=' + realization.id)">Śledź postęp prac</a></div>
        </template>
        <template x-if="answered">
          <div class="alert alert-secondary mt-3">Wycena ma już zapisaną odpowiedź<span x-show="q.responded_at" x-text="' z dnia ' + dateText(q.responded_at)"></span>. Dziękujemy.</div>
        </template>

        <template x-for="room in q.rooms" :key="room.id">
          <section class="list-card mt-3" :aria-labelledby="'room-' + room.id">
            <h2 class="h5 mb-0" :id="'room-' + room.id" x-text="room.name"></h2>
            <p class="small mb-2" x-show="roomSize(room)" x-text="roomSize(room)"></p>
            <table class="table stack-table mb-2">
              <thead><tr><th scope="col">Praca</th><th scope="col">Etap</th><th scope="col" class="num-cell">Ilość</th><th scope="col" class="num-cell">Cena jedn. netto</th><th scope="col" class="num-cell">Wartość netto</th></tr></thead>
              <tbody>
                <template x-for="job in sorted(room.jobs)" :key="job.id">
                  <tr><td class="lead-cell" x-text="job.name"></td><td data-label="Etap" x-text="job.stage"></td>
                    <td class="num-cell" data-label="Ilość" x-text="qtyText(job.quantity, job.unit)"></td>
                    <td class="num-cell" data-label="Cena jedn. netto" x-text="pln(unitPrice(job))"></td>
                    <td class="num-cell" data-label="Wartość netto" x-text="pln(line(job))"></td></tr>
                </template>
                <tr x-show="!room.jobs.length"><td colspan="5">(brak prac w tym pokoju)</td></tr>
              </tbody>
            </table>
            <template x-if="respondable">
              <div><label class="form-label" :for="'rc-' + room.id">Komentarz do pokoju</label>
                <textarea class="form-control" :id="'rc-' + room.id" maxlength="5000" placeholder="Opcjonalnie..." x-model="roomComments[room.id]"></textarea></div>
            </template>
            <template x-if="!respondable && answered"><p class="mb-0 small">Komentarz do pokoju: <span x-text="room.client_comment || '—'"></span></p></template>
          </section>
        </template>

        <template x-if="respondable">
          <div class="mt-3"><label class="form-label" for="general">Komentarz ogólny</label>
            <textarea class="form-control" id="general" maxlength="5000" placeholder="Uwagi do całej wyceny..." x-model="general"></textarea></div>
        </template>
        <template x-if="!respondable && answered"><p class="mt-3">Komentarz ogólny: <span x-text="q.client_general_comment || '—'"></span></p></template>

        <section class="list-card summary-card mt-3" aria-labelledby="h-sum" style="max-width: 26rem; margin-left: auto">
          <h2 class="h5" id="h-sum">Podsumowanie</h2>
          <dl>
            <dt>Razem netto</dt><dd x-text="pln(sums.net)"></dd>
            <dt x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd x-text="pln(sums.vat)"></dd>
            <dt>Razem brutto</dt><dd class="fw-bold fs-5" x-text="pln(sums.gross)"></dd>
          </dl>
        </section>

        <template x-if="respondable">
          <div class="d-flex flex-wrap gap-2 justify-content-end mt-3">
            <button type="button" class="btn btn-outline-primary btn-main" @click="answer('changes_requested')"><i class="bi bi-chat-left-dots" aria-hidden="true"></i> Oczekuję zmiany</button>
            <button type="button" class="btn btn-success btn-main" @click="answer('accepted')"><i class="bi bi-check-circle" aria-hidden="true"></i> Akceptuję wycenę</button>
          </div>
        </template>
      </div>
    </template>
  </div></main>
  <footer class="app-footer"><div class="container-xxl">Wygenerowane przez system IKPM.</div></footer>
  <script type="module">
    import { start, getQuote, lastSentQuote, saveQuote, totals, sortJobs, realizations, sender, ikpm } from '../assets/app.js';
    const _id = new URLSearchParams(location.search).get('id');
    const _q = _id ? getQuote(_id) : (lastSentQuote() ?? getQuote(2));
    // „Odrzucona” ustawia tylko wygaśnięcie linku bez odpowiedzi — /q daje wtedy 404 jak w aplikacji.
    if (!_q || _q.status === 'rejected') location.replace('error-404.html');
    start(() => ({
      q: _q, from: _q && sender(_q), message: '',
      general: _q?.client_general_comment ?? '', roomComments: Object.fromEntries((_q?.rooms ?? []).map((room) => [room.id, room.client_comment ?? ''])),
      get respondable() { return ['sent', 'changes_requested'].includes(this.q.status); },
      get answered() { return ['accepted', 'rejected'].includes(this.q.status); },
      get realization() { return this.q.status === 'accepted' ? realizations().find((r) => r.quote_id === this.q.id && r.status !== 'cancelled') : null; },
      get sums() { return totals(this.q); },
      sorted: sortJobs,
      unitPrice(job) { return ikpm.clientUnitPrice(job, this.q.markup_percent); },
      line(job) { return ikpm.lineTotal(job, this.q.markup_percent); },
      answer(decision) {
        const _accept = decision === 'accepted';
        this.$store.confirm.ask({
          title: _accept ? 'Zaakceptować wycenę?' : 'Wysłać prośbę o zmianę wyceny?',
          lines: [_accept ? 'Wykonawca dostanie Państwa akceptację. Odpowiedzi nie będzie można zmienić.' : 'Wykonawca dostanie Państwa uwagi i przygotuje poprawioną ofertę.'],
          ok: _accept ? 'Akceptuję wycenę' : 'Oczekuję zmiany', variant: _accept ? 'success' : 'primary',
          run: () => {
            this.q.status = decision; this.q.responded_at = new Date().toISOString();
            this.q.client_general_comment = this.general.trim() || null;
            for (const room of this.q.rooms) room.client_comment = (this.roomComments[room.id] ?? '').trim() || null;
            saveQuote(this.q);
            this.message = _accept ? 'Dziękujemy za akceptację wyceny!' : 'Dziękujemy — odpowiedź z prośbą o zmianę została wysłana do wykonawcy.';
            window.scrollTo(0, 0);
          },
        });
      },
    }));
  </script>
</body>
</html>
