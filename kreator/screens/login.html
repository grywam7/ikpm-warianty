<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaloguj się — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="guest">
  <main id="main" class="container-xxl"><div style="max-width: 26rem" class="mx-auto mt-5">
    <p class="fs-4 mb-1"><strong>IKPM</strong> <span class="fs-6">System kosztorysów</span></p>
    <form class="list-card" id="login-form">
      <h1 class="h3">Zaloguj się</h1>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" value="admin@ikpm.pl" required></div>
      <div class="mb-3"><label class="form-label" for="password">Hasło</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
      <label class="check-row mb-3"><input class="form-check-input" type="checkbox" id="remember"> Zapamiętaj mnie</label>
      <button class="btn btn-primary btn-main w-100" type="submit">Zaloguj się</button>
      <p class="mt-3 mb-0"><a class="tap-link" href="password-reset.html">Zapomniałeś hasła?</a></p>
    </form>
    <p class="small mt-3">Prototyp: dowolne hasło otwiera ekran startowy.</p>
  </div></main>
  <script>document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); location.href = '../index.html'; });</script>
</body>
</html>
