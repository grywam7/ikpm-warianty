<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zaloguj się — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="guest">
  <main id="main" class="ikpm-content"><div class="auth-box">
    <p class="ikpm-brand px-0 mb-2"><strong>IKPM</strong><span>System kosztorysów</span></p>
    <form class="box" id="login-form">
      <h1 class="h2">Zaloguj się</h1>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" value="admin@ikpm.pl" required></div>
      <div class="mb-3"><label class="form-label" for="password">Hasło</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Zapamiętaj mnie</label></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Zaloguj się</button>
      <p class="mt-3 mb-0"><a  href="password-reset.html">Zapomniałeś hasła?</a></p>
    </form>
    <p class="ikpm-meta mt-3">Prototyp: dowolne hasło otwiera ekran startowy.</p>
  </div></main>
  <script>document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); location.href = '../index.html'; });</script>
</body>
</html>
