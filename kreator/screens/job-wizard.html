<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dodaj pracę — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="data">
  <!-- Dane → „Dodaj pracę” krok po kroku (ekran stages, część kreatora); ?praca=ID — edycja istniejącej pracy. -->
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <div class="wz">
      <nav class="wz-steps" aria-label="Kroki dodawania pracy">
        <div class="wz-compact d-md-none">
          <div><span class="ikpm-meta">Krok <span x-text="stepIndex + 1"></span> z <span x-text="STEPS.length"></span></span><strong class="d-block" x-text="STEPS[stepIndex].label"></strong></div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary" x-show="step !== 'sprawdz' && canCheck" @click="go('sprawdz')"><i class="bi bi-clipboard-check" aria-hidden="true"></i>Sprawdź</button>
            <button type="button" class="btn btn-outline-secondary" @click="showSteps = !showSteps" :aria-expanded="showSteps" aria-controls="jw-steps">Kroki</button>
          </div>
          <div class="progress" role="progressbar" aria-label="Postęp kreatora" aria-valuemin="0" :aria-valuemax="STEPS.length" :aria-valuenow="stepIndex + 1"><div class="progress-bar" :style="`width: ${(stepIndex + 1) / STEPS.length * 100}%`"></div></div>
        </div>
        <ol class="ikpm-steps" id="jw-steps" :class="showSteps ? '' : 'collapsed-sm'">
          <template x-for="(s, i) in STEPS" :key="s.key">
            <li><button type="button" class="ikpm-step" :class="{ 'is-done': step !== s.key && done(s.key) }" :aria-current="step === s.key ? 'step' : null" :disabled="!reachable(i)" @click="go(s.key)">
              <span class="ikpm-step-num" aria-hidden="true" x-text="i + 1"></span>
              <span x-text="s.label"></span><span class="visually-hidden" x-text="done(s.key) ? '(gotowe)' : ''"></span></button></li>
          </template>
        </ol>
      </nav>

      <section class="wz-main" aria-labelledby="wz-h1">
        <p class="wz-lead"><a :href="link('screens/stages.html')">Dane</a> · <span x-text="editId ? 'Edycja pracy' : 'Dodaj pracę'"></span></p>
        <h1 id="wz-h1" class="wz-h1" tabindex="-1" x-text="STEPS[stepIndex].question"></h1>

        <!-- 1. etap -->
        <template x-if="step === 'etap'">
          <fieldset><legend class="visually-hidden">Etap</legend>
          <div class="ikpm-grid" style="--ikpm-grid-min: 15rem">
            <template x-for="s in stages" :key="s.id">
              <label class="ikpm-choice">
                <input type="radio" name="stage" :value="s.id" :checked="job.stage_id === s.id" @change="job.stage_id = s.id; error = ''">
                <span><strong class="d-block" x-text="s.name"></strong><span class="ikpm-meta" x-text="jobsText(s.jobs.length)"></span></span>
              </label>
            </template>
          </div></fieldset>
        </template>

        <!-- 2. nazwa i jednostka -->
        <template x-if="step === 'nazwa'">
          <div class="row g-3 narrow-form">
            <div class="col-12"><label class="form-label" for="job-name">Nazwa pracy</label>
              <input class="form-control" id="job-name" maxlength="100" placeholder="np. Malowanie ścian" x-model="job.name"></div>
            <div class="col-sm-6"><label class="form-label" for="job-unit">Jednostka</label>
              <select class="form-select" id="job-unit" :disabled="!!editId" aria-describedby="lock-hint" @change="job.unit = $event.target.value; job.area_type = null">
                <template x-for="u in units" :key="u"><option :value="u" :selected="job.unit === u" x-text="u"></option></template>
              </select></div>
            <p class="form-text col-12" id="lock-hint">Jednostki i wymiaru nie zmienisz po zapisaniu — inna jednostka albo wymiar to nowa praca.</p>
          </div>
        </template>

        <!-- 3. wymiar (auto-ilość) -->
        <template x-if="step === 'wymiar'">
          <div>
            <p>Wymiar (auto-ilość) — skąd wycena weźmie ilość tej pracy w pokoju. Dla jednostki <strong x-text="job.unit"></strong>:</p>
            <fieldset><legend class="visually-hidden">Wymiar (auto-ilość)</legend>
            <div class="ikpm-grid" style="--ikpm-grid-min: 15rem">
              <template x-for="t in areaTypes" :key="t">
                <label class="ikpm-choice">
                  <input type="radio" name="area-type" :value="t" :checked="job.area_type === t" :disabled="!!editId" @change="job.area_type = t; error = ''">
                  <span><strong class="d-block" x-text="kit.labels.area_type[t]"></strong><span class="ikpm-meta" x-text="AREA_HINTS[t]"></span></span>
                </label>
              </template>
            </div></fieldset>
            <p class="form-text mt-2">Inna jednostka albo wymiar to nowa praca.</p>
          </div>
        </template>

        <!-- 4. cena i opis -->
        <template x-if="step === 'cena'">
          <div class="row g-3 narrow-form">
            <div class="col-sm-6"><label class="form-label" for="job-price">Śr. cena (zł)</label>
              <input class="form-control" id="job-price" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" placeholder="np. 35" aria-describedby="price-hint" x-init="$el.value = job.average_price ?? ''" @input="setNum('average_price', $el)">
              <p class="form-text" id="price-hint">Cena ekipy za jednostkę, gdy ekipa nie ma własnej ceny. Możesz zostawić pustą.</p></div>
            <div class="col-sm-6"><label class="form-label" for="job-order">Kolejność</label>
              <input class="form-control" id="job-order" type="number" inputmode="decimal" step="1" min="0" max="10000" x-init="$el.value = job.order ?? ''" @input="setNum('order', $el)"></div>
            <div class="col-12"><label class="form-label" for="job-desc">Opis</label>
              <textarea class="form-control" id="job-desc" placeholder="Krótki opis..." x-model="job.description"></textarea></div>
            <template x-if="editId"><div class="col-sm-6"><label class="form-label" for="job-stage">Etap</label>
              <select class="form-select" id="job-stage" @change="job.stage_id = Number($event.target.value)"><template x-for="s in stages" :key="s.id"><option :value="s.id" :selected="s.id === job.stage_id" x-text="s.name"></option></template></select></div></template>
          </div>
        </template>

        <!-- 5. materiały -->
        <template x-if="step === 'materialy'">
          <div>
            <h2 class="h6">Materiały potrzebne do pracy</h2>
            <ul class="ikpm-list mb-3">
              <template x-for="(m, i) in job.materials" :key="m.name + m.package">
                <li class="ikpm-row">
                  <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="m.name"></span>
                    <span class="ikpm-row-meta" x-text="`${pln(m.unit_price)}/${materialUnit(m)} · opak. ${m.package} za ${pln(m.price)}`"></span></span>
                  <span class="d-flex align-items-end gap-2"><span><label class="form-label mb-1" :for="'mq-' + i" x-text="`${materialUnit(m)} na ${job.unit}:`"></label>
                    <input class="form-control ikpm-num" style="width: 7rem" :id="'mq-' + i" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" x-init="$el.value = m.quantity_per_unit" @input="setMatQty(m, $el)"></span>
                  <button type="button" class="btn btn-outline-secondary ikpm-btn-icon" :aria-label="'Usuń materiał: ' + m.name" @click="askRemove('materials', i, 'Usunąć ten materiał z pracy?')"><i class="bi bi-trash" aria-hidden="true"></i></button></span>
                </li>
              </template>
              <li class="ikpm-row" x-show="!job.materials.length">Praca bez materiałów — dodaj je niżej albo przejdź dalej.</li>
            </ul>
            <div class="box">
              <h3 class="box-title">Dodaj materiał</h3>
              <div class="row g-2 align-items-end">
                <div class="col-12"><label class="form-label" for="mat-filter">Szukaj materiału</label>
                  <input class="form-control" id="mat-filter" type="search" x-model="matFilter" autocomplete="off"></div>
                <div class="col-md-7"><label class="form-label" for="mat-select">Materiał</label>
                  <select class="form-select" id="mat-select" x-model="matSel">
                    <option value="">-- Wybierz materiał --</option>
                    <template x-for="(m, i) in filteredMaterials" :key="m.name + m.package + i"><option :value="m.name + '|' + m.package" x-text="`${m.name} (${m.package})`"></option></template>
                  </select></div>
                <div class="col-7 col-md-3"><label class="form-label" for="mat-qty">Ilość na jednostkę:</label>
                  <input class="form-control" id="mat-qty" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" value="1" aria-describedby="mat-qty-hint"></div>
                <div class="col-5 col-md-2"><button type="button" class="btn btn-outline-primary w-100" @click="addMaterial()"><i class="bi bi-plus-lg" aria-hidden="true"></i> Dodaj</button></div>
                <p class="form-text col-12 mb-0" id="mat-qty-hint" x-text="matHint"></p>
              </div>
            </div>
          </div>
        </template>

        <!-- 6. wykonawcy -->
        <template x-if="step === 'wykonawcy'">
          <div>
            <h2 class="h6">Wykonawcy mogący wykonać tę pracę</h2>
            <ul class="ikpm-list mb-3">
              <template x-for="(c, i) in job.crews" :key="c.contractor">
                <li class="crew-row">
                  <div class="crew-name"><span x-text="c.contractor"></span>
                    <button type="button" class="btn btn-outline-secondary ikpm-btn-icon" :aria-label="'Usuń wykonawcę: ' + c.contractor" @click="askRemove('crews', i, 'Usunąć tego wykonawcę?')"><i class="bi bi-trash" aria-hidden="true"></i></button></div>
                  <div><label class="form-label" :for="'cp-' + i">Cena: (zł)</label>
                    <input class="form-control ikpm-num" :id="'cp-' + i" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" placeholder="średnia" :value="c.price ?? ''" @change="setCrew(c, 'price', $el)"></div>
                  <div><label class="form-label" :for="'cmin-' + i">Tempo: min (h/j.)</label>
                    <input class="form-control ikpm-num" :id="'cmin-' + i" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" :value="c.speed_min ?? ''" @change="setCrew(c, 'speed_min', $el)"></div>
                  <div><label class="form-label" :for="'cmax-' + i">Tempo: max (h/j.)</label>
                    <input class="form-control ikpm-num" :id="'cmax-' + i" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" :value="c.speed_max ?? ''" @change="setCrew(c, 'speed_max', $el)"></div>
                  <div><label class="form-label" :for="'cq-' + i">Jakość:</label>
                    <select class="form-select" :id="'cq-' + i" @change="c.quality = $event.target.value ? Number($event.target.value) : null; crewSaved(c)"><option value="">brak oceny</option>
                      <template x-for="[k, v] in Object.entries(kit.labels.quality)" :key="k"><option :value="k" :selected="String(c.quality) === k" x-text="v"></option></template></select></div>
                </li>
              </template>
              <li class="ikpm-row" x-show="!job.crews.length">Bez wykonawców ta praca nie dostanie ekipy w doborze — dodaj co najmniej jedną.</li>
            </ul>
            <div class="box">
              <h3 class="box-title">Dodaj wykonawcę</h3>
              <div class="row g-2 align-items-end">
                <div class="col-md-6"><label class="form-label" for="crew-select">Wykonawca</label>
                  <select class="form-select" id="crew-select" x-model="crewSel">
                    <option value="">-- Wykonawca --</option>
                    <template x-for="c in activeCrews" :key="c.name"><option :value="c.name" x-text="c.name"></option></template>
                  </select></div>
                <div class="col-6 col-md-3"><label class="form-label" for="crew-price">Cena: (zł)</label>
                  <input class="form-control" id="crew-price" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" :placeholder="job.average_price ? 'średnia ' + dec(job.average_price) : 'średnia'"></div>
                <div class="col-6 col-md-3"><label class="form-label" for="crew-quality">Jakość:</label>
                  <select class="form-select" id="crew-quality"><option value="">brak oceny</option>
                    <template x-for="[k, v] in Object.entries(kit.labels.quality)" :key="k"><option :value="k" x-text="v"></option></template></select></div>
                <div class="col-6 col-md-3"><label class="form-label" for="crew-min">Tempo: min (h/j.)</label>
                  <input class="form-control" id="crew-min" type="number" inputmode="decimal" step="0.01" min="0" max="1000000"></div>
                <div class="col-6 col-md-3"><label class="form-label" for="crew-max">Tempo: max (h/j.)</label>
                  <input class="form-control" id="crew-max" type="number" inputmode="decimal" step="0.01" min="0" max="1000000"></div>
                <div class="col-md-3 ms-auto"><button type="button" class="btn btn-outline-primary w-100" @click="addCrew()"><i class="bi bi-plus-lg" aria-hidden="true"></i> Dodaj</button></div>
              </div>
              <p class="form-text mb-0">Pusta cena — ekipa idzie za średnią ceną pracy. Wykonawcy z archiwum nie ma na liście.</p>
            </div>
          </div>
        </template>

        <!-- 7. sprawdź -->
        <template x-if="step === 'sprawdz'">
          <div>
            <div class="ikpm-grid" style="--ikpm-grid-min: 20rem">
              <template x-for="sec in checkSections" :key="sec.key">
                <section class="box m-0">
                  <div class="box-head"><h2 class="box-title" x-text="sec.title"></h2>
                    <button type="button" class="btn btn-outline-primary btn-sm" @click="change(sec.key)" :aria-label="'Zmień: ' + sec.title">Zmień</button></div>
                  <template x-for="line in sec.lines"><p class="mb-0" x-text="line"></p></template>
                </section>
              </template>
            </div>
          </div>
        </template>

        <div class="alert alert-danger d-flex gap-2 mt-3" role="alert" x-show="error"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="error"></span></div>
        <div class="ikpm-actionbar">
          <div class="ikpm-actionbar-actions">
            <button type="button" class="btn btn-outline-secondary btn-lg" @click="back()"><i class="bi bi-arrow-left" aria-hidden="true"></i>Wstecz</button>
            <button type="button" class="btn btn-primary btn-lg" @click="next()"><span x-text="nextLabel"></span><i class="bi" :class="step === 'sprawdz' ? 'bi-check-lg' : 'bi-arrow-right'" aria-hidden="true"></i></button>
          </div>
        </div>
      </section>

      <aside class="wz-aside" aria-label="Podgląd pracy">
        <div class="box" tabindex="0">
          <p class="ikpm-meta mb-1" x-text="stageName || 'Etap: —'"></p>
          <h2 class="h3" x-text="job.name || 'Nowa praca'"></h2>
          <div class="chips mb-3">
            <span class="ikpm-chip ikpm-chip-lg" x-text="job.unit"></span>
            <span class="ikpm-chip ikpm-chip-lg" x-show="job.area_type"><i class="bi bi-rulers" aria-hidden="true" x-show="job.area_type !== 'manual'"></i><span x-text="kit.labels.area_type[job.area_type]"></span></span>
          </div>
          <dl class="ikpm-dl ikpm-dl-num">
            <dt>Śr. cena:</dt><dd x-text="job.average_price ? pln(job.average_price) : '—'"></dd>
            <dt>Materiały /j.:</dt><dd x-text="'mat. ' + pln(materialCost) + '/' + job.unit"></dd>
          </dl>
          <h3 class="h6 mt-3">Materiały</h3>
          <ul class="ps-3 mb-2"><template x-for="m in job.materials" :key="m.name + m.package"><li x-text="`${m.name}: ${dec(m.quantity_per_unit)} ${materialUnit(m)} na ${job.unit}`"></li></template><li x-show="!job.materials.length">—</li></ul>
          <h3 class="h6">Wykonawcy</h3>
          <ul class="ps-3 mb-0"><template x-for="c in job.crews" :key="c.contractor"><li x-text="`${c.contractor}: ${c.price ? pln(c.price) : 'średnia'}`"></li></template><li x-show="!job.crews.length">—</li></ul>
        </div>
      </aside>
    </div>
  </div></main>
  <script type="module">
    import { start, catalogue, allJobs, jobById, contractors, materials, materialUnit, saveCatalogueJob, nextId, fieldNumber, go, kit, ikpm, jobsText, pln, dec, tempoText, link } from '../assets/app.js';

    const STEPS = [
      { key: 'etap', label: 'Etap', question: 'Do którego etapu dodać pracę?' },
      { key: 'nazwa', label: 'Nazwa i jednostka', question: 'Jak się nazywa praca i w czym ją liczysz?' },
      { key: 'wymiar', label: 'Wymiar (auto-ilość)', question: 'Skąd brać ilość pracy?' },
      { key: 'cena', label: 'Cena i opis', question: 'Średnia cena i opis' },
      { key: 'materialy', label: 'Materiały', question: 'Jakie materiały zużywa praca?' },
      { key: 'wykonawcy', label: 'Wykonawcy', question: 'Które ekipy ją robią i za ile?' },
      { key: 'sprawdz', label: 'Sprawdź', question: 'Sprawdź pracę' },
    ];
    const AREA_BY_UNIT = { 'm²': ['floor', 'wall', 'ceiling', 'wall_ceiling', 'manual'], mb: ['perimeter', 'manual'] };
    const AREA_HINTS = { floor: 'długość × szerokość pokoju', wall: 'obwód × wysokość − otwory', ceiling: 'jak podłoga', wall_ceiling: 'ściany i sufit razem', perimeter: '2 × (długość + szerokość)', manual: 'ilość wpisujesz sam (na start 1)' };

    start(() => ({
      STEPS, AREA_HINTS, kit, materialUnit, jobsText, link,
      step: 'etap', editId: null, fromCheck: false, showSteps: false, error: '',
      job: { stage_id: null, name: '', unit: 'm²', area_type: null, average_price: null, order: null, description: '', materials: [], crews: [] },
      matFilter: '', matSel: '', crewSel: '',
      stages: catalogue(),
      units: [...new Set(['m²', 'mb', 'szt', 'h', ...allJobs().map((j) => j.unit)])],
      init() {
        const _p = new URLSearchParams(location.search);
        const _edit = _p.get('praca') && jobById(_p.get('praca'));
        if (_edit) {
          this.editId = _edit.id;
          const { stage, ...rest } = JSON.parse(JSON.stringify(_edit));
          this.job = { description: '', order: null, ...rest };
          this.step = 'sprawdz';
          document.title = 'Edycja pracy — IKPM';
        } else if (_p.get('etap')) {
          this.job.stage_id = Number(_p.get('etap'));
          this.step = 'nazwa';
        }
        // Wstecz przeglądarki / gest systemu: o jeden krok wstecz (krok w stanie historii, adres bez zmian).
        history.replaceState({ krok: this.step }, '');
        window.addEventListener('popstate', (e) => {
          if (!e.state?.krok) return;
          this.error = ''; this.fromCheck = false; this.showSteps = false; this.step = e.state.krok;
          this.$nextTick(() => { window.scrollTo(0, 0); document.getElementById('wz-h1')?.focus(); });
        });
      },
      get stepIndex() { return STEPS.findIndex((s) => s.key === this.step); },
      get stageName() { return this.stages.find((s) => s.id === this.job.stage_id)?.name; },
      get areaTypes() { return AREA_BY_UNIT[this.job.unit] ?? ['manual']; },
      get canCheck() { return this.done('etap') && this.done('nazwa') && this.done('wymiar'); },
      done(key) {
        return { etap: !!this.job.stage_id, nazwa: !!this.job.name.trim(), wymiar: !!this.job.area_type, cena: !!(this.job.average_price || this.job.description),
          materialy: this.job.materials.length > 0, wykonawcy: this.job.crews.length > 0, sprawdz: false }[key];
      },
      reachable(i) { return !!this.editId || i <= this.stepIndex || STEPS.slice(0, i).every((s) => ['cena', 'materialy', 'wykonawcy', 'sprawdz'].includes(s.key) || this.done(s.key)); },
      validate() {
        if (this.step === 'etap' && !this.job.stage_id) return 'Wybierz etap.';
        if (this.step === 'nazwa' && !this.job.name.trim()) return 'Nazwa nie może być pusta';
        if (this.step === 'wymiar' && !this.areaTypes.includes(this.job.area_type)) return 'Typ powierzchni nie pasuje do jednostki';
        return '';
      },
      go(key, { fromCheck = false } = {}) {
        if (key !== this.step) history.pushState({ krok: key }, '');
        this.error = ''; this.fromCheck = fromCheck; this.step = key; this.showSteps = false;
        this.$nextTick(() => { window.scrollTo(0, 0); document.getElementById('wz-h1')?.focus(); });
      },
      change(key) { this.go(key, { fromCheck: true }); },
      get nextLabel() {
        if (this.step === 'sprawdz') return this.editId ? 'Zapisz pracę' : 'Dodaj pracę';
        if (this.fromCheck) return 'Wróć do „Sprawdź”';
        return `Dalej: ${STEPS[this.stepIndex + 1].label}`;
      },
      next() {
        this.error = this.validate();
        if (this.error) return;
        if (this.step === 'sprawdz') return this.save();
        if (this.fromCheck) return this.go('sprawdz');
        if (this.step === 'nazwa' && !this.areaTypes.includes(this.job.area_type)) this.job.area_type = this.areaTypes.length === 1 ? 'manual' : null;
        this.go(STEPS[this.stepIndex + 1].key);
      },
      back() {
        if (this.stepIndex === 0 || this.fromCheck) { if (this.fromCheck) return this.go('sprawdz'); location.href = '../screens/stages.html'; return; }
        this.go(STEPS[this.stepIndex - 1].key);
      },
      setNum(field, el) { const _v = fieldNumber(el); if (_v !== undefined) this.job[field] = _v === null ? null : String(_v); },
      // materiały
      get filteredMaterials() {
        const _s = this.matFilter.trim().toLowerCase();
        return materials().filter((m) => !_s || m.name.toLowerCase().includes(_s)).slice().sort((a, b) => a.name.localeCompare(b.name, 'pl'));
      },
      get matHint() {
        const _m = materials().find((m) => `${m.name}|${m.package}` === this.matSel);
        return _m ? `Ile ${materialUnit(_m)} materiału „${_m.name}” zużywa 1 ${this.job.unit} pracy (opakowanie ${_m.package} za ${pln(_m.price)}).` : 'Najpierw wybierz materiał.';
      },
      get materialCost() { return ikpm.roundHalfUp(this.job.materials.reduce((s, m) => s + Number(m.unit_price) * Number(m.quantity_per_unit), 0)); },
      addMaterial() {
        const _m = materials().find((m) => `${m.name}|${m.package}` === this.matSel);
        if (!_m) { this.error = 'Wybierz materiał.'; return; }
        if (this.job.materials.some((x) => x.name === _m.name && x.package === _m.package)) { this.error = 'Materiał jest już przypisany do tej pracy'; return; }
        const _q = fieldNumber(document.getElementById('mat-qty'));
        if (!(_q > 0)) { this.error = 'Ilość na jednostkę musi być większa od 0'; return; }
        this.error = '';
        this.job.materials.push({ ..._m, quantity_per_unit: String(_q) });
        this.matSel = ''; document.getElementById('mat-qty').value = '1';
        this.$store.toast.show('Materiał został przypisany do pracy.');
      },
      setMatQty(m, el) { const _v = fieldNumber(el); if (_v > 0) m.quantity_per_unit = String(_v); },
      // wykonawcy
      get activeCrews() { return contractors().filter((c) => !c.archived && !this.job.crews.some((x) => x.contractor === c.name)); },
      crewLine(c) {
        return `Cena: ${c.price ? pln(c.price) : 'średnia'} · Tempo: ${tempoText(c)} · Jakość: ${c.quality ? kit.labels.quality[c.quality] : 'brak oceny'}`;
      },
      addCrew() {
        const _c = contractors().find((c) => c.name === this.crewSel);
        if (!_c) { this.error = 'Wybierz wykonawcę.'; return; }
        const _price = fieldNumber(document.getElementById('crew-price'));
        if (_price !== null && !(_price > 0)) { this.error = 'Cena musi być większa od 0'; return; }
        const _q = document.getElementById('crew-quality').value;
        const _min = fieldNumber(document.getElementById('crew-min')); const _max = fieldNumber(document.getElementById('crew-max'));
        this.error = '';
        this.job.crews.push({ contractor: _c.name, archived: false, max_parallel_jobs: _c.max_parallel_jobs, price: _price ? String(_price) : null,
          effective_price: _price ? String(_price) : this.job.average_price, speed_min: _min ? String(_min) : null, speed_max: _max ? String(_max) : null, quality: _q ? Number(_q) : null });
        this.crewSel = '';
        for (const id of ['crew-price', 'crew-min', 'crew-max', 'crew-quality']) document.getElementById(id).value = '';
        this.$store.toast.show('Wykonawca został przypisany do pracy.');
      },
      // Cena, tempo i jakość ekipy w tej pracy (zapis z „Dodaj pracę” / „Zapisz pracę”).
      setCrew(c, field, el) {
        const _v = fieldNumber(el);
        if (_v === undefined) return;
        if (field === 'price' && _v !== null && !(_v > 0)) { this.error = 'Cena musi być większa od 0'; return; }
        c[field] = _v === null ? null : String(_v);
        this.crewSaved(c);
      },
      crewSaved(c) { this.error = ''; c.effective_price = c.price ?? this.job.average_price; this.$store.toast.show('Dane wykonawcy zostały zaktualizowane.'); },
      askRemove(list, i, title) {
        this.$store.confirm.ask({ title, lines: [`„${this.job[list][i].name ?? this.job[list][i].contractor}” zniknie z tej pracy.`], ok: 'Usuń', variant: 'danger',
          run: () => { this.job[list].splice(i, 1); this.$store.toast.show(list === 'materials' ? 'Materiał został usunięty z pracy.' : 'Wykonawca został usunięty z pracy.'); } });
      },
      get checkSections() {
        const j = this.job;
        return [
          { key: 'etap', title: 'Etap', lines: [this.stageName || '—'] },
          { key: 'nazwa', title: 'Nazwa i jednostka', lines: [`${j.name || '—'} · ${j.unit}`] },
          { key: 'wymiar', title: 'Wymiar (auto-ilość)', lines: [j.area_type ? kit.labels.area_type[j.area_type] : '—'] },
          { key: 'cena', title: 'Cena i opis', lines: [`Śr. cena: ${j.average_price ? pln(j.average_price) : '—'}`, j.description ? `Opis: ${j.description}` : 'Bez opisu'] },
          { key: 'materialy', title: 'Materiały potrzebne do pracy', lines: j.materials.length ? j.materials.map((m) => `${m.name} — ${dec(m.quantity_per_unit)} ${materialUnit(m)} na ${j.unit}`) : ['Brak materiałów'] },
          { key: 'wykonawcy', title: 'Wykonawcy mogący wykonać tę pracę', lines: j.crews.length ? j.crews.map((c) => `${c.contractor} — ${this.crewLine(c)}`) : ['Brak wykonawców'] },
        ];
      },
      save() {
        for (const key of ['etap', 'nazwa', 'wymiar']) { this.step = key; const _e = this.validate(); if (_e) { this.go(key); this.error = _e; return; } }
        this.step = 'sprawdz';
        const _job = {
          ...JSON.parse(JSON.stringify(this.job)), id: this.editId ?? nextId(), name: this.job.name.trim(),
          area_type_label: kit.labels.area_type[this.job.area_type], average_speed: this.job.average_speed ?? null,
          material_unit_cost: String(this.materialCost),
        };
        for (const c of _job.crews) c.effective_price = c.price ?? _job.average_price;
        saveCatalogueJob(_job);
        go(`screens/stages.html?etap=${_job.stage_id}&praca=${_job.id}`, `Praca '${_job.name}' została ${this.editId ? 'zaktualizowana' : 'dodana'}.`);
      },
    }));
  </script>
</body>
