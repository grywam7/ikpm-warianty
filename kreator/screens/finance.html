<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finanse — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="finance">
  <main id="main"><div id="app" class="container-xxl" x-data="page" x-cloak>
    <h1 class="page-title">Finanse</h1>
    <div class="alert alert-secondary">W badaniu układu ekranów Finanse to tylko wpis w menu. Raporty zostają w obecnym wyglądzie aplikacji — po badaniu dostaną układ zwycięskiego wariantu.</div>
    <p>Raporty dla księgowości (tylko odczyt, okres „Od” – „Do”, „Pokaż”, „CSV”, kwoty netto):</p>
    <ul class="list-group" style="max-width: 36rem">
      <template x-for="r in reports" :key="r"><li class="list-group-item py-3" x-text="r"></li></template>
    </ul>
  </div></main>
  <script type="module">
    import { start } from '../assets/app.js';
    start(() => ({ reports: ['Wynik', 'Koszty', 'Realizacje', 'Oferty', 'Wykonawcy'] }));
  </script>
</body>
</html>
