<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edytuj konto — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="account">
  <main id="main"><div id="app" class="container-xxl" x-data="page" x-cloak>
    <h1 class="page-title">Edytuj konto</h1>
    <form class="list-card" style="max-width: 36rem" @submit.prevent="$store.toast.show('Konto zostało pomyślnie zaktualizowane.')">
      <div class="mb-3"><label class="form-label" for="a-email">Email</label><input class="form-control" id="a-email" type="email" :value="kit.users[0].email" autocomplete="email"></div>
      <div class="mb-3"><label class="form-label" for="a-pass">Hasło (pozostaw puste, jeśli nie chcesz wprowadzać zmian)</label><input class="form-control" id="a-pass" type="password" autocomplete="new-password" aria-describedby="a-pass-hint"><span class="form-text" id="a-pass-hint">(minimum 6 znaków)</span></div>
      <div class="mb-3"><label class="form-label" for="a-pass2">Potwierdzenie hasła</label><input class="form-control" id="a-pass2" type="password" autocomplete="new-password"></div>
      <div class="mb-3"><label class="form-label" for="a-current">Aktualne hasło (potrzebujemy Twojego bieżącego hasła, aby potwierdzić zmiany)</label><input class="form-control" id="a-current" type="password" autocomplete="current-password"></div>
      <div class="d-flex gap-2 justify-content-end">
        <a class="btn btn-outline-secondary btn-main" :href="link('screens/profile.html')">Powrót</a>
        <button class="btn btn-primary btn-main" type="submit">Aktualizuj</button>
      </div>
    </form>
  </div></main>
  <script type="module">
    import { start } from '../assets/app.js';
    start();
  </script>
</body>
</html>
