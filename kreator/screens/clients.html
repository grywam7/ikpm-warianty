<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klienci — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="clients">
  <main id="main"><div id="app" class="container-xxl" x-data="page" x-cloak>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 page-title">
      <h1 class="mb-0">Klienci</h1>
      <a class="btn btn-primary btn-main" :href="link('screens/client-form.html')"><i class="bi bi-person-plus" aria-hidden="true"></i> Nowy klient</a>
    </div>
    <label class="form-label" for="client-filter">Szukaj klienta</label>
    <input class="form-control mb-3" id="client-filter" type="search" x-model="filter" autocomplete="off">
    <template x-for="c in shown" :key="c.id">
      <article class="list-card d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="min-w-0">
          <a class="fw-semibold tap-link" :href="link('screens/client-show.html?id=' + c.id)" x-text="c.name"></a>
          <span class="d-block small" x-text="[c.email, c.phone].filter(Boolean).join(' · ') || '—'"></span>
          <span class="d-block small" x-text="'Wyceny: ' + counts(c).quotes + ' · Realizacje: ' + counts(c).realizations"></span>
        </div>
        <a class="btn btn-outline-primary" :href="link('screens/client-form.html?id=' + c.id)" :aria-label="'Edytuj: ' + c.name">Edytuj</a>
      </article>
    </template>
    <p x-show="!shown.length">Brak klientów — dodaj pierwszego przyciskiem „Nowy klient”.</p>
  </div></main>
  <script type="module">
    import { start, clients, quotes, realizations } from '../assets/app.js';
    const _q = quotes(); const _r = realizations();
    start(() => ({
      all: clients(), filter: '',
      get shown() { const _f = this.filter.trim().toLowerCase(); return this.all.filter((c) => !_f || c.name.toLowerCase().includes(_f)); },
      counts: (c) => ({ quotes: _q.filter((q) => q.client?.name === c.name).length, realizations: _r.filter((r) => r.client.name === c.name).length }),
    }));
  </script>
</body>
</html>
