<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klient — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="clients">
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <template x-if="c">
      <div>
        <div class="ikpm-page-head">
          <a class="ikpm-back" :href="link('screens/clients.html')">Klienci</a>
          <div class="ikpm-page-heading"><h1 class="ikpm-page-title" x-text="c.name"></h1></div>
          <div class="ikpm-page-actions">
            <a class="btn btn-outline-primary btn-lg" :href="link('screens/client-form.html?id=' + c.id)"><i class="bi bi-pencil" aria-hidden="true"></i>Edytuj</a>
            <button type="button" class="btn btn-outline-danger btn-lg" @click="askDelete()"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button>
          </div>
        </div>
        <div class="box mb-4 ikpm-measure">
          <dl class="ikpm-dl">
            <dt>Email</dt><dd><template x-if="c.email"><a :href="'mailto:' + c.email" x-text="c.email"></a></template><span x-show="!c.email">—</span></dd>
            <dt>Telefon</dt><dd><template x-if="c.phone"><a :href="'tel:' + c.phone.replace(/\s/g, '')" x-text="c.phone"></a></template><span x-show="!c.phone">—</span></dd>
            <dt>Notatki</dt><dd class="text-pre" x-text="c.notes || '—'"></dd>
          </dl>
        </div>
        <div class="start-work">
          <section aria-labelledby="h-q">
            <h2 class="ikpm-section-title" id="h-q">Wyceny</h2>
            <ul class="ikpm-list" x-show="myQuotes.length">
              <template x-for="q in myQuotes" :key="q.id">
                <li><div class="ikpm-row">
                  <span class="ikpm-row-main"><a class="ikpm-row-title" :href="link('screens/quote-show.html?id=' + q.id)" x-text="'Wycena #' + q.id"></a>
                    <span class="ikpm-row-meta" x-text="'Wartość: ' + pln(net(q)) + ' · Wysłana: ' + dateText(q.sent_at)"></span></span>
                  <span class="ikpm-row-end"><span x-html="badge('quote', q.status)"></span></span>
                  <template x-if="q.status === 'draft'"><span class="row-actions"><a class="btn btn-outline-primary btn-sm" :href="builderLink(q, 'sprawdz')">Edytuj</a></span></template>
                </div></li>
              </template>
            </ul>
            <p x-show="!myQuotes.length">Brak wycen.</p>
          </section>
          <section aria-labelledby="h-r">
            <h2 class="ikpm-section-title" id="h-r">Realizacje</h2>
            <ul class="ikpm-list" x-show="myRealizations.length">
              <template x-for="r in myRealizations" :key="r.id">
                <li><a class="ikpm-row" :href="link('screens/realization-show.html?id=' + r.id)">
                  <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="'Realizacja #' + r.id"></span><span class="ikpm-row-meta" x-text="'Wartość (z wyceny): ' + pln(r.total_price) + ' · Postęp: ' + prog(r).pct + '%'"></span></span>
                  <span class="ikpm-row-end"><span x-html="badge('realization', r.status)"></span></span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
              </template>
            </ul>
            <p x-show="!myRealizations.length">Brak realizacji.</p>
          </section>
        </div>
      </div>
    </template>
  </div></main>
  <script type="module">
    import { start, clientById, quotes, realizations, totals, progress, builderLink, go } from '../assets/app.js';
    const _c = clientById(new URLSearchParams(location.search).get('id') ?? 1);
    if (!_c) location.replace('error-404.html');
    start(() => ({
      c: _c, builderLink, prog: (r) => progress(r), net: (q) => totals(q).net,
      myQuotes: quotes().filter((q) => q.client?.name === _c?.name),
      myRealizations: realizations().filter((r) => r.client.name === _c?.name),
      askDelete() {
        this.$store.confirm.ask({ title: `Usunąć klienta „${this.c.name}”?`, lines: ['Klienta z wycenami lub realizacjami nie da się usunąć.'], ok: 'Usuń', variant: 'danger',
          run: () => {
            if (this.myQuotes.length || this.myRealizations.length) { this.$store.alert.msg = 'Nie można usunąć, gdyż istnieją zależne od niego wyceny'; return; }
            go('screens/clients.html', 'Klient usunięty.');
          } });
      },
    }));
  </script>
</body>
</html>
