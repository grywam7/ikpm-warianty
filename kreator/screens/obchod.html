<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Obchód na budowie — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="realizations">
  <!-- Obchód: realizacja → pokój → prace po jednej → zdjęcia → podsumowanie (ekran realization-show, część „na budowie”). -->
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <div class="wz">
      <nav class="wz-steps" aria-label="Kroki obchodu">
        <div class="wz-compact d-md-none">
          <div><span class="ikpm-meta">Obchód · krok <span x-text="stepIndex + 1"></span> z 5</span><strong class="d-block" x-text="STEPS[stepIndex].label"></strong></div>
          <button type="button" class="btn btn-outline-secondary" @click="showSteps = !showSteps" :aria-expanded="showSteps" aria-controls="ob-steps">Kroki</button>
          <div class="progress" role="progressbar" aria-label="Postęp obchodu" aria-valuemin="0" aria-valuemax="5" :aria-valuenow="stepIndex + 1"><div class="progress-bar" :style="`width: ${(stepIndex + 1) * 20}%`"></div></div>
        </div>
        <ol class="ikpm-steps" id="ob-steps" :class="showSteps ? '' : 'collapsed-sm'">
          <template x-for="(s, i) in STEPS" :key="s.key">
            <li><button type="button" class="ikpm-step" :class="{ 'is-done': i < stepIndex }" :aria-current="step === s.key ? 'step' : null" :disabled="(i > 0 && !r) || (i > 1 && !room)" @click="go(s.key)">
              <span class="ikpm-step-num" aria-hidden="true" x-text="i + 1"></span><span x-text="s.label"></span><span class="visually-hidden" x-text="i < stepIndex ? '(gotowe)' : ''"></span></button></li>
          </template>
        </ol>
      </nav>

      <section class="wz-main" aria-labelledby="wz-h1">
        <p class="wz-lead" x-show="r"><a :href="r ? link('screens/realization-show.html?id=' + r.id) : '#'" x-text="r ? 'Realizacja #' + r.id : ''"></a><span x-text="r ? ' · ' + r.client.name : ''"></span></p>
        <h1 id="wz-h1" class="wz-h1" tabindex="-1" x-text="question"></h1>

        <template x-if="r && !active">
          <div class="alert alert-secondary d-flex gap-2"><i class="bi bi-lock" aria-hidden="true"></i><span>Realizacja jest <span x-text="statusLabel('realization', r.status)"></span> — status i stawka faktyczna są zablokowane. Komentarz i notatka wewnętrzna zostają edytowalne.</span></div>
        </template>

        <!-- 1. realizacja -->
        <template x-if="step === 'realizacja'">
          <div>
            <ul class="ikpm-list" x-show="list.length">
              <template x-for="x in list" :key="x.id">
                <li><button type="button" class="ikpm-row" @click="pickRealization(x)" :aria-current="r && r.id === x.id ? 'true' : null">
                  <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="x.client.name"></span>
                    <span class="ikpm-row-meta" x-text="x.site_address"></span>
                    <span class="ikpm-row-meta" x-text="progressLine(x)"></span></span>
                  <span class="ikpm-row-end"><span x-html="badge('realization', x.status)"></span></span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i>
                </button></li>
              </template>
            </ul>
            <div class="ikpm-empty" x-show="!list.length"><i class="bi bi-cone-striped" aria-hidden="true"></i><p class="ikpm-empty-title">Brak realizacji w trakcie</p><p>Przekształć zaakceptowaną wycenę na jej stronie (przycisk „Przekształć w realizację”).</p></div>
          </div>
        </template>

        <!-- 2. pokój -->
        <template x-if="step === 'pokoj' && r">
          <div>
            <ul class="ikpm-list">
              <template x-for="rm in r.rooms" :key="rm.id">
                <li><button type="button" class="ikpm-row" @click="pickRoom(rm)">
                  <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="rm.name"></span>
                    <span class="ikpm-row-meta" x-text="roomCounts(rm)"></span></span>
                  <span class="ikpm-row-end"><span class="ikpm-progress row-progress-sm">
                    <span class="ikpm-meta" x-text="`${prog(rm).pct}% (${prog(rm).done} / ${prog(rm).all})`"></span>
                    <span class="progress" role="progressbar" :aria-label="'Postęp pokoju ' + rm.name" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="prog(rm).pct"><span class="progress-bar" :style="`width: ${prog(rm).pct}%`"></span></span></span></span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i>
                </button></li>
              </template>
            </ul>
            <a class="btn btn-outline-secondary mt-3" :href="link('screens/realization-show.html?id=' + r.id)" x-text="'Realizacja #' + r.id + ' — wszystkie dane'"></a>
          </div>
        </template>

        <!-- 3. prace — jedna naraz -->
        <template x-if="step === 'prace' && room">
          <div>
            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
              <span class="ikpm-meta">Oznacz prace po kolei albo wszystkie naraz.</span>
              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-secondary" x-show="fromRealization" :href="link('screens/realization-show.html?id=' + r.id)"><i class="bi bi-arrow-return-left" aria-hidden="true"></i>Wróć do realizacji</a>
                <button type="button" class="btn btn-outline-success btn-lg" x-show="active" @click="bulkDone()"><i class="bi bi-check2-all" aria-hidden="true"></i>Wszystkie prace pokoju: Zrobione</button>
              </div>
            </div>
            <template x-for="job in [job]" :key="job.id">
              <article class="job-card" aria-labelledby="job-name">
                <h2 class="h2 mb-1" id="job-name" x-text="job.name"></h2>
                <p class="ikpm-meta mb-2"><span x-text="job.stage"></span> · <span x-text="qtyText(job.quantity, job.unit)"></span> · Wykonawca: <strong x-text="job.contractor || '—'"></strong></p>
                <p class="mb-3 d-flex flex-wrap align-items-center gap-2">Status teraz: <span x-html="badge('job', job.status, null, 'ikpm-status-lg')"></span>
                  <span class="ikpm-save" data-state="saved" aria-live="polite" x-show="lastChange?.jobId === job.id" x-text="'Zapisano: ' + statusLabel('job', job.status) + '.'"></span></p>
                <fieldset class="ikpm-seg seg-site" :disabled="!active">
                  <legend class="visually-hidden" x-text="'Status: ' + job.name"></legend>
                  <template x-for="s in ['done', 'remake', 'to_do', 'in_progress']" :key="s">
                    <span class="contents">
                      <input type="radio" class="btn-check" :name="'st-' + job.id" :id="'st-' + job.id + '-' + s" :value="s" :checked="job.status === s" @change="setStatus(job, s)">
                      <label class="btn ikpm-seg-btn" :class="statusClass('job', s)" :for="'st-' + job.id + '-' + s" x-text="statusLabel('job', s)"></label>
                    </span>
                  </template>
                </fieldset>
                <p class="ikpm-meta mt-2 mb-0" x-show="job.status === 'done' || lastChange?.prev === 'done'">Data wykonania zostaje przy pierwszym „Zrobione”.</p>

                <div class="note-fields mt-3">
                  <div>
                    <label class="form-label" for="internal-note"><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma)</label>
                    <textarea class="form-control" id="internal-note" :class="job.status === 'remake' && !job.internal_notes ? 'is-invalid' : ''" aria-describedby="internal-hint" x-init="$el.value = job.internal_notes ?? ''" @input="setText(job, 'internal_notes', $el.value)"></textarea>
                    <p class="form-text" id="internal-hint"><strong x-show="job.status === 'remake'">Wpisz tu powód „Do poprawy”. </strong>Klient jej nie widzi — nie ma jej na stronie postępu, w mailach ani w PDF.</p>
                  </div>
                  <div>
                    <label class="form-label" for="client-comment"><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient)</label>
                    <textarea class="form-control" id="client-comment" aria-describedby="comment-hint" x-init="$el.value = job.notes ?? ''" @input="setText(job, 'notes', $el.value)"></textarea>
                    <p class="form-text" id="comment-hint">Klient zobaczy go przy tej pracy na stronie postępu prac (/r).</p>
                  </div>
                </div>
                <details class="mt-1">
                  <summary>Stawka faktyczna /j.</summary>
                  <div class="form-row pt-1">
                    <div class="field-sm" style="flex-basis: 12rem">
                      <label class="form-label" for="actual-rate">Stawka faktyczna /j. (zł)</label>
                      <input class="form-control ikpm-num" id="actual-rate" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" :placeholder="dec(job.contractor_price)" :disabled="!active" aria-describedby="rate-hint" x-init="$el.value = job.actual_contractor_price ?? ''" @change="setRate(job, $el)">
                    </div>
                    <p class="ikpm-meta mb-2" id="rate-hint">Puste — stawka uzgodniona <span x-text="pln(job.contractor_price)"></span>. Zmienia tylko koszt.</p>
                  </div>
                </details>
                <p class="mb-0" x-show="savedAt"><span class="ikpm-save" data-state="saved" aria-live="polite" x-text="'Zapisano ' + savedAt"></span></p>
              </article>
            </template>
            <details class="box mt-3">
              <summary x-text="'Wszystkie prace pokoju (' + jobs.length + ')'"></summary>
              <ol class="ikpm-list ikpm-list-flush mt-2">
                <template x-for="(j, i) in jobs" :key="j.id">
                  <li><button type="button" class="ikpm-row" :aria-current="i === idx ? 'true' : null" @click="openJob(i)">
                    <span class="ikpm-row-main"><span class="ikpm-row-title fw-normal" x-text="(i + 1) + '. ' + j.name"></span></span>
                    <span class="ikpm-row-end"><span x-html="badge('job', j.status)"></span></span></button></li>
                </template>
              </ol>
            </details>
          </div>
        </template>

        <!-- 4. zdjęcia -->
        <template x-if="step === 'zdjecia' && r">
          <div>
            <p>Dodaj zdjęcia z galerii albo aparatu. Przy każdym zdjęciu zdecyduj, czy zobaczy je klient.</p>
            <div class="form-row">
              <div class="field">
                <input class="visually-hidden file-input" id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple @change="pickFiles($event)">
                <label class="btn btn-outline-primary btn-lg w-100" for="photo-files"><i class="bi bi-images" aria-hidden="true"></i>Zdjęcia (JPG, PNG, WebP; najwyżej 20 naraz)</label>
              </div>
              <div class="field">
                <label class="form-label" for="photo-room">Pokój</label>
                <select class="form-select" id="photo-room" x-model="photoRoom">
                  <option value="">Ogólne (bez pokoju)</option>
                  <template x-for="rm in r.rooms" :key="rm.id"><option :value="rm.name" :selected="rm.name === photoRoom" x-text="rm.name"></option></template>
                </select>
              </div>
            </div>
            <div class="alert alert-danger d-flex gap-2 mt-3" role="alert" x-show="photoError"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="photoError"></span></div>
            <template x-if="pending.length">
              <section class="box mt-3" id="pending-photos" aria-labelledby="h-pending">
                <h2 class="box-title" id="h-pending">Wybrane — jeszcze niedodane</h2>
                <div class="ikpm-photo-grid">
                  <template x-for="(ph, i) in pending" :key="ph.key">
                    <div class="ikpm-photo">
                      <img class="ikpm-photo-thumb" :src="ph.src" :alt="'Wybrane zdjęcie ' + ph.filename">
                      <div class="ikpm-photo-body">
                        <div class="form-check form-switch">
                          <input class="form-check-input" type="checkbox" role="switch" :id="'pv-' + ph.key" x-model="ph.client_visible">
                          <label class="form-check-label" :for="'pv-' + ph.key">Widoczne dla klienta</label>
                        </div>
                        <p class="ikpm-meta mb-0 text-break" x-text="ph.filename"></p>
                      </div>
                    </div>
                  </template>
                </div>
                <button type="button" class="btn btn-primary btn-lg mt-3" @click="addPhotos()"><i class="bi bi-upload" aria-hidden="true"></i>Dodaj zdjęcia</button>
              </section>
            </template>
            <h2 class="ikpm-section-title" x-text="photoRoom ? 'Zdjęcia: ' + photoRoom : 'Zdjęcia: Ogólne'"></h2>
            <div class="ikpm-photo-grid">
              <template x-for="ph in roomPhotos" :key="ph.key">
                <div class="ikpm-photo">
                  <template x-if="ph.src"><img class="ikpm-photo-thumb" :src="ph.src" :alt="'Zdjęcie ' + ph.filename"></template>
                  <template x-if="!ph.src"><div class="ikpm-photo-thumb" role="img" :aria-label="'Zdjęcie ' + ph.filename"><i class="bi bi-image" aria-hidden="true"></i><span x-text="ph.filename"></span></div></template>
                  <div class="ikpm-photo-body">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" role="switch" :id="'v-' + ph.key" :checked="ph.client_visible" @change="setVisible(ph, $el.checked)">
                      <label class="form-check-label" :for="'v-' + ph.key">Widoczne dla klienta</label>
                    </div>
                  </div>
                </div>
              </template>
            </div>
            <p x-show="!roomPhotos.length">Brak zdjęć.</p>
          </div>
        </template>

        <!-- 5. podsumowanie -->
        <template x-if="step === 'podsumowanie' && r && room">
          <div>
            <p x-text="roomCounts(room)"></p>
            <div class="ikpm-grid" style="--ikpm-grid-min: 18rem">
              <section class="box" aria-labelledby="h-client">
                <h2 class="box-title" id="h-client"><i class="bi bi-eye" aria-hidden="true"></i> Klient zobaczy na stronie postępu (/r)</h2>
                <ul class="mb-0">
                  <li>Statusy prac pokoju „<span x-text="room.name"></span>”.</li>
                  <template x-for="j in jobs.filter((x) => x.notes)" :key="j.id"><li><span x-text="j.name"></span>: „<span x-text="j.notes"></span>”</li></template>
                  <li x-text="'Zdjęcia widoczne dla klienta: ' + photosOf(room).filter((p) => p.client_visible).length"></li>
                </ul>
              </section>
              <section class="box" aria-labelledby="h-company">
                <h2 class="box-title" id="h-company"><i class="bi bi-lock" aria-hidden="true"></i> Tylko firma</h2>
                <ul class="mb-0">
                  <template x-for="j in jobs.filter((x) => x.internal_notes)" :key="j.id"><li><span x-text="j.name"></span>: <span x-text="j.internal_notes"></span></li></template>
                  <li x-text="'Zdjęcia wewnętrzne: ' + photosOf(room).filter((p) => !p.client_visible).length"></li>
                </ul>
              </section>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button type="button" class="btn btn-outline-primary btn-lg" @click="go('pokoj')"><i class="bi bi-door-open" aria-hidden="true"></i>Inny pokój</button>
              <a class="btn btn-primary btn-lg" :href="link('screens/realization-show.html?id=' + r.id)"><i class="bi bi-arrow-return-left" aria-hidden="true"></i>Wróć do realizacji</a>
            </div>
          </div>
        </template>

        <div class="ikpm-actionbar" :class="skipToPhotos ? 'has-skip' : ''" x-show="['prace', 'zdjecia'].includes(step)">
          <div class="ikpm-actionbar-total"><span x-text="room ? room.name : ''"></span><span class="ikpm-amount" x-text="room ? `${prog(room).done} / ${prog(room).all} zrobione` : ''"></span></div>
          <div class="ikpm-actionbar-actions">
            <button type="button" class="btn btn-outline-secondary btn-lg" @click="prev()"><i class="bi bi-arrow-left" aria-hidden="true"></i><span x-text="step === 'prace' && idx > 0 ? 'Poprzednia' : 'Wstecz'"></span></button>
            <button type="button" class="btn btn-lg" :class="skipToPhotos ? 'btn-outline-primary' : 'btn-primary'" @click="next()"><i class="bi bi-upload" aria-hidden="true" x-show="step === 'zdjecia' && pending.length"></i><span x-text="nextLabel"></span><i class="bi bi-arrow-right" aria-hidden="true" x-show="!(step === 'zdjecia' && pending.length)"></i></button>
            <template x-if="skipToPhotos"><button type="button" class="btn btn-primary btn-lg" @click="go('zdjecia')">Dalej: Zdjęcia<i class="bi bi-arrow-right" aria-hidden="true"></i></button></template>
          </div>
        </div>
      </section>

      <aside class="wz-aside" aria-label="Podsumowanie obchodu" x-show="r">
        <div class="box" x-show="r" tabindex="0">
          <h2 class="h3 mb-1" x-text="r ? r.client.name : ''"></h2>
          <p class="ikpm-meta mb-2" x-text="r?.site_address"></p>
          <p class="mb-3" x-html="r ? badge('realization', r.status) : ''"></p>
          <template x-if="r">
            <div class="ikpm-progress mb-3">
              <div class="ikpm-progress-head"><span id="pp-all">Postęp prac</span><span x-text="`${prog().pct}% (${prog().done} / ${prog().all})`"></span></div>
              <div class="progress" role="progressbar" aria-labelledby="pp-all" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="prog().pct"><div class="progress-bar" :style="`width: ${prog().pct}%`"></div></div>
            </div>
          </template>
          <template x-if="room">
            <div>
              <h3 class="h6" x-text="room.name"></h3>
              <ol class="live-rooms">
                <template x-for="(j, i) in jobs" :key="j.id">
                  <li :class="step === 'prace' && i === idx ? 'fw-semibold' : ''"><span class="min-w-0" x-text="j.name"></span><span x-html="badge('job', j.status)"></span></li>
                </template>
              </ol>
            </div>
          </template>
        </div>
      </aside>
    </div>
  </div></main>
  <script type="module">
    import {
      start, getRealization, saveRealization, realizations, progress, sortJobs, assignStatus, isActive,
      statusLabel, jobsAccusative, fieldNumber, link, readPhotos,
    } from '../assets/app.js';

    const STEPS = [
      { key: 'realizacja', label: 'Realizacja', question: 'Na której budowie jesteś?' },
      { key: 'pokoj', label: 'Pokój', question: 'W którym pokoju?' },
      { key: 'prace', label: 'Prace', question: '' },
      { key: 'zdjecia', label: 'Zdjęcia', question: '' },
      { key: 'podsumowanie', label: 'Podsumowanie', question: '' },
    ];
    start(() => ({
      STEPS,
      r: null, step: 'realizacja', roomId: null, idx: 0, showSteps: false, lastChange: null, savedAt: '', fromRealization: false,
      pending: [], photoRoom: '', photoError: '',
      init() {
        this.fromUrl();
        // Wstecz przeglądarki / gest systemu: o jeden krok obchodu wstecz (każda zmiana kroku to wpis w historii).
        window.addEventListener('popstate', () => { this.fromUrl(); this.$nextTick(() => { window.scrollTo(0, 0); document.getElementById('wz-h1')?.focus(); }); });
      },
      fromUrl() {
        const _p = new URLSearchParams(location.search);
        this.r = _p.get('id') ? getRealization(_p.get('id')) : null;
        this.roomId = Number(_p.get('pokoj')) || null;
        this.idx = Number(_p.get('praca') || 0);
        this.fromRealization = _p.get('z') === 'realizacja';
        this.step = this.r ? (_p.get('krok') || (this.roomId ? 'prace' : 'pokoj')) : 'realizacja';
        this.showSteps = false; this.lastChange = null; this.pending = [];
        if (this.room) this.photoRoom = this.room.name;
        this.sync();
      },
      get list() {
        // aktywne realizacje; bieżąca (także zakończona, otwarta z jej strony) zostaje na liście
        return realizations().filter((x) => ['in_progress', 'planned'].includes(x.status) || x.id === this.r?.id)
          .sort((a, b) => (a.status === 'in_progress' ? 0 : 1) - (b.status === 'in_progress' ? 0 : 1) || b.id - a.id);
      },
      get stepIndex() { return STEPS.findIndex((s) => s.key === this.step); },
      get active() { return this.r ? isActive(this.r) : true; },
      get room() { return this.r?.rooms.find((x) => x.id === this.roomId) ?? null; },
      get jobs() { return this.room ? sortJobs(this.room.jobs) : []; },
      get job() { return this.jobs[this.idx]; },
      get question() {
        if (this.step === 'prace') return this.room ? `${this.room.name} — praca ${this.idx + 1} z ${this.jobs.length}` : '';
        if (this.step === 'zdjecia') return this.room ? `Zdjęcia: ${this.room.name}` : 'Zdjęcia';
        if (this.step === 'podsumowanie') return this.room ? `Podsumowanie: ${this.room.name}` : 'Podsumowanie';
        return STEPS[this.stepIndex].question;
      },
      get nextLabel() {
        if (this.step === 'prace') return this.idx < this.jobs.length - 1 ? 'Następna' : 'Dalej: Zdjęcia';
        if (this.pending.length) return 'Dodaj zdjęcia';
        return 'Dalej: Podsumowanie';
      },
      // Każda praca pokoju ma już status (żadna „Do zrobienia”) — zdjęcia są następnym krokiem, nie kolejne prace.
      get skipToPhotos() { return this.step === 'prace' && this.idx < this.jobs.length - 1 && this.jobs.every((j) => j.status && j.status !== 'to_do'); },
      prog(room) { return room ? progress(this.r, room) : progress(this.r); },
      progressLine(x) { const _p = progress(x); return `Postęp prac: ${_p.pct}% (${_p.done} / ${_p.all})`; },
      roomCounts(room) {
        const _c = {};
        for (const j of room.jobs) _c[j.status] = (_c[j.status] ?? 0) + 1;
        return ['done', 'in_progress', 'remake', 'to_do'].filter((s) => _c[s]).map((s) => `${statusLabel('job', s)}: ${_c[s]}`).join(' · ');
      },
      sync(push = false) {
        const _q = new URLSearchParams();
        if (this.r) _q.set('id', this.r.id);
        if (this.fromRealization) _q.set('z', 'realizacja');
        if (this.roomId) _q.set('pokoj', this.roomId);
        _q.set('krok', this.step);
        if (this.step === 'prace') _q.set('praca', this.idx);
        if (push && `?${_q}` !== location.search) history.pushState(null, '', `?${_q}`); else history.replaceState(null, '', `?${_q}`);
      },
      go(key) {
        this.step = key; this.showSteps = false; this.lastChange = null; this.sync(true);
        this.$nextTick(() => { window.scrollTo(0, 0); document.getElementById('wz-h1')?.focus(); });
      },
      pickRealization(x) { this.r = getRealization(x.id); this.roomId = null; this.go('pokoj'); },
      pickRoom(rm) {
        this.roomId = rm.id; this.photoRoom = rm.name;
        const _first = sortJobs(rm.jobs).findIndex((j) => j.status !== 'done');
        this.idx = _first >= 0 ? _first : 0;
        this.go('prace');
      },
      openJob(i) { this.idx = i; this.go('prace'); },
      save() { saveRealization(this.r); this.savedAt = new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); },
      // Status zapisuje się od razu; „Cofnij” w komunikacie wraca do poprzedniego (data wykonania zostaje).
      setStatus(job, s) {
        if (!this.active || job.status === s) return;
        const _prev = job.status;
        this.lastChange = { jobId: job.id, prev: _prev };
        assignStatus(job, s);
        this.save();
        this.$store.toast.show(`Zapisano pracę „${job.name}”: ${statusLabel('job', s)}.`, { undo: () => this.undo(job) });
        if (s === 'remake') this.$nextTick(() => { const _note = document.getElementById('internal-note'); _note?.focus({ preventScroll: true }); _note?.scrollIntoView({ block: 'center' }); });
      },
      undo(job) {
        const _prev = this.lastChange.prev; assignStatus(job, _prev); this.lastChange = { jobId: job.id, prev: _prev }; this.save();
        this.$nextTick(() => { const _i = document.getElementById(`st-${job.id}-${_prev}`); if (_i) _i.checked = true; });
      },
      setText(job, field, value) { job[field] = value || null; this.save(); },
      setRate(job, el) { const _v = fieldNumber(el); if (_v === undefined) return; job.actual_contractor_price = _v === null ? null : String(_v); this.save(); },
      bulkDone() {
        let _n = 0; let _skipped = 0;
        for (const j of this.room.jobs) {
          if (j.status === 'remake') { _skipped += 1; continue; }
          if (j.status !== 'done') { assignStatus(j, 'done'); }
          _n += 1;
        }
        this.save();
        this.$store.toast.show(_skipped ? `Zaktualizowano ${jobsAccusative(_n)}, pominięto ${jobsAccusative(_skipped)} „Do poprawy” — sprawdź pojedynczo.` : `Zaktualizowano ${jobsAccusative(_n)}.`);
      },
      next() {
        if (this.step === 'prace') { if (this.idx < this.jobs.length - 1) { this.idx += 1; this.lastChange = null; this.sync(); this.$nextTick(() => { window.scrollTo(0, 0); document.getElementById('wz-h1')?.focus(); }); } else this.go('zdjecia'); return; }
        // wybrane, a niedodane zdjęcia: przycisk dodaje je, zamiast przechodzić dalej (nie giną po cichu)
        if (this.step === 'zdjecia' && this.pending.length) { this.addPhotos(); return; }
        this.go('podsumowanie');
      },
      prev() {
        if (this.step === 'prace') { if (this.idx > 0) { this.idx -= 1; this.lastChange = null; this.sync(); } else this.go('pokoj'); return; }
        this.idx = this.jobs.length - 1; this.go('prace');
      },
      // zdjęcia
      photosOf(room) { return (this.r.photos ?? []).filter((p) => (room ? p.room === room.name : !p.room)); },
      get roomPhotos() { return (this.r.photos ?? []).map((p, i) => ({ ...p, key: i })).filter((p) => (this.photoRoom ? p.room === this.photoRoom : !p.room)); },
      async pickFiles(e) {
        this.photoError = ''; this.pending = [];
        const _r = await readPhotos(e.target.files);
        if (_r.error) this.photoError = _r.error; else this.pending = _r.photos;
        this.$nextTick(() => document.getElementById('pending-photos')?.scrollIntoView({ block: 'center' }));
      },
      addPhotos() {
        this.r.photos = [...(this.r.photos ?? []), ...this.pending.map(({ key, ...p }) => ({ ...p, room: this.photoRoom || null }))];
        const _n = this.pending.length;
        this.pending = [];
        const _input = document.getElementById('photo-files'); if (_input) _input.value = '';
        this.save();
        this.$store.toast.show(`Dodano zdjęcia: ${_n}.`);
      },
      setVisible(ph, on) { this.r.photos[ph.key].client_visible = on; this.save(); this.$store.toast.show('Zapisano zdjęcie.'); },
      link,
    }));
  </script>
