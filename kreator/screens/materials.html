<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Materiały — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="data">
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <nav class="ikpm-topnav data-nav" aria-label="Dane"><template x-for="n in DATA_NAV" :key="n.key"><a class="ikpm-nav-link" :href="link(n.href)" :aria-current="n.key === 'materials' ? 'page' : null"><i class="bi" :class="'bi-' + n.icon" aria-hidden="true"></i><span x-text="n.label"></span></a></template></nav>
    <div class="ikpm-page-head">
      <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Materiały</h1></div>
      <div class="ikpm-page-actions"><button type="button" class="btn btn-primary btn-lg" @click="formOpen = !formOpen" :aria-expanded="formOpen" aria-controls="new-material"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj materiał</button></div>
    </div>
    <div class="box mb-3" id="new-material" x-show="formOpen">
      <div class="ikpm-grid" style="--ikpm-grid-min: 10rem; align-items: end">
        <div style="grid-column: span 2"><label class="form-label" for="m-name">Nazwa materiału</label><input class="form-control" id="m-name" placeholder="np. Farba lateksowa biała" maxlength="100"></div>
        <div><label class="form-label" for="m-price">Cena</label><input class="form-control ikpm-num" id="m-price" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" value="0"></div>
        <div><label class="form-label" for="m-qty">Ilość</label><input class="form-control ikpm-num" id="m-qty" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" value="1"></div>
        <div><label class="form-label" for="m-unit">Jedn.</label><select class="form-select" id="m-unit"><template x-for="u in UNITS"><option x-text="u"></option></template></select></div>
        <div style="grid-column: span 2"><label class="form-label" for="m-link">Link do sklepu</label><input class="form-control" id="m-link" type="url" placeholder="https://..."></div>
        <div><button type="button" class="btn btn-primary" @click="add()">Dodaj</button></div>
      </div>
    </div>
    <div class="obj">
      <div class="obj-side">
        <section class="box" aria-labelledby="h-change">
          <h2 class="box-title" id="h-change">Zmiana cen</h2>
          <form id="materials-price-change" @submit.prevent="preview()">
            <fieldset class="mb-2"><legend class="form-label fs-6">Zakres</legend>
              <div class="form-check"><input class="form-check-input" type="radio" name="selection" id="sel-all" value="all" x-model="selection" required><label class="form-check-label" for="sel-all">Wszystkie materiały</label></div>
              <div class="form-check"><input class="form-check-input" type="radio" name="selection" id="sel-picked" value="selected" x-model="selection"><label class="form-check-label" for="sel-picked">Zaznaczone na liście <span class="ikpm-meta" x-text="'(' + picked.length + ')'"></span></label></div>
            </fieldset>
            <div class="form-row">
              <div class="field-sm"><label class="form-label" for="pct">Zmień ceny o %</label><input class="form-control ikpm-num" id="pct" type="number" inputmode="decimal" step="0.1" min="-90" max="200" x-model="percent" aria-describedby="pct-hint"><span class="form-text" id="pct-hint">od -90 do +200</span></div>
              <button class="btn btn-outline-primary mb-4" type="submit">Podgląd</button>
            </div>
          </form>
        </section>
      </div>
      <section class="obj-main" aria-labelledby="h-list">
        <h2 class="ikpm-section-title" id="h-list">Lista materiałów</h2>
        <div class="form-row mb-3"><div class="field" style="max-width: 28rem"><label class="form-label" for="m-filter">Szukaj materiału</label>
          <input class="form-control" id="m-filter" type="search" x-model="filter" autocomplete="off"></div></div>
        <ul class="ikpm-list">
          <template x-for="m in shown" :key="m.key">
            <li>
              <div class="ikpm-row">
                <input class="form-check-input flex-shrink-0" type="checkbox" :id="'pick-' + m.key" :value="m.key" x-model="picked" form="materials-price-change">
                <label class="ikpm-row-main" :for="'pick-' + m.key"><span class="ikpm-row-title fw-normal" x-text="m.name"></span><span class="ikpm-row-meta" x-text="`${pln(m.price)} · opak. ${m.package} · ${pln(m.unit_price)}/${materialUnit(m)}`"></span></label>
                <span class="row-actions">
                  <template x-if="safeLink(m.link)"><a class="btn btn-outline-secondary ikpm-btn-icon" :href="m.link" target="_blank" rel="noopener" :aria-label="'Otwórz w sklepie: ' + m.name"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a></template>
                  <button type="button" class="btn btn-outline-primary" @click="editing = editing === m.key ? null : m.key" :aria-expanded="editing === m.key" :aria-label="'Zmień: ' + m.name">Zmień</button>
                  <button type="button" class="btn btn-outline-secondary ikpm-btn-icon" @click="askDelete(m)" :aria-label="'Usuń materiał: ' + m.name"><i class="bi bi-trash" aria-hidden="true"></i></button>
                </span>
              </div>
              <div class="ikpm-grid job-detail" style="--ikpm-grid-min: 9rem; align-items: end" x-show="editing === m.key">
                <div style="grid-column: span 2"><label class="form-label" :for="'en-' + m.key">Nazwa</label><input class="form-control" :id="'en-' + m.key" :value="m.name" maxlength="100"></div>
                <div><label class="form-label" :for="'ep-' + m.key">Cena</label><input class="form-control ikpm-num" :id="'ep-' + m.key" type="number" inputmode="decimal" step="0.01" min="0" max="1000000" :value="m.price"></div>
                <div><label class="form-label" :for="'eq-' + m.key">Ilość</label><input class="form-control ikpm-num" :id="'eq-' + m.key" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000000" :value="parseFloat(m.package)"></div>
                <div><label class="form-label" :for="'eu-' + m.key">Jedn.</label><input class="form-control" :id="'eu-' + m.key" :value="materialUnit(m)"></div>
                <div style="grid-column: span 2"><label class="form-label" :for="'el-' + m.key">Link do sklepu</label><input class="form-control" :id="'el-' + m.key" type="url" placeholder="https://..." :value="m.link ?? ''"></div>
                <div><button type="button" class="btn btn-primary" @click="saveRow(m)">Zapisz</button></div>
              </div>
            </li>
          </template>
        </ul>
        <div class="ikpm-empty" x-show="!shown.length"><i class="bi bi-box-seam" aria-hidden="true"></i><p class="ikpm-empty-title">Brak materiałów.</p><p>Dodaj pierwszy materiał powyżej.</p></div>
      </section>
    </div>
  </div></main>
  <script type="module">
    import { start, materials, saveMaterial, materialUnit, allJobs, DATA_NAV, link } from '../assets/app.js';
    start(() => ({
      DATA_NAV, materialUnit, UNITS: ['szt', 'kg', 'l', 'm²', 'mb', 'h'],
      all: [], filter: '', formOpen: false, editing: null, picked: [], selection: '', percent: '',
      init() { this.reload(); },
      reload() { this.all = materials().sort((a, b) => a.name.localeCompare(b.name, 'pl') || String(a.key).localeCompare(String(b.key))); },
      get shown() { const _f = this.filter.trim().toLowerCase(); return this.all.filter((m) => !_f || m.name.toLowerCase().includes(_f)); },
      val(id) { return document.getElementById(id)?.value ?? ''; },
      safeLink: (l) => /^https?:\/\//i.test(l ?? ''),
      check(name, link) {
        if (!name) return 'Nazwa nie może być pusta';
        if (link && !/^https?:\/\//i.test(link)) return 'Link musi zaczynać się od http(s)://';
        return '';
      },
      add() {
        const _n = this.val('m-name').trim(); const _l = this.val('m-link').trim();
        const _e = this.check(_n, _l); if (_e) { this.$store.alert.msg = _e; return; }
        saveMaterial({ name: _n, price: Number(this.val('m-price')) || 0, package: `${Number(this.val('m-qty')) || 1} ${this.val('m-unit')}`, link: _l || null });
        this.reload(); this.formOpen = false; this.$store.toast.show(`Materiał '${_n}' został dodany.`);
      },
      saveRow(m) {
        const _n = this.val('en-' + m.key).trim(); const _l = this.val('el-' + m.key).trim();
        const _e = this.check(_n, _l); if (_e) { this.$store.alert.msg = _e; return; }
        saveMaterial({ key: m.key, name: _n, price: Number(this.val('ep-' + m.key)) || 0, package: `${Number(this.val('eq-' + m.key)) || 1} ${this.val('eu-' + m.key).trim() || 'szt'}`, link: _l || null });
        this.reload(); this.editing = null; this.$store.toast.show(`Materiał '${_n}' został zaktualizowany.`);
      },
      askDelete(m) {
        this.$store.confirm.ask({ title: `Usunąć materiał '${m.name}'?`, lines: ['Materiału przypisanego do prac nie da się usunąć.'], ok: 'Usuń', variant: 'danger',
          run: () => {
            if (allJobs().some((j) => j.materials.some((x) => x.name === m.name && x.package === m.package))) { this.$store.alert.msg = 'Nie można usunąć, gdyż istnieją zależne od niego prace'; return; }
            saveMaterial({ ...m, deleted: true }); this.reload(); this.$store.toast.show(`Materiał '${m.name}' został usunięty.`);
          } });
      },
      preview() {
        if (!this.selection) { this.$store.alert.msg = 'Zaznacz materiały, których ceny chcesz zmienić, albo wybierz „Wszystkie”.'; return; }
        if (this.selection === 'selected' && !this.picked.length) { this.$store.alert.msg = 'Zaznacz materiały, których ceny chcesz zmienić, albo wybierz „Wszystkie”.'; return; }
        location.href = link(`screens/price-change.html?scope=materials&selection=${this.selection}&ids=${this.picked.join(',')}&percent=${encodeURIComponent(this.percent)}`);
      },
    }));
  </script>
</body>
</html>
