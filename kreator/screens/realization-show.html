<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realizacja — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="realizations">
  <main id="main"><div id="app" class="container-xxl" x-data="page" x-cloak>
    <template x-if="r">
      <div>
        <div class="d-flex flex-wrap align-items-center gap-2 page-title">
          <h1 class="mb-0 me-2">Realizacja #<span x-text="r.id"></span></h1>
          <span x-html="badge('realization', r.status)"></span>
        </div>
        <p class="lead-line"><a class="tap-link" :href="link('screens/client-show.html?id=' + clientId)" x-text="r.client.name"></a>
          <template x-if="r.quote_id"><span> · <a class="tap-link" :href="link('screens/quote-show.html?id=' + r.quote_id)" x-text="'z wyceny #' + r.quote_id"></a></span></template></p>

        <!-- następny krok -->
        <section class="list-card my-3" aria-labelledby="h-next">
          <h2 class="h6" id="h-next">Co dalej</h2>
          <div class="d-flex flex-wrap gap-2 align-items-start">
            <a class="btn btn-primary btn-main" x-show="active" :href="link('screens/obchod.html?id=' + r.id + '&krok=pokoj')"><i class="bi bi-cone-striped" aria-hidden="true"></i> Obchód na budowie</a>
            <template x-if="r.status === 'planned'"><button type="button" class="btn btn-outline-primary btn-main" @click="ask('in_progress')"><i class="bi bi-play-circle" aria-hidden="true"></i> Rozpocznij</button></template>
            <template x-if="r.status === 'in_progress' && unfinished === 0"><button type="button" class="btn btn-outline-success btn-main" @click="ask('done')"><i class="bi bi-check-circle" aria-hidden="true"></i> Zakończ</button></template>
            <template x-if="r.status === 'in_progress' && unfinished > 0">
              <div><button type="button" class="btn btn-outline-secondary btn-main" disabled aria-describedby="finish-hint"><i class="bi bi-check-circle" aria-hidden="true"></i> Zakończ</button>
                <p class="small mb-0 mt-1" id="finish-hint" x-text="unfinishedText(unfinished)"></p></div>
            </template>
            <template x-if="active"><button type="button" class="btn btn-outline-danger btn-main" @click="ask('cancelled')"><i class="bi bi-x-circle" aria-hidden="true"></i> Anuluj</button></template>
            <span class="align-self-center" x-show="!active">(status terminalny)</span>
            <button type="button" class="btn btn-outline-primary btn-main" @click="askLink()"><i class="bi bi-envelope" aria-hidden="true"></i> Wyślij link</button>
            <template x-if="r.status !== 'done'"><button type="button" class="btn btn-outline-danger btn-main" @click="askDelete()"><i class="bi bi-trash" aria-hidden="true"></i> Usuń</button></template>
          </div>
        </section>

        <div class="row g-3">
          <div class="col-lg-6">
            <section class="list-card h-100" aria-labelledby="h-progress">
              <h2 class="h6" id="h-progress">Postęp prac</h2>
              <p class="mb-1" x-text="`${prog.pct}% (${prog.done} / ${prog.all})`"></p>
              <div class="progress mb-3" role="progressbar" aria-label="Postęp prac" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="prog.pct"><div class="progress-bar bg-success" :style="`width: ${prog.pct}%`"></div></div>
              <p class="mb-1">Publiczny link dla klienta:</p>
              <p class="mb-2 text-break"><span x-text="publicUrl"></span>
                <span x-show="r.link_valid_until" x-text="'(ważny do ' + dateText(r.link_valid_until) + ')'"></span></p>
              <p class="small mb-1">Prototyp — to, co dostał klient: <a class="tap-link" :href="link('screens/public-realization.html?id=' + r.id)">strona postępu prac (/r)</a> ·
                <a class="tap-link" :href="link('screens/mail-progress-link.html?id=' + r.id)">mail z linkiem do postępu</a></p>
              <template x-if="active">
                <div>
                  <label class="form-label" for="settlement">Rozliczenie:</label>
                  <select class="form-select" id="settlement" @change="setSettlement($event.target.value)">
                    <template x-for="[k, v] in Object.entries(kit.labels.settlement)" :key="k"><option :value="k" :selected="r.settlement === k" x-text="v"></option></template>
                  </select>
                </div>
              </template>
              <p class="mb-0" x-show="!active" x-text="'Rozliczenie: ' + kit.labels.settlement[r.settlement]"></p>
            </section>
          </div>
          <div class="col-lg-6">
            <section class="list-card h-100" aria-labelledby="h-term">
              <h2 class="h6" id="h-term">Termin</h2>
              <dl class="row mb-0">
                <dt class="col-sm-5">Adres inwestycji</dt><dd class="col-sm-7" x-text="r.site_address || '—'"></dd>
                <dt class="col-sm-5">Planowany start</dt><dd class="col-sm-7" x-text="dateText(r.planned_start_on)"></dd>
                <dt class="col-sm-5">Termin obiecany</dt><dd class="col-sm-7" x-text="dateText(r.promised_end_on)"></dd>
                <template x-if="r.status === 'done'"><dt class="col-sm-5">Data zakończenia</dt></template>
                <template x-if="r.status === 'done'"><dd class="col-sm-7" x-text="dateText(r.end_on)"></dd></template>
                <template x-if="!active && r.status !== 'done'"><dt class="col-sm-5">Aktualnie przewidywany</dt></template>
                <template x-if="!active && r.status !== 'done'"><dd class="col-sm-7" x-text="dateText(r.expected_end_on)"></dd></template>
              </dl>
              <template x-if="active">
                <div class="d-flex flex-wrap gap-2 align-items-end mt-2">
                  <div><label class="form-label" for="expected-end">Aktualnie przewidywany</label>
                    <input class="form-control" id="expected-end" type="date" min="2000-01-01" max="2099-12-31" :value="r.expected_end_on || ''"></div>
                  <button type="button" class="btn btn-outline-primary" @click="saveEnd()">Zapisz</button>
                </div>
              </template>
            </section>
          </div>
        </div>

        <section class="row g-3 mt-1" aria-label="Koszty">
          <div class="col-sm-4"><div class="list-card h-100"><div class="small">Wartość netto (z wyceny)</div><div class="fs-4 fw-bold" x-text="pln(r.total_price)"></div></div></div>
          <div class="col-sm-4"><div class="list-card h-100"><div class="small">Koszt (faktyczny)</div><div class="fs-4 fw-bold" x-text="pln(cost)"></div></div></div>
          <div class="col-sm-4"><div class="list-card h-100"><div class="small">Koszt z wyceny</div><div class="fs-4 fw-bold" x-text="pln(r.estimated_cost)"></div></div></div>
        </section>

        <template x-if="active">
          <section class="list-card mt-3" aria-labelledby="h-bulk">
            <h2 class="h6" id="h-bulk">Ustaw status wszystkim pracom etapu</h2>
            <form class="row g-2 align-items-end" @submit.prevent="bulk(realJobs(r).filter((j) => j.stage === bulkStage), bulkStatus)">
              <div class="col-sm-5"><label class="form-label" for="bulk-stage">Etap</label>
                <select class="form-select" id="bulk-stage" x-model="bulkStage" required><option value="">Wybierz etap</option>
                  <template x-for="s in stages" :key="s"><option :value="s" x-text="s"></option></template></select></div>
              <div class="col-sm-4"><label class="form-label" for="bulk-status">Status</label>
                <select class="form-select" id="bulk-status" x-model="bulkStatus" required><option value="">Wybierz status</option>
                  <template x-for="[k, v] in Object.entries(kit.labels.realization_job_status)" :key="k"><option :value="k" x-text="v"></option></template></select></div>
              <div class="col-sm-3"><button type="submit" class="btn btn-outline-primary w-100">Zastosuj</button></div>
            </form>
          </section>
        </template>

        <h2 class="h4 mt-4">Pokoje i prace</h2>
        <template x-for="room in r.rooms" :key="room.id">
          <section class="list-card" :aria-labelledby="'room-' + room.id">
            <div class="d-flex flex-wrap justify-content-between gap-2 align-items-start">
              <div class="min-w-0">
                <h3 class="h5 mb-0" :id="'room-' + room.id" x-text="room.name"></h3>
                <p class="small mb-1"><span x-text="roomSize(room)"></span> <span x-text="'· ' + progLine(room)"></span></p>
                <p class="small mb-1" x-show="room.notes"><i class="bi bi-lock" aria-hidden="true"></i> Notatka: <span x-text="room.notes"></span></p>
              </div>
              <a class="btn btn-primary" x-show="active" :href="link(`screens/obchod.html?id=${r.id}&pokoj=${room.id}&krok=prace`)"><i class="bi bi-cone-striped" aria-hidden="true"></i> Obchód w tym pokoju</a>
            </div>
            <template x-if="active">
              <form class="d-flex flex-wrap gap-2 align-items-end my-2" @submit.prevent="bulk(room.jobs, document.getElementById('room-status-' + room.id).value)">
                <div><label class="form-label small" :for="'room-status-' + room.id">Status wszystkich prac</label>
                  <select class="form-select" :id="'room-status-' + room.id" :aria-label="'Status wszystkich prac: ' + room.name" required>
                    <option value="">Wybierz status</option>
                    <template x-for="[k, v] in Object.entries(kit.labels.realization_job_status)" :key="k"><option :value="k" x-text="v"></option></template></select></div>
                <button type="submit" class="btn btn-outline-primary">Zastosuj</button>
              </form>
            </template>
            <ul class="list-unstyled mb-0">
              <template x-for="(job, i) in sorted(room.jobs)" :key="job.id">
                <li class="border-top py-2">
                  <div class="d-flex flex-wrap gap-2 justify-content-between">
                    <div class="min-w-0">
                      <strong x-text="job.name"></strong>
                      <span class="small d-block" x-text="`${job.unit} · ${job.stage} · ${qtyText(job.quantity, job.unit)} · Wykonawca: ${job.contractor || '—'}`"></span>
                      <span class="small d-block" x-text="`Stawka faktyczna /j.: ${job.actual_contractor_price ? pln(job.actual_contractor_price) : '— (uzgodniona ' + pln(job.contractor_price) + ')'} · Wartość: ${pln(line(job))}`"></span>
                    </div>
                    <div class="d-flex gap-2 align-items-start">
                      <span x-html="badge('job', job.status)"></span>
                      <a class="btn btn-outline-primary btn-sm-tap" :href="link(`screens/obchod.html?id=${r.id}&pokoj=${room.id}&krok=prace&praca=${i}`)" :aria-label="'Zmień: ' + job.name">Zmień</a>
                    </div>
                  </div>
                  <p class="small mb-0 mt-1" x-show="job.notes"><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient): <span x-text="job.notes"></span></p>
                  <p class="small mb-0" x-show="job.internal_notes"><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma): <span x-text="job.internal_notes"></span></p>
                </li>
              </template>
              <li x-show="!room.jobs.length">(brak prac w tym pomieszczeniu)</li>
            </ul>
          </section>
        </template>

        <section id="zdjecia" class="mt-4" aria-labelledby="h-photos">
          <h2 class="h4" id="h-photos">Zdjęcia</h2>
          <div class="list-card">
            <div class="row g-2 align-items-end">
              <div class="col-md-6">
                <input class="visually-hidden file-input" id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple @change="pickFiles($event)">
                <label class="btn btn-outline-primary btn-main w-100" for="photo-files"><i class="bi bi-images" aria-hidden="true"></i> Zdjęcia (JPG, PNG, WebP; najwyżej 20 naraz)</label>
              </div>
              <div class="col-md-4"><label class="form-label" for="photo-room">Pokój</label>
                <select class="form-select" id="photo-room" x-model="photoRoom"><option value="">Ogólne (bez pokoju)</option>
                  <template x-for="rm in r.rooms" :key="rm.id"><option :value="rm.name" x-text="rm.name"></option></template></select></div>
              <div class="col-md-2"><button type="button" class="btn btn-primary w-100" :disabled="!pending.length" @click="addPhotos()">Dodaj zdjęcia</button></div>
            </div>
            <p class="small mt-2 mb-0" x-show="pending.length" x-text="'Wybrane: ' + pending.length + ' — „Widoczne dla klienta” ustawisz przy zdjęciu po dodaniu.'"></p>
            <div class="alert alert-danger mt-2 mb-0" role="alert" x-show="photoError" x-text="photoError"></div>
          </div>
          <template x-for="g in photoGroups" :key="g.name">
            <div class="mt-3">
              <h3 class="h6" x-text="g.name"></h3>
              <div class="photo-grid">
                <template x-for="ph in g.photos" :key="ph.key">
                  <div class="photo-card">
                    <template x-if="ph.src"><img class="photo-thumb" :src="ph.src" :alt="'Zdjęcie ' + ph.filename"></template>
                    <template x-if="!ph.src"><div class="photo-thumb" role="img" :aria-label="'Zdjęcie ' + ph.filename"><i class="bi bi-image" aria-hidden="true"></i><span x-text="ph.filename"></span></div></template>
                    <div class="p-2">
                      <div class="form-check form-switch check-row">
                        <input class="form-check-input" type="checkbox" role="switch" :id="'v-' + ph.key" :checked="ph.client_visible" @change="setVisible(ph.key, $el.checked)">
                        <label class="form-check-label" :for="'v-' + ph.key">Widoczne dla klienta</label>
                      </div>
                      <label class="form-label small mb-1" :for="'pr-' + ph.key">Pokój</label>
                      <select class="form-select" :id="'pr-' + ph.key" @change="setPhotoRoom(ph.key, $event.target.value)">
                        <option value="" :selected="!ph.room">Ogólne (bez pokoju)</option>
                        <template x-for="rm in r.rooms" :key="rm.id"><option :value="rm.name" :selected="ph.room === rm.name" x-text="rm.name"></option></template>
                      </select>
                      <button type="button" class="btn btn-outline-danger w-100 mt-2" @click="askDeletePhoto(ph.key)" :aria-label="'Usuń zdjęcie ' + ph.filename"><i class="bi bi-trash" aria-hidden="true"></i> Usuń</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <p class="mt-3" x-show="!r.photos?.length">Brak zdjęć.</p>
        </section>
      </div>
    </template>
  </div></main>
  <script type="module">
    import {
      start, getRealization, saveRealization, progress, realJobs, realCost, isActive, sortJobs, assignStatus, unfinishedText,
      jobsAccusative, clientByName, addDays, todayISO, go, readPhotos, ikpm, statusLabel, jobNames,
    } from '../assets/app.js';
    const _r = getRealization(new URLSearchParams(location.search).get('id') ?? 1);
    if (!_r || _r.deleted) location.replace('error-404.html');
    start(() => ({
      r: _r, realJobs, unfinishedText, sorted: sortJobs,
      clientId: _r ? clientByName(_r.client.name)?.id : null,
      bulkStage: '', bulkStatus: '', pending: [], photoRoom: '', photoError: '',
      get active() { return isActive(this.r); },
      get prog() { return progress(this.r); },
      get cost() { return realCost(this.r); },
      get unfinished() { return realJobs(this.r).filter((j) => j.status !== 'done').length; },
      get stages() { return [...new Set(sortJobs(realJobs(this.r)).map((j) => j.stage))]; },
      get publicUrl() { return `${location.origin}/r/${this.r.id}…`; },
      progLine(room) { const _p = progress(this.r, room); return `${_p.done} / ${_p.all} zrobione`; },
      line(job) { return ikpm.lineTotal(job, this.r.markup_percent); },
      save(msg) { saveRealization(this.r); if (msg) this.$store.toast.show(msg); },
      ask(to) {
        const _texts = {
          in_progress: { title: 'Rozpocząć realizację?', ok: 'Rozpocznij', variant: 'primary', lines: ['Status realizacji zmieni się na „W trakcie” — klient zobaczy go na stronie postępu prac (/r).'] },
          done: { title: 'Zakończyć realizację?', ok: 'Zakończ', variant: 'success', lines: [
            'Wszystkie prace mają status „Zrobione”.',
            'Cennik nauczy się ze stawek faktycznych ekip z tej realizacji.',
            'Statusy prac, stawki faktyczne, rozliczenie i przewidywany termin zostaną zablokowane (komentarz i notatka wewnętrzna zostają edytowalne).',
            'Przychód trafi do raportów Finanse; zakończonej realizacji nie da się usunąć.'] },
          cancelled: { title: 'Anulować realizację?', ok: 'Anuluj realizację', variant: 'danger', lines: [
            'Statusy prac zostaną zablokowane.',
            'Realizacja zniknie z raportów Finanse, a strona oferty (/q) przestanie linkować do strony postępu (/r).'] },
        }[to];
        this.$store.confirm.ask({ ..._texts, cancel: 'Wróć', run: () => this.transition(to) });
      },
      transition(to) {
        let _msg = 'Status realizacji zaktualizowany.';
        if (to === 'done') {
          if (this.unfinished) { this.$store.alert.msg = `Nie można zakończyć realizacji. ${unfinishedText(this.unfinished)} — wszystkie prace muszą mieć status „Zrobione”.`; return; }
          this.r.end_on = todayISO();
          const _learn = realJobs(this.r).filter((j) => j.actual_contractor_price);
          if (_learn.length) _msg += ` Zaktualizowano cennik: ${jobNames(_learn)}.`;
        }
        this.r.status = to; this.r.status_label = statusLabel('realization', to);
        this.save(_msg);
      },
      askLink() {
        this.$store.confirm.ask({
          title: 'Wysłać klientowi link z postępem?',
          lines: [`Klient dostanie e-mail${this.r.client.email ? ` na ${this.r.client.email}` : ''} z linkiem do strony postępu prac.`, 'Link będzie ważny jeszcze 30 dni od dziś.'],
          ok: 'Wyślij link',
          run: () => {
            if (!this.r.client.email) { this.$store.alert.msg = 'Klient nie ma adresu email — dodaj go w danych klienta.'; return; }
            this.r.link_valid_until = addDays(todayISO(), 30);
            this.save('Link z postępem wysłany klientowi.');
          },
        });
      },
      askDelete() {
        this.$store.confirm.ask({
          title: 'Usunąć realizację wraz z pokojami, pracami i zdjęciami?', ok: 'Usuń', variant: 'danger',
          lines: ['Tego nie da się cofnąć. Klient straci stronę postępu prac (/r).'],
          run: () => { this.r.deleted = true; saveRealization(this.r); go('screens/realizations-index.html', 'Realizacja usunięta.'); },
        });
      },
      setSettlement(v) { this.r.settlement = v; this.save('Realizacja zaktualizowana.'); },
      saveEnd() { const _v = document.getElementById('expected-end').value; this.r.expected_end_on = _v || null; this.save('Realizacja zaktualizowana.'); },
      bulk(jobs, status) {
        if (!status) return; // pusty wybór zatrzymuje przeglądarka (select „required”)
        let _n = 0; let _skipped = 0;
        for (const j of jobs) {
          if (status === 'done' && j.status === 'remake') { _skipped += 1; continue; }
          assignStatus(j, status); _n += 1;
        }
        this.save(_skipped ? `Zaktualizowano ${jobsAccusative(_n)}, pominięto ${jobsAccusative(_skipped)} „Do poprawy” — sprawdź pojedynczo.` : `Zaktualizowano ${jobsAccusative(_n)}.`);
      },
      get photoGroups() {
        const _all = (this.r.photos ?? []).map((p, i) => ({ ...p, key: i }));
        return [{ name: 'Ogólne', photos: _all.filter((p) => !p.room) }, ...this.r.rooms.map((rm) => ({ name: rm.name, photos: _all.filter((p) => p.room === rm.name) }))]
          .filter((g) => g.photos.length);
      },
      async pickFiles(e) { this.photoError = ''; const _r = await readPhotos(e.target.files); if (_r.error) { this.photoError = _r.error; this.pending = []; } else this.pending = _r.photos; },
      addPhotos() {
        this.r.photos = [...(this.r.photos ?? []), ...this.pending.map(({ key, ...p }) => ({ ...p, room: this.photoRoom || null }))];
        const _n = this.pending.length; this.pending = []; document.getElementById('photo-files').value = '';
        this.save(`Dodano zdjęcia: ${_n}.`);
      },
      setVisible(i, on) { this.r.photos[i].client_visible = on; this.save('Zapisano zdjęcie.'); },
      setPhotoRoom(i, room) { this.r.photos[i].room = room || null; this.save('Zapisano zdjęcie.'); },
      askDeletePhoto(i) {
        this.$store.confirm.ask({ title: 'Usunąć zdjęcie?', lines: [`„${this.r.photos[i].filename}” zniknie z realizacji i ze strony klienta.`], ok: 'Usuń', variant: 'danger',
          run: () => { this.r.photos.splice(i, 1); this.save('Zdjęcie usunięte.'); } });
      },
    }));
  </script>
</body>
</html>
