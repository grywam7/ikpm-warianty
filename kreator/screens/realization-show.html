<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Realizacja — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="realizations">
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <template x-if="r">
      <div>
        <div class="ikpm-page-head">
          <a class="ikpm-back" :href="link('screens/realizations-index.html')">Realizacje</a>
          <div class="ikpm-page-heading">
            <h1 class="ikpm-page-title">Realizacja #<span x-text="r.id"></span></h1>
            <div class="ikpm-page-meta">
              <span x-html="badge('realization', r.status, null, 'ikpm-status-lg')"></span>
              <a :href="link('screens/client-show.html?id=' + clientId)" x-text="r.client.name"></a>
              <template x-if="r.quote_id"><a :href="link('screens/quote-show.html?id=' + r.quote_id)" x-text="'z wyceny #' + r.quote_id"></a></template>
            </div>
          </div>
          <div class="ikpm-page-actions">
            <a class="btn btn-primary btn-lg" x-show="active" :href="link('screens/obchod.html?id=' + r.id + '&krok=pokoj')"><i class="bi bi-cone-striped" aria-hidden="true"></i>Obchód na budowie</a>
            <template x-if="r.status === 'planned'"><button type="button" class="btn btn-outline-primary btn-lg" @click="ask('in_progress')"><i class="bi bi-play-circle" aria-hidden="true"></i>Rozpocznij</button></template>
            <template x-if="r.status === 'in_progress' && unfinished === 0"><button type="button" class="btn btn-success btn-lg" @click="ask('done')"><i class="bi bi-check-circle" aria-hidden="true"></i>Zakończ</button></template>
            <template x-if="r.status === 'in_progress' && unfinished > 0">
              <span class="d-inline-flex flex-column"><button type="button" class="btn btn-outline-secondary btn-lg" disabled aria-describedby="finish-hint"><i class="bi bi-check-circle" aria-hidden="true"></i>Zakończ</button>
                <span class="ikpm-meta mt-1" id="finish-hint" x-text="unfinishedText(unfinished)"></span></span>
            </template>
            <span class="ikpm-meta" x-show="!active">(status terminalny)</span>
            <button type="button" class="btn btn-outline-primary btn-lg" @click="askLink()"><i class="bi bi-envelope" aria-hidden="true"></i>Wyślij link</button>
            <template x-if="active"><button type="button" class="btn btn-outline-danger btn-lg" @click="ask('cancelled')"><i class="bi bi-x-octagon" aria-hidden="true"></i>Anuluj</button></template>
            <template x-if="r.status !== 'done'"><button type="button" class="btn btn-outline-danger btn-lg" @click="askDelete()"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button></template>
          </div>
        </div>

        <div class="obj obj-real">
          <div class="obj-main">
            <!-- przegląd: postęp i skróty do pokoi i zdjęć — iPad pionowo i telefon nie przewijają przez cały panel boczny -->
            <section class="box" aria-labelledby="h-progress">
              <div class="ikpm-progress mb-3">
                <div class="ikpm-progress-head"><span id="h-progress">Postęp prac</span><span x-text="`${prog.pct}% (${prog.done} / ${prog.all})`"></span></div>
                <div class="progress" role="progressbar" aria-labelledby="h-progress" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="prog.pct"><div class="progress-bar" :class="r.status === 'done' ? 'bg-success' : ''" :style="`width: ${prog.pct}%`"></div></div>
              </div>
              <nav aria-label="Przejdź do">
                <ul class="jump-links">
                  <template x-for="room in r.rooms" :key="room.id">
                    <li><a class="btn btn-outline-primary btn-sm" :href="'#room-' + room.id"><span x-text="room.name"></span><span class="fw-normal" x-text="progLine(room)"></span></a></li>
                  </template>
                  <li><a class="btn btn-outline-primary btn-sm" href="#zdjecia">Zdjęcia<span class="fw-normal" x-text="'(' + (r.photos?.length ?? 0) + ')'"></span></a></li>
                  <li class="only-narrow"><a class="btn btn-outline-secondary btn-sm" href="#szczegoly">Link, rozliczenie, termin i koszty</a></li>
                </ul>
              </nav>
            </section>
            <h2 class="ikpm-section-title">Pokoje i prace</h2>
            <template x-for="room in r.rooms" :key="room.id">
              <section class="room-block" :aria-labelledby="'room-' + room.id">
                <div class="room-head">
                  <div class="min-w-0">
                    <h3 :id="'room-' + room.id" x-text="room.name"></h3>
                    <p class="ikpm-meta mb-0"><span x-text="roomSize(room)"></span><span x-show="roomSize(room)"> · </span><span x-text="progLine(room)"></span></p>
                    <p class="ikpm-meta mb-0" x-show="room.notes"><i class="bi bi-lock" aria-hidden="true"></i> Notatka: <span x-text="room.notes"></span></p>
                  </div>
                  <a class="btn btn-primary" x-show="active" :href="link(`screens/obchod.html?id=${r.id}&pokoj=${room.id}&krok=prace&z=realizacja`)"><i class="bi bi-cone-striped" aria-hidden="true"></i>Obchód w tym pokoju</a>
                </div>
                <template x-if="active">
                  <form class="form-row room-body" @submit.prevent="bulk(room.jobs, document.getElementById('room-status-' + room.id).value)">
                    <div class="field" style="max-width: 18rem"><label class="form-label" :for="'room-status-' + room.id">Status wszystkich prac</label>
                      <select class="form-select" :id="'room-status-' + room.id" :aria-label="'Status wszystkich prac: ' + room.name" required>
                        <option value="">Wybierz status</option>
                        <template x-for="[k, v] in Object.entries(kit.labels.realization_job_status)" :key="k"><option :value="k" x-text="v"></option></template></select></div>
                    <button type="submit" class="btn btn-outline-primary">Zastosuj</button>
                  </form>
                </template>
                <ul class="list-unstyled mb-0">
                  <template x-for="(job, i) in sorted(room.jobs)" :key="job.id">
                    <li class="real-job">
                      <div class="real-job-main">
                        <strong x-text="job.name"></strong>
                        <span class="ikpm-meta d-block" x-text="`${job.stage} · ${qtyText(job.quantity, job.unit)} · Wykonawca: ${job.contractor || '—'}`"></span>
                        <span class="ikpm-meta d-block" x-text="`Stawka faktyczna /j.: ${job.actual_contractor_price ? pln(job.actual_contractor_price) : '— (uzgodniona ' + pln(job.contractor_price) + ')'} · Wartość: ${pln(line(job))}`"></span>
                        <p class="note" x-show="job.notes"><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient): <span x-text="job.notes"></span></p>
                        <p class="note" x-show="job.internal_notes"><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma): <span x-text="job.internal_notes"></span></p>
                      </div>
                      <div class="real-job-end">
                        <span x-html="badge('job', job.status)"></span>
                        <a class="btn btn-outline-primary btn-sm" :href="link(`screens/obchod.html?id=${r.id}&pokoj=${room.id}&krok=prace&praca=${i}&z=realizacja`)" :aria-label="'Zmień: ' + job.name">Zmień</a>
                      </div>
                    </li>
                  </template>
                  <li class="real-job" x-show="!room.jobs.length">(brak prac w tym pomieszczeniu)</li>
                </ul>
              </section>
            </template>

            <section id="zdjecia" aria-labelledby="h-photos">
              <h2 class="ikpm-section-title" id="h-photos">Zdjęcia</h2>
              <div class="box">
                <div class="form-row">
                  <div class="field">
                    <input class="visually-hidden file-input" id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple @change="pickFiles($event)">
                    <label class="btn btn-outline-primary btn-lg w-100" for="photo-files"><i class="bi bi-images" aria-hidden="true"></i>Zdjęcia (JPG, PNG, WebP; najwyżej 20 naraz)</label>
                  </div>
                  <div class="field"><label class="form-label" for="photo-room">Pokój</label>
                    <select class="form-select" id="photo-room" x-model="photoRoom"><option value="">Ogólne (bez pokoju)</option>
                      <template x-for="rm in r.rooms" :key="rm.id"><option :value="rm.name" x-text="rm.name"></option></template></select></div>
                  <button type="button" class="btn btn-primary btn-lg" :disabled="!pending.length" @click="addPhotos()"><i class="bi bi-upload" aria-hidden="true"></i>Dodaj zdjęcia</button>
                </div>
                <p class="ikpm-meta mt-2 mb-0" x-show="pending.length" x-text="'Wybrane: ' + pending.length + ' — „Widoczne dla klienta” ustawisz przy zdjęciu po dodaniu.'"></p>
                <div class="alert alert-danger d-flex gap-2 mt-2 mb-0" role="alert" x-show="photoError"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span x-text="photoError"></span></div>
              </div>
              <template x-for="g in photoGroups" :key="g.name">
                <div class="mt-3">
                  <h3 class="h6" x-text="g.name"></h3>
                  <div class="ikpm-photo-grid">
                    <template x-for="ph in g.photos" :key="ph.key">
                      <div class="ikpm-photo">
                        <template x-if="ph.src"><a class="ikpm-photo-thumb p-0" :href="ph.src" target="_blank" :aria-label="'Otwórz zdjęcie ' + ph.filename"><img class="ikpm-photo-thumb" :src="ph.src" alt=""></a></template>
                        <template x-if="!ph.src"><div class="ikpm-photo-thumb" role="img" :aria-label="'Zdjęcie ' + ph.filename"><i class="bi bi-image" aria-hidden="true"></i><span x-text="ph.filename"></span></div></template>
                        <div class="ikpm-photo-body">
                          <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" :id="'v-' + ph.key" :checked="ph.client_visible" @change="setVisible(ph.key, $el.checked)">
                            <label class="form-check-label" :for="'v-' + ph.key">Widoczne dla klienta</label>
                          </div>
                          <label class="visually-hidden" :for="'pr-' + ph.key" x-text="'Pokój: ' + ph.filename"></label>
                          <select class="form-select form-select-sm" :id="'pr-' + ph.key" @change="setPhotoRoom(ph.key, $event.target.value)">
                            <option value="" :selected="!ph.room">Ogólne (bez pokoju)</option>
                            <template x-for="rm in r.rooms" :key="rm.id"><option :value="rm.name" :selected="ph.room === rm.name" x-text="rm.name"></option></template>
                          </select>
                          <button type="button" class="btn btn-outline-danger btn-sm" @click="askDeletePhoto(ph.key)" :aria-label="'Usuń zdjęcie ' + ph.filename"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <p class="mt-3" x-show="!r.photos?.length">Brak zdjęć.</p>
            </section>
          </div>
          <div class="obj-side" id="szczegoly" tabindex="-1">
            <section class="box" aria-label="Publiczny link i rozliczenie">
              <p class="mb-1">Publiczny link dla klienta:</p>
              <p class="mb-2 text-break"><span x-text="publicUrl"></span>
                <span class="ikpm-meta" x-show="r.link_valid_until" x-text="linkValidity"></span></p>
              <p class="ikpm-meta mb-3">Prototyp — to, co dostał klient: <a :href="link('screens/public-realization.html?id=' + r.id)">strona postępu prac (/r)</a> ·
                <a :href="link('screens/mail-progress-link.html?id=' + r.id)">mail z linkiem do postępu</a></p>
              <template x-if="active">
                <div>
                  <label class="form-label" for="settlement">Rozliczenie:</label>
                  <select class="form-select" id="settlement" @change="setSettlement($event.target.value)">
                    <template x-for="[k, v] in Object.entries(kit.labels.settlement)" :key="k"><option :value="k" :selected="r.settlement === k" x-text="v"></option></template>
                  </select>
                </div>
              </template>
              <p class="mb-0" x-show="!active" x-text="'Rozliczenie: ' + kit.labels.settlement[r.settlement]"></p>
            </section>
            <section class="box" aria-labelledby="h-term">
              <h2 class="box-title" id="h-term">Termin</h2>
              <dl class="ikpm-dl">
                <dt>Adres inwestycji</dt><dd x-text="r.site_address || '—'"></dd>
                <dt>Planowany start</dt><dd x-text="dateText(r.planned_start_on)"></dd>
                <dt>Termin obiecany</dt><dd x-text="dateText(r.promised_end_on)"></dd>
                <template x-if="r.status === 'done'"><dt>Data zakończenia</dt></template>
                <template x-if="r.status === 'done'"><dd x-text="dateText(r.end_on)"></dd></template>
                <template x-if="!active && r.status !== 'done'"><dt>Aktualnie przewidywany</dt></template>
                <template x-if="!active && r.status !== 'done'"><dd x-text="dateText(r.expected_end_on)"></dd></template>
              </dl>
              <template x-if="active">
                <div class="form-row mt-3">
                  <div class="field"><label class="form-label" for="expected-end">Aktualnie przewidywany</label>
                    <input class="form-control" id="expected-end" type="date" min="2000-01-01" max="2099-12-31" :value="r.expected_end_on || ''" @input="endDirty = true"></div>
                  <button type="button" class="btn btn-outline-primary" @click="saveEnd()">Zapisz</button>
                  <span class="ikpm-save" data-state="dirty" x-show="endDirty">Niezapisane zmiany</span>
                </div>
              </template>
            </section>
            <section class="cost-cards" aria-label="Koszty">
              <div><div class="ikpm-meta">Wartość netto (z wyceny)</div><div class="ikpm-amount-lg" x-text="pln(r.total_price)"></div></div>
              <div><div class="ikpm-meta">Koszt (faktyczny)</div><div class="ikpm-amount-lg" x-text="pln(cost)"></div></div>
              <div><div class="ikpm-meta">Koszt z wyceny</div><div class="ikpm-amount-lg" x-text="pln(r.estimated_cost)"></div></div>
            </section>
            <template x-if="active">
              <section class="box" aria-labelledby="h-bulk">
                <h2 class="box-title" id="h-bulk">Ustaw status wszystkim pracom etapu</h2>
                <form class="ikpm-grid" style="--ikpm-grid-min: 11rem; align-items: end" @submit.prevent="bulk(realJobs(r).filter((j) => j.stage === bulkStage), bulkStatus)">
                  <div><label class="form-label" for="bulk-stage">Etap</label>
                    <select class="form-select" id="bulk-stage" x-model="bulkStage" required><option value="">Wybierz etap</option>
                      <template x-for="s in stages" :key="s"><option :value="s" x-text="s"></option></template></select></div>
                  <div><label class="form-label" for="bulk-status">Status</label>
                    <select class="form-select" id="bulk-status" x-model="bulkStatus" required><option value="">Wybierz status</option>
                      <template x-for="[k, v] in Object.entries(kit.labels.realization_job_status)" :key="k"><option :value="k" x-text="v"></option></template></select></div>
                  <div><button type="submit" class="btn btn-outline-primary w-100">Zastosuj</button></div>
                </form>
              </section>
            </template>
          </div>

        </div>
      </div>
    </template>
  </div></main>
  <script type="module">
    import {
      start, getRealization, saveRealization, progress, realJobs, realCost, isActive, sortJobs, assignStatus, unfinishedText,
      jobsAccusative, clientByName, addDays, todayISO, go, readPhotos, ikpm, statusLabel, jobNames, dateText,
    } from '../assets/app.js';
    const _r = getRealization(new URLSearchParams(location.search).get('id') ?? 1);
    if (!_r || _r.deleted) location.replace('error-404.html');
    start(() => ({
      r: _r, realJobs, unfinishedText, sorted: sortJobs,
      clientId: _r ? clientByName(_r.client.name)?.id : null,
      bulkStage: '', bulkStatus: '', pending: [], photoRoom: '', photoError: '', endDirty: false,
      get active() { return isActive(this.r); },
      get prog() { return progress(this.r); },
      get cost() { return realCost(this.r); },
      get unfinished() { return realJobs(this.r).filter((j) => j.status !== 'done').length; },
      get stages() { return [...new Set(sortJobs(realJobs(this.r)).map((j) => j.stage))]; },
      get publicUrl() { return `${location.origin}/r/${this.r.id}…`; },
      get linkValidity() {
        const _v = this.r.link_valid_until;
        return _v < todayISO() ? `(wygasł ${dateText(_v)} — „Wyślij link” odnowi go na 30 dni)` : `(ważny do ${dateText(_v)})`;
      },
      progLine(room) { const _p = progress(this.r, room); return `${_p.done} / ${_p.all} zrobione`; },
      line(job) { return ikpm.lineTotal(job, this.r.markup_percent); },
      save(msg) { saveRealization(this.r); if (msg) this.$store.toast.show(msg); },
      ask(to) {
        const _texts = {
          in_progress: { title: 'Rozpocząć realizację?', ok: 'Rozpocznij', variant: 'primary', lines: ['Status realizacji zmieni się na „W trakcie” — klient zobaczy go na stronie postępu prac (/r).'] },
          done: { title: 'Zakończyć realizację?', ok: 'Zakończ', variant: 'success', lines: [
            'Wszystkie prace mają status „Zrobione”.',
            'Cennik nauczy się ze stawek faktycznych ekip z tej realizacji.',
            'Statusy prac, stawki faktyczne, rozliczenie i przewidywany termin zostaną zablokowane (komentarz i notatka wewnętrzna zostają edytowalne).',
            'Przychód trafi do raportów Finanse; zakończonej realizacji nie da się usunąć.'] },
          cancelled: { title: 'Anulować realizację?', ok: 'Anuluj realizację', variant: 'danger', lines: [
            'Statusy prac zostaną zablokowane.',
            'Realizacja zniknie z raportów Finanse, a strona oferty (/q) przestanie linkować do strony postępu (/r).'] },
        }[to];
        this.$store.confirm.ask({ ..._texts, cancel: 'Wróć', run: () => this.transition(to) });
      },
      transition(to) {
        let _msg = 'Status realizacji zaktualizowany.';
        if (to === 'done') {
          if (this.unfinished) { this.$store.alert.msg = `Nie można zakończyć realizacji. ${unfinishedText(this.unfinished)} — wszystkie prace muszą mieć status „Zrobione”.`; return; }
          this.r.end_on = todayISO();
          const _learn = realJobs(this.r).filter((j) => j.actual_contractor_price);
          if (_learn.length) _msg += ` Zaktualizowano cennik: ${jobNames(_learn)}.`;
        }
        this.r.status = to; this.r.status_label = statusLabel('realization', to);
        this.save(_msg);
      },
      askLink() {
        this.$store.confirm.ask({
          title: 'Wysłać klientowi link z postępem?',
          lines: [`Klient dostanie e-mail${this.r.client.email ? ` na ${this.r.client.email}` : ''} z linkiem do strony postępu prac.`, 'Link będzie ważny jeszcze 30 dni od dziś.'],
          ok: 'Wyślij link',
          run: () => {
            if (!this.r.client.email) { this.$store.alert.msg = 'Klient nie ma adresu email — dodaj go w danych klienta.'; return; }
            this.r.link_valid_until = addDays(todayISO(), 30);
            this.save('Link z postępem wysłany klientowi.');
          },
        });
      },
      askDelete() {
        this.$store.confirm.ask({
          title: 'Usunąć realizację wraz z pokojami, pracami i zdjęciami?', ok: 'Usuń', variant: 'danger',
          lines: ['Tego nie da się cofnąć. Klient straci stronę postępu prac (/r).'],
          run: () => { this.r.deleted = true; saveRealization(this.r); go('screens/realizations-index.html', 'Realizacja usunięta.'); },
        });
      },
      setSettlement(v) { this.r.settlement = v; this.save('Realizacja zaktualizowana.'); },
      saveEnd() { const _v = document.getElementById('expected-end').value; this.r.expected_end_on = _v || null; this.endDirty = false; this.save('Realizacja zaktualizowana.'); },
      bulk(jobs, status) {
        if (!status) return; // pusty wybór zatrzymuje przeglądarka (select „required”)
        let _n = 0; let _skipped = 0;
        for (const j of jobs) {
          if (status === 'done' && j.status === 'remake') { _skipped += 1; continue; }
          assignStatus(j, status); _n += 1;
        }
        this.save(_skipped ? `Zaktualizowano ${jobsAccusative(_n)}, pominięto ${jobsAccusative(_skipped)} „Do poprawy” — sprawdź pojedynczo.` : `Zaktualizowano ${jobsAccusative(_n)}.`);
      },
      get photoGroups() {
        const _all = (this.r.photos ?? []).map((p, i) => ({ ...p, key: i }));
        return [{ name: 'Ogólne', photos: _all.filter((p) => !p.room) }, ...this.r.rooms.map((rm) => ({ name: rm.name, photos: _all.filter((p) => p.room === rm.name) }))]
          .filter((g) => g.photos.length);
      },
      async pickFiles(e) { this.photoError = ''; const _r = await readPhotos(e.target.files); if (_r.error) { this.photoError = _r.error; this.pending = []; } else this.pending = _r.photos; },
      addPhotos() {
        this.r.photos = [...(this.r.photos ?? []), ...this.pending.map(({ key, ...p }) => ({ ...p, room: this.photoRoom || null }))];
        const _n = this.pending.length; this.pending = []; document.getElementById('photo-files').value = '';
        this.save(`Dodano zdjęcia: ${_n}.`);
      },
      setVisible(i, on) { this.r.photos[i].client_visible = on; this.save('Zapisano zdjęcie.'); },
      setPhotoRoom(i, room) { this.r.photos[i].room = room || null; this.save('Zapisano zdjęcie.'); },
      askDeletePhoto(i) {
        this.$store.confirm.ask({ title: 'Usunąć zdjęcie?', lines: [`„${this.r.photos[i].filename}” zniknie z realizacji i ze strony klienta.`], ok: 'Usuń', variant: 'danger',
          run: () => { this.r.photos.splice(i, 1); this.save('Zdjęcie usunięte.'); } });
      },
    }));
  </script>
</body>
</html>
