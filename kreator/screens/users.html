<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Użytkownicy — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="users">
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <div class="ikpm-page-head">
      <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Użytkownicy</h1></div>
      <div class="ikpm-page-actions"><a class="btn btn-primary btn-lg" :href="link('screens/user-form.html')"><i class="bi bi-person-plus" aria-hidden="true"></i>Dodaj użytkownika</a></div>
    </div>
    <div class="ikpm-table-box">
      <table class="table ikpm-stack">
        <thead><tr><th scope="col">Email</th><th scope="col">Imię i nazwisko</th><th scope="col">Telefon</th><th scope="col">Role</th><th scope="col"><span class="visually-hidden">Akcje</span></th></tr></thead>
        <tbody>
          <template x-for="u in list" :key="u.email">
            <tr><td class="ikpm-cell-lead"><span x-text="u.email"></span> <span x-show="!u.active" x-html="badge('user', 'inactive', 'Nieaktywne')"></span></td>
              <td data-label="Imię i nazwisko" x-text="u.display_name"></td><td data-label="Telefon" x-text="u.phone || '—'"></td>
              <td data-label="Role"><span class="d-inline-flex flex-wrap gap-1"><template x-for="r in u.role_labels" :key="r"><span class="ikpm-chip" x-text="r"></span></template><span x-show="!u.role_labels.length">brak</span></span></td>
              <td class="ikpm-cell-full text-end"><a class="btn btn-outline-primary btn-sm" :href="link('screens/user-form.html?email=' + encodeURIComponent(u.email))" :aria-label="'Edytuj: ' + u.email">Edytuj</a></td></tr>
          </template>
        </tbody>
      </table>
    </div>
  </div></main>
  <script type="module">
    import { start, users } from '../assets/app.js';
    start(() => ({ list: users() }));
  </script>
</body>
</html>
