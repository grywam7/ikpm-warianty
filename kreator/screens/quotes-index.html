<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wyceny — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="quotes">
  <main id="main"><div id="app" class="ikpm-content" x-data="page" x-cloak>
    <div class="ikpm-page-head">
      <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Wyceny</h1></div>
      <div class="ikpm-page-actions">
        <a class="btn btn-primary btn-lg" :href="link('screens/quotes-new.html?mode=rooms')"><i class="bi bi-plus-square" aria-hidden="true"></i>Nowa wycena (pokoje)</a>
        <a class="btn btn-outline-primary btn-lg" :href="link('screens/quotes-new.html?mode=simple')"><i class="bi bi-plus-lg" aria-hidden="true"></i>Nowa wycena (prosta)</a>
        <a class="btn btn-outline-secondary btn-lg" :href="link('screens/clients.html')"><i class="bi bi-people" aria-hidden="true"></i>Klienci</a>
      </div>
    </div>
    <div class="ikpm-table-box" x-show="list.length">
      <table class="table ikpm-stack">
        <thead><tr><th scope="col">#</th><th scope="col">Klient</th><th scope="col">Status</th><th scope="col" class="col-aux ikpm-num">Pokoje</th><th scope="col" class="col-aux ikpm-num">Prace</th><th scope="col" class="ikpm-num">Wartość</th><th class="col-aux" scope="col">Wysłana</th><th class="col-aux" scope="col">Odpowiedź</th><th scope="col" class="col-actions"><span class="visually-hidden">Akcje</span></th></tr></thead>
        <tbody>
          <template x-for="q in list" :key="q.id">
            <tr>
              <td class="ikpm-cell-lead"><a class="text-nowrap" :href="link('screens/quote-show.html?id=' + q.id)" x-text="'Wycena #' + q.id"></a></td>
              <td data-label="Klient"><span><span x-text="q.client?.name || '(brak klienta)'"></span><span class="d-block ikpm-meta" x-show="q.site_address" x-text="q.site_address"></span></span></td>
              <td data-label="Status" x-html="badge('quote', q.status)"></td>
              <td class="col-aux ikpm-num" data-label="Pokoje" x-text="q.rooms.length"></td>
              <td class="col-aux ikpm-num" data-label="Prace" x-text="jobCount(q)"></td>
              <td class="ikpm-num fw-semibold" data-label="Wartość" x-text="pln(net(q))"></td>
              <td class="col-aux" data-label="Wysłana" x-text="dateText(q.sent_at)"></td>
              <td class="col-aux" data-label="Odpowiedź" x-text="dateText(q.responded_at)"></td>
              <td class="ikpm-cell-full"><div class="d-flex flex-wrap gap-2 justify-content-end">
                <template x-if="q.status === 'draft'"><a class="btn btn-primary btn-sm" :href="builderLink(q, nextStep(q).step)" x-text="nextStep(q).label"></a></template>
                <template x-if="q.status === 'draft'"><a class="btn btn-outline-primary btn-sm" :href="builderLink(q, 'sprawdz')">Edytuj</a></template>
                <a class="btn btn-outline-secondary btn-sm ikpm-btn-icon" :href="link('screens/quote-show.html?id=' + q.id)" :aria-label="'Podgląd: wycena #' + q.id" title="Podgląd"><i class="bi bi-eye" aria-hidden="true"></i></a>
                <button type="button" class="btn btn-outline-secondary btn-sm ikpm-btn-icon" @click="copy(q)" :aria-label="'Kopiuj: wycena #' + q.id" title="Kopiuj"><i class="bi bi-copy" aria-hidden="true"></i></button>
                <template x-if="q.status === 'draft'"><button type="button" class="btn btn-outline-danger btn-sm ikpm-btn-icon" @click="askDelete(q)" :aria-label="'Usuń: wycena #' + q.id" title="Usuń"><i class="bi bi-trash" aria-hidden="true"></i></button></template>
              </div></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="ikpm-empty" x-show="!list.length"><i class="bi bi-file-earmark-text" aria-hidden="true"></i><p class="ikpm-empty-title">Brak wycen.</p><p>Utwórz pierwszą wycenę.</p><a class="btn btn-primary" :href="link('screens/quotes-new.html?mode=rooms')">Nowa wycena (pokoje)</a></div>
  </div></main>
  <script type="module">
    import { start, quotes, quoteJobs, totals, nextStep, builderLink, copyQuote, saveQuote, go } from '../assets/app.js';
    start(() => ({
      list: quotes(), nextStep, builderLink,
      jobCount: (q) => quoteJobs(q).length,
      net: (q) => totals(q).net,
      copy(q) { const _c = copyQuote(q); go(`screens/builder.html?id=${_c.id}&krok=sprawdz`, `Utworzono kopię wyceny #${q.id}. Ceny są z aktualnego cennika — dobierz wykonawców i uzupełnij termin oferty.`); },
      askDelete(q) {
        this.$store.confirm.ask({ title: `Usunąć wycenę #${q.id}?`, lines: ['Szkic zniknie razem z pokojami i pracami. Tego nie da się cofnąć.'], ok: 'Usuń', variant: 'danger',
          run: () => { q.deleted = true; saveQuote(q); this.list = quotes(); this.$store.toast.show('Wycena usunięta.'); } });
      },
    }));
  </script>
</body>
</html>
