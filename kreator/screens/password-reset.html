<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Przypomnienie hasła — IKPM</title>
  <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/ikpm-ui.css">
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body data-section="guest">
  <main id="main" class="ikpm-content"><div class="auth-box">
    <p class="ikpm-brand px-0 mb-2"><strong>IKPM</strong><span>System kosztorysów</span></p>
    <div class="alert alert-success d-flex gap-2" role="status" id="sent" hidden><i class="bi bi-check-circle-fill" aria-hidden="true"></i>Instrukcja zmiany hasła zostanie niezwłocznie wysłana na podany adres e-mail.</div>
    <form class="box" id="reset-form">
      <h1 class="h2">Zapomniałeś swojego hasła?</h1>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" required></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Wyślij instrukcje zmiany hasła</button>
      <p class="mt-3 mb-0"><a  href="login.html">Zaloguj się</a> · <a  href="password-reset.html?krok=nowe">Prototyp: nowe hasło (link z maila)</a></p>
    </form>
    <form class="box" id="new-form" hidden>
      <h1 class="h2">Zmień swoje hasło</h1>
      <div class="mb-3"><label class="form-label" for="new-pass">Nowe hasło</label><input class="form-control" id="new-pass" type="password" autocomplete="new-password" aria-describedby="new-hint"><span class="form-text" id="new-hint">(minimum 6 znaków)</span></div>
      <div class="mb-3"><label class="form-label" for="new-pass2">Powtórz nowe hasło</label><input class="form-control" id="new-pass2" type="password" autocomplete="new-password"></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Zmień moje hasło</button>
      <p class="mt-3 mb-0"><a  href="login.html">Zaloguj się</a> · <a  href="password-reset.html">Zapomniałeś hasła?</a></p>
    </form>
  </div></main>
  <script>
    const _new = new URLSearchParams(location.search).get('krok') === 'nowe';
    document.getElementById('reset-form').hidden = _new;
    document.getElementById('new-form').hidden = !_new;
    document.getElementById('reset-form').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sent').hidden = false; });
    document.getElementById('new-form').addEventListener('submit', (e) => { e.preventDefault(); location.href = '../index.html'; });
  </script>
</body>
</html>
