<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IKPM — System kosztorysów</title>
<link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/ikpm-ui.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* Start: zestawienie bieżącej pracy — od 1100 px dwie kolumny (realizacje | wyceny), od 1600 px wyceny w dwóch kolumnach. */
  .k-start { display: grid; gap: var(--ikpm-space-6) var(--ikpm-space-8); align-items: start; }
  .k-start-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; }
  .k-start-head .ikpm-section-title { margin-top: 0; }
  .k-start-groups > section + section { margin-top: var(--ikpm-space-5); }
  .k-group-title { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0 0 .5rem; font-size: 1rem; }
  @media (min-width: 1100px) { .k-start { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  @media (min-width: 1600px) {
    .k-start { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
    .k-start-groups { column-count: 2; column-gap: var(--ikpm-space-6); }
    .k-start-groups > section, .k-start-groups > section + section { break-inside: avoid; margin: 0 0 var(--ikpm-space-5); }
  }
</style>
</head>
<body data-nav="start">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div id="alerts"></div>
  <div class="ikpm-page-head">
    <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Start</h1>
      <div class="ikpm-page-meta"><span x-text="realizations.length + ' w toku · ' + waiting + ' wycen czeka na następny krok'"></span></div></div>
    <div class="ikpm-page-actions">
      <a class="btn btn-primary btn-lg" :href="ik.href('screens/quotes-new.html?mode=rooms')"><i class="bi bi-plus-square" aria-hidden="true"></i>Nowa wycena (pokoje)</a>
      <a class="btn btn-outline-primary btn-lg" :href="ik.href('screens/quotes-new.html?mode=simple')"><i class="bi bi-plus-lg" aria-hidden="true"></i>Nowa wycena (prosta)</a>
    </div>
  </div>

  <div class="k-start">
    <section aria-labelledby="real-title">
      <div class="k-start-head"><h2 id="real-title" class="ikpm-section-title">Realizacje w toku</h2><a :href="ik.href('screens/realizations-index.html')">Lista realizacji</a></div>
      <div class="ikpm-empty" x-show="!realizations.length"><i class="bi bi-cone-striped" aria-hidden="true"></i><p>Brak realizacji planowanych i w trakcie.</p></div>
      <ul class="ikpm-list" x-show="realizations.length">
        <template x-for="r in realizations" :key="r.id">
          <li class="ikpm-row">
            <span class="ikpm-row-main">
              <span class="ikpm-row-title" x-text="'#' + r.id + ' ' + r.client.name"></span>
              <span class="ikpm-row-meta" x-text="r.site_address"></span>
              <span class="ikpm-row-meta"><span x-text="'Termin: ' + ik.date(ik.endOn(r))"></span><span class="fw-semibold text-danger-emphasis" x-show="ik.delayed(r)" x-text="' · obiecany ' + ik.date(r.promised_end_on)"></span></span>
              <span class="ikpm-progress mt-2" style="max-width: 22rem">
                <span class="ikpm-progress-head"><span :id="'pp-' + r.id">Postęp prac</span><span x-text="ik.progress(r) + '% (' + ik.doneCount(r) + ' / ' + ik.realJobs(r).length + ')'"></span></span>
                <span class="progress d-flex" role="progressbar" :aria-labelledby="'pp-' + r.id" :aria-valuenow="ik.progress(r)" aria-valuemin="0" aria-valuemax="100"><span class="progress-bar" :style="'width:' + ik.progress(r) + '%'"></span></span>
              </span>
            </span>
            <span class="ikpm-row-end"><span x-html="ik.realBadge(r.status)"></span>
              <a class="btn btn-primary btn-lg" :href="ik.href('screens/realization-show.html?id=' + r.id)" :aria-label="'Otwórz realizację #' + r.id">Otwórz</a></span>
          </li>
        </template>
      </ul>
    </section>

    <section aria-labelledby="quotes-title">
      <div class="k-start-head"><h2 id="quotes-title" class="ikpm-section-title">Wyceny czekające na następny krok</h2><a :href="ik.href('screens/quotes-index.html')">Lista wycen</a></div>
      <div class="ikpm-empty" x-show="!waiting"><i class="bi bi-file-earmark-text" aria-hidden="true"></i><p>Żadna wycena nie czeka na następny krok.</p></div>
      <div class="k-start-groups">
        <template x-for="g in groups" :key="g.key">
          <section x-show="g.quotes.length" :aria-labelledby="'g-' + g.key">
            <h3 class="k-group-title" :id="'g-' + g.key"><span x-html="ik.quoteBadge(g.status, true)"></span><span x-text="g.title"></span><span class="ikpm-chip" x-text="g.quotes.length"></span></h3>
            <ul class="ikpm-list">
              <template x-for="q in g.quotes" :key="q.id">
                <li class="ikpm-row">
                  <span class="ikpm-row-main">
                    <span class="ikpm-row-title" x-text="'#' + q.id + ' ' + (q.client ? q.client.name : '(brak klienta)')"></span>
                    <span class="ikpm-row-meta" x-text="q.site_address || 'Adres inwestycji: —'"></span>
                    <span class="ikpm-chip ikpm-tone-warning mt-1" x-show="ik.clientComments(q)"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Uwagi klienta</span>
                  </span>
                  <span class="ikpm-row-end"><span class="ikpm-amount" x-text="ik.pln(ik.quoteTotals(q).net)"></span>
                    <a class="btn btn-lg" :class="q.status === 'draft' ? 'btn-primary' : 'btn-outline-primary'" :href="ik.href('screens/' + (q.status === 'draft' ? 'builder' : 'quote-show') + '.html?id=' + q.id)" :aria-label="(q.status === 'draft' ? 'Edytuj' : 'Podgląd') + ' — wycena #' + q.id" x-text="q.status === 'draft' ? 'Edytuj' : 'Podgląd'"></a></span>
                </li>
              </template>
            </ul>
          </section>
        </template>
      </div>
    </section>
  </div>
</main>
<script type="module">
import { boot, db } from './assets/app.js';

boot(() => ({
  get waiting() { return this.groups.reduce((n, g) => n + g.quotes.length, 0); },
  get realizations() { return db.realizations.filter((r) => ik.realActive(r)).sort((a, b) => (a.status === 'in_progress' ? 0 : 1) - (b.status === 'in_progress' ? 0 : 1) || b.id - a.id); },
  get groups() {
    const by = (status, extra = () => true) => [...db.quotes].filter((q) => q.status === status && extra(q)).sort((a, b) => b.id - a.id);
    return [
      { key: 'cr', status: 'changes_requested', title: 'klient czeka na poprawioną ofertę', quotes: by('changes_requested') },
      { key: 'draft', status: 'draft', title: 'do dokończenia i wysłania', quotes: by('draft') },
      { key: 'acc', status: 'accepted', title: 'bez realizacji', quotes: by('accepted', (q) => !ik.realizationOf(q)) },
      { key: 'sent', status: 'sent', title: 'czeka na odpowiedź klienta', quotes: by('sent') },
    ];
  },
}));
</script>
</body>
</html>
