<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zaloguj się — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="ikpm-public-bar"><span><strong>IKPM</strong> <span class="ikpm-muted">System kosztorysów</span></span></header>
<main id="main" class="ikpm-public" style="max-width: 30rem">
  <form id="login" class="card" novalidate aria-labelledby="l-title">
    <div class="card-body p-4 d-grid gap-3">
      <h1 id="l-title" class="mb-0">Zaloguj się</h1>
      <div id="l-error" class="alert alert-danger d-flex gap-2 mb-0" role="alert" hidden><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i><span>Błędny adres Email lub hasło.</span></div>
      <div><label class="form-label" for="l-email">Email</label><input id="l-email" type="email" class="form-control" autocomplete="email" required></div>
      <div><label class="form-label" for="l-pass">Hasło</label><input id="l-pass" type="password" class="form-control" autocomplete="current-password" required></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" id="l-remember"><label class="form-check-label" for="l-remember">Zapamiętaj mnie</label></div>
      <button class="btn btn-primary btn-lg w-100">Zaloguj się</button>
      <p class="mb-0"><a href="password-reset.html">Zapomniałeś hasła?</a></p>
    </div>
  </form>
</main>
<script>
  // Prototyp: każde wpisane konto loguje na ekran startowy.
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const ok = document.getElementById('l-email').value.includes('@') && document.getElementById('l-pass').value;
    document.getElementById('l-error').hidden = !!ok;
    if (ok) location.href = '../index.html';
  });
</script>
</body>
</html>
