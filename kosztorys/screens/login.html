<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaloguj się — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="bg-dark text-white py-3"><div class="container px-3" style="max-width: 480px"><span class="fw-bold">IKPM</span> <small>System kosztorysów</small></div></header>
<main class="container px-3 py-4" style="max-width: 480px">
  <form id="login" class="card" novalidate aria-labelledby="l-title">
    <div class="card-body p-4">
      <h1 id="l-title" class="h3 mb-3">Zaloguj się</h1>
      <div id="l-error" class="alert alert-danger" role="alert" hidden>Błędny adres Email lub hasło.</div>
      <label class="form-label" for="l-email">Email</label><input id="l-email" type="email" class="form-control mb-3" autocomplete="email" required>
      <label class="form-label" for="l-pass">Hasło</label><input id="l-pass" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="l-remember"><label class="form-check-label" for="l-remember">Zapamiętaj mnie</label></div>
      <button class="btn btn-primary btn-main w-100">Zaloguj się</button>
      <p class="mt-3 mb-0"><a class="tap" href="password-reset.html">Zapomniałeś hasła?</a></p>
    </div>
  </form>
</main>
<script>
  // Prototyp: każde wpisane konto loguje na ekran startowy.
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const ok = document.getElementById('l-email').value.includes('@') && document.getElementById('l-pass').value;
    document.getElementById('l-error').hidden = !!ok;
    if (ok) location.href = '../index.html';
  });
</script>
</body>
</html>
