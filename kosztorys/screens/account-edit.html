<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edytuj konto — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="profile">
<div id="nav"></div>
<main x-data="page" x-cloak class="container px-3 pb-5" style="max-width: 640px">
  <form class="card my-3" @submit.prevent="submit()" novalidate aria-labelledby="a-title">
    <div class="card-body">
      <h1 id="a-title" class="h3">Edytuj konto</h1>
      <div class="alert alert-danger" role="alert" x-show="errors.length"><ul class="mb-0"><template x-for="e in errors" :key="e"><li x-text="e"></li></template></ul></div>
      <label class="form-label" for="a-email">Email</label><input id="a-email" type="email" class="form-control mb-3" autocomplete="email" x-model="form.email">
      <label class="form-label" for="a-pass">Hasło <span class="text-body-secondary">(pozostaw puste, jeśli nie chcesz wprowadzać zmian)</span></label>
      <input id="a-pass" type="password" class="form-control" autocomplete="new-password" aria-describedby="a-pass-hint" x-model="form.password"><p id="a-pass-hint" class="small text-body-secondary">(minimum 6 znaków)</p>
      <label class="form-label" for="a-pass2">Potwierdzenie hasła</label><input id="a-pass2" type="password" class="form-control mb-3" autocomplete="new-password" x-model="form.password2">
      <label class="form-label" for="a-current">Aktualne hasło <span class="text-body-secondary">(potrzebujemy Twojego bieżącego hasła, aby potwierdzić zmiany)</span></label><input id="a-current" type="password" class="form-control mb-3" autocomplete="current-password" x-model="form.current">
      <div class="d-flex justify-content-between gap-2"><a class="btn btn-outline-secondary btn-main" :href="ik.href('screens/profile.html')">Powrót</a><button class="btn btn-primary btn-main">Aktualizuj</button></div>
    </div>
  </form>
</main>
<script type="module">
import { boot, db, save, toast } from '../assets/app.js';

boot(() => ({
  form: {}, errors: [],
  init() { this.form = { email: db.users[0].email, password: '', password2: '', current: '' }; },
  submit() {
    const f = this.form; const e = [];
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.push('Email jest nieprawidłowy');
    if (f.password && f.password.length < 6) e.push('Hasło jest za krótkie (przynajmniej 6 znaków)');
    if (f.password !== f.password2) e.push('Potwierdzenie hasła musi być takie samo jak hasło');
    if (!f.current) e.push('Aktualne hasło nie może być puste');
    this.errors = e; if (e.length) return;
    db.users[0].email = f.email; save(); this.form.password = this.form.password2 = this.form.current = '';
    toast('Konto zostało pomyślnie zaktualizowane.');
  },
}));
</script>
</body>
</html>
