<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mail: link do postępu — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<main id="main" x-data="page" x-cloak class="ikpm-content">
<template x-if="r">
  <article class="ikpm-mail" aria-labelledby="m-subject">
    <div class="ikpm-mail-head">
      <dl class="ikpm-dl">
        <dt>Od:</dt><dd>IKPM &lt;noreply@ikpm.local&gt;</dd>
        <dt>Do:</dt><dd class="text-break" x-text="r.client.email || '—'"></dd>
        <dt>Temat:</dt><dd><h1 id="m-subject" class="fs-6 fw-semibold mb-0" x-text="'Postęp prac — ' + r.client.name"></h1></dd>
      </dl>
    </div>
    <div class="ikpm-mail-body">
      <p>Witamy,</p>
      <p>Zapraszamy do śledzenia postępu Państwa prac:</p>
      <p><a class="text-break" :href="ik.href('screens/public-realization.html?id=' + r.id)">Postęp prac</a></p>
      <p class="mb-0">Zespół</p>
    </div>
  </article>
</template>
</main>
<script type="module">
import { boot, db, idParam } from '../assets/app.js';
boot(() => ({
  r: null,
  init() { this.r = db.realizations.find((x) => x.id === idParam(1)); if (!this.r) location.replace(ik.href('screens/error-404.html')); },
}));
</script>
</body>
</html>
