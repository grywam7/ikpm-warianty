<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail: link do postępu — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<main x-data="page" x-cloak class="container px-3 py-3" style="max-width: 720px">
<template x-if="r">
  <article class="card" aria-labelledby="m-subject">
    <div class="card-header bg-body small">
      <dl class="row mb-0">
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Od:</dt><dd class="col-9 col-sm-10 mb-1">IKPM &lt;noreply@ikpm.local&gt;</dd>
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Do:</dt><dd class="col-9 col-sm-10 mb-1 text-break" x-text="r.client.email || '—'"></dd>
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Temat:</dt><dd class="col-9 col-sm-10 mb-0"><h1 id="m-subject" class="h6 mb-0" x-text="'Postęp prac — ' + r.client.name"></h1></dd>
      </dl>
    </div>
    <div class="card-body">
      <p>Witamy,</p>
      <p>Zapraszamy do śledzenia postępu Państwa prac:</p>
      <p><a class="tap text-break" :href="ik.href('screens/public-realization.html?id=' + r.id)">Postęp prac</a></p>
      <p class="mb-0">Zespół</p>
    </div>
  </article>
</template>
</main>
<script type="module">
import { boot, db, idParam } from '../assets/app.js';
boot(() => ({
  r: null,
  init() { this.r = db.realizations.find((x) => x.id === idParam(1)); if (!this.r) location.replace(ik.href('screens/error-404.html')); },
}));
</script>
</body>
</html>
