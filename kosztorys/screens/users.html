<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Użytkownicy — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="users">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div class="ikpm-page-head">
    <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Użytkownicy</h1></div>
    <div class="ikpm-page-actions"><a class="btn btn-primary btn-lg" :href="ik.href('screens/user-form.html')"><i class="bi bi-person-plus" aria-hidden="true"></i>Dodaj użytkownika</a></div>
  </div>
  <div class="ikpm-table-box">
    <table class="table ikpm-stack">
      <caption class="visually-hidden">Konta użytkowników</caption>
      <thead><tr><th scope="col">Email</th><th scope="col">Imię i nazwisko</th><th scope="col">Telefon</th><th scope="col">Role</th><th scope="col"><span class="visually-hidden">Akcje</span></th></tr></thead>
      <tbody>
        <template x-for="u in db.users" :key="u.id">
          <tr>
            <td class="ikpm-cell-lead"><span class="d-inline-flex flex-wrap align-items-center gap-2"><span class="text-break" x-text="u.email"></span><span x-show="!u.active" x-html="ik.inactiveBadge()"></span></span></td>
            <td data-label="Imię i nazwisko" x-text="[u.first_name, u.last_name].filter(Boolean).join(' ') || '—'"></td>
            <td data-label="Telefon" x-text="u.phone || '—'"></td>
            <td data-label="Role"><span class="d-inline-flex flex-wrap gap-1 justify-content-end"><template x-for="r in u.roles" :key="r"><span class="ikpm-chip" x-text="ik.labels().role[r]"></span></template><span x-show="!u.roles.length">brak</span></span></td>
            <td class="text-end"><a class="btn btn-outline-secondary" :href="ik.href('screens/user-form.html?id=' + u.id)" :aria-label="'Edytuj ' + u.email"><i class="bi bi-pencil" aria-hidden="true"></i>Edytuj</a></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>
<script type="module">
import { boot } from '../assets/app.js';
boot(() => ({}));
</script>
</body>
</html>
