<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wycena.pdf — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  body { background: #6c757d; }
  .a4 table { font-size: .85rem; }
  .a4 th { background: #f1f3f5; }
</style>
</head>
<body>
<main id="main" x-data="page" x-cloak class="k-pdf-wrap">
<template x-if="q">
  <div class="k-pdf-zoom">
  <article class="ikpm-paper" aria-labelledby="pdf-title">
    <p class="ikpm-meta text-end mb-2" x-text="'wycena-' + q.id + '.pdf'"></p>
    <div class="d-flex flex-wrap justify-content-between gap-3 border-bottom pb-3 mb-3">
      <div><h1 id="pdf-title" class="mb-1">Wycena #<span x-text="q.id"></span></h1><p class="mb-0" x-text="'Data wystawienia: ' + ik.date(q.sent_at || ik.todayISO())"></p></div>
      <div class="text-end" x-show="q.user"><strong x-text="sender.display_name"></strong><span class="d-block" x-show="sender.first_name" x-text="sender.email"></span><span class="d-block" x-show="sender.phone" x-text="'tel. ' + sender.phone"></span></div>
    </div>
    <h2 class="h3">Dane klienta</h2>
    <p class="ikpm-paper-label mb-0">KLIENT</p>
    <p x-text="q.client ? [q.client.name, q.client.email, q.client.phone].filter(Boolean).join(' · ') : '(brak klienta)'"></p>
    <template x-if="q.site_address || q.planned_start_on || q.planned_end_on">
      <div><h2 class="h3">Inwestycja</h2>
        <div class="d-flex flex-wrap gap-4 mb-3">
          <template x-if="q.site_address"><div><p class="ikpm-paper-label mb-0">ADRES INWESTYCJI</p><p class="mb-0" x-text="q.site_address"></p></div></template>
          <template x-if="q.planned_start_on"><div><p class="ikpm-paper-label mb-0">PLANOWANY START</p><p class="mb-0" x-text="ik.date(q.planned_start_on)"></p></div></template>
          <template x-if="q.planned_end_on"><div><p class="ikpm-paper-label mb-0">TERMIN ZAKOŃCZENIA</p><p class="mb-0" x-text="ik.date(q.planned_end_on)"></p></div></template>
        </div></div>
    </template>
    <h2 class="h3">Zakres prac</h2>
    <template x-for="room in q.rooms" :key="room.id">
      <section class="mb-3">
        <h3 class="h4 mb-0" x-text="'Pokój: ' + room.name"></h3>
        <p class="ikpm-meta mb-1" x-text="pdfSize(room)"></p>
        <p x-show="!room.jobs.length">(brak prac w tym pokoju)</p>
        <table class="table table-bordered k-pdf-table mb-0" x-show="room.jobs.length">
          <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
          <thead><tr><th scope="col" style="width: 26%">Praca</th><th scope="col" style="width: 17%">Etap</th><th scope="col" class="ikpm-num" style="width: 16%">Ilość</th><th scope="col" class="ikpm-num" style="width: 21%">Cena jedn. netto</th><th scope="col" class="ikpm-num" style="width: 20%">Wartość netto</th></tr></thead>
          <tbody><template x-for="j in ik.sortJobs(room.jobs)" :key="j.id"><tr><td x-text="j.name"></td><td x-text="j.stage"></td><td class="ikpm-num" x-text="ik.dec(j.quantity) + ' ' + j.unit"></td><td class="ikpm-num" x-text="ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></td><td class="ikpm-num" x-text="ik.pln(ik.lineTotal(j, q.markup_percent))"></td></tr></template></tbody>
        </table>
      </section>
    </template>
    <dl class="ikpm-totals border-top pt-2 mb-4 ms-auto" style="max-width: 22rem">
      <div><dt>Razem netto</dt><dd x-text="ik.pln(totals.net)"></dd></div>
      <div><dt x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd x-text="ik.pln(totals.vat)"></dd></div>
      <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="ik.pln(totals.gross)"></dd></div>
    </dl>
    <footer class="ikpm-meta border-top pt-2">
      <p class="mb-0">Dokument wygenerowany automatycznie przez system IKPM.</p>
      <p class="mb-0" x-show="q.user" x-text="'Kontakt: ' + sender.email + (sender.phone ? ', tel. ' + sender.phone : '')"></p>
    </footer>
  </article>
  </div>
</template>
</main>
<script type="module">
import { boot, db, idParam } from '../assets/app.js';

boot(() => ({
  q: null,
  init() {
    this.q = db.quotes.find((x) => x.id === idParam(2));
    if (!this.q) { location.replace(ik.href('screens/error-404.html')); return; }
    document.title = `wycena-${this.q.id}.pdf — IKPM`;
    // Arkusz A4 w szerokości druku; węższy ekran pomniejsza go jak przeglądarka PDF (wszystkie kolumny widoczne, zoom palcami działa).
    const fit = () => { const paper = document.querySelector('.ikpm-paper'); if (!paper) return; const w = paper.offsetWidth; const avail = document.documentElement.clientWidth - 16; document.querySelector('.k-pdf-zoom').style.zoom = String(Math.min(1, avail / w)); };
    this.$nextTick(fit); addEventListener('resize', fit);
  },
  get sender() { return ik.quoteUser(this.q); },
  get totals() { return ik.quoteTotals(this.q); },
  pdfSize(room) {
    const p = ik.roomSizeParts(room); const rest = [p.floor, p.walls].filter(Boolean).map((s) => s.charAt(0).toLowerCase() + s.slice(1));
    if (p.dimensions) return `Wymiary: ${p.dimensions}${rest.length ? ` — ${rest.join(', ')}` : ''}`;
    return [p.floor, rest[1]].filter(Boolean).join(', ');
  },
}));
</script>
</body>
</html>
