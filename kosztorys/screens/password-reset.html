<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Przypomnienie hasła — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="ikpm-public-bar"><span><strong>IKPM</strong> <span class="ikpm-muted">System kosztorysów</span></span></header>
<main id="main" class="ikpm-public d-grid gap-4" style="max-width: 30rem">
  <div id="sent" class="alert alert-success d-flex gap-2 mb-0" role="status" hidden><i class="bi bi-check-circle-fill" aria-hidden="true"></i><span>Instrukcja zmiany hasła zostanie niezwłocznie wysłana na podany adres e-mail.</span></div>
  <form id="reset" class="card" novalidate aria-labelledby="r-title">
    <div class="card-body p-4 d-grid gap-3">
      <h1 id="r-title" class="mb-0">Zapomniałeś swojego hasła?</h1>
      <div><label class="form-label" for="r-email">Email</label><input id="r-email" type="email" class="form-control" autocomplete="email" required></div>
      <button class="btn btn-primary btn-lg w-100">Wyślij instrukcje zmiany hasła</button>
      <p class="mb-0"><a href="login.html">Zaloguj się</a></p>
    </div>
  </form>
  <form class="card" novalidate aria-labelledby="n-title" onsubmit="event.preventDefault(); location.href='login.html'">
    <div class="card-body p-4 d-grid gap-3">
      <p class="ikpm-meta mb-0">Strona z linku w mailu (ważny 15 minut):</p>
      <h2 id="n-title" class="mb-0">Zmień swoje hasło</h2>
      <div><label class="form-label" for="n-pass">Nowe hasło</label><input id="n-pass" type="password" class="form-control" autocomplete="new-password" aria-describedby="n-hint"><p id="n-hint" class="form-text mb-0">(minimum 6 znaków)</p></div>
      <div><label class="form-label" for="n-pass2">Powtórz nowe hasło</label><input id="n-pass2" type="password" class="form-control" autocomplete="new-password"></div>
      <button class="btn btn-primary btn-lg w-100">Zmień moje hasło</button>
      <p class="mb-0 d-flex flex-wrap gap-3"><a href="login.html">Zaloguj się</a><a href="password-reset.html">Zapomniałeś hasła?</a></p>
    </div>
  </form>
</main>
<script>
  document.getElementById('reset').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sent').hidden = false; });
</script>
</body>
</html>
