<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przypomnienie hasła — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="bg-dark text-white py-3"><div class="container px-3" style="max-width: 480px"><span class="fw-bold">IKPM</span> <small>System kosztorysów</small></div></header>
<main class="container px-3 py-4" style="max-width: 480px">
  <div id="sent" class="alert alert-success" role="status" hidden>Instrukcja zmiany hasła zostanie niezwłocznie wysłana na podany adres e-mail.</div>
  <form id="reset" class="card mb-4" novalidate aria-labelledby="r-title">
    <div class="card-body p-4">
      <h1 id="r-title" class="h3 mb-3">Zapomniałeś swojego hasła?</h1>
      <label class="form-label" for="r-email">Email</label><input id="r-email" type="email" class="form-control mb-3" autocomplete="email" required>
      <button class="btn btn-primary btn-main w-100">Wyślij instrukcje zmiany hasła</button>
      <p class="mt-3 mb-0"><a class="tap" href="login.html">Zaloguj się</a></p>
    </div>
  </form>
  <form class="card" novalidate aria-labelledby="n-title" onsubmit="event.preventDefault(); location.href='login.html'">
    <div class="card-body p-4">
      <p class="small text-body-secondary mb-2">Strona z linku w mailu (ważny 15 minut):</p>
      <h2 id="n-title" class="h4 mb-3">Zmień swoje hasło</h2>
      <label class="form-label" for="n-pass">Nowe hasło</label><input id="n-pass" type="password" class="form-control" autocomplete="new-password" aria-describedby="n-hint"><p id="n-hint" class="small text-body-secondary">(minimum 6 znaków)</p>
      <label class="form-label" for="n-pass2">Powtórz nowe hasło</label><input id="n-pass2" type="password" class="form-control mb-3" autocomplete="new-password">
      <button class="btn btn-primary btn-main w-100">Zmień moje hasło</button>
      <p class="mt-3 mb-0 d-flex gap-3"><a class="tap" href="login.html">Zaloguj się</a><a class="tap" href="password-reset.html">Zapomniałeś hasła?</a></p>
    </div>
  </form>
</main>
<script>
  document.getElementById('reset').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sent').hidden = false; });
</script>
</body>
</html>
