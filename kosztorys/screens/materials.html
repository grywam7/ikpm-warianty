<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materiały — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* Lista materiałów: od 992 px tabela; 768–991 px (tablet pionowo) arkusz — wiersz w dwóch liniach pod nagłówkiem kolumn
     (zaznaczenie, nazwa, cena, ilość, jedn.; pod nimi link do sklepu i przyciski); telefon — karta z etykietami pól. */
  .k-mat > thead > tr > th { position: sticky; top: var(--ikpm-sticky-top); z-index: 4; }
  /* Zaznaczenie: cała komórka jest celem (etykieta pokrywa ją). */
  .k-mat td.k-c-check { position: relative; }
  .k-mat .k-c-check .form-check { position: static; min-height: 0; }
  .k-mat .k-c-check .form-check-input { position: relative; z-index: 1; }
  .k-mat .k-c-check .form-check-label::after { content: ""; position: absolute; inset: 0; }
  /* Od 768 px etykieta bez widocznego tekstu — sama jest całą komórką. */
  @media (min-width: 768px) { .k-mat td.k-c-check .form-check-label { position: absolute; inset: 0; padding: 0; } }
  @media (max-width: 991.98px) {
    .k-mat, .k-mat > tbody { display: block; width: 100%; }
    .k-mat > tbody > tr { display: grid; gap: .5rem .75rem; align-items: center; padding: .625rem 1rem; border-bottom: 1px solid var(--ikpm-border-subtle); }
    .k-mat > tbody > tr:last-child { border-bottom: 0; }
    .k-mat.table > tbody > tr > * { display: block; padding: 0; border: 0; background: transparent; min-width: 0; text-align: left; }
    .k-mat .k-c-check { grid-area: check; } .k-mat .k-c-name { grid-area: name; } .k-mat .k-c-price { grid-area: price; }
    .k-mat .k-c-qty { grid-area: qty; } .k-mat .k-c-unit { grid-area: unit; } .k-mat .k-c-link { grid-area: link; }
    .k-mat.table > tbody > tr > .k-c-act { grid-area: act; justify-self: end; }
    .k-mat.table > tbody > tr > .k-c-check { align-self: stretch; display: flex; align-items: center; }
  }
  @media (min-width: 768px) and (max-width: 991.98px) {
    .k-mat > thead { display: block; position: sticky; top: var(--ikpm-sticky-top); z-index: 4; }
    .k-mat > thead > tr, .k-mat > tbody > tr { grid-template-columns: 2.75rem minmax(0, 1fr) 8.5rem 6rem 6.75rem; }
    .k-mat > thead > tr { display: grid; gap: 0 .75rem; padding: .5rem 1rem; background: var(--ikpm-surface-2); border-bottom: 1px solid var(--ikpm-border);
      grid-template-areas: "check name price qty unit"; }
    .k-mat.table > thead > tr > th { position: static; display: block; width: auto !important; padding: 0; border: 0; background: transparent; }
    .k-mat.table > thead > tr > :is(.k-c-link, .k-c-act) { display: none; }
    .k-mat > tbody > tr { grid-template-areas: "check name price qty unit" ". link link link act"; }
    .k-mat.table > tbody > tr > .k-c-link { display: flex; align-items: center; gap: .75rem; }
    .k-mat > tbody > tr > .k-c-link::before { content: attr(data-label); flex: none; font-size: var(--ikpm-fs-sm); color: var(--ikpm-text-2); }
  }
  @media (max-width: 767.98px) {
    .k-mat > thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .k-mat > tbody > tr { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "check check act" "name name name" "price qty unit" "link link link"; }
    .k-mat > tbody > tr > [data-label]::before { content: attr(data-label); display: block; margin-bottom: .25rem; font-size: var(--ikpm-fs-xs);
      font-weight: 600; color: var(--ikpm-text-2); }
  }
</style>
</head>
<body data-nav="data">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div id="alerts"></div>
  <div class="ikpm-page-head mb-3"><div class="ikpm-page-heading"><h1 class="ikpm-page-title">Materiały</h1></div></div>
  <div id="data-tabs" data-active="materials"></div>

  <div class="ikpm-grid mb-4" style="--ikpm-grid-min: 24rem">
    <form class="card" @submit.prevent="add()" aria-labelledby="add-title">
      <div class="card-body">
        <h2 id="add-title" class="k-sub-title">Dodaj materiał</h2>
        <div class="ikpm-grid k-fields align-items-end" style="--ikpm-grid-min: 8rem">
          <div class="ikpm-span-all"><label class="form-label" for="m-name">Nazwa materiału</label><input id="m-name" class="form-control" maxlength="100" placeholder="np. Farba lateksowa biała" x-model="draft.name" required></div>
          <div><label class="form-label" for="m-price">Cena (zł)</label><input id="m-price" type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" x-model="draft.price"></div>
          <div><label class="form-label" for="m-qty">Ilość</label><input id="m-qty" type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" x-model="draft.quantity"></div>
          <div><label class="form-label" for="m-unit">Jedn.</label><select id="m-unit" class="form-select" x-model="draft.unit"><template x-for="u in UNITS" :key="u"><option :value="u" :selected="draft.unit === u" x-text="u"></option></template></select></div>
          <div class="ikpm-span-all"><label class="form-label" for="m-link">Link do sklepu</label><input id="m-link" type="url" class="form-control" placeholder="https://..." x-model="draft.link"></div>
          <div><button class="btn btn-primary w-100"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj</button></div>
        </div>
      </div>
    </form>
    <form id="materials-price-change" class="card" @submit.prevent="preview()" aria-labelledby="pc-title">
      <div class="card-body">
        <h2 id="pc-title" class="k-sub-title">Zmiana cen</h2>
        <fieldset class="mb-2"><legend class="form-label">Zakres</legend>
          <div class="d-flex flex-wrap column-gap-4">
            <div class="form-check"><input class="form-check-input" type="radio" name="scope" id="sc-all" value="all" x-model="scope" required><label class="form-check-label" for="sc-all">Wszystkie materiały</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="scope" id="sc-sel" value="selected" x-model="scope"><label class="form-check-label" for="sc-sel">Zaznaczone na liście <span class="ikpm-muted" x-text="'(' + selected.length + ')'"></span></label></div>
          </div>
        </fieldset>
        <div class="d-flex gap-2 align-items-end">
          <div class="flex-grow-1"><label class="form-label" for="pc-percent">Zmień ceny o % <span class="fw-normal ikpm-muted">(od -90 do +200)</span></label><input id="pc-percent" type="number" inputmode="decimal" step="0.1" min="-90" max="200" class="form-control ikpm-num" x-model="percent" required></div>
          <button class="btn btn-outline-primary">Podgląd</button>
        </div>
      </div>
    </form>
  </div>

  <section aria-labelledby="list-title">
    <h2 id="list-title" class="ikpm-section-title d-flex align-items-center gap-2">Lista materiałów <span class="ikpm-chip" x-text="db.materials.length"></span></h2>
    <div class="ikpm-empty" x-show="!db.materials.length"><i class="bi bi-box-seam" aria-hidden="true"></i><p>Brak materiałów. Dodaj pierwszy materiał powyżej.</p></div>
    <div class="card" x-show="db.materials.length">
    <table class="table k-mat">
      <caption class="visually-hidden">Lista materiałów — ceny opakowań</caption>
      <thead><tr><th scope="col" class="k-act-col k-c-check"><span class="visually-hidden">Zaznacz</span></th><th scope="col" class="k-c-name" style="width: 34%">Nazwa</th><th scope="col" class="ikpm-num k-c-price" style="width: 10rem">Cena</th><th scope="col" class="ikpm-num k-c-qty" style="width: 7rem">Ilość</th><th scope="col" class="k-c-unit" style="width: 7rem">Jedn.</th><th scope="col" class="k-c-link">Link do sklepu</th><th scope="col" class="k-c-act" style="width: 7rem"><span class="visually-hidden">Akcje</span></th></tr></thead>
      <tbody>
        <template x-for="m in materials" :key="m.id">
          <tr>
            <td class="k-c-check"><div class="form-check"><input class="form-check-input" type="checkbox" :id="'sel-' + m.id" :value="m.id" x-model.number="selected"><label class="form-check-label" :for="'sel-' + m.id"><span class="d-md-none">Zaznacz</span><span class="visually-hidden" x-text="': ' + m.name + ' (' + m.package + ')'"></span></label></div></td>
            <td data-label="Nazwa" class="k-c-name"><input class="form-control" maxlength="100" :value="m.name" :aria-label="'Nazwa: ' + m.name" @change="setField(m, 'name', $event.target)"></td>
            <td data-label="Cena" class="k-c-price"><div class="input-group"><input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :value="Number(m.price)" :aria-label="'Cena: ' + m.name" @change="setField(m, 'price', $event.target)"><span class="input-group-text">zł</span></div></td>
            <td data-label="Ilość" class="k-c-qty"><input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :value="Number(m.quantity)" :aria-label="'Ilość: ' + m.name" @change="setField(m, 'quantity', $event.target)"></td>
            <td data-label="Jedn." class="k-c-unit"><select class="form-select" :aria-label="'Jedn.: ' + m.name" @change="setField(m, 'unit', $event.target)"><template x-for="u in UNITS" :key="u"><option :value="u" :selected="m.unit === u" x-text="u"></option></template></select></td>
            <td data-label="Link do sklepu" class="k-c-link"><input type="url" class="form-control" placeholder="https://..." :value="m.link" :aria-label="'Link do sklepu: ' + m.name" @change="setField(m, 'link', $event.target)"></td>
            <td class="text-end k-c-act"><div class="d-inline-flex gap-2">
              <a class="btn btn-outline-secondary ikpm-btn-icon" x-show="/^https?:\/\//.test(m.link)" :href="m.link" target="_blank" rel="noopener" :aria-label="'Otwórz w sklepie: ' + m.name" title="Otwórz w sklepie"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
              <button type="button" class="btn btn-outline-danger ikpm-btn-icon" :aria-label="'Usuń materiał ' + m.name" title="Usuń materiał" @click="remove(m)"><i class="bi bi-trash" aria-hidden="true"></i></button>
            </div></td>
          </tr>
        </template>
      </tbody>
    </table>
    </div>
  </section>
</main>
<script type="module">
import { boot, db, save, nextId, toast, alertError, ask, go } from '../assets/app.js';

boot(() => ({
  UNITS: ['szt', 'm²', 'kg', 'l', 'mb', 'h'], selected: [], scope: '', percent: '',
  draft: { name: '', price: '0', quantity: '1', unit: 'szt', link: '' },
  get materials() { return [...db.materials].sort((a, b) => a.name.localeCompare(b.name, 'pl') || a.id - b.id); },
  used(m) { return db.catalogue.some((s) => s.jobs.some((j) => j.materials.some((x) => x.name === m.name && x.package === m.package))); },
  setField(m, field, el) {
    const oldName = m.name; const oldPackage = m.package;
    if (field === 'name') { const v = el.value.trim(); if (!v) { el.value = m.name; alertError('Nazwa nie może być pusta'); return; } m.name = v; }
    if (field === 'price' || field === 'quantity') {
      const v = ik.parseNumber(el.value);
      if (Number.isNaN(v) || v < 0 || (field === 'quantity' && v <= 0) || v > 1000000) { el.value = Number(m[field]); alertError(field === 'price' ? 'Cena musi być większa lub równa 0' : 'Ilość musi być większa od 0'); return; }
      m[field] = String(ik.roundHalfUp(v));
    }
    if (field === 'unit') m.unit = el.value;
    if (field === 'link') m.link = el.value.trim();
    m.package = ik.packageOf(m.quantity, m.unit);
    m.unit_price = String(Number(m.price) / Number(m.quantity));
    ik.syncMaterial(m, oldName, oldPackage); save(); toast(`Materiał '${m.name}' został zaktualizowany.`);
  },
  add() {
    const d = this.draft; const name = d.name.trim();
    const price = ik.parseNumber(d.price); const qty = ik.parseNumber(d.quantity);
    if (!name) { alertError('Nazwa nie może być pusta'); return; }
    if (Number.isNaN(price) || price < 0) { alertError('Cena musi być większa lub równa 0'); return; }
    if (Number.isNaN(qty) || qty <= 0) { alertError('Ilość musi być większa od 0'); return; }
    db.materials.push({ id: nextId('material'), name, price: String(price), quantity: qty, unit: d.unit, package: ik.packageOf(qty, d.unit), unit_price: String(price / qty), link: d.link.trim() });
    save(); this.draft = { name: '', price: '0', quantity: '1', unit: 'szt', link: '' }; toast(`Materiał '${name}' został dodany.`);
  },
  async remove(m) {
    if (!(await ask({ title: 'Usuń materiał', text: `Usunąć materiał '${m.name}'?`, points: ['Materiał zniknie z listy materiałów.'], ok: 'Usuń materiał', okClass: 'danger' }))) return;
    if (this.used(m)) { alertError('Nie można usunąć, gdyż istnieją zależne od niego prace'); return; }
    db.materials.splice(db.materials.indexOf(m), 1); this.selected = this.selected.filter((id) => id !== m.id); save(); toast(`Materiał '${m.name}' został usunięty.`);
  },
  preview() {
    if (this.scope === 'selected' && !this.selected.length) { alertError('Zaznacz materiały, których ceny chcesz zmienić, albo wybierz „Wszystkie”.'); return; }
    go(`screens/price-change.html?materials=${this.scope}${this.scope === 'selected' ? `&ids=${this.selected.join(',')}` : ''}&percent=${encodeURIComponent(this.percent)}`);
  },
}));
</script>
</body>
</html>
