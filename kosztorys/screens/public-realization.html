<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postęp prac — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="ikpm-public-bar"><strong>IKPM</strong><span class="ikpm-meta">Postęp prac</span></header>
<main id="main" x-data="page" x-cloak class="ikpm-public">
<template x-if="r">
<div>
  <div class="k-public-head">
    <h1>Postęp prac</h1>
    <p class="mb-0 fs-5" x-text="'dla ' + r.client.name"></p>
    <div class="ikpm-contact"><strong x-text="sender.display_name"></strong><template x-if="sender.first_name"><a :href="'mailto:' + sender.email"><i class="bi bi-envelope" aria-hidden="true"></i><span x-text="sender.email"></span></a></template><template x-if="sender.phone"><a :href="'tel:' + sender.phone.replace(/\s/g, '')"><i class="bi bi-telephone" aria-hidden="true"></i><span x-text="sender.phone"></span></a></template></div>
  </div>

  <section class="card mb-4" aria-labelledby="st-title">
    <div class="card-body d-grid gap-3">
      <h2 id="st-title" class="visually-hidden">Stan prac</h2>
      <dl class="ikpm-dl k-dl-stack">
        <dt>Status realizacji</dt><dd x-html="ik.realBadge(r.status, true)"></dd>
        <template x-if="r.site_address"><dt>Adres inwestycji</dt></template><template x-if="r.site_address"><dd x-text="r.site_address"></dd></template>
        <template x-if="endText"><dt>Termin zakończenia</dt></template><template x-if="endText"><dd class="fw-semibold" x-text="endText"></dd></template>
      </dl>
      <div class="ikpm-progress">
        <div class="ikpm-progress-head"><span id="p-progress">Postęp prac</span><span x-text="ik.progress(r) + '% (' + ik.doneCount(r) + ' / ' + ik.realJobs(r).length + ')'"></span></div>
        <div class="progress" role="progressbar" aria-labelledby="p-progress" :aria-valuenow="ik.progress(r)" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" :class="{ 'bg-success': r.status === 'done' }" :style="'width:' + ik.progress(r) + '%'"></div></div>
      </div>
    </div>
  </section>

  <template x-for="room in r.rooms" :key="room.id">
    <section class="doc-room card" :aria-labelledby="'rr-' + room.id">
      <div class="doc-room-head border-bottom">
        <div class="doc-room-name"><h2 class="doc-room-title" :id="'rr-' + room.id" x-text="room.name"></h2><p class="ikpm-meta mb-0" x-text="'Zrobione: ' + room.jobs.filter((j) => j.status === 'done').length + ' / ' + room.jobs.length"></p></div>
      </div>
      <p class="doc-room-body mb-0 ikpm-muted" x-show="!room.jobs.length">(brak prac w tym pomieszczeniu)</p>
      <div class="ikpm-table-box" x-show="room.jobs.length">
        <table class="table k-compact">
          <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
          <thead><tr><th scope="col">Praca</th><th scope="col">Etap</th><th scope="col">Status</th><th scope="col">Komentarz</th></tr></thead>
          <template x-for="g in ik.byStage(room.jobs)" :key="g.stage"><tbody>
            <tr class="k-stage-row"><th scope="rowgroup" colspan="4" x-text="g.stage"></th></tr>
            <template x-for="j in g.jobs" :key="j.id"><tr>
              <td class="ikpm-cell-lead" x-text="j.name"></td>
              <td class="k-no-compact" x-text="j.stage"></td>
              <td class="k-end" x-html="ik.jobBadge(j.status, true)"></td>
              <td class="k-note" :class="{ 'k-empty': !j.notes }" data-label="Komentarz" x-text="j.notes || '—'"></td></tr></template>
          </tbody></template>
        </table>
      </div>
      <div class="doc-room-body border-top" x-show="photos(room.name).length">
        <h3 class="k-sub-title">Zdjęcia</h3>
        <div class="ikpm-photo-grid"><template x-for="p in photos(room.name)" :key="p.id"><div class="ikpm-photo">
          <template x-if="p.src"><button type="button" class="k-photo-open" @click="view(p)" :aria-label="'Pokaż zdjęcie: ' + room.name"><img class="ikpm-photo-thumb" :src="p.src" alt=""></button></template>
          <template x-if="!p.src"><div class="ikpm-photo-thumb" role="img" :aria-label="'Zdjęcie: ' + p.filename"><i class="bi bi-image" aria-hidden="true"></i><span x-text="p.filename"></span></div></template>
        </div></template></div>
      </div>
    </section>
  </template>
  <section class="card mb-3" aria-labelledby="ph-title" x-show="photos(null).length">
    <div class="card-body">
      <h2 id="ph-title" class="k-card-title mb-3">Zdjęcia — Ogólne</h2>
      <div class="ikpm-photo-grid"><template x-for="p in photos(null)" :key="p.id"><div class="ikpm-photo">
        <template x-if="p.src"><button type="button" class="k-photo-open" @click="view(p)" aria-label="Pokaż zdjęcie ogólne"><img class="ikpm-photo-thumb" :src="p.src" alt=""></button></template>
        <template x-if="!p.src"><div class="ikpm-photo-thumb" role="img" :aria-label="'Zdjęcie: ' + p.filename"><i class="bi bi-image" aria-hidden="true"></i><span x-text="p.filename"></span></div></template>
      </div></template></div>
    </div>
  </section>
</div>
</template>
<dialog class="ikpm-dialog k-photo-view" id="photo-view" aria-label="Zdjęcie" style="width: min(60rem, calc(100vw - 2rem))">
  <div class="ikpm-sheet-head"><h2>Zdjęcie</h2><form method="dialog"><button class="btn-close" aria-label="Zamknij"></button></form></div>
  <img x-show="big" :src="big ? big.src : ''" alt="Zdjęcie z budowy">
</dialog>
</main>
<footer class="ikpm-public-footer">Wygenerowane przez system IKPM.</footer>
<script type="module">
import { boot, db, idParam } from '../assets/app.js';

boot(() => ({
  r: null, big: null,
  view(p) { this.big = p; document.getElementById('photo-view').showModal(); },
  init() {
    this.r = db.realizations.find((x) => x.id === idParam(1));
    if (!this.r || (this.r.link_valid_until && this.r.link_valid_until < ik.todayISO())) location.replace(ik.href('screens/error-404.html'));
  },
  get sender() { const q = db.quotes.find((x) => x.id === this.r.quote_id); return q ? ik.quoteUser(q) : db.users[0]; },
  // Tylko zdjęcia z „Widoczne dla klienta”.
  photos(roomName) { return this.r.photos.filter((p) => p.client_visible && (p.room || null) === roomName); },
  get endText() {
    const r = this.r;
    if (r.status === 'cancelled') return null;
    if (r.status === 'done') return `Zakończono ${ik.date(ik.endOn(r))}`;
    const cur = ik.currentEnd(r);
    if (r.promised_end_on && cur && cur !== r.promised_end_on) return `Pierwotnie obiecany ${ik.date(r.promised_end_on)}, aktualnie przewidywany ${ik.date(cur)}`;
    return cur ? ik.date(cur) : null;
  },
}));
</script>
</body>
</html>
