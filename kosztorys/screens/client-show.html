<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klient — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="clients">
<div id="nav"></div>
<main x-data="page" x-cloak class="container-xxl px-3 mw-doc pb-5">
<template x-if="c">
<div>
  <div id="alerts"></div>
  <section class="card my-3" aria-labelledby="c-title">
    <div class="card-body">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <h1 id="c-title" class="h3 mb-0 me-auto" x-text="c.name"></h1>
        <a class="btn btn-outline-primary" :href="ik.href('screens/client-form.html?id=' + c.id)"><i class="bi bi-pencil" aria-hidden="true"></i> Edytuj</a>
        <button type="button" class="btn btn-outline-danger" @click="remove()"><i class="bi bi-trash" aria-hidden="true"></i> Usuń</button>
      </div>
      <dl class="row mt-3 mb-0">
        <dt class="col-sm-3">Email</dt><dd class="col-sm-9"><template x-if="c.email"><a class="tap text-break" :href="'mailto:' + c.email" x-text="c.email"></a></template><template x-if="!c.email"><span>—</span></template></dd>
        <dt class="col-sm-3">Telefon</dt><dd class="col-sm-9"><template x-if="c.phone"><a class="tap" :href="'tel:' + c.phone.replace(/\s/g, '')" x-text="c.phone"></a></template><template x-if="!c.phone"><span>—</span></template></dd>
        <dt class="col-sm-3">Notatki</dt><dd class="col-sm-9 text-pre" x-text="c.notes || '—'"></dd>
      </dl>
    </div>
  </section>
  <section class="card mb-3" aria-labelledby="q-title">
    <div class="card-header bg-body"><h2 id="q-title" class="h5 mb-0">Wyceny</h2></div>
    <p class="card-body mb-0 text-body-secondary" x-show="!quotes.length">Brak wycen.</p>
    <table class="table doc-table reflow mb-0" x-show="quotes.length">
      <caption class="visually-hidden">Wyceny klienta</caption>
      <thead class="table-light"><tr><th scope="col">#</th><th scope="col">Status</th><th scope="col" class="text-end">Wartość</th><th scope="col">Wysłana</th><th scope="col"><span class="visually-hidden">Akcje</span></th></tr></thead>
      <tbody><template x-for="q in quotes" :key="q.id"><tr>
        <td data-label="#"><a class="tap fw-semibold" :href="ik.href('screens/quote-show.html?id=' + q.id)" x-text="'#' + q.id"></a></td>
        <td data-label="Status" x-html="ik.quoteBadge(q.status)"></td>
        <td data-label="Wartość" class="num" x-text="ik.pln(ik.quoteTotals(q).net)"></td>
        <td data-label="Wysłana" x-text="ik.date(q.sent_at)"></td>
        <td class="text-end"><template x-if="q.status === 'draft'"><a class="btn btn-outline-primary" :href="ik.href('screens/builder.html?id=' + q.id)" :aria-label="'Edytuj wycenę #' + q.id">Edytuj</a></template></td>
      </tr></template></tbody>
    </table>
  </section>
  <section class="card mb-3" aria-labelledby="r-title">
    <div class="card-header bg-body"><h2 id="r-title" class="h5 mb-0">Realizacje</h2></div>
    <p class="card-body mb-0 text-body-secondary" x-show="!realizations.length">Brak realizacji.</p>
    <table class="table doc-table reflow mb-0" x-show="realizations.length">
      <caption class="visually-hidden">Realizacje klienta</caption>
      <thead class="table-light"><tr><th scope="col">#</th><th scope="col">Status</th><th scope="col" class="text-end">Wartość (z wyceny)</th><th scope="col" style="min-width: 10rem">Postęp</th></tr></thead>
      <tbody><template x-for="r in realizations" :key="r.id"><tr>
        <td data-label="#"><a class="tap fw-semibold" :href="ik.href('screens/realization-show.html?id=' + r.id)" x-text="'#' + r.id"></a></td>
        <td data-label="Status" x-html="ik.realBadge(r.status)"></td>
        <td data-label="Wartość (z wyceny)" class="num" x-text="ik.pln(r.total_price)"></td>
        <td data-label="Postęp"><div class="d-flex align-items-center gap-2 w-100"><div class="progress flex-grow-1" role="progressbar" :aria-label="'Postęp prac #' + r.id" :aria-valuenow="ik.progress(r)" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar bg-success" :style="'width:' + ik.progress(r) + '%'"></div></div><span class="small num" x-text="ik.progress(r) + '%'"></span></div></td>
      </tr></template></tbody>
    </table>
  </section>
</div>
</template>
</main>
<script type="module">
import { boot, db, save, go, ask, alertError, idParam } from '../assets/app.js';

boot(() => ({
  c: null,
  init() { this.c = db.clients.find((x) => x.id === idParam(db.clients[0]?.id)); if (!this.c) location.replace(ik.href('screens/error-404.html')); },
  get quotes() { return db.quotes.filter((q) => q.client && q.client.name === this.c.name).sort((a, b) => b.id - a.id); },
  get realizations() { return db.realizations.filter((r) => r.client.name === this.c.name).sort((a, b) => b.id - a.id); },
  async remove() {
    if (!(await ask({ title: 'Usuń klienta', text: `Usunąć klienta „${this.c.name}”?`, points: ['Klient zniknie z listy klientów.', 'Klienta z wycenami lub realizacjami nie da się usunąć.'], ok: 'Usuń klienta', okClass: 'danger' }))) return;
    if (this.quotes.length) { alertError('Nie można usunąć, gdyż istnieją zależne od niego wyceny'); return; }
    if (this.realizations.length) { alertError('Nie można usunąć, gdyż istnieją zależne od niego realizacje'); return; }
    db.clients.splice(db.clients.indexOf(this.c), 1); save(); go('screens/clients.html', 'Klient usunięty.');
  },
}));
</script>
</body>
</html>
