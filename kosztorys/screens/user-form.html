<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Użytkownik — formularz — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="users">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/users.html')">Użytkownicy</a>
    <div class="ikpm-page-heading"><h1 class="ikpm-page-title" x-text="user ? 'Edycja użytkownika ' + user.email : 'Nowy użytkownik'"></h1></div>
  </div>
  <form class="k-form" @submit.prevent="submit()" novalidate aria-label="Dane użytkownika">
    <div class="alert alert-danger" role="alert" x-show="errors.length"><ul class="mb-0"><template x-for="e in errors" :key="e"><li x-text="e"></li></template></ul></div>
    <div class="ikpm-grid k-fields">
      <div class="ikpm-span-all"><label class="form-label" for="u-email">Email</label><input id="u-email" type="email" class="form-control" autocomplete="off" x-model="form.email" required></div>
      <div><label class="form-label" for="u-first">Imię</label><input id="u-first" class="form-control" x-model="form.first_name"></div>
      <div><label class="form-label" for="u-last">Nazwisko</label><input id="u-last" class="form-control" x-model="form.last_name"></div>
      <div><label class="form-label" for="u-phone">Telefon</label><input id="u-phone" type="tel" class="form-control" title="Numer telefonu: cyfry, spacje oraz + ( ) -" x-model="form.phone"></div>
      <div><label class="form-label" for="u-pass" x-text="user ? 'Nowe hasło (puste = bez zmiany)' : 'Hasło'"></label><input id="u-pass" type="password" class="form-control" autocomplete="new-password" x-model="form.password"></div>
      <div><label class="form-label" for="u-pass2">Powtórz hasło</label><input id="u-pass2" type="password" class="form-control" autocomplete="new-password" x-model="form.password2"></div>
      <fieldset class="ikpm-span-all"><legend class="form-label">Role</legend>
        <div class="d-flex flex-wrap column-gap-4">
          <template x-for="[k, label] in Object.entries(ik.labels().role)" :key="k">
            <div class="form-check"><input class="form-check-input" type="checkbox" :id="'role-' + k" :value="k" x-model="form.roles"><label class="form-check-label" :for="'role-' + k" x-text="label"></label></div>
          </template>
        </div>
      </fieldset>
      <template x-if="user"><div class="ikpm-span-all"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="u-active" x-model="form.active" aria-describedby="u-active-hint"><label class="form-check-label" for="u-active">Konto aktywne</label><p id="u-active-hint" class="form-text">Nieaktywne konto nie zaloguje się — jego wyceny i realizacje zostają.</p></div></div></template>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary btn-lg">Zapisz</button><a class="btn btn-outline-secondary btn-lg" :href="ik.href('screens/users.html')">Anuluj</a></div>
  </form>
</main>
<script type="module">
import { boot, db, save, nextId, go, param } from '../assets/app.js';

boot(() => ({
  user: null, errors: [], form: { email: '', first_name: '', last_name: '', phone: '', password: '', password2: '', roles: ['worker'], active: true },
  init() {
    if (param('id')) { this.user = db.users.find((u) => u.id === Number(param('id'))); }
    if (this.user) this.form = { ...this.form, email: this.user.email, first_name: this.user.first_name, last_name: this.user.last_name, phone: this.user.phone || '', roles: [...this.user.roles], active: this.user.active };
  },
  submit() {
    const f = this.form; const e = []; const me = this.user && this.user.id === db.users[0].id;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.push(f.email ? 'Email jest nieprawidłowy' : 'Email nie może być pusty');
    if (!this.user && f.password.length < 6) e.push('Hasło jest za krótkie (przynajmniej 6 znaków)');
    if (f.password !== f.password2) e.push('Powtórz hasło musi być takie samo jak hasło');
    if (me && !f.roles.includes('admin')) e.push('Nie możesz odebrać sobie roli administratora.');
    if (me && !f.active) e.push('Nie możesz dezaktywować własnego konta.');
    this.errors = e; if (e.length) return;
    const data = { email: f.email.trim(), first_name: f.first_name.trim(), last_name: f.last_name.trim(), phone: f.phone.trim(), roles: f.roles, active: this.user ? f.active : true };
    data.display_name = [data.first_name, data.last_name].filter(Boolean).join(' ') || data.email;
    if (this.user) { Object.assign(this.user, data); save(); go('screens/users.html', 'Użytkownik zaktualizowany.'); }
    else { db.users.push({ id: nextId('user'), ...data }); save(); go('screens/users.html', 'Użytkownik utworzony.'); }
  },
}));
</script>
</body>
</html>
