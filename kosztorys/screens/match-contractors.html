<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dobieranie wykonawców — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">

</head>
<body data-nav="quotes">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
<template x-if="q">
<div>
  <div id="alerts"></div>
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/builder.html?id=' + q.id)">Wróć do edytora</a>
    <div class="ikpm-page-heading">
      <h1 class="ikpm-page-title">Dobieranie wykonawców — Wycena #<span x-text="q.id"></span></h1>
      <div class="ikpm-page-meta"><span x-text="q.client ? q.client.name : '(brak klienta)'"></span><span x-text="ik.jobsCount(ik.jobsOf(q).length)"></span><span>Razem netto <strong class="ikpm-num" x-text="ik.pln(ik.quoteTotals(q).net)"></strong></span></div>
    </div>
  </div>

  <template x-if="!ik.jobsOf(q).length">
    <div class="alert alert-warning d-flex gap-2"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>Wycena nie ma jeszcze żadnych prac. Dodaj prace w edytorze.</span></div>
  </template>
  <template x-if="ik.jobsOf(q).length && !src && !ik.hasKitPlans(q)">
    <div class="alert alert-secondary d-flex gap-2"><i class="bi bi-info-circle-fill" aria-hidden="true"></i><span>Prototyp: plany doboru są policzone przez aplikację tylko dla wycen z danych demo. Dla wyceny utworzonej w prototypie karta planów zostaje pusta.</span></div>
  </template>
  <template x-if="ik.jobsOf(q).length && !src && ik.hasKitPlans(q)">
    <div class="alert alert-secondary d-flex gap-2"><i class="bi bi-info-circle-fill" aria-hidden="true"></i><span>Prototyp: plany doboru są policzone przez aplikację dla jednej wersji tej wyceny (te same prace i ilości). Ta wersja ma inne prace albo ilości, więc prototyp nie ma dla niej planu.</span></div>
  </template>

  <template x-if="ik.jobsOf(q).length && src">
    <div>
      <p class="ikpm-meta ikpm-measure">Plany pomijają ekipy o nietypowej dla danej pracy cenie, tempie lub jakości. Poza „Najszybszym” żaden etap nie trwa ponad 2 × tyle, co przy najszybszym podziale prac na najwyżej 3 ekipy naraz (o ile ekipy na to pozwalają) — dlatego „Najtańszy” nie zawsze bierze najtańsze ekipy, a „Minimum ekip” dobiera kolejną ekipę, gdy jedna robiłaby etap za długo. Plan najlepszy w kilku miarach widać na kilku kartach.</p>

      <!-- Arkusz porównania: plany w kolumnach (od 1100 px) -->
      <div class="ikpm-table-box k-plans-sheet mb-4" tabindex="0" aria-label="Porównanie planów doboru wykonawców">
        <table class="table k-plan-table">
          <caption class="visually-hidden">Porównanie planów doboru wykonawców</caption>
          <thead>
            <tr>
              <th scope="col">Plan</th>
              <template x-for="p in plans" :key="p.key">
                <th scope="col"><span class="d-flex flex-wrap align-items-center gap-2" style="font-size: 1rem; color: var(--ikpm-text)"><i class="bi" :class="p.icon" aria-hidden="true"></i><span x-text="p.plan.label"></span><span class="ikpm-chip ikpm-tone-accent" x-show="p.applied"><i class="bi bi-check-lg" aria-hidden="true"></i>Zastosowany</span></span></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <tr><th scope="row">Koszt ekip:</th><template x-for="p in plans" :key="p.key"><td class="ikpm-amount" x-text="ik.pln(p.plan.summary.total_cost)"></td></template></tr>
            <tr><th scope="row">Liczba ekip:</th><template x-for="p in plans" :key="p.key"><td class="fw-semibold" x-text="p.plan.summary.contractor_count"></td></template></tr>
            <tr><th scope="row">Czas realizacji:</th><template x-for="p in plans" :key="p.key"><td><span class="ikpm-amount" x-text="ik.hours(p.plan.summary.makespan_hours)"></span><span class="ikpm-meta d-block" x-text="ik.workDays(p.plan.work_days) + ' z odbiorami etapów'"></span></td></template></tr>
            <tr><th scope="row">Łącznie roboczogodzin:</th><template x-for="p in plans" :key="p.key"><td x-text="ik.hours(p.plan.summary.total_work_hours)"></td></template></tr>
            <tr><th scope="row">Śr. jakość:</th><template x-for="p in plans" :key="p.key"><td><strong x-text="ik.oneDec(p.plan.summary.avg_quality)"></strong> <span class="ikpm-meta">/10</span></td></template></tr>
            <tr><th scope="row">Pokrycie:</th><template x-for="p in plans" :key="p.key"><td><div class="ikpm-progress"><div class="ikpm-progress-head"><span class="visually-hidden">Pokrycie</span><span x-text="p.plan.summary.coverage_pct + '%'"></span></div><div class="progress" role="progressbar" :aria-label="'Pokrycie: ' + p.plan.label" :aria-valuenow="p.plan.summary.coverage_pct" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" :class="p.plan.summary.coverage_pct === 100 ? 'bg-success' : 'bg-warning'" :style="'width:' + p.plan.summary.coverage_pct + '%'"></div></div></div></td></template></tr>
            <tr><th scope="row">Harmonogram etapów:</th>
              <template x-for="p in plans" :key="p.key"><td><ul class="k-schedule"><template x-for="s in p.schedule" :key="s.stage"><li><span x-text="s.stage"></span><span class="ikpm-num" x-text="ik.hours(s.hours) + ' → ' + ik.hours(s.cumulative)"></span></li></template></ul></td></template></tr>
            <tr><th scope="row">Wykonawcy:</th><template x-for="p in plans" :key="p.key"><td><span class="d-flex flex-wrap gap-1"><template x-for="c in p.plan.summary.contractors_used" :key="c"><span class="ikpm-chip" x-text="c"></span></template></span>
              <div class="alert alert-warning small py-1 px-2 mb-0 mt-2" x-show="p.plan.summary.unassigned_job_names.length"><strong>Bez wykonawcy (brak w cenniku ekipy z ceną):</strong> <span x-text="p.plan.summary.unassigned_job_names.join(', ')"></span></div></td></template></tr>
            <tr><th scope="row"><span class="visually-hidden">Akcja</span></th><template x-for="p in plans" :key="p.key"><td><button type="button" class="btn btn-lg w-100" :class="p.applied ? 'btn-outline-primary' : 'btn-primary'" :aria-label="(p.applied ? 'Zastosuj ponownie: ' : 'Zastosuj ten plan: ') + p.plan.label" @click="apply(p)"><i class="bi" :class="p.applied ? 'bi-arrow-clockwise' : 'bi-check-lg'" aria-hidden="true"></i><span x-text="p.applied ? 'Zastosuj ponownie' : 'Zastosuj ten plan'"></span></button></td></template></tr>
          </tbody>
        </table>
      </div>

      <!-- Węziej: plany jako karty (2 × 2 na tablecie, jedna pod drugą na telefonie) -->
      <div class="k-plans-cards mb-4">
        <template x-for="p in plans" :key="p.key">
          <section class="card" :class="{ 'ikpm-selected': p.applied }" :aria-labelledby="'plan-' + p.key">
            <div class="card-header d-flex flex-wrap align-items-center gap-2">
              <h2 class="k-card-title me-auto d-flex align-items-center gap-2" :id="'plan-' + p.key"><i class="bi" :class="p.icon" aria-hidden="true"></i><span x-text="p.plan.label"></span></h2>
              <span class="ikpm-chip ikpm-tone-accent" x-show="p.applied"><i class="bi bi-check-lg" aria-hidden="true"></i>Zastosowany</span>
            </div>
            <div class="card-body d-grid gap-3">
              <dl class="ikpm-dl ikpm-dl-num">
                <dt>Koszt ekip:</dt><dd class="fw-semibold" x-text="ik.pln(p.plan.summary.total_cost)"></dd>
                <dt>Liczba ekip:</dt><dd class="fw-semibold" x-text="p.plan.summary.contractor_count"></dd>
                <dt>Czas realizacji:</dt><dd><strong x-text="ik.hours(p.plan.summary.makespan_hours)"></strong><span class="d-block ikpm-meta" x-text="ik.workDays(p.plan.work_days) + ' z odbiorami etapów'"></span></dd>
                <dt>Łącznie roboczogodzin:</dt><dd x-text="ik.hours(p.plan.summary.total_work_hours)"></dd>
                <dt>Śr. jakość:</dt><dd><strong x-text="ik.oneDec(p.plan.summary.avg_quality)"></strong> /10</dd>
                <dt>Pokrycie:</dt><dd x-text="p.plan.summary.coverage_pct + '%'"></dd>
              </dl>
              <div><p class="fw-semibold mb-1">Harmonogram etapów:</p>
                <ul class="k-schedule"><template x-for="s in p.schedule" :key="s.stage"><li><span x-text="s.stage"></span><span class="ikpm-num" x-text="ik.hours(s.hours) + ' → ' + ik.hours(s.cumulative)"></span></li></template></ul></div>
              <div><p class="fw-semibold mb-1">Wykonawcy:</p>
                <span class="d-flex flex-wrap gap-1"><template x-for="c in p.plan.summary.contractors_used" :key="c"><span class="ikpm-chip" x-text="c"></span></template></span></div>
              <div class="alert alert-warning small py-1 px-2 mb-0" x-show="p.plan.summary.unassigned_job_names.length"><strong>Bez wykonawcy (brak w cenniku ekipy z ceną):</strong> <span x-text="p.plan.summary.unassigned_job_names.join(', ')"></span></div>
              <button type="button" class="btn btn-lg w-100" :class="p.applied ? 'btn-outline-primary' : 'btn-primary'" :aria-label="(p.applied ? 'Zastosuj ponownie: ' : 'Zastosuj ten plan: ') + p.plan.label" @click="apply(p)"><span x-text="p.applied ? 'Zastosuj ponownie' : 'Zastosuj ten plan'"></span></button>
            </div>
          </section>
        </template>
      </div>

      <details class="card mb-3">
        <summary class="card-header" style="min-height: var(--ikpm-control-h); cursor: pointer">Harmonogram etapów — porównanie planów</summary>
        <div class="ikpm-table-box border-0 rounded-0" tabindex="0" aria-label="Harmonogram etapów — porównanie planów">
          <table class="table">
            <caption class="visually-hidden">Czas etapu (h) i godziny ekip w każdym planie</caption>
            <thead><tr><th scope="col">Etap</th><template x-for="p in plans" :key="p.key"><th scope="col" x-text="p.plan.label"></th></template></tr></thead>
            <tbody>
              <template x-for="(st, si) in stageNames" :key="st">
                <tr><th scope="row" x-text="st"></th>
                  <template x-for="p in plans" :key="p.key"><td><template x-if="p.stageBy[st]"><span><strong class="ikpm-num" x-text="ik.hours(p.stageBy[st].duration_hours)"></strong><template x-for="c in p.stageBy[st].crews" :key="c.contractor"><span class="d-block ikpm-meta" x-text="c.contractor + ': ' + ik.hours(c.hours)"></span></template></span></template><template x-if="!p.stageBy[st]"><span class="ikpm-muted">—</span></template></td></template></tr>
              </template>
            </tbody>
            <tfoot><tr><th scope="row">RAZEM</th><template x-for="p in plans" :key="p.key"><td class="ikpm-num text-start" x-text="ik.hours(p.plan.summary.makespan_hours)"></td></template></tr></tfoot>
          </table>
        </div>
      </details>

      <details class="card mb-3">
        <summary class="card-header" style="min-height: var(--ikpm-control-h); cursor: pointer">Porównanie — kto robi co w każdym planie</summary>
        <div class="ikpm-table-box border-0 rounded-0" tabindex="0" aria-label="Porównanie — kto robi co w każdym planie">
          <table class="table table-sm">
            <caption class="visually-hidden">Wykonawca każdej pracy w każdym planie</caption>
            <thead><tr><th scope="col">Pokój</th><th scope="col">Praca</th><th scope="col" class="ikpm-num">Ilość</th><template x-for="p in plans" :key="p.key"><th scope="col" x-text="p.plan.label"></th></template></tr></thead>
            <tbody>
              <template x-for="row in rows" :key="row.j.id">
                <tr><td x-text="row.room"></td><td x-text="row.j.name"></td><td class="ikpm-num" x-text="ik.dec(row.j.quantity) + ' ' + row.j.unit"></td>
                  <template x-for="p in plans" :key="p.key"><td><template x-if="p.byJob[row.j.id]"><span><span x-text="p.byJob[row.j.id].contractor"></span><span class="d-block ikpm-meta ikpm-num text-start" x-text="ik.pln(p.byJob[row.j.id].price) + ' · ' + ik.hours(p.byJob[row.j.id].job_hours)"></span></span></template><template x-if="!p.byJob[row.j.id]"><span class="ikpm-muted">brak</span></template></td></template></tr>
              </template>
            </tbody>
          </table>
        </div>
      </details>
    </div>
  </template>
</div>
</template>
</main>
<script type="module">
import { boot, db, go, ask, idParam } from '../assets/app.js';

const ICONS = { cheapest: 'bi-cash-coin', best_quality: 'bi-award', fastest: 'bi-lightning', fewest_crews: 'bi-people' };
boot(() => ({
  q: null, src: null,
  init() {
    const id = idParam(11);
    const q = db.quotes.find((x) => x.id === id);
    if (!q) { location.replace(ik.href('screens/error-404.html')); return; }
    if (q.status !== 'draft') { go(`screens/quote-show.html?id=${id}`, 'Wycena jest u klienta — przywróć ją do edycji, aby ją zmienić.', 'error', true); return; }
    this.src = ik.plansFor(q);
    this.q = q;
  },
  get plans() {
    return Object.entries(this.src.plans).map(([key, plan]) => {
      let sum = 0;
      return {
        key, plan, icon: ICONS[key], applied: this.q.applied_profile_name === key,
        schedule: plan.stage_schedule.map((s) => { sum += s.duration_hours; return { stage: s.stage, hours: s.duration_hours, cumulative: sum }; }),
        byJob: Object.fromEntries(plan.assignments.map((a) => [a.quote_job_id, a])),
        stageBy: Object.fromEntries(plan.stage_schedule.map((s) => [s.stage, s])),
      };
    });
  },
  get stageNames() { return [...new Set(Object.values(this.src.plans).flatMap((p) => p.stage_schedule.map((s) => s.stage)))]; },
  get rows() { return this.q.rooms.flatMap((room) => ik.sortJobs(room.jobs).map((j) => ({ room: room.name, j }))); },
  async apply(p) {
    const verb = p.applied ? 'Zastosować ponownie' : 'Zastosować';
    const ok = await ask({
      title: p.applied ? 'Zastosuj ponownie' : 'Zastosuj ten plan',
      text: `${verb} plan '${p.plan.label}'? Przypisze wykonawców do ${ik.jobsGenitive(p.plan.assignments.length)}; cennik zastąpi ręcznie wpisane ceny ekipy.`,
      points: [
        'Ceny ekip i koszt materiałów zostaną zamrożone w wycenie — późniejsze zmiany cennika ich nie zmienią.',
        `Sugerowany termin zakończenia: ${ik.workDays(p.plan.work_days)} od planowanego startu (do wpisania przyciskiem „Użyj”).`,
      ],
      ok: p.applied ? 'Zastosuj ponownie' : 'Zastosuj ten plan',
    });
    if (!ok) return;
    ik.applyPlan(this.q, p.key);
    const missing = p.plan.summary.unassigned_job_names;
    go(`screens/builder.html?id=${this.q.id}`, `Zastosowano plan '${p.plan.label}'.${missing.length ? ` Bez wykonawcy (brak w cenniku ekipy z ceną): ${ik.jobNames(missing)}.` : ''}`, undefined, true);
  },
}));
</script>
</body>
</html>
