<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail: oferta — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<main x-data="page" x-cloak class="container px-3 py-3" style="max-width: 720px">
<template x-if="q">
  <article class="card" aria-labelledby="m-subject">
    <div class="card-header bg-body small">
      <dl class="row mb-0">
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Od:</dt><dd class="col-9 col-sm-10 mb-1">IKPM &lt;noreply@ikpm.local&gt;</dd>
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Do:</dt><dd class="col-9 col-sm-10 mb-1 text-break" x-text="q.client ? q.client.email : '—'"></dd>
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Temat:</dt><dd class="col-9 col-sm-10 mb-1"><h1 id="m-subject" class="h6 mb-0" x-text="'Wycena #' + q.id"></h1></dd>
        <dt class="col-3 col-sm-2 fw-normal text-body-secondary">Załącznik:</dt><dd class="col-9 col-sm-10 mb-0"><a class="tap" :href="ik.href('screens/quote-pdf.html?id=' + q.id)" target="_blank" rel="noopener"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> <span x-text="'wycena-' + q.id + '.pdf'"></span></a></dd>
      </dl>
    </div>
    <div class="card-body">
      <p x-text="'Dzień dobry ' + (q.client ? q.client.name : '') + ','"></p>
      <p x-text="'Przesyłamy wycenę nr #' + q.id + ' do akceptacji.'"></p>
      <p>PDF z wyceną znajdą Państwo w załączniku. Aby zostawić komentarze i odpowiedzieć (zaakceptować lub poprosić o zmianę), prosimy kliknąć poniższy link:</p>
      <p><a class="tap text-break" :href="ik.href('screens/public-quote.html?id=' + q.id)" x-text="'Oferta — Wycena #' + q.id"></a></p>
      <p>Pozostajemy do dyspozycji w razie pytań.</p>
      <p class="mb-0">Pozdrawiamy,<br><span x-text="sender ? sender.display_name : 'Zespół IKPM'"></span><template x-if="sender && sender.first_name"><span><br><span x-text="sender.email"></span></span></template></p>
    </div>
  </article>
</template>
</main>
<script type="module">
import { boot, db, idParam } from '../assets/app.js';
boot(() => ({
  q: null,
  init() { this.q = db.quotes.find((x) => x.id === idParam(2)); if (!this.q) location.replace(ik.href('screens/error-404.html')); },
  get sender() { return this.q.user ? ik.quoteUser(this.q) : null; },
}));
</script>
</body>
</html>
