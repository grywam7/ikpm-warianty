<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realizacja — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* Realizacja: spis pokoi | lista kontrolna | dane realizacji. Poniżej 1100 px dane nad listą, od 1600 px z prawej. */
  .k-real { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--ikpm-gutter); grid-template-areas: "info" "doc"; align-items: start; }
  .k-real > .k-toc { grid-area: toc; }
  .k-real > .k-info { grid-area: info; }
  .k-real > .k-doc { grid-area: doc; min-width: 0; }
  @media (min-width: 1100px) {
    .k-real { grid-template-columns: clamp(16rem, 22vw, 20rem) minmax(0, 1fr); grid-template-areas: "toc info" "toc doc"; }
    .k-real > .k-toc { position: sticky; top: var(--ikpm-sticky-top); max-height: calc(100dvh - var(--ikpm-sticky-top)); overflow-y: auto;
      overscroll-behavior: contain; padding: 0 .25rem 1rem 0; align-self: start; }
  }
  @media (min-width: 1600px) {
    .k-real { grid-template-columns: clamp(16rem, 18vw, 20rem) minmax(0, 1fr) 24rem; grid-template-areas: "toc doc info"; }
    .k-real > .k-info { position: sticky; top: var(--ikpm-sticky-top); max-height: calc(100dvh - var(--ikpm-sticky-top)); overflow-y: auto;
      overscroll-behavior: contain; padding-bottom: 1rem; }
    .k-info .k-info-grid { grid-template-columns: minmax(0, 1fr); }
  }
  .k-info-grid { display: grid; gap: var(--ikpm-space-4); }
  @media (min-width: 768px) and (max-width: 1599.98px) { .k-info-grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
  .k-info-toggle { display: none; }
  /* Poniżej 1600 px (telefon, tablet, laptop) dane realizacji zwinięte pod paskiem postępu — od razu filtr i lista prac;
     przycisk podaje rozliczenie, termin i koszt faktyczny. Od 1600 px dane są w kolumnie z prawej. */
  @media (max-width: 1599.98px) {
    .k-info-toggle { display: flex; align-items: flex-start; justify-content: flex-start; text-align: left; }
    .k-info-toggle > .bi { margin-top: .2rem; }
    .k-info-body:not(.is-open) { display: none; }
  }
  @media (max-width: 575.98px) {
    .k-doc .ikpm-filters { gap: .375rem; }
    .k-doc .ikpm-filters .btn { --bs-btn-padding-x: .625rem; gap: .25rem; }
    .k-doc .k-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .k-doc .k-chips .btn { white-space: normal; text-align: center; line-height: 1.2; }
  }
  .k-room-toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .k-filtered { margin: 0; padding: .75rem 1rem; color: var(--ikpm-text-2); }
</style>
</head>
<body data-nav="realizations">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
<template x-if="r">
<div>
  <div id="alerts"></div>
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/realizations-index.html')">Lista realizacji</a>
    <div class="ikpm-page-heading">
      <h1 class="ikpm-page-title">Realizacja #<span x-text="r.id"></span></h1>
      <div class="ikpm-page-meta"><span x-html="ik.realBadge(r.status, true)"></span><a :href="clientHref" x-text="r.client.name"></a><template x-if="r.quote_id"><span>z wyceny <a :href="ik.href('screens/quote-show.html?id=' + r.quote_id)" x-text="'#' + r.quote_id"></a></span></template></div>
    </div>
    <div id="realization-actions" class="ikpm-page-actions">
      <template x-if="r.status === 'planned'"><button type="button" class="btn btn-primary btn-lg" @click="start()"><i class="bi bi-play-fill" aria-hidden="true"></i>Rozpocznij</button></template>
      <template x-if="r.status === 'in_progress' && unfinished === 0"><button type="button" class="btn btn-success btn-lg" @click="finish()"><i class="bi bi-flag-fill" aria-hidden="true"></i>Zakończ</button></template>
      <template x-if="r.status === 'in_progress' && unfinished > 0">
        <span class="d-inline-flex flex-wrap align-items-center gap-2"><button type="button" class="btn btn-success btn-lg" disabled aria-describedby="finish-hint"><i class="bi bi-flag-fill" aria-hidden="true"></i>Zakończ</button><span id="finish-hint" class="ikpm-meta" x-text="ik.unfinished(unfinished)"></span></span>
      </template>
      <button type="button" class="btn btn-outline-primary" @click="sendLink()"><i class="bi bi-envelope" aria-hidden="true"></i>Wyślij link</button>
      <template x-if="ik.realActive(r)"><button type="button" class="btn btn-outline-danger d-none d-md-inline-flex" @click="cancel()"><i class="bi bi-x-octagon" aria-hidden="true"></i>Anuluj</button></template>
      <template x-if="r.status !== 'done'"><button type="button" class="btn btn-outline-danger d-none d-md-inline-flex" @click="destroy()"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button></template>
      <template x-if="!ik.realActive(r)"><span class="ikpm-meta">(status terminalny)</span></template>
    </div>
  </div>

  <div class="k-real">
    <!-- Spis pokoi (od 1100 px) -->
    <nav class="k-toc" aria-labelledby="toc-title">
      <h2 id="toc-title" class="k-toc-title">Spis pokoi</h2>
      <ul class="ikpm-list">
        <template x-for="room in r.rooms" :key="room.id">
          <li><a class="ikpm-row" :href="'#room-' + room.id" @click="if (closed[room.id]) closed[room.id] = false">
            <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="room.name"></span>
              <span class="ikpm-row-meta" x-text="'Zrobione: ' + doneIn(room) + ' / ' + room.jobs.length"></span>
              <span class="ikpm-status ikpm-st-job-remake mt-1" x-show="remakeIn(room)" x-text="'Do poprawy: ' + remakeIn(room)"></span></span></a></li>
        </template>
        <li><a class="ikpm-row" href="#zdjecia"><span class="ikpm-row-main"><span class="ikpm-row-title">Zdjęcia</span><span class="ikpm-row-meta" x-text="ik.plural(r.photos.length, 'zdjęcie', 'zdjęcia', 'zdjęć')"></span></span></a></li>
      </ul>
    </nav>

    <!-- Dane realizacji: na telefonie zwinięte pod paskiem postępu -->
    <section class="k-info mb-4" aria-labelledby="info-title">
      <div class="ikpm-progress mb-3">
        <div class="ikpm-progress-head"><span id="info-progress">Postęp prac</span><span x-text="ik.progress(r) + '% (' + ik.doneCount(r) + ' / ' + ik.realJobs(r).length + ')'"></span></div>
        <div class="progress" role="progressbar" aria-labelledby="info-progress" :aria-valuenow="ik.progress(r)" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" :class="{ 'bg-success': r.status === 'done' }" :style="'width:' + ik.progress(r) + '%'"></div></div>
      </div>
      <h2 id="info-title" class="visually-hidden">Dane realizacji</h2>
      <button type="button" class="btn btn-outline-secondary w-100 k-info-toggle mb-3" :aria-expanded="infoOpen.toString()" aria-controls="info-body" @click="infoOpen = !infoOpen"><i class="bi" :class="infoOpen ? 'bi-chevron-up' : 'bi-chevron-down'" aria-hidden="true"></i><span class="min-w-0"><span class="d-block">Dane realizacji — klient, link, rozliczenie, terminy, koszty</span><span class="d-block ikpm-meta fw-normal" x-text="infoSummary"></span></span></button>
      <div id="info-body" class="k-info-body k-info-grid" :class="{ 'is-open': infoOpen }">
        <div class="card"><div class="card-body">
          <dl class="ikpm-dl">
            <dt>Klient</dt><dd><a :href="clientHref" x-text="r.client.name"></a></dd>
            <template x-if="r.quote_id"><dt>z wyceny</dt></template>
            <template x-if="r.quote_id"><dd><a :href="ik.href('screens/quote-show.html?id=' + r.quote_id)" x-text="'#' + r.quote_id"></a></dd></template>
            <dt>Publiczny link dla klienta:</dt>
            <dd><a class="text-break" :href="ik.href('screens/public-realization.html?id=' + r.id)" target="_blank" rel="noopener" x-text="'/r/ — postęp prac #' + r.id"></a> <span class="ikpm-meta" x-show="r.link_valid_until" x-text="r.link_valid_until < ik.todayISO() ? '(wygasł ' + ik.date(r.link_valid_until) + ' — „Wyślij link” odnowi go na 30 dni)' : '(ważny do ' + ik.date(r.link_valid_until) + ')'"></span></dd>
            <dt><label for="settlement" class="m-0" x-show="ik.realActive(r)">Rozliczenie:</label><span x-show="!ik.realActive(r)">Rozliczenie:</span></dt>
            <dd>
              <template x-if="ik.realActive(r)"><select id="settlement" class="form-select" @change="r.settlement = $event.target.value; save(); toast('Realizacja zaktualizowana.')">
                <template x-for="[k, label] in Object.entries(ik.labels().settlement)" :key="k"><option :value="k" :selected="r.settlement === k" x-text="label"></option></template>
              </select></template>
              <span x-show="!ik.realActive(r)" x-text="ik.labels().settlement[r.settlement]"></span>
            </dd>
            <dt>Adres inwestycji</dt><dd x-text="r.site_address || '—'"></dd>
            <dt>Planowany start</dt><dd x-text="ik.date(r.planned_start_on)"></dd>
            <dt>Termin obiecany</dt><dd x-text="ik.date(r.promised_end_on)"></dd>
            <template x-if="r.status === 'done'"><dt>Data zakończenia</dt></template>
            <template x-if="r.status === 'done'"><dd x-text="ik.date(ik.endOn(r))"></dd></template>
            <template x-if="r.status !== 'done'"><dt><label class="m-0" for="expected">Aktualnie przewidywany</label></dt></template>
            <template x-if="r.status !== 'done'"><dd>
              <template x-if="ik.realActive(r)"><form class="d-flex flex-wrap gap-2" @submit.prevent="saveExpected()"><input id="expected" type="date" class="form-control w-auto" min="2000-01-01" max="2099-12-31" x-model="expected"><button class="btn btn-outline-primary">Zapisz</button></form></template>
              <template x-if="!ik.realActive(r)"><span x-text="ik.date(ik.currentEnd(r))"></span></template>
            </dd></template>
          </dl>
        </div></div>
        <div class="d-grid gap-3 align-content-start">
          <div id="realization-costs" class="card"><div class="card-body">
            <dl class="ikpm-dl ikpm-dl-num">
              <dt>Wartość netto (z wyceny)</dt><dd class="fw-semibold" x-text="ik.pln(r.total_price)"></dd>
              <dt>Koszt (faktyczny)</dt><dd class="fw-semibold" x-text="ik.pln(ik.realCost(r))"></dd>
              <dt>Koszt z wyceny</dt><dd x-text="ik.pln(r.estimated_cost)"></dd>
            </dl>
          </div></div>
          <template x-if="ik.realActive(r)">
            <form class="card" @submit.prevent="bulkStage()" aria-labelledby="bulk-title">
              <div class="card-body d-grid gap-2">
                <h3 id="bulk-title" class="k-sub-title mb-0">Ustaw status wszystkim pracom etapu</h3>
                <div class="ikpm-grid k-fields" style="--ikpm-grid-min: 10rem">
                  <div><label class="form-label" for="bulk-stage">Etap</label>
                    <select id="bulk-stage" class="form-select" x-model="bulk.stage" required><option value="">Wybierz etap</option><template x-for="s in stages" :key="s"><option :value="s" x-text="s"></option></template></select></div>
                  <div><label class="form-label" for="bulk-status">Status</label>
                    <select id="bulk-status" class="form-select" x-model="bulk.status" required><option value="">Wybierz status</option><template x-for="[k, label] in statusList" :key="k"><option :value="k" x-text="label"></option></template></select></div>
                </div>
                <div><button class="btn btn-outline-primary">Zastosuj</button></div>
              </div>
            </form>
          </template>
          <div class="d-flex d-md-none flex-wrap gap-2">
            <template x-if="ik.realActive(r)"><button type="button" class="btn btn-outline-danger flex-fill" @click="cancel()"><i class="bi bi-x-octagon" aria-hidden="true"></i>Anuluj</button></template>
            <template x-if="r.status !== 'done'"><button type="button" class="btn btn-outline-danger flex-fill" @click="destroy()"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button></template>

          </div>
        </div>
      </div>
    </section>

    <div class="k-doc">
      <!-- Filtr listy kontrolnej -->
      <div class="ikpm-filters mb-3" role="radiogroup" aria-label="Pokaż prace">
        <template x-for="f in filters" :key="f.key">
          <span class="d-contents"><input type="radio" class="btn-check" name="job-filter" :id="'f-' + f.key" :value="f.key" :checked="filter === f.key" @change="setFilter(f.key)"><label class="btn" :for="'f-' + f.key"><span x-text="f.label"></span> <span class="ikpm-num" x-text="'(' + f.count + ')'"></span></label></span>
        </template>
      </div>
      <nav class="k-chips" aria-label="Pokoje realizacji">
        <template x-for="room in r.rooms" :key="room.id">
          <a class="btn btn-outline-secondary" :href="'#room-' + room.id" @click="if (closed[room.id]) closed[room.id] = false"><span x-text="room.name"></span> <span class="ikpm-meta ikpm-num" x-text="doneIn(room) + '/' + room.jobs.length"></span></a>
        </template>
        <a class="btn btn-outline-secondary" href="#zdjecia"><i class="bi bi-images" aria-hidden="true"></i>Zdjęcia</a>
      </nav>

      <!-- Pokoje: lista kontrolna -->
      <template x-for="room in r.rooms" :key="room.id">
        <section class="doc-room card" :id="'room-' + room.id" :aria-labelledby="'rt-' + room.id">
          <div class="doc-room-head ikpm-sticky-head">
            <button type="button" class="btn btn-outline-secondary ikpm-btn-icon flex-none" :aria-expanded="(!closed[room.id]).toString()" :aria-controls="'rb-' + room.id" @click="closed[room.id] = !closed[room.id]" :aria-label="(closed[room.id] ? 'Rozwiń pokój ' : 'Zwiń pokój ') + room.name"><i class="bi" :class="closed[room.id] ? 'bi-chevron-right' : 'bi-chevron-down'" aria-hidden="true"></i></button>
            <div class="doc-room-name">
              <h2 class="doc-room-title" :id="'rt-' + room.id" x-text="room.name"></h2>
              <p class="ikpm-meta mb-0"><span x-text="'Zrobione: ' + doneIn(room) + ' / ' + room.jobs.length"></span><span x-show="remakeIn(room)" x-text="' · Do poprawy: ' + remakeIn(room)"></span><span x-show="sizeText(room)" x-text="' · ' + sizeText(room)"></span></p>
            </div>
            <template x-if="ik.realActive(r)">
              <form class="d-none d-md-flex gap-2" @submit.prevent="bulkRoom(room, $event.target.elements.status.value)">
                <select name="status" class="form-select w-auto" required :aria-label="'Status wszystkich prac: ' + room.name"><option value="">Status wszystkich prac</option><template x-for="[k, label] in statusList" :key="k"><option :value="k" x-text="label"></option></template></select>
                <button class="btn btn-outline-primary">Zastosuj</button>
              </form>
            </template>
            <template x-if="ik.realActive(r)"><button type="button" class="btn btn-outline-primary k-room-act d-md-none" @click="openBulk(room)"><i class="bi bi-ui-checks" aria-hidden="true"></i>Status wszystkich prac</button></template>
            <label class="btn btn-outline-secondary mb-0 position-relative k-room-act"><i class="bi bi-camera" aria-hidden="true"></i>Dodaj zdjęcia<input type="file" class="k-file" multiple accept="image/jpeg,image/png,image/webp" @change="addPhotos($event.target, room.name)"></label>
          </div>
          <div :id="'rb-' + room.id" x-show="!closed[room.id]">
            <p class="px-3 pt-3 mb-0" x-show="room.notes"><strong>Notatka:</strong> <span x-text="room.notes"></span></p>
            <p class="k-filtered" x-show="!room.jobs.length">(brak prac w tym pomieszczeniu)</p>
            <p class="k-filtered" x-show="room.jobs.length && !visible(room).length" x-text="'Żadna praca tego pokoju nie pasuje do filtra „' + filters.find((f) => f.key === filter).label + '”.'"></p>
            <!-- telefon: wiersz otwiera okno dolne -->
            <div class="d-md-none">
              <template x-for="j in visible(room)" :key="j.id">
                <button type="button" class="k-job-btn" :id="'jobm-' + j.id" @click="openJob(j, room)">
                  <span class="flex-grow-1 min-w-0">
                    <span class="d-block fw-semibold" x-text="j.name"></span>
                    <span class="ikpm-meta d-block" x-text="ik.dec(j.quantity) + ' ' + j.unit + ' · ' + (j.contractor || '—')"></span>
                    <span class="d-block mt-1" x-html="ik.jobBadge(j.status, true)"></span>
                    <span class="k-text-line" x-show="j.notes"><b><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient):</b> <span x-text="j.notes"></span></span>
                    <span class="k-text-line ikpm-muted" x-show="j.internal_notes"><b><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma):</b> <span x-text="j.internal_notes"></span></span>
                  </span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i>
                </button>
              </template>
            </div>
            <!-- od 768 px: wiersz edytowany w miejscu -->
            <div class="d-none d-md-block">
              <template x-for="j in visible(room)" :key="j.id">
                <div class="k-job" :id="'job-' + j.id">
                  <div class="k-job-line" style="grid-auto-flow: row dense">
                    <div class="min-w-0"><span class="fw-semibold" x-text="j.name"></span>
                      <span class="ikpm-meta d-block" x-text="j.unit + ' · ' + j.stage + ' · ' + ik.dec(j.quantity) + ' ' + j.unit + ' · ' + (j.contractor || '—')"></span></div>
                    <fieldset class="ikpm-seg" :disabled="!ik.realActive(r)">
                      <legend class="visually-hidden" x-text="'Status: ' + j.name"></legend>
                      <template x-for="[k, label] in statusList" :key="k">
                        <span class="d-contents"><input type="radio" class="btn-check" :name="'st-' + j.id" :id="'st-' + j.id + '-' + k" :value="k" :checked="j.status === k" @change="setStatus(j, k)"><label class="btn ikpm-seg-btn" :class="'ikpm-st-job-' + k" :for="'st-' + j.id + '-' + k" x-text="label"></label></span>
                      </template>
                    </fieldset>
                    <div>
                      <template x-if="ik.realActive(r)"><div><label class="form-label small mb-1" :for="'rate-' + j.id">Stawka faktyczna /j.</label><div class="input-group"><input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :id="'rate-' + j.id" :placeholder="ik.measure(ik.laborUnitCost(j))" :value="j.actual_contractor_price === null ? '' : Number(j.actual_contractor_price)" @change="setRate(j, $event.target)"><span class="input-group-text">zł</span></div></div></template>
                      <template x-if="!ik.realActive(r)"><div><span class="ikpm-meta d-block">Stawka faktyczna /j.</span><span class="ikpm-num" x-text="ik.pln(j.actual_contractor_price ?? ik.laborUnitCost(j))"></span></div></template>
                    </div>
                    <div class="text-end"><span class="ikpm-meta d-block">Wartość</span><span class="ikpm-amount" x-text="ik.pln(j.total_price)"></span></div>
                  </div>
                  <div class="k-job-texts">
                    <div><label class="form-label" :for="'c-' + j.id"><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient)</label><input type="text" class="form-control" :id="'c-' + j.id" :value="j.notes || ''" :aria-label="'Komentarz (widzi klient): ' + j.name" @change="setText(j, 'notes', $event.target.value)"></div>
                    <div><label class="form-label" :for="'n-' + j.id"><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma)</label><input type="text" class="form-control" :id="'n-' + j.id" :value="j.internal_notes || ''" :aria-label="'Notatka wewnętrzna (tylko firma): ' + j.name" @change="setText(j, 'internal_notes', $event.target.value)"></div>
                  </div>
                  <span class="ikpm-save mt-1" data-state="saved" role="status" x-show="savedJob === j.id">Zapisano</span>
                </div>
              </template>
            </div>
            <!-- zdjęcia pokoju -->
            <div class="doc-room-body border-top" x-show="photosIn(room.name).length">
              <h3 class="k-sub-title" x-text="'Zdjęcia: ' + room.name"></h3>
              <div class="ikpm-photo-grid k-photos"><template x-for="p in photosIn(room.name)" :key="p.id"><div class="d-flex" x-init="$el.replaceChildren(photoCard(p))"></div></template></div>
            </div>
          </div>
        </section>
      </template>

      <!-- Zdjęcia: formularz i zdjęcia ogólne -->
      <section id="zdjecia" class="card mb-3" aria-labelledby="photos-title">
        <div class="card-body">
          <h2 id="photos-title" class="k-card-title mb-3">Zdjęcia</h2>
          <form class="ikpm-grid k-fields align-items-end" style="--ikpm-grid-min: 14rem" @submit.prevent="addPhotos($event.target.querySelector('input[type=file]'), photoRoom)">
            <div><label class="form-label" for="photo-files">Zdjęcia (JPG, PNG, WebP; najwyżej 20 naraz)</label><input id="photo-files" type="file" class="form-control" multiple accept="image/jpeg,image/png,image/webp"></div>
            <div><label class="form-label" for="photo-room">Pokój</label><select id="photo-room" class="form-select" x-model="photoRoom"><option value="">Ogólne (bez pokoju)</option><template x-for="room in r.rooms" :key="room.id"><option :value="room.name" x-text="room.name"></option></template></select></div>
            <div><button class="btn btn-primary w-100" :disabled="adding" x-text="adding ? 'Dodawanie…' : 'Dodaj zdjęcia'"></button></div>
          </form>
          <h3 class="k-sub-title mt-4">Ogólne</h3>
          <p class="ikpm-muted" x-show="!photosIn(null).length">Brak zdjęć.</p>
          <div class="ikpm-photo-grid k-photos"><template x-for="p in photosIn(null)" :key="p.id"><div class="d-flex" x-init="$el.replaceChildren(photoCard(p))"></div></template></div>
        </div>
      </section>
    </div>
  </div>
</div>
</template>

<!-- Okno dolne: praca (telefon) -->
<dialog class="ikpm-dialog ikpm-sheet" id="job-sheet" aria-labelledby="js-title" @close="closeSheet()">
  <template x-if="sheet">
    <div>
      <div class="ikpm-sheet-head"><h2 id="js-title" x-text="sheet.j.name"></h2><button type="button" class="btn btn-primary" @click="document.getElementById('job-sheet').close()">Gotowe</button></div>
      <div class="ikpm-dialog-body d-grid gap-3 pb-4">
        <p class="ikpm-meta mb-0" x-text="sheet.room.name + ' · ' + sheet.j.stage + ' · ' + ik.dec(sheet.j.quantity) + ' ' + sheet.j.unit + ' · ' + (sheet.j.contractor || '—')"></p>
        <fieldset class="ikpm-seg k-seg-2" :disabled="!ik.realActive(r)">
          <legend class="form-label">Status</legend>
          <template x-for="[k, label] in statusList" :key="k">
            <span class="d-contents"><input type="radio" class="btn-check" name="js-status" :id="'js-st-' + k" :value="k" :checked="sheet.j.status === k" @change="setStatus(sheet.j, k)"><label class="btn ikpm-seg-btn" :class="'ikpm-st-job-' + k" :for="'js-st-' + k" x-text="label"></label></span>
          </template>
        </fieldset>
        <p class="ikpm-meta mb-0" x-show="!ik.realActive(r)">Status nie może się zmienić po zakończeniu lub anulowaniu realizacji</p>
        <div><label class="form-label" for="js-comment"><i class="bi bi-eye" aria-hidden="true"></i> Komentarz (widzi klient)</label>
          <textarea id="js-comment" class="form-control" rows="2" :value="sheet.j.notes || ''" @change="setText(sheet.j, 'notes', $event.target.value)"></textarea></div>
        <div><label class="form-label" for="js-note"><i class="bi bi-lock" aria-hidden="true"></i> Notatka wewnętrzna (tylko firma)</label>
          <textarea id="js-note" class="form-control" rows="2" :value="sheet.j.internal_notes || ''" @change="setText(sheet.j, 'internal_notes', $event.target.value)"></textarea></div>
        <template x-if="ik.realActive(r)"><div><label class="form-label" for="js-rate">Stawka faktyczna /j.</label><div class="input-group"><input id="js-rate" type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :placeholder="ik.measure(ik.laborUnitCost(sheet.j))" :value="sheet.j.actual_contractor_price === null ? '' : Number(sheet.j.actual_contractor_price)" @change="setRate(sheet.j, $event.target)"><span class="input-group-text">zł</span></div></div></template>
        <template x-if="!ik.realActive(r)"><p class="mb-0">Stawka faktyczna /j.: <span x-text="ik.pln(sheet.j.actual_contractor_price ?? ik.laborUnitCost(sheet.j))"></span></p></template>
        <dl class="ikpm-dl ikpm-dl-num"><dt>Wartość</dt><dd class="fw-semibold" x-text="ik.pln(sheet.j.total_price)"></dd></dl>
      </div>
    </div>
  </template>
</dialog>

<!-- Okno dolne: status wszystkich prac pokoju -->
<dialog class="ikpm-dialog ikpm-sheet" id="bulk-sheet" aria-labelledby="bs-title" @close="bulkTarget = null">
  <template x-if="bulkTarget">
    <div>
      <div class="ikpm-sheet-head"><h2 id="bs-title">Status wszystkich prac: <span x-text="bulkTarget.name"></span></h2><form method="dialog"><button class="btn-close" aria-label="Zamknij"></button></form></div>
      <div class="ikpm-dialog-body pb-4">
        <p class="ikpm-meta">„Zrobione” pomija prace „Do poprawy” — sprawdza się je pojedynczo.</p>
        <div class="ikpm-seg k-seg-2">
          <template x-for="[k, label] in statusList" :key="k">
            <button type="button" class="btn ikpm-seg-btn" :class="'ikpm-st-job-' + k" @click="const room = bulkTarget; document.getElementById('bulk-sheet').close(); bulkRoom(room, k)" x-text="label"></button>
          </template>
        </div>
      </div>
    </div>
  </template>
</dialog>

<dialog class="ikpm-dialog k-photo-view" id="photo-view" aria-labelledby="pv-title" style="width: min(60rem, calc(100vw - 2rem))">
  <div class="ikpm-sheet-head"><h2 id="pv-title" x-text="bigPhoto ? bigPhoto.filename : 'Zdjęcie'"></h2><form method="dialog"><button class="btn-close" aria-label="Zamknij"></button></form></div>
  <img x-show="bigPhoto" :src="bigPhoto ? bigPhoto.src : ''" :alt="bigPhoto ? 'Zdjęcie: ' + bigPhoto.filename : ''">
</dialog>
</main>
<script type="module">
import { boot, db, save, nextId, go, toast, alertError, ask, idParam } from '../assets/app.js';

const TYPES = ['image/jpeg', 'image/png', 'image/webp'];
// Zmniejszenie zdjęcia przed zapisem (aplikacja: do 2000 px; prototyp: 1000 px, żeby zmieścić się w pamięci przeglądarki).
const shrink = (file) => createImageBitmap(file).then((bmp) => {
  const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
});
const priceRound = (x) => Math.max(1, Math.floor(x + 0.5 + 1e-9));

boot(() => ({
  // save / toast — także dla krótkich obsług w znacznikach (@change="…; save()").
  save, toast,
  r: null, filter: 'all', keep: new Set(), closed: {}, sheet: null, bulkTarget: null, bulk: { stage: '', status: '' }, expected: '', photoRoom: '', adding: false, bigPhoto: null,
  infoOpen: false, savedJob: null, savedTimer: null, undoToast: null,
  init() {
    const r = db.realizations.find((x) => x.id === idParam(1));
    if (!r) { location.replace(ik.href('screens/error-404.html')); return; }
    this.r = r; this.expected = ik.currentEnd(r) || '';
  },
  get statusList() { return Object.entries(ik.labels().realization_job_status); },
  get unfinished() { return ik.realJobs(this.r).filter((j) => j.status !== 'done').length; },
  get stages() { return [...new Set(ik.sortJobs(ik.realJobs(this.r)).map((j) => j.stage))]; },
  get infoSummary() {
    const r = this.r;
    const end = r.status === 'cancelled' ? null : (r.status === 'done' ? 'zakończono ' : 'przewidywany ') + ik.date(ik.endOn(r));
    return [ik.labels().settlement[r.settlement], end, 'koszt faktyczny ' + ik.pln(ik.realCost(r))].filter(Boolean).join(' · ');
  },
  get clientHref() { const c = ik.clientByName(this.r.client.name); return ik.href(`screens/client-show.html?id=${c ? c.id : ''}`); },
  get filters() {
    const jobs = ik.realJobs(this.r);
    return [
      { key: 'all', label: 'Wszystkie', icon: 'bi-list-check', count: jobs.length },
      { key: 'open', label: 'Tylko niezrobione', icon: 'bi-circle', count: jobs.filter((j) => j.status !== 'done').length },
      { key: 'remake', label: 'Do poprawy', icon: 'bi-exclamation-triangle', count: jobs.filter((j) => j.status === 'remake').length },
    ];
  },
  // Filtr ukrywa tylko prace (pokój z nagłówkiem, „Status wszystkich prac” i „Dodaj zdjęcia” zostaje). Praca zmieniona
  // przy włączonym filtrze zostaje widoczna do ponownego wyboru filtra — da się ją od razu poprawić albo cofnąć.
  visible(room) {
    const jobs = ik.sortJobs(room.jobs);
    const keep = (j) => this.keep.has(j.id);
    if (this.filter === 'open') return jobs.filter((j) => j.status !== 'done' || keep(j));
    if (this.filter === 'remake') return jobs.filter((j) => j.status === 'remake' || keep(j));
    return jobs;
  },
  setFilter(key) { this.filter = key; this.keep = new Set(); },
  remember(jobs) { if (this.filter !== 'all') { const next = new Set(this.keep); jobs.forEach((j) => next.add(j.id)); this.keep = next; } },
  doneIn(room) { return room.jobs.filter((j) => j.status === 'done').length; },
  remakeIn(room) { return room.jobs.filter((j) => j.status === 'remake').length; },
  sizeText(room) { return Object.values(ik.roomSizeParts(room)).join(' · '); },
  markSaved(j) { this.savedJob = j.id; clearTimeout(this.savedTimer); this.savedTimer = setTimeout(() => { this.savedJob = null; }, 3000); },
  photosIn(roomName) { return this.r.photos.filter((p) => (p.room || null) === roomName); },

  // Prace
  openJob(j, room) { this.sheet = { j, room }; this.$nextTick(() => { if (!document.getElementById('job-sheet').open) document.getElementById('job-sheet').showModal(); }); },
  setStatus(j, status) {
    if (!ik.realActive(this.r) || j.status === status) return;
    const before = j.status;
    this.remember([j]);
    ik.setJobStatus(j, status); save(); this.markSaved(j);
    const label = ik.labels().realization_job_status[status];
    const undo = () => { this.undoToast = null; ik.setJobStatus(j, before); save(); toast(`Przywrócono status „${ik.labels().realization_job_status[before]}”: ${j.name}.`); };
    this.undoToast = { el: toast(`Zapisano pracę „${j.name}”: ${label}.`, undo), jobId: j.id, label, undo };
  },
  // Komunikat po zapisie tekstu albo stawki. Zaraz po zmianie statusu tej samej pracy (komunikat z „Cofnij” jeszcze
  // widoczny) — jeden komunikat ze statusem i z „Cofnij” (cofa status; tekst zostaje), np. „Do poprawy” + powód.
  savedToast(j, what) {
    const u = this.undoToast;
    if (u && u.jobId === j.id && u.el.isConnected) { u.el = toast(`Zapisano pracę „${j.name}”: ${u.label}, ${what}.`, u.undo); return; }
    toast(`Zapisano pracę „${j.name}”.`);
  },
  setText(j, field, value) { j[field] = value.trim() || null; save(); this.markSaved(j); this.savedToast(j, field === 'notes' ? 'komentarz' : 'notatka wewnętrzna'); },
  // Zamknięcie okna (Gotowe, Esc, tło): niezapisany tekst i stawka zapisują się — WebKit nie wysyła change pola usuwanego
  // razem z oknem. Wartości czytane przed zamknięciem, zapis po usunięciu treści okna.
  closeSheet() {
    const j = this.sheet?.j;
    const val = (id) => document.getElementById(id)?.value;
    const rate = document.getElementById('js-rate');
    const typed = { notes: val('js-comment'), internal_notes: val('js-note'), rate: rate && !rate.validity.badInput ? rate.value : undefined };
    this.sheet = null;
    if (!j) return;
    this.$nextTick(() => {
      ['notes', 'internal_notes'].forEach((field) => { if (typed[field] !== undefined && (typed[field].trim() || null) !== (j[field] ?? null)) this.setText(j, field, typed[field]); });
      if (typed.rate !== undefined && typed.rate !== (j.actual_contractor_price === null ? '' : String(Number(j.actual_contractor_price)))) this.setRate(j, { value: typed.rate });
    });
  },
  setRate(j, el) {
    if (el.value === '') { j.actual_contractor_price = null; save(); this.savedToast(j, 'stawka faktyczna'); return; }
    const v = ik.parseNumber(el.value);
    if (Number.isNaN(v) || v <= 0 || v > 1000000) { el.value = j.actual_contractor_price === null ? '' : Number(j.actual_contractor_price); alertError('Stawka faktyczna musi być większa od 0'); return; }
    j.actual_contractor_price = String(ik.roundHalfUp(v)); save(); this.markSaved(j); this.savedToast(j, 'stawka faktyczna');
  },
  bulkApply(jobs, status) {
    let updated = 0; let skipped = 0;
    this.remember(jobs);
    jobs.forEach((j) => { if (status === 'done' && j.status === 'remake') { skipped += 1; return; } ik.setJobStatus(j, status); updated += 1; });
    save();
    toast(`Zaktualizowano ${ik.jobsAccusative(updated)}${skipped ? `, pominięto ${ik.jobsAccusative(skipped)} „Do poprawy” — sprawdź pojedynczo` : ''}.`);
  },
  openBulk(room) { this.bulkTarget = room; this.$nextTick(() => document.getElementById('bulk-sheet').showModal()); },
  bulkRoom(room, status) { if (status) this.bulkApply(room.jobs, status); },
  bulkStage() { this.bulkApply(ik.realJobs(this.r).filter((j) => j.stage === this.bulk.stage), this.bulk.status); this.bulk = { stage: '', status: '' }; },

  // Zdjęcia
  async addPhotos(input, roomName) {
    const files = [...(input.files || [])];
    if (!files.length) { alertError('Wybierz co najmniej jedno zdjęcie.'); return; }
    if (files.length > 20) { alertError('Wybierz najwyżej 20 zdjęć naraz.'); return; }
    const bad = files.find((f) => !TYPES.includes(f.type));
    if (bad) { alertError(`Nie dodano zdjęć — ${bad.name.slice(0, 100)}: Zdjęcie ma nieobsługiwany format (dozwolone: JPG, PNG, WebP).`); return; }
    const big = files.find((f) => f.size > 20 * 1024 * 1024);
    if (big) { alertError(`Nie dodano zdjęć — ${big.name.slice(0, 100)}: Zdjęcie jest za duże (maks. 20 MB).`); return; }
    this.adding = true;
    const added = [];
    for (const f of files) {
      try { added.push({ id: nextId('photo'), room: roomName || null, client_visible: false, filename: f.name, content_type: f.type, src: await shrink(f) }); } catch (e) {
        this.adding = false; alertError(`Nie dodano zdjęć — ${f.name.slice(0, 100)}: nie da się odczytać pliku jako zdjęcia.`); return;
      }
    }
    this.r.photos.push(...added); save(); this.adding = false; input.value = '';
    toast(`Dodano zdjęcia: ${added.length}.`);
    // Karta powstaje w x-init po przerysowaniu listy — przewinięcie dopiero, gdy jest w układzie strony.
    const target = `photo-${added[0].id}`;
    const reveal = (tries) => { const el = document.getElementById(target); if (el && el.offsetParent) { el.scrollIntoView({ block: 'center' }); el.querySelector('[role=switch]')?.focus({ preventScroll: true }); } else if (tries) setTimeout(() => reveal(tries - 1), 60); };
    this.$nextTick(() => requestAnimationFrame(() => setTimeout(() => reveal(20), 0)));
  },
  // Karta zdjęcia budowana w DOM (ten sam wzór w pokoju i w „Ogólne”).
  photoCard(p) {
    const el = document.createElement('article');
    el.className = 'ikpm-photo w-100'; el.id = `photo-${p.id}`;
    el.innerHTML = `${p.src ? '<button type="button" class="k-photo-open"><img class="ikpm-photo-thumb" alt=""></button>' : '<div class="ikpm-photo-thumb" role="img"><i class="bi bi-image" aria-hidden="true"></i></div>'}
      <div class="ikpm-photo-body"><p class="k-photo-name fname"></p>
      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="vis-${p.id}"><label class="form-check-label" for="vis-${p.id}">Widoczne dla klienta</label></div>
      <div><label class="form-label small mb-1" for="photo-room-${p.id}">Pokój</label><select class="form-select" id="photo-room-${p.id}"></select></div>
      <div><button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button></div></div>`;
    el.querySelector('.fname').textContent = p.filename;
    const img = el.querySelector('img');
    if (img) { img.src = p.src; el.querySelector('.k-photo-open').setAttribute('aria-label', `Pokaż zdjęcie: ${p.filename}`); el.querySelector('.k-photo-open').addEventListener('click', () => { this.bigPhoto = p; document.getElementById('photo-view').showModal(); }); }
    const ph = el.querySelector('div.ikpm-photo-thumb'); if (ph) { ph.setAttribute('aria-label', `Zdjęcie: ${p.filename}`); }
    const vis = el.querySelector('input'); vis.checked = p.client_visible;
    vis.addEventListener('change', () => { p.client_visible = vis.checked; save(); toast('Zapisano zdjęcie.'); });
    const sel = el.querySelector('select');
    [['', 'Ogólne (bez pokoju)'], ...this.r.rooms.map((x) => [x.name, x.name])].forEach(([v, t]) => { const o = new Option(t, v, false, (p.room || '') === v); sel.append(o); });
    sel.addEventListener('change', () => { p.room = sel.value || null; save(); toast('Zapisano zdjęcie.'); });
    const del = el.querySelector('.btn-outline-danger');
    del.setAttribute('aria-label', `Usuń zdjęcie ${p.filename}`);
    del.addEventListener('click', async () => {
      if (!(await ask({ title: 'Usuń zdjęcie', text: 'Usunąć zdjęcie?', points: [`„${p.filename}” zniknie z realizacji${p.client_visible ? ' i ze strony postępu prac klienta' : ''}.`, 'Tego nie da się cofnąć.'], ok: 'Usuń zdjęcie', okClass: 'danger' }))) return;
      this.r.photos.splice(this.r.photos.indexOf(p), 1); save(); toast('Zdjęcie usunięte.');
    });
    return el;
  },

  // Statusy realizacji
  async start() {
    if (!(await ask({ title: 'Rozpocznij', text: 'Rozpocząć realizację?', points: ['Status zmieni się na „W trakcie” — klient zobaczy go na stronie postępu prac (/r).'], ok: 'Rozpocznij' }))) return;
    this.r.status = 'in_progress'; save(); toast('Status realizacji zaktualizowany.');
  },
  async finish() {
    if (this.unfinished) { alertError(`Nie można zakończyć realizacji. ${ik.unfinished(this.unfinished)} — wszystkie prace muszą mieć status „Zrobione”.`); return; }
    if (!(await ask({ title: 'Zakończ', text: 'Zakończyć realizację?', points: ['Wszystkie prace mają status „Zrobione”.', 'Cennik nauczy się ze stawek faktycznych ekip z tej realizacji.', 'Statusy prac, stawki faktyczne, rozliczenie i przewidywany termin zostaną zablokowane (komentarz i notatka wewnętrzna — dalej do edycji).', 'Przychód trafi do raportów Finanse; zakończonej realizacji nie da się usunąć.'], ok: 'Zakończ', okClass: 'success' }))) return;
    const changed = this.learn();
    Object.assign(this.r, { status: 'done', completed_on: ik.todayISO() }); save();
    toast(`Status realizacji zaktualizowany.${changed.length ? ` Zaktualizowano cennik: ${ik.jobNames(changed)}.` : ''}`);
  },
  // Nauka cennika: nowa cena = (cena teraz + stawka faktyczna ważona ilością) / 2, pełne złote, najmniej 1 zł.
  learn() {
    const changed = [];
    const rated = ik.sortJobs(ik.realJobs(this.r)).filter((j) => j.actual_contractor_price !== null && j.actual_contractor_price !== undefined);
    const byJob = new Map(); rated.forEach((j) => { if (!byJob.has(j.job_id)) byJob.set(j.job_id, []); byJob.get(j.job_id).push(j); });
    const weighted = (list) => list.reduce((s, j) => s + Number(j.actual_contractor_price) * Number(j.quantity), 0) / list.reduce((s, j) => s + Number(j.quantity), 0);
    byJob.forEach((list, jobId) => {
      const cat = ik.catJobs().byId.get(jobId); if (!cat) return;
      const avgBefore = ik.num(cat.job.average_price); let touched = false;
      const avgNext = avgBefore === null ? priceRound(weighted(list)) : priceRound((avgBefore + weighted(list)) / 2);
      const crews = new Map(); list.forEach((j) => { if (j.contractor) { if (!crews.has(j.contractor)) crews.set(j.contractor, []); crews.get(j.contractor).push(j); } });
      crews.forEach((cl, name) => {
        const crew = cat.job.crews.find((c) => c.contractor === name); if (!crew) return;
        const own = ik.num(crew.price); const now = own ?? avgBefore; const next = now === null ? priceRound(weighted(cl)) : priceRound((now + weighted(cl)) / 2);
        // Ekipa bez własnej ceny zostaje przy średniej, gdy nauczona cena równa się nowej średniej (jak w aplikacji).
        if (next !== now && !(own === null && next === avgNext)) { crew.price = String(next); touched = true; }
      });
      if (avgNext !== avgBefore) { cat.job.average_price = String(avgNext); touched = true; }
      if (touched) changed.push(cat.job.name);
    });
    return changed;
  },
  async cancel() {
    if (!(await ask({ title: 'Anuluj', text: 'Anulować realizację?', points: ['Statusy prac i stawki faktyczne zostaną zablokowane.', 'Realizacja zniknie z raportów Finanse.', 'Strona oferty (/q) przestanie linkować do postępu prac (/r).'], ok: 'Anuluj realizację', okClass: 'danger' }))) return;
    this.r.status = 'cancelled'; save(); toast('Status realizacji zaktualizowany.');
  },
  async sendLink() {
    if (!this.r.client.email) { alertError('Klient nie ma adresu email — dodaj go w danych klienta.'); return; }
    const until = ik.addDays(ik.todayISO(), 30);
    if (!(await ask({ title: 'Wyślij link', text: 'Wysłać klientowi link z postępem?', points: [`Klient dostanie e-mail (${this.r.client.email}) z linkiem do strony postępu prac.`, `Link będzie ważny jeszcze 30 dni — do ${ik.date(until)}.`], ok: 'Wyślij link' }))) return;
    this.r.link_valid_until = until; save(); toast('Link z postępem wysłany klientowi.');
  },
  async destroy() {
    if (!(await ask({ title: 'Usuń', text: 'Usunąć realizację wraz z pokojami, pracami i zdjęciami?', points: ['Klient straci stronę postępu prac.', 'Tego nie da się cofnąć.'], ok: 'Usuń realizację', okClass: 'danger' }))) return;
    db.realizations.splice(db.realizations.indexOf(this.r), 1); save();
    go('screens/realizations-index.html', 'Realizacja usunięta.');
  },
  saveExpected() { this.r.expected_end_on = this.expected || null; save(); toast('Realizacja zaktualizowana.'); },
}));
</script>
</body>
