<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nowa wycena — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="quotes">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/quotes-index.html')">Wyceny</a>
    <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Nowa wycena</h1></div>
  </div>
  <form class="k-form d-grid gap-4" @submit.prevent="create()" aria-label="Nowa wycena">
    <div class="ikpm-grid k-fields">
      <div><label class="form-label" for="client">Klient (opcjonalnie)</label>
        <select id="client" class="form-select" x-model="client" aria-describedby="client-hint">
          <option value="">-- wybierz później --</option>
          <template x-for="c in db.clients" :key="c.id"><option :value="c.name" x-text="c.name"></option></template>
        </select>
        <p id="client-hint" class="form-text mb-0">Możesz przypisać klienta później</p></div>
      <div><label class="form-label" for="notes">Notatki</label>
        <textarea id="notes" class="form-control" rows="2" placeholder="Dodatkowe informacje o wycenie..." x-model="notes"></textarea></div>
    </div>
    <fieldset>
      <legend class="form-label">Tryb</legend>
      <div class="ikpm-grid" style="--ikpm-grid-min: 18rem">
        <label class="ikpm-choice"><input type="radio" name="mode" value="rooms" x-model="mode"><i class="bi bi-plus-square" aria-hidden="true"></i>
          <span><strong class="d-block">Tryb z pokojami</strong><span class="ikpm-meta">Po utworzeniu wyceny zostaniesz przeniesiony do edytora, gdzie możesz dodawać pokoje i prace.</span></span></label>
        <label class="ikpm-choice"><input type="radio" name="mode" value="simple" x-model="mode"><i class="bi bi-plus-lg" aria-hidden="true"></i>
          <span><strong class="d-block">Tryb prosty</strong><span class="ikpm-meta">Wycena bez podziału na pokoje. Wszystkie prace będą przypisane do jednego "wirtualnego" pokoju.</span></span></label>
      </div>
    </fieldset>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary btn-lg"><i class="bi bi-check-lg" aria-hidden="true"></i>Utwórz wycenę</button>
      <a class="btn btn-outline-secondary btn-lg" :href="ik.href('screens/quotes-index.html')">Anuluj</a>
    </div>
  </form>
</main>
<script type="module">
import { boot, db, save, nextId, go, param } from '../assets/app.js';

boot(() => ({
  client: '', notes: '', mode: param('mode') === 'simple' ? 'simple' : 'rooms',
  create() {
    const c = db.clients.find((x) => x.name === this.client);
    const id = nextId('quote');
    const room = this.mode === 'rooms'
      ? { name: 'Pokój 1', length: null, width: null, height: 0, holes_area: null }
      : { name: 'Cały obiekt', length: 0, width: 0, height: 0, holes_area: null };
    db.quotes.push({ id, notes: this.notes.trim() || null, status: 'draft', client: c ? { name: c.name, email: c.email, phone: c.phone } : null, user: db.users[0].display_name,
      markup_percent: '20.0', vat_rate: '8.0', site_address: null, planned_start_on: null, planned_end_on: null, suggested_work_days: null, applied_profile_name: null,
      client_general_comment: null, sent_at: null, responded_at: null,
      rooms: [{ id: nextId('room'), notes: null, client_comment: null, floor_area_override: null, ceiling_area_override: null, wall_area_override: null, perimeter_override: null, jobs: [], ...room }] });
    save();
    go(`screens/builder.html?id=${id}`, 'Wycena utworzona. Możesz teraz dodawać pokoje i prace.');
  },
}));
</script>
</body>
</html>
