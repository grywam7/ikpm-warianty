<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowa wycena — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="quotes">
<div id="nav"></div>
<main x-data="page" x-cloak class="container px-3 pb-5" style="max-width: 760px">
  <form class="card my-3" @submit.prevent="create()" aria-labelledby="new-title">
    <div class="card-body">
      <h1 id="new-title" class="h3">Nowa wycena</h1>
      <label class="form-label fw-semibold mt-2" for="client">Klient (opcjonalnie)</label>
      <select id="client" class="form-select" x-model="client" aria-describedby="client-hint">
        <option value="">-- wybierz później --</option>
        <template x-for="c in db.clients" :key="c.id"><option :value="c.name" x-text="c.name"></option></template>
      </select>
      <p id="client-hint" class="small text-body-secondary">Możesz przypisać klienta później</p>
      <label class="form-label fw-semibold" for="notes">Notatki</label>
      <textarea id="notes" class="form-control" rows="3" placeholder="Dodatkowe informacje o wycenie..." x-model="notes"></textarea>

      <fieldset class="mt-3">
        <legend class="form-label fw-semibold fs-6">Tryb</legend>
        <div class="row g-2">
          <div class="col-md-6"><label class="card h-100 p-3" :class="mode === 'rooms' ? 'border-primary border-2' : ''">
            <span class="form-check mb-1"><input class="form-check-input" type="radio" name="mode" value="rooms" x-model="mode"> <strong>Tryb z pokojami</strong></span>
            <span class="small text-body-secondary">Po utworzeniu wyceny zostaniesz przeniesiony do edytora, gdzie możesz dodawać pokoje i prace.</span></label></div>
          <div class="col-md-6"><label class="card h-100 p-3" :class="mode === 'simple' ? 'border-primary border-2' : ''">
            <span class="form-check mb-1"><input class="form-check-input" type="radio" name="mode" value="simple" x-model="mode"> <strong>Tryb prosty</strong></span>
            <span class="small text-body-secondary">Wycena bez podziału na pokoje. Wszystkie prace będą przypisane do jednego "wirtualnego" pokoju.</span></label></div>
        </div>
      </fieldset>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a class="btn btn-outline-secondary btn-main" :href="ik.href('screens/quotes-index.html')">Anuluj</a>
        <button class="btn btn-success btn-main"><i class="bi bi-check-lg" aria-hidden="true"></i> Utwórz wycenę</button>
      </div>
    </div>
  </form>
</main>
<script type="module">
import { boot, db, save, nextId, go, param } from '../assets/app.js';

boot(() => ({
  client: '', notes: '', mode: param('mode') === 'simple' ? 'simple' : 'rooms',
  create() {
    const c = db.clients.find((x) => x.name === this.client);
    const id = nextId('quote');
    const room = this.mode === 'rooms'
      ? { name: 'Pokój 1', length: null, width: null, height: 0, holes_area: null }
      : { name: 'Cały obiekt', length: 0, width: 0, height: 0, holes_area: null };
    db.quotes.push({ id, notes: this.notes.trim() || null, status: 'draft', client: c ? { name: c.name, email: c.email, phone: c.phone } : null, user: db.users[0].display_name,
      markup_percent: '20.0', vat_rate: '8.0', site_address: null, planned_start_on: null, planned_end_on: null, suggested_work_days: null, applied_profile_name: null,
      client_general_comment: null, sent_at: null, responded_at: null,
      rooms: [{ id: nextId('room'), notes: null, client_comment: null, floor_area_override: null, ceiling_area_override: null, wall_area_override: null, perimeter_override: null, jobs: [], ...room }] });
    save();
    go(`screens/builder.html?id=${id}`, 'Wycena utworzona. Możesz teraz dodawać pokoje i prace.');
  },
}));
</script>
</body>
</html>
