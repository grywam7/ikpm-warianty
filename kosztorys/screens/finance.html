<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanse — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="finance">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div class="ikpm-page-head"><div class="ikpm-page-heading"><h1 class="ikpm-page-title">Finanse</h1></div></div>
  <div class="alert alert-info d-flex gap-2 ikpm-measure"><i class="bi bi-info-circle-fill" aria-hidden="true"></i><span>Raporty księgowości zostają w badaniu w obecnym wyglądzie — ta strona to tylko pozycja menu. Układ raportów powstanie po wyborze wariantu.</span></div>
  <ul class="ikpm-list">
    <template x-for="r in reports" :key="r[0]">
      <li class="ikpm-row"><i class="bi bi-graph-up ikpm-muted" aria-hidden="true"></i><span class="ikpm-row-main"><span class="ikpm-row-title" x-text="r[0]"></span><span class="ikpm-row-meta" x-text="r[1]"></span></span></li>
    </template>
  </ul>
</main>
<script type="module">
import { boot } from '../assets/app.js';
boot(() => ({
  reports: [
    ['Wynik', 'Wynik finansowy: Przychód, Ekipy, Materiały, Marża — per realizacja; Od, Do, Pokaż, CSV.'],
    ['Koszty', 'Koszty — ekipy vs materiały, per miesiąc (ostatnie 12 miesięcy).'],
    ['Realizacje', 'Realizacje: Wartość, Wykonane, Postęp (wg wartości), Pozostało, Koszt, Marża planowana.'],
    ['Oferty', 'Oferty wg statusu: Liczba, Wartość, Koszt, Marża.'],
    ['Wykonawcy', 'Wykonawcy: Wykonane w okresie, Do wykonania (stan na dziś).'],
  ],
}));
</script>
</body>
</html>
