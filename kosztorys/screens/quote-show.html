<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podgląd wyceny — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="quotes">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
<template x-if="q">
<div>
  <div id="alerts"></div>
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/quotes-index.html')">Wróć do listy</a>
    <div class="ikpm-page-heading">
      <h1 class="ikpm-page-title">Wycena #<span x-text="q.id"></span></h1>
      <div class="ikpm-page-meta"><span x-html="ik.quoteBadge(q.status, true)"></span><span x-text="q.client ? q.client.name : '(nie przypisano)'"></span><span>Razem netto <strong class="ikpm-num" x-text="ik.pln(totals.net)"></strong></span><span x-show="q.status !== 'draft' && !realization"><i class="bi bi-lock" aria-hidden="true"></i> Oferta u klienta — tylko do odczytu. Zmiany po „Przywróć do edycji”.</span></div>
    </div>
    <div class="ikpm-page-actions">
      <template x-if="q.status !== 'draft' && !realization"><button type="button" class="btn btn-primary btn-lg" @click="reopen()"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>Przywróć do edycji</button></template>
      <template x-if="q.status === 'accepted' && !realization"><button type="button" class="btn btn-success btn-lg" @click="convert()"><i class="bi bi-cone-striped" aria-hidden="true"></i>Przekształć w realizację</button></template>
      <template x-if="q.status === 'draft'"><a class="btn btn-primary btn-lg" :href="ik.href('screens/builder.html?id=' + q.id)"><i class="bi bi-pencil" aria-hidden="true"></i>Edytuj</a></template>
      <template x-if="q.status === 'draft'"><a class="btn btn-outline-primary" :href="ik.href('screens/match-contractors.html?id=' + q.id)"><i class="bi bi-people" aria-hidden="true"></i>Dobierz wykonawców</a></template>
      <template x-if="realization"><a class="btn btn-outline-primary" :href="ik.href('screens/realization-show.html?id=' + realization.id)"><i class="bi bi-cone-striped" aria-hidden="true"></i>Realizacja</a></template>
      <a class="btn btn-outline-secondary" :href="ik.href('screens/quote-pdf.html?id=' + q.id)" target="_blank" rel="noopener"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>PDF</a>
      <button type="button" class="btn btn-outline-secondary" @click="copy()"><i class="bi bi-copy" aria-hidden="true"></i>Kopiuj</button>
    </div>
  </div>

  <div class="ikpm-split ikpm-split-3">
    <nav class="ikpm-pane ikpm-pane-list k-toc" aria-labelledby="toc-title">
      <h2 id="toc-title" class="k-toc-title">Spis pokoi</h2>
      <ul class="ikpm-list">
        <template x-for="r in q.rooms" :key="r.id">
          <li><a class="ikpm-row" :href="'#room-' + r.id">
            <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="r.name"></span><span class="ikpm-row-meta"><span x-text="ik.jobsCount(r.jobs.length) + ' · '"></span><span class="ikpm-num" x-text="ik.pln(ik.roomTotal(r, q.markup_percent))"></span></span>
              <span class="ikpm-chip ikpm-tone-warning mt-1" x-show="r.client_comment"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Komentarz klienta</span></span></a></li>
        </template>
        <li><a class="ikpm-row" href="#summary"><span class="ikpm-row-main"><span class="ikpm-row-title">Podsumowanie</span></span></a></li>
      </ul>
    </nav>

    <div class="ikpm-pane">
      <section class="card mb-4" aria-labelledby="info-title">
        <div class="card-body">
          <h2 id="info-title" class="visually-hidden">Dane wyceny</h2>
          <dl class="ikpm-dl">
            <dt>Klient</dt>
            <dd><template x-if="q.client"><span><a :href="clientHref" x-text="q.client.name"></a><span class="d-block ikpm-meta" x-text="[q.client.email, q.client.phone].filter(Boolean).join(' · ')"></span></span></template><template x-if="!q.client"><span>(nie przypisano)</span></template></dd>
            <dt>Status</dt><dd x-html="ik.quoteBadge(q.status)"></dd>
            <template x-if="q.site_address"><dt>Adres inwestycji</dt></template><template x-if="q.site_address"><dd x-text="q.site_address"></dd></template>
            <template x-if="q.planned_start_on"><dt>Planowany start</dt></template><template x-if="q.planned_start_on"><dd x-text="ik.date(q.planned_start_on)"></dd></template>
            <template x-if="q.planned_end_on"><dt>Termin zakończenia</dt></template><template x-if="q.planned_end_on"><dd x-text="ik.date(q.planned_end_on)"></dd></template>
            <template x-if="q.sent_at"><dt>Wysłana</dt></template><template x-if="q.sent_at"><dd x-text="ik.date(q.sent_at)"></dd></template>
            <template x-if="q.responded_at"><dt>Odpowiedź</dt></template><template x-if="q.responded_at"><dd x-text="ik.date(q.responded_at)"></dd></template>
          </dl>
        </div>
      </section>

      <template x-if="ik.clientComments(q)">
        <section class="alert alert-warning" aria-labelledby="cc-title">
          <h2 id="cc-title" class="h3 d-flex align-items-center gap-2"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Uwagi klienta</h2>
          <p class="mb-2 text-pre" x-text="q.client_general_comment || '(brak komentarza ogólnego — sprawdź komentarze przy pokojach)'"></p>
          <ul class="mb-0"><template x-for="r in q.rooms.filter(x => x.client_comment)" :key="r.id"><li><a class="alert-link" :href="'#room-' + r.id" x-text="r.name"></a>: <span x-text="r.client_comment"></span></li></template></ul>
        </section>
      </template>

      <nav class="k-chips" aria-label="Pokoje wyceny">
        <template x-for="r in q.rooms" :key="r.id">
          <a class="btn btn-outline-secondary" :href="'#room-' + r.id"><span x-text="r.name"></span><i class="bi bi-chat-left-text-fill" style="color: var(--ikpm-warning-ic)" x-show="r.client_comment" aria-hidden="true"></i><span class="visually-hidden" x-show="r.client_comment"> (Komentarz klienta)</span></a>
        </template>
      </nav>
      <p class="ikpm-meta ikpm-measure"><i class="bi bi-eye" aria-hidden="true"></i> Klient zobaczy w ofercie (strona oferty i PDF): pokoje, prace, ilości, ceny dla klienta („Cena/j.” i „Wartość”), sumy i terminy. <i class="bi bi-lock" aria-hidden="true"></i> Tylko firma: wykonawcy, notatki, koszt, narzut i marża.</p>
      <template x-for="room in q.rooms" :key="room.id">
        <section class="doc-room card" :id="'room-' + room.id" :aria-labelledby="'rt-' + room.id">
          <div class="doc-room-head ikpm-sticky-head">
            <div class="doc-room-name"><h2 class="doc-room-title" :id="'rt-' + room.id" x-text="room.name"></h2><p class="ikpm-meta mb-0" x-show="sizeOf(room)" x-text="sizeOf(room)"></p></div>
            <div class="text-end lh-sm"><span class="ikpm-meta d-block">Suma pokoju:</span><span class="ikpm-amount" x-text="ik.pln(ik.roomTotal(room, q.markup_percent))"></span></div>
            <button type="button" class="btn btn-outline-secondary" @click="openTplSave(room)"><i class="bi bi-bookmark-plus" aria-hidden="true"></i>Zapisz jako szablon</button>
          </div>
          <div class="px-3 pt-3" x-show="room.client_comment"><div class="alert alert-warning d-flex gap-2 mb-0"><i class="bi bi-chat-left-text" aria-hidden="true"></i><span><strong>Komentarz klienta:</strong> <span x-text="room.client_comment"></span></span></div></div>
          <p class="px-3 pt-3 mb-0" x-show="room.notes"><strong>Notatka:</strong> <span x-text="room.notes"></span></p>
          <div class="ikpm-table-box mt-3">
            <table class="table ikpm-stack">
              <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
              <thead><tr><th scope="col">Praca</th><th scope="col" class="ikpm-num">Ilość</th><th scope="col" class="ikpm-num">Cena/j.</th><th scope="col" class="ikpm-num">Wartość</th></tr></thead>
              <tbody>
                <template x-for="j in ik.sortJobs(room.jobs)" :key="j.id">
                  <tr :id="'job-' + j.id"><td class="ikpm-cell-lead"><span class="ikpm-meta fw-normal" x-text="j.stage + ' › '"></span><span x-text="j.name"></span><span class="d-block ikpm-meta fw-normal" x-text="j.contractor ? 'Wykonawca: ' + j.contractor : 'bez wykonawcy'"></span></td>
                    <td data-label="Ilość" class="ikpm-num" x-text="ik.dec(j.quantity) + ' ' + j.unit"></td>
                    <td data-label="Cena/j." class="ikpm-num" x-text="ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></td>
                    <td data-label="Wartość" class="ikpm-num fw-semibold" x-text="ik.pln(ik.lineTotal(j, q.markup_percent))"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>
      </template>
    </div>

    <aside class="ikpm-pane ikpm-pane-aside k-aside" id="summary" aria-labelledby="sum-title">
      <section class="card">
        <div class="card-body">
          <h2 id="sum-title" class="k-card-title mb-3">Podsumowanie</h2>
          <dl class="ikpm-dl ikpm-dl-num mb-3">
            <dt>Pokoje:</dt><dd x-text="q.rooms.length"></dd>
            <dt>Prace:</dt><dd x-text="ik.jobsOf(q).length"></dd>
            <dt>Koszt (ekipy + materiały):</dt><dd x-text="ik.pln(ik.quoteCost(q))"></dd>
            <dt>Narzut:</dt><dd x-text="ik.dec(q.markup_percent) + ' %'"></dd>
            <dt>Marża:</dt><dd x-text="ik.pln(totals.net - ik.quoteCost(q))"></dd>
          </dl>
          <dl class="ikpm-totals" data-quote-totals>
            <div><dt>Razem netto</dt><dd id="total-net" x-text="ik.pln(totals.net)"></dd></div>
            <div><dt x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd x-text="ik.pln(totals.vat)"></dd></div>
            <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="ik.pln(totals.gross)"></dd></div>
          </dl>
        </div>
      </section>
      <template x-if="q.notes"><section class="card"><div class="card-body"><h2 class="k-card-title mb-2">Notatki</h2><p class="text-pre mb-0" x-text="q.notes"></p></div></section></template>
    </aside>
  </div>
</div>
</template>

<dialog class="ikpm-dialog ikpm-sheet" id="tpl-sheet" aria-labelledby="tpl-sheet-title">
  <div class="ikpm-sheet-head"><h2 id="tpl-sheet-title">Zapisz jako szablon</h2><form method="dialog"><button class="btn-close" aria-label="Zamknij"></button></form></div>
  <form @submit.prevent="saveTemplate()" novalidate>
    <div class="ikpm-dialog-body d-grid gap-2">
      <div class="alert alert-danger mb-0" role="alert" x-show="tplError" x-text="tplError"></div>
      <label class="form-label mb-0" for="tpl-name">Nazwa szablonu</label>
      <input id="tpl-name" class="form-control" maxlength="100" x-model="tplName" aria-describedby="tpl-hint">
      <p id="tpl-hint" class="form-text mb-0">Nowy szablon z wymiarami i pracami pokoju (ilości tylko prac ręcznych).</p>
    </div>
    <div class="ikpm-dialog-actions"><button type="button" class="btn btn-outline-secondary btn-lg" @click="document.getElementById('tpl-sheet').close()">Wróć</button><button class="btn btn-primary btn-lg">Zapisz szablon</button></div>
  </form>
</dialog>
</main>
<script type="module">
import { boot, db, save, nextId, go, toast, ask, idParam } from '../assets/app.js';

boot(() => ({
  q: null, tplRoom: null, tplName: '', tplError: '',
  init() {
    const q = db.quotes.find((x) => x.id === idParam(2));
    if (!q) { location.replace(ik.href('screens/error-404.html')); return; }
    this.q = q;
  },
  get totals() { return ik.quoteTotals(this.q); },
  sizeOf(room) { const p = ik.roomSizeParts(room); return p.dimensions || Object.values(p)[0] || ''; },
  get realization() { return ik.realizationOf(this.q); },
  get clientHref() { const c = ik.clientByName(this.q.client.name); return ik.href(`screens/client-show.html?id=${c ? c.id : ''}`); },
  async reopen() {
    const q = this.q;
    const ok = await ask({
      title: 'Przywróć do edycji',
      text: `Przywrócić wycenę do edycji? Link klienta przestanie pokazywać ofertę do ponownej wysyłki.${q.status === 'accepted' ? ' Akceptacja klienta zostanie anulowana.' : ''}`,
      points: ['Wycena wróci do statusu „Szkic” — pokoje, prace, dobór i terminy znów będzie można zmieniać.', 'Klient pod swoim linkiem zobaczy „Oferta jest aktualizowana” do ponownej wysyłki.', 'Uwagi klienta zostają w wycenie; przy ponownej wysyłce trafią do notatek.'],
      ok: 'Przywróć do edycji',
    });
    if (!ok) return;
    Object.assign(q, { status: 'draft', sent_at: null, responded_at: null });
    save();
    go(`screens/builder.html?id=${q.id}`, 'Wycena przywrócona do edycji — link klienta pokaże ją dopiero po ponownej wysyłce.');
  },
  async convert() {
    const q = this.q;
    const ok = await ask({
      title: 'Przekształć w realizację', text: 'Przekształcić tę wycenę w realizację?',
      points: ['Pokoje i prace zostaną skopiowane do realizacji z zamrożonymi cenami — zmiany cennika ich nie zmienią.', 'Ruszy link postępu prac dla klienta (/r) — ważny 30 dni.', 'Tej wyceny nie będzie już można przywrócić do edycji.'],
      ok: 'Przekształć w realizację', okClass: 'success',
    });
    if (!ok) return;
    const id = nextId('real');
    const rooms = q.rooms.map((room) => ({ ...JSON.parse(JSON.stringify(room)), id: nextId('room'), client_comment: null,
      jobs: room.jobs.map((j) => ({ ...j, id: nextId('job'), contractor_price: String(ik.laborUnitCost(j)), client_unit_price: String(ik.clientUnitPrice(j, q.markup_percent)), total_price: String(ik.lineTotal(j, q.markup_percent)), status: 'to_do', status_label: 'Do zrobienia', notes: null, internal_notes: null, actual_contractor_price: null })) }));
    db.realizations.unshift({ id, quote_id: q.id, status: 'planned', settlement: 'on_completion', client: { ...q.client }, markup_percent: q.markup_percent, site_address: q.site_address,
      planned_start_on: q.planned_start_on, promised_end_on: q.planned_end_on, expected_end_on: q.planned_end_on, total_price: String(this.totals.net), estimated_cost: String(ik.quoteCost(q)),
      link_valid_until: ik.addDays(ik.todayISO(), 30), rooms, photos: [] });
    save();
    go(`screens/realization-show.html?id=${id}`, 'Utworzono realizację z wyceny.');
  },
  copy() {
    const q = this.q; const id = nextId('quote');
    const rooms = q.rooms.map((room) => ({ ...JSON.parse(JSON.stringify(room)), id: nextId('room'), client_comment: null,
      jobs: room.jobs.map((j) => { const cat = ik.catJobs().byId.get(j.job_id); return { ...j, id: nextId('job'), contractor: null, contractor_price: null, matched_quantity: null, effective_material_unit_cost: cat ? cat.job.material_unit_cost : j.effective_material_unit_cost, average_price: cat ? cat.job.average_price : j.average_price }; }) }));
    db.quotes.unshift({ id, notes: null, status: 'draft', client: q.client ? { ...q.client } : null, user: db.users[0].display_name, markup_percent: q.markup_percent, vat_rate: q.vat_rate,
      site_address: null, planned_start_on: null, planned_end_on: null, suggested_work_days: null, applied_profile_name: null, client_general_comment: null, sent_at: null, responded_at: null, rooms });
    save();
    go(`screens/builder.html?id=${id}`, `Utworzono kopię wyceny #${q.id}. Ceny są z aktualnego cennika — dobierz wykonawców i uzupełnij termin oferty.`);
  },
  openTplSave(room) { this.tplRoom = room; this.tplName = room.name; this.tplError = ''; document.getElementById('tpl-sheet').showModal(); },
  saveTemplate() {
    const room = this.tplRoom; const name = this.tplName.replace(/\s+/g, ' ').trim() || room.name;
    if (db.templates.some((t) => t.name.toLowerCase() === name.toLowerCase())) { this.tplError = 'Nie można zapisać szablonu: Szablon o tej nazwie już istnieje — zmień nazwę.'; return; }
    db.templates.push({ id: nextId('template'), name, description: '', order: db.templates.length + 1, length: room.length, width: room.width, height: room.height, holes_area: room.holes_area,
      jobs: ik.sortJobs(room.jobs).map((j, i) => ({ job_id: j.job_id, name: j.name, unit: j.unit, area_type: j.area_type, area_type_label: j.area_type_label, quantity: j.area_type === 'manual' ? String(j.quantity) : null, order: i + 1 })) });
    save(); document.getElementById('tpl-sheet').close(); toast(`Szablon '${name}' został utworzony.`);
  },
}));
</script>
</body>
</html>
