<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oferta — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="bg-dark text-white py-3"><div class="container px-3" style="max-width: 980px"><span class="fw-bold">IKPM</span></div></header>
<main x-data="page" x-cloak class="container px-3 py-3" style="max-width: 980px">
<template x-if="q">
<div>
  <div id="alerts"></div>
  <template x-if="q.status === 'draft'">
    <div class="card text-center my-4"><div class="card-body p-4">
      <i class="bi bi-hourglass-split display-5 text-secondary" aria-hidden="true"></i>
      <h1 class="h3 mt-2">Oferta jest aktualizowana</h1>
      <p class="mb-0">Otrzymają Państwo nową wiadomość, gdy będzie gotowa.</p>
    </div></div>
  </template>
  <template x-if="q.status !== 'draft'">
    <div>
      <section class="card mb-3" aria-labelledby="o-title">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <div><h1 id="o-title" class="h3 mb-0">Wycena #<span x-text="q.id"></span></h1><p class="small text-body-secondary mb-0" x-text="'Wysłana: ' + ik.dateTime(q.sent_at)"></p></div>
            <div class="text-md-end small"><strong x-text="sender.display_name"></strong><span class="d-block" x-show="sender.first_name" x-text="sender.email"></span></div>
          </div>
          <dl class="row mt-3 mb-0">
            <dt class="col-sm-4 col-md-3">Klient</dt><dd class="col-sm-8 col-md-9" x-text="q.client ? [q.client.name, q.client.email].filter(Boolean).join(' · ') : ''"></dd>
            <dt class="col-sm-4 col-md-3">Status</dt><dd class="col-sm-8 col-md-9"><span class="badge" :class="'text-bg-' + statusColor"><i class="bi" :class="statusIcon" aria-hidden="true"></i> <span x-text="ik.labels().quote_client_status[q.status]"></span></span></dd>
            <template x-if="q.site_address"><dt class="col-sm-4 col-md-3">Adres inwestycji</dt></template><template x-if="q.site_address"><dd class="col-sm-8 col-md-9" x-text="q.site_address"></dd></template>
            <template x-if="q.planned_start_on"><dt class="col-sm-4 col-md-3">Planowany start</dt></template><template x-if="q.planned_start_on"><dd class="col-sm-8 col-md-9" x-text="ik.date(q.planned_start_on)"></dd></template>
            <template x-if="q.planned_end_on"><dt class="col-sm-4 col-md-3">Termin zakończenia</dt></template><template x-if="q.planned_end_on"><dd class="col-sm-8 col-md-9" x-text="ik.date(q.planned_end_on)"></dd></template>
          </dl>
          <template x-if="trackable"><p class="alert alert-success mt-3 mb-0"><span x-text="trackable.status === 'done' ? 'Prace z tej wyceny zostały zakończone —' : 'Prace z tej wyceny są w realizacji —'"></span> <a class="tap alert-link" :href="ik.href('screens/public-realization.html?id=' + trackable.id)">Śledź postęp prac</a></p></template>
          <template x-if="!respondable && q.responded_at"><p class="alert alert-secondary mt-3 mb-0" x-text="'Wycena ma już zapisaną odpowiedź z dnia ' + ik.date(q.responded_at) + '. Dziękujemy.'"></p></template>
        </div>
      </section>

      <template x-for="room in q.rooms" :key="room.id">
        <section class="doc-room card mb-3" :aria-labelledby="'pr-' + room.id">
          <div class="doc-room-head card-header bg-body"><h2 class="h5 mb-0"><span :id="'pr-' + room.id" x-text="room.name"></span> <small class="d-block fw-normal text-body-secondary" x-text="ik.roomSizeParts(room).dimensions || Object.values(ik.roomSizeParts(room))[0] || ''"></small></h2></div>
          <p class="card-body mb-0 text-body-secondary" x-show="!room.jobs.length">(brak prac w tym pokoju)</p>
          <table class="table doc-table reflow mb-0" x-show="room.jobs.length">
            <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
            <thead class="table-light"><tr><th scope="col">Praca</th><th scope="col">Etap</th><th scope="col" class="text-end">Ilość</th><th scope="col" class="text-end">Cena jedn. netto</th><th scope="col" class="text-end">Wartość netto</th></tr></thead>
            <tbody><template x-for="j in ik.sortJobs(room.jobs)" :key="j.id"><tr>
              <td data-label="Praca" class="reflow-full" x-text="j.name"></td><td data-label="Etap" x-text="j.stage"></td>
              <td data-label="Ilość" class="num" x-text="ik.dec(j.quantity) + ' ' + j.unit"></td>
              <td data-label="Cena jedn. netto" class="num" x-text="ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></td>
              <td data-label="Wartość netto" class="num fw-semibold" x-text="ik.pln(ik.lineTotal(j, q.markup_percent))"></td></tr></template></tbody>
          </table>
          <div class="card-body border-top">
            <template x-if="respondable"><div><label class="form-label fw-semibold" :for="'rc-' + room.id">Komentarz do pokoju</label><textarea class="form-control" rows="2" maxlength="5000" placeholder="Opcjonalnie..." :id="'rc-' + room.id" x-model="comments[room.id]"></textarea></div></template>
            <template x-if="!respondable"><p class="mb-0 small"><strong>Komentarz do pokoju:</strong> <span x-text="room.client_comment || '—'"></span></p></template>
          </div>
        </section>
      </template>

      <section class="card mb-3"><div class="card-body">
        <template x-if="respondable"><div><label id="gc-title" class="form-label fw-semibold" for="gc">Komentarz ogólny</label><textarea id="gc" class="form-control" rows="3" maxlength="5000" placeholder="Uwagi do całej wyceny..." x-model="general"></textarea></div></template>
        <template x-if="!respondable"><p id="gc-title" class="mb-0"><strong>Komentarz ogólny:</strong> <span x-text="q.client_general_comment || '—'"></span></p></template>
      </div></section>

      <section class="card mb-3" aria-labelledby="sum-title"><div class="card-body">
        <h2 id="sum-title" class="h5">Podsumowanie</h2>
        <dl class="row mb-0" data-quote-totals>
          <dt class="col-7">Razem netto</dt><dd class="col-5 text-end num" x-text="ik.pln(totals.net)"></dd>
          <dt class="col-7 fw-normal" x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd class="col-5 text-end num" x-text="ik.pln(totals.vat)"></dd>
          <dt class="col-7">Razem brutto</dt><dd class="col-5 text-end num fw-bold fs-5" x-text="ik.pln(totals.gross)"></dd>
        </dl>
      </div></section>

      <template x-if="respondable">
        <div class="d-flex flex-wrap gap-2 justify-content-end mb-4">
          <button type="button" class="btn btn-outline-warning text-dark btn-main" @click="answer('changes_requested')"><i class="bi bi-chat-left-text" aria-hidden="true"></i> Oczekuję zmiany</button>
          <button type="button" class="btn btn-success btn-main" @click="answer('accepted')"><i class="bi bi-check-lg" aria-hidden="true"></i> Akceptuję wycenę</button>
        </div>
      </template>
    </div>
  </template>
</div>
</template>
</main>
<footer class="text-center small text-body-secondary py-3">Wygenerowane przez system IKPM.</footer>
<script type="module">
import { boot, db, save, toast, alertError, ask, idParam } from '../assets/app.js';

const COLORS = { sent: ['info', 'bi-send'], changes_requested: ['warning', 'bi-chat-left-text'], accepted: ['success', 'bi-check-circle'], rejected: ['danger', 'bi-x-circle'] };
boot(() => ({
  q: null, comments: {}, general: '',
  init() {
    this.q = db.quotes.find((x) => x.id === idParam(2));
    if (!this.q || (this.q.link_valid_until && this.q.link_valid_until < ik.todayISO() && this.q.status !== 'draft')) { location.replace(ik.href('screens/error-404.html')); return; }
    this.q.rooms.forEach((r) => { this.comments[r.id] = r.client_comment || ''; });
    this.general = this.q.client_general_comment || '';
  },
  get sender() { return ik.quoteUser(this.q); },
  get totals() { return ik.quoteTotals(this.q); },
  get respondable() { return ['sent', 'changes_requested'].includes(this.q.status); },
  get statusColor() { return (COLORS[this.q.status] || ['secondary'])[0]; },
  get statusIcon() { return (COLORS[this.q.status] || ['', 'bi-circle'])[1]; },
  get trackable() { const r = ik.realizationOf(this.q); return this.q.status === 'accepted' && r && r.status !== 'cancelled' ? r : null; },
  async answer(decision) {
    const accept = decision === 'accepted';
    if ([this.general, ...Object.values(this.comments)].some((t) => t.replace(/\r\n/g, '\n').length > 5000)) { alertError('Uwaga jest za długa — najwyżej 5000 znaków.'); return; }
    const ok = await ask(accept
      ? { title: 'Akceptuję wycenę', text: 'Zaakceptować wycenę?', points: [`Akceptują Państwo ofertę na kwotę Razem brutto ${ik.pln(this.totals.gross)}.`, 'Odpowiedzi nie będzie można zmienić.'], ok: 'Akceptuję wycenę', okClass: 'success' }
      : { title: 'Oczekuję zmiany', text: 'Wysłać prośbę o zmianę wyceny?', points: ['Wykonawca dostanie Państwa komentarze i przygotuje nową wersję oferty.', 'O nowej wersji powiadomi Państwa e-mail.'], ok: 'Oczekuję zmiany', okClass: 'warning' });
    if (!ok) return;
    this.q.rooms.forEach((r) => { r.client_comment = (this.comments[r.id] || '').trim() || null; });
    Object.assign(this.q, { status: decision, responded_at: new Date().toISOString().slice(0, 19), client_general_comment: this.general.trim() || null });
    save();
    toast(accept ? 'Dziękujemy za akceptację wyceny!' : 'Dziękujemy — odpowiedź z prośbą o zmianę została wysłana do wykonawcy.');
    window.scrollTo(0, 0);
  },
}));
</script>
</body>
</html>
