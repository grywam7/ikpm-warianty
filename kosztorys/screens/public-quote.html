<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oferta — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* Pasek decyzji przyklejony do dołu ekranu na całą szerokość kolumny oferty. */
  .k-public-bar { margin: var(--ikpm-space-6) calc(-1 * var(--ikpm-gutter)) 0; border-radius: var(--ikpm-radius-lg) var(--ikpm-radius-lg) 0 0; }
  @media (min-width: 868px) { .k-public-bar { margin-inline: 0; border-inline: 1px solid var(--ikpm-border); } }
</style>
</head>
<body>
<header class="ikpm-public-bar"><strong>IKPM</strong><span class="ikpm-meta">Oferta</span></header>
<main id="main" x-data="page" x-cloak class="ikpm-public">
<template x-if="q">
<div>
  <div id="alerts"></div>
  <template x-if="q.status === 'draft'">
    <div class="ikpm-empty">
      <i class="bi bi-hourglass-split" aria-hidden="true"></i>
      <h1 class="ikpm-empty-title">Oferta jest aktualizowana</h1>
      <p>Otrzymają Państwo nową wiadomość, gdy będzie gotowa.</p>
    </div>
  </template>
  <template x-if="q.status !== 'draft'">
    <div>
      <div class="k-public-head">
        <h1>Wycena #<span x-text="q.id"></span></h1>
        <div class="d-flex flex-wrap align-items-center gap-2 column-gap-3"><span x-html="ik.clientQuoteBadge(q.status)"></span><span class="ikpm-meta" x-text="'Wysłana: ' + ik.dateTime(q.sent_at)"></span></div>
        <div class="ikpm-contact"><strong x-text="sender.display_name"></strong><template x-if="sender.first_name"><a :href="'mailto:' + sender.email"><i class="bi bi-envelope" aria-hidden="true"></i><span x-text="sender.email"></span></a></template><template x-if="sender.phone"><a :href="'tel:' + sender.phone.replace(/\s/g, '')"><i class="bi bi-telephone" aria-hidden="true"></i><span x-text="sender.phone"></span></a></template></div>
      </div>
      <template x-if="trackable"><p class="alert alert-success d-flex flex-wrap gap-1"><span x-text="trackable.status === 'done' ? 'Prace z tej wyceny zostały zakończone —' : 'Prace z tej wyceny są w realizacji —'"></span> <a class="alert-link" :href="ik.href('screens/public-realization.html?id=' + trackable.id)">Śledź postęp prac</a></p></template>
      <template x-if="!respondable && q.responded_at"><p class="alert alert-secondary" x-text="'Wycena ma już zapisaną odpowiedź z dnia ' + ik.date(q.responded_at) + '. Dziękujemy.'"></p></template>

      <section class="card mb-4" aria-labelledby="sum-title">
        <div class="card-body">
          <h2 id="sum-title" class="k-card-title mb-3">Podsumowanie</h2>
          <dl class="ikpm-totals" data-quote-totals>
            <div><dt>Razem netto</dt><dd x-text="ik.pln(totals.net)"></dd></div>
            <div><dt x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd x-text="ik.pln(totals.vat)"></dd></div>
            <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="ik.pln(totals.gross)"></dd></div>
          </dl>
        </div>
      </section>

      <dl class="ikpm-dl k-dl-stack mb-4">
        <dt>Klient</dt><dd><span class="d-block" x-text="q.client ? q.client.name : ''"></span><span class="d-block" x-show="q.client && q.client.email" x-text="q.client ? q.client.email : ''"></span></dd>
        <template x-if="q.site_address"><dt>Adres inwestycji</dt></template><template x-if="q.site_address"><dd x-text="q.site_address"></dd></template>
        <template x-if="q.planned_start_on"><dt>Planowany start</dt></template><template x-if="q.planned_start_on"><dd x-text="ik.date(q.planned_start_on)"></dd></template>
        <template x-if="q.planned_end_on"><dt>Termin zakończenia</dt></template><template x-if="q.planned_end_on"><dd x-text="ik.date(q.planned_end_on)"></dd></template>
      </dl>

      <template x-for="room in q.rooms" :key="room.id">
        <section class="doc-room card" :aria-labelledby="'pr-' + room.id">
          <div class="doc-room-head border-bottom">
            <div class="doc-room-name"><h2 class="doc-room-title" :id="'pr-' + room.id" x-text="room.name"></h2><p class="ikpm-meta mb-0" x-show="sizeOf(room)" x-text="sizeOf(room)"></p><p class="ikpm-meta mb-0 k-legend" x-show="room.jobs.length">Ilość × cena jedn. netto = wartość netto</p></div>
          </div>
          <p class="doc-room-body mb-0 ikpm-muted" x-show="!room.jobs.length">(brak prac w tym pokoju)</p>
          <div class="ikpm-table-box" x-show="room.jobs.length">
            <table class="table k-compact">
              <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
              <thead><tr><th scope="col">Praca</th><th scope="col">Etap</th><th scope="col" class="ikpm-num">Ilość</th><th scope="col" class="ikpm-num">Cena jedn. netto</th><th scope="col" class="ikpm-num">Wartość netto</th></tr></thead>
              <template x-for="g in ik.byStage(room.jobs)" :key="g.stage"><tbody>
                <tr class="k-stage-row"><th scope="rowgroup" colspan="5" x-text="g.stage"></th></tr>
                <template x-for="j in g.jobs" :key="j.id"><tr>
                  <td class="ikpm-cell-lead k-full" x-text="j.name"></td>
                  <td class="k-no-compact" x-text="j.stage"></td>
                  <td class="ikpm-num k-no-compact" x-text="ik.dec(j.quantity) + ' ' + j.unit"></td>
                  <td class="ikpm-num k-no-compact" x-text="ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></td>
                  <td class="k-only-compact ikpm-meta ikpm-num" x-text="ik.dec(j.quantity) + ' ' + j.unit + ' × ' + ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></td>
                  <td class="ikpm-num k-end fw-semibold" x-text="ik.pln(ik.lineTotal(j, q.markup_percent))"></td></tr></template>
              </tbody></template>
            </table>
          </div>
          <div class="doc-room-body border-top">
            <template x-if="respondable"><div><label class="form-label" :for="'rc-' + room.id">Komentarz do pokoju</label><textarea class="form-control" rows="2" maxlength="5000" placeholder="Opcjonalnie..." :id="'rc-' + room.id" x-model="comments[room.id]"></textarea></div></template>
            <template x-if="!respondable"><p class="mb-0"><strong>Komentarz do pokoju:</strong> <span x-text="room.client_comment || '—'"></span></p></template>
          </div>
        </section>
      </template>

      <section class="card mb-4" aria-labelledby="gc-title"><div class="card-body">
        <template x-if="respondable"><div><label id="gc-title" class="form-label" for="gc">Komentarz ogólny</label><textarea id="gc" class="form-control" rows="3" maxlength="5000" placeholder="Uwagi do całej wyceny..." x-model="general"></textarea></div></template>
        <template x-if="!respondable"><p id="gc-title" class="mb-0"><strong>Komentarz ogólny:</strong> <span x-text="q.client_general_comment || '—'"></span></p></template>
      </div></section>

      <template x-if="respondable">
        <div class="ikpm-actionbar k-public-bar">
          <div class="ikpm-actionbar-total"><span>Razem brutto</span><span class="ikpm-amount-lg" x-text="ik.pln(totals.gross)"></span></div>
          <div class="ikpm-actionbar-actions">
            <button type="button" class="btn btn-outline-secondary btn-lg" @click="answer('changes_requested')"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Oczekuję zmiany</button>
            <button type="button" class="btn btn-success btn-lg" @click="answer('accepted')"><i class="bi bi-check-lg" aria-hidden="true"></i>Akceptuję wycenę</button>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
</template>
</main>
<footer class="ikpm-public-footer">Wygenerowane przez system IKPM.</footer>
<script type="module">
import { boot, db, save, toast, alertError, ask, idParam } from '../assets/app.js';

boot(() => ({
  q: null, comments: {}, general: '',
  init() {
    this.q = db.quotes.find((x) => x.id === idParam(2));
    if (!this.q || (this.q.link_valid_until && this.q.link_valid_until < ik.todayISO() && this.q.status !== 'draft')) { location.replace(ik.href('screens/error-404.html')); return; }
    this.q.rooms.forEach((r) => { this.comments[r.id] = r.client_comment || ''; });
    this.general = this.q.client_general_comment || '';
  },
  get sender() { return ik.quoteUser(this.q); },
  get totals() { return ik.quoteTotals(this.q); },
  get respondable() { return ['sent', 'changes_requested'].includes(this.q.status); },
  sizeOf(room) { const p = ik.roomSizeParts(room); return p.dimensions || Object.values(p)[0] || ''; },
  get trackable() { const r = ik.realizationOf(this.q); return this.q.status === 'accepted' && r && r.status !== 'cancelled' ? r : null; },
  async answer(decision) {
    const accept = decision === 'accepted';
    if ([this.general, ...Object.values(this.comments)].some((t) => t.replace(/\r\n/g, '\n').length > 5000)) { alertError('Uwaga jest za długa — najwyżej 5000 znaków.'); return; }
    const ok = await ask(accept
      ? { title: 'Akceptuję wycenę', text: 'Zaakceptować wycenę?', points: [`Akceptują Państwo ofertę na kwotę Razem brutto ${ik.pln(this.totals.gross)}.`, 'Odpowiedzi nie będzie można zmienić.'], ok: 'Akceptuję wycenę', okClass: 'success' }
      : { title: 'Oczekuję zmiany', text: 'Wysłać prośbę o zmianę wyceny?', points: ['Wykonawca dostanie Państwa komentarze i przygotuje nową wersję oferty.', 'O nowej wersji powiadomi Państwa e-mail.'], ok: 'Oczekuję zmiany', okClass: 'primary' });
    if (!ok) return;
    this.q.rooms.forEach((r) => { r.client_comment = (this.comments[r.id] || '').trim() || null; });
    Object.assign(this.q, { status: decision, responded_at: new Date().toISOString().slice(0, 19), client_general_comment: this.general.trim() || null });
    save();
    toast(accept ? 'Dziękujemy za akceptację wyceny!' : 'Dziękujemy — odpowiedź z prośbą o zmianę została wysłana do wykonawcy.');
    window.scrollTo(0, 0);
  },
}));
</script>
</body>
</html>
