<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edytor wyceny — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .k-bleed { margin: var(--ikpm-space-6) calc(-1 * var(--ikpm-gutter)) calc(-2 * var(--ikpm-gutter)); }
  @media (min-width: 576px) { .k-span2 { grid-column: span 2; } }
  .k-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--ikpm-space-3); margin: 0 0 var(--ikpm-space-4); }
  .k-stats > div { padding: .5rem .75rem; border: 1px solid var(--ikpm-border); border-radius: var(--ikpm-radius); }
  .k-stats dt { font-size: var(--ikpm-fs-sm); font-weight: 400; color: var(--ikpm-text-2); }
  .k-stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Metryczka: od 38rem szerokości karty dwa rzędy — Klient | Adres, potem start | termin | narzut | VAT, pod nimi sugestia
     terminu w jednej linii z „Użyj”; węziej pola jedno pod drugim (sugestia zaraz pod terminem). */
  .k-meta { container: k-meta / inline-size; }
  .k-meta-grid { display: grid; gap: .75rem 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); }
  .k-meta-grid .form-label { margin-bottom: .25rem; }
  .k-m-client, .k-m-adr, .k-m-sugg { grid-column: 1 / -1; }
  /* Co zobaczy klient: od 1100 px w kolumnie spisu pokoi, żeby pierwszy pokój zaczynał się na pierwszym ekranie laptopa */
  .k-hint-side { display: none; margin-top: 1rem; }
  @media (min-width: 1100px) { .k-hint-main { display: none; } .k-hint-side { display: block; } }
  @container k-meta (min-width: 38rem) {
    .k-meta-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-areas: "client client adr adr" "start end markup vat" "sugg sugg sugg sugg"; row-gap: .5rem; }
    .k-m-client { grid-area: client; } .k-m-adr { grid-area: adr; } .k-m-start { grid-area: start; } .k-m-end { grid-area: end; }
    .k-m-sugg { grid-area: sugg; } .k-m-markup { grid-area: markup; } .k-m-vat { grid-area: vat; }
  }
</style>
</head>
<body data-nav="quotes">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
<template x-if="q">
<div>
  <div id="alerts"></div>
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="ik.href('screens/quotes-index.html')">Lista wycen</a>
    <div class="ikpm-page-heading">
      <h1 class="ikpm-page-title">Wycena #<span x-text="q.id"></span></h1>
      <div class="ikpm-page-meta"><span x-html="ik.quoteBadge(q.status, true)"></span><span x-text="q.client ? q.client.name : '(brak klienta)'"></span><span x-text="ik.jobsCount(ik.jobsOf(q).length) + ' · pokoje: ' + q.rooms.length"></span></div>
    </div>
    <div class="ikpm-page-actions">
      <a class="btn btn-outline-secondary" :href="ik.href('screens/quote-show.html?id=' + q.id)"><i class="bi bi-eye" aria-hidden="true"></i>Podgląd</a>
      <a class="btn btn-outline-primary d-sm-none" :href="ik.href('screens/match-contractors.html?id=' + q.id)"><i class="bi bi-people" aria-hidden="true"></i>Dobierz wykonawców</a>
      <button type="button" class="btn btn-primary d-sm-none" @click="send()"><i class="bi bi-send" aria-hidden="true"></i>Wyślij do klienta</button>
    </div>
  </div>

  <div class="ikpm-split ikpm-split-3">
    <!-- Spis pokoi (od 1100 px; węziej — przyciski pokoi nad dokumentem) -->
    <nav class="ikpm-pane ikpm-pane-list k-toc" aria-labelledby="toc-title">
      <h2 id="toc-title" class="k-toc-title">Spis pokoi</h2>
      <ul class="ikpm-list">
        <template x-for="r in q.rooms" :key="r.id">
          <li><a class="ikpm-row" :href="'#room-' + r.id">
            <span class="ikpm-row-main"><span class="ikpm-row-title" x-text="r.name"></span>
              <span class="ikpm-row-meta"><span x-text="ik.jobsCount(r.jobs.length) + ' · '"></span><span class="ikpm-num" x-text="ik.pln(ik.roomTotal(r, q.markup_percent))"></span></span>
              <span class="ikpm-chip ikpm-tone-warning mt-1" x-show="r.client_comment"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Komentarz klienta</span></span></a></li>
        </template>
        <li><button type="button" class="ikpm-row ikpm-row-add" @click="addRoom()"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj pokój</button></li>
      </ul>
      <ul class="ikpm-list mt-3">
        <li><a class="ikpm-row" href="#all-jobs"><span class="ikpm-row-main"><span class="ikpm-row-title">Wszystkie prace w wycenie</span></span><span class="ikpm-row-end ikpm-meta" x-text="ik.jobsOf(q).length"></span></a></li>
        <li><a class="ikpm-row" href="#summary"><span class="ikpm-row-main"><span class="ikpm-row-title">Podsumowanie i notatki</span></span></a></li>
      </ul>
      <p class="ikpm-meta k-hint-side"><i class="bi bi-eye" aria-hidden="true"></i> Klient zobaczy w ofercie (strona oferty i PDF): pokoje, prace, ilości, ceny dla klienta („Cena/j.” i „Wartość”), sumy i terminy. <i class="bi bi-lock" aria-hidden="true"></i> Tylko firma: wykonawcy, ceny ekip, koszt materiałów, notatki, koszt i marża.</p>
    </nav>

    <div class="ikpm-pane">
      <!-- Metryczka wyceny -->
      <section class="card mb-4 k-meta" aria-labelledby="meta-title">
        <div class="card-body">
          <h2 id="meta-title" class="visually-hidden">Dane wyceny</h2>
          <div class="k-meta-grid">
            <div class="k-m-client">
              <label class="form-label" for="q-client">Klient</label>
              <div class="d-flex flex-wrap gap-2">
                <select id="q-client" class="form-select" style="flex: 1 1 10rem; min-width: 0; width: auto" @change="setClient($event.target.value)">
                  <option value="" :selected="!q.client">-- wybierz klienta --</option>
                  <template x-for="c in clients" :key="c.id"><option :value="c.name" :selected="q.client && q.client.name === c.name" x-text="c.name"></option></template>
                </select>
                <button type="button" class="btn btn-outline-primary" @click="openClient()"><i class="bi bi-person-plus" aria-hidden="true"></i>Dodaj nowego klienta</button>
              </div>
              <p class="form-text mb-0" x-show="q.client">
                <span x-text="q.client ? [q.client.email || '(brak e-maila)', q.client.phone].filter(Boolean).join(' · ') : ''"></span>
                <span x-show="clientId"> · Aktualny klient: <a :href="ik.href('screens/client-form.html?id=' + clientId + '&back=builder&quote=' + q.id)" x-text="q.client ? q.client.name : ''"></a></span>
              </p>
            </div>
            <div class="k-m-adr">
              <label class="form-label" for="q-address">Adres inwestycji</label>
              <input id="q-address" class="form-control" :value="q.site_address || ''" @change="q.site_address = $event.target.value.trim() || null; save()">
            </div>
            <div class="k-m-start">
              <label class="form-label" for="q-start">Planowany start</label>
              <input id="q-start" type="date" class="form-control" min="2000-01-01" max="2099-12-31" :value="q.planned_start_on || ''" @change="setTerm('planned_start_on', $event.target)">
            </div>
            <div class="k-m-end">
              <label class="form-label" for="q-end">Termin zakończenia</label>
              <input id="q-end" type="date" class="form-control" :class="{ 'is-invalid': endError }" :min="q.planned_start_on || '2000-01-01'" max="2099-12-31" :value="q.planned_end_on || ''" @change="setTerm('planned_end_on', $event.target)" aria-describedby="q-suggest q-end-error">
              <div id="q-end-error" class="invalid-feedback" x-text="endError"></div>
            </div>
            <!-- Sugestia z doboru: pod oboma polami terminu, w jednej linii z „Użyj” -->
            <div id="q-suggest" class="k-m-sugg form-text d-flex flex-wrap align-items-center gap-2 mt-0" aria-live="polite">
              <template x-if="q.suggested_work_days && q.planned_start_on">
                <span class="d-flex flex-wrap align-items-center gap-2"><span><i class="bi bi-lightbulb" aria-hidden="true"></i> Sugerowany: <strong x-text="ik.date(suggested)"></strong> (<span x-text="ik.workDays(q.suggested_work_days)"></span>)</span>
                  <button type="button" class="btn btn-sm btn-outline-primary" @click="useSuggestion()" :disabled="q.planned_end_on === suggested">Użyj</button></span>
              </template>
              <template x-if="q.suggested_work_days && !q.planned_start_on"><span x-text="ik.workDays(q.suggested_work_days) + ' od startu'"></span></template>
              <template x-if="!q.suggested_work_days"><span><i class="bi bi-lightbulb" aria-hidden="true"></i> Dobierz wykonawców, żeby dostać sugestię</span></template>
            </div>
            <div class="k-m-markup">
              <label class="form-label" for="q-markup">Narzut</label>
              <div class="input-group">
                <input id="q-markup" type="number" inputmode="decimal" step="any" min="0" max="1000" class="form-control ikpm-num" :value="Number(q.markup_percent)" @change="setMarkup($event.target)" aria-describedby="q-margin">
                <span class="input-group-text">%</span>
              </div>
              <div id="q-margin" class="form-text" title="Marża jako % ceny dla klienta — wynika z narzutu">marża <span x-text="ik.pct(ik.marginPercent(q.markup_percent))"></span></div>
            </div>
            <div class="k-m-vat">
              <label class="form-label" for="q-vat">VAT</label>
              <select id="q-vat" class="form-select" @change="q.vat_rate = $event.target.value; save()">
                <template x-for="r in ik.labels().vat_rates" :key="r"><option :value="r" :selected="Number(q.vat_rate) === r" x-text="r + '%'"></option></template>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Uwagi klienta po „Oczekuję zmiany” -->
      <template x-if="ik.clientComments(q)">
        <section class="alert alert-warning" aria-labelledby="client-comments-title">
          <h2 id="client-comments-title" class="h3 d-flex align-items-center gap-2"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Uwagi klienta</h2>
          <p class="mb-2 text-pre" x-text="q.client_general_comment || '(brak komentarza ogólnego — sprawdź komentarze przy pokojach)'"></p>
          <ul class="mb-0">
            <template x-for="r in q.rooms.filter(x => x.client_comment)" :key="r.id">
              <li><a class="alert-link" :href="'#room-' + r.id" x-text="r.name"></a>: <span x-text="r.client_comment"></span></li>
            </template>
          </ul>
        </section>
      </template>

      <!-- Pokoje (poniżej 1100 px zamiast spisu z lewej) -->
      <nav class="k-chips" aria-label="Pokoje wyceny">
        <template x-for="r in q.rooms" :key="r.id">
          <a class="btn btn-outline-secondary" :href="'#room-' + r.id">
            <span x-text="r.name"></span>
            <i class="bi bi-chat-left-text-fill" style="color: var(--ikpm-warning-ic)" x-show="r.client_comment" aria-hidden="true"></i><span class="visually-hidden" x-show="r.client_comment"> (Komentarz klienta)</span>
            <span class="ikpm-meta ikpm-num" x-text="ik.pln(ik.roomTotal(r, q.markup_percent))"></span>
          </a>
        </template>
        <button type="button" class="btn btn-primary" @click="addRoom()"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj pokój</button>
      </nav>
      <p class="ikpm-meta ikpm-measure k-hint-main"><i class="bi bi-eye" aria-hidden="true"></i> Klient zobaczy w ofercie (strona oferty i PDF): pokoje, prace, ilości, ceny dla klienta („Cena/j.” i „Wartość”), sumy i terminy. <i class="bi bi-lock" aria-hidden="true"></i> Tylko firma: wykonawcy, ceny ekip, koszt materiałów, notatki, koszt i marża.</p>
      <div class="ikpm-empty" x-show="!q.rooms.length"><i class="bi bi-door-open" aria-hidden="true"></i><p class="ikpm-empty-title">Dodaj pierwszy pokój, aby rozpocząć wycenę</p><button type="button" class="btn btn-primary" @click="addRoom()">Dodaj pokój</button></div>

      <!-- Pokoje: jeden dokument -->
      <template x-for="room in q.rooms" :key="room.id">
        <section class="doc-room card" :id="'room-' + room.id" :aria-labelledby="'room-title-' + room.id">
          <div class="doc-room-head ikpm-sticky-head">
            <button type="button" class="btn btn-outline-secondary ikpm-btn-icon flex-none" :aria-expanded="(!closed[room.id]).toString()" :aria-controls="'room-body-' + room.id" @click="closed[room.id] = !closed[room.id]" :aria-label="(closed[room.id] ? 'Rozwiń pokój ' : 'Zwiń pokój ') + room.name"><i class="bi" :class="closed[room.id] ? 'bi-chevron-right' : 'bi-chevron-down'" aria-hidden="true"></i></button>
            <div class="doc-room-name">
              <h2 class="doc-room-title" :id="'room-title-' + room.id" x-text="room.name"></h2>
              <p class="ikpm-meta mb-0" x-text="Object.values(ik.roomSizeParts(room)).join(' · ') || 'bez wymiarów'"></p>
            </div>
            <div class="text-end lh-sm"><span class="ikpm-meta d-block">Suma pokoju</span><span class="ikpm-amount" x-text="ik.pln(ik.roomTotal(room, q.markup_percent))"></span></div>
            <button type="button" class="btn btn-outline-secondary d-none d-md-inline-flex" @click="openTplSave(room)"><i class="bi bi-bookmark-plus" aria-hidden="true"></i><span class="d-none d-lg-inline">Zapisz jako szablon</span><span class="visually-hidden d-lg-none">Zapisz jako szablon</span></button>
            <button type="button" class="btn btn-outline-danger ikpm-btn-icon d-none d-md-inline-flex" :aria-label="'Usuń pokój ' + room.name" title="Usuń pokój" @click="removeRoom(room)"><i class="bi bi-trash" aria-hidden="true"></i></button>
          </div>
          <div :id="'room-body-' + room.id" x-show="!closed[room.id]">
            <!-- Pomiary pokoju: w dokumencie; na telefonie rozwijane przyciskiem -->
            <div class="px-3 pt-3 k-room-edit-toggle"><button type="button" class="btn btn-outline-primary w-100" :aria-expanded="(!!openEdit[room.id]).toString()" :aria-controls="'room-edit-' + room.id" @click="toggleEdit(room)"><i class="bi" :class="openEdit[room.id] ? 'bi-chevron-up' : 'bi-rulers'" aria-hidden="true"></i>Edytuj pokój — wymiary, szablony, notatka</button></div>
            <div class="k-room-edit doc-room-body" :class="{ 'is-open': openEdit[room.id] }" :id="'room-edit-' + room.id">
              <div class="ikpm-grid k-fields" style="--ikpm-grid-min: 8.5rem">
                <div class="k-span2">
                  <label class="form-label" :for="'rn-' + room.id">Nazwa pokoju</label>
                  <input class="form-control" :id="'rn-' + room.id" maxlength="100" :value="room.name" @change="setName(room, $event.target)">
                </div>
                <template x-for="d in DIMS" :key="d[0]">
                  <div>
                    <label class="form-label" :for="d[0] + '-' + room.id" x-text="d[1]"></label>
                    <input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :id="d[0] + '-' + room.id" x-effect="show($el, room[d[0]] ?? '')" @input="liveMeasure(room, d[0], $event.target)" @change="setMeasure(room, d[0], $event.target)">
                  </div>
                </template>
              </div>
              <div class="d-flex flex-wrap align-items-center gap-2 column-gap-4 mt-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" :id="'irr-' + room.id" :checked="isIrregular(room)" @change="toggleIrregular(room, $event.target.checked)">
                  <label class="form-check-label" :for="'irr-' + room.id">Pokój nieregularny</label>
                </div>
                <span class="ikpm-meta ikpm-num" style="white-space: normal">Podłoga: <span x-text="ik.dec(ik.floorArea(room))"></span> m² · Ściany: <span x-text="ik.dec(ik.wallArea(room))"></span> m² · Obwód: <span x-text="ik.dec(ik.perimeter(room))"></span> mb</span>
              </div>
              <template x-if="isIrregular(room)">
                <div class="mt-2">
                  <div class="ikpm-grid k-fields" style="--ikpm-grid-min: 8.5rem">
                    <template x-for="o in OVERRIDES" :key="o[0]">
                      <div>
                        <label class="form-label" :for="o[0] + '-' + room.id" x-text="o[1]"></label>
                        <input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :id="o[0] + '-' + room.id" x-effect="show($el, room[o[0]] ?? '')" :placeholder="hintFor(room, o[0])" :aria-describedby="'irr-hint-' + room.id" @input="liveMeasure(room, o[0], $event.target)" @change="setMeasure(room, o[0], $event.target)">
                      </div>
                    </template>
                  </div>
                  <p class="form-text mb-0 mt-1 ikpm-measure" :id="'irr-hint-' + room.id">Puste pole — wartość z wymiarów (podpowiedź w polu); sufit jak podłoga, ściany: obwód × wysokość − otwory. Wpisane ściany to powierzchnia netto — otworów się od nich nie odejmuje.</p>
                </div>
              </template>
              <p class="text-danger-emphasis fw-semibold mb-0 mt-2" role="alert" x-show="roomError(room)"><i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i> <span x-text="roomError(room)"></span></p>
              <div class="ikpm-grid ikpm-grid-fit k-fields mt-3" style="--ikpm-grid-min: 18rem">
                <div>
                  <label class="form-label" :for="'note-' + room.id">Notatka</label>
                  <input class="form-control" :id="'note-' + room.id" :value="room.notes || ''" placeholder="Np. stan ścian, ustalenia z klientem" :aria-describedby="'note-hint-' + room.id" @change="room.notes = $event.target.value.trim() || null; save()">
                  <div class="form-text" :id="'note-hint-' + room.id"><i class="bi bi-lock" aria-hidden="true"></i> Wewnętrzna — nie trafia do oferty dla klienta.</div>
                </div>
                <div role="group" :aria-labelledby="'tpl-l-' + room.id">
                  <p class="form-label mb-1" :id="'tpl-l-' + room.id">Szablony prac <span class="fw-normal ikpm-muted">(kliknij aby dodać prace z szablonu)</span></p>
                  <div class="d-flex flex-wrap gap-2">
                    <template x-for="t in templates" :key="t.id">
                      <button type="button" class="btn btn-outline-primary" @click="useTemplate(room, t)"><i class="bi bi-grid-1x2" aria-hidden="true"></i><span x-text="t.name"></span><span class="ikpm-chip" x-text="ik.jobsCount(t.jobs.length)"></span></button>
                    </template>
                  </div>
                </div>
              </div>
              <div class="d-flex d-md-none flex-wrap gap-2 mt-3 pt-3 border-top">
                <button type="button" class="btn btn-outline-secondary flex-fill" @click="openTplSave(room)"><i class="bi bi-bookmark-plus" aria-hidden="true"></i>Zapisz jako szablon</button>
                <button type="button" class="btn btn-outline-danger flex-fill" @click="removeRoom(room)"><i class="bi bi-trash" aria-hidden="true"></i>Usuń pokój</button>
              </div>
            </div>

            <div class="px-3 pt-3" x-show="room.client_comment">
              <div class="alert alert-warning d-flex gap-2 mb-0"><i class="bi bi-chat-left-text" aria-hidden="true"></i><span><strong>Komentarz klienta:</strong> <span x-text="room.client_comment"></span></span></div>
            </div>
            <p class="px-3 pt-3 mb-0 d-md-none" x-show="room.notes && !openEdit[room.id]"><strong>Notatka:</strong> <span x-text="room.notes"></span></p>

            <!-- Prace pokoju: tabela (od 768 px) -->
            <div class="ikpm-table-box d-none d-md-block mt-3" x-show="room.jobs.length">
              <table class="table">
                <caption class="visually-hidden" x-text="'Prace: ' + room.name"></caption>
                <thead><tr><th scope="col">Praca</th><th scope="col" class="ikpm-num k-num-col">Ilość</th><th scope="col" class="ikpm-num k-num-col">Cena ekipy /j.<span class="k-col-hint"><i class="bi bi-lock" aria-hidden="true"></i> tylko firma</span></th><th scope="col" class="ikpm-num k-val-col">Wartość<span class="k-col-hint"><i class="bi bi-eye" aria-hidden="true"></i> widzi klient</span></th><th scope="col" class="k-act-col"><span class="visually-hidden">Usuń</span></th></tr></thead>
                <template x-for="g in ik.byStage(room.jobs)" :key="g.stage">
                  <tbody>
                    <tr class="ikpm-group-row"><th scope="rowgroup" colspan="5" x-text="g.stage"></th></tr>
                    <template x-for="j in g.jobs" :key="j.id">
                      <tr :id="'job-' + j.id">
                        <td>
                          <span class="fw-semibold" x-text="j.name"></span>
                          <span class="ikpm-chip ms-1" x-show="j.area_type !== 'manual'" title="Wyliczane automatycznie z wymiarów"><i class="bi bi-rulers" aria-hidden="true"></i><span x-text="j.area_type_label"></span></span>
                          <span class="ikpm-meta d-block" x-text="j.contractor ? 'Wykonawca: ' + j.contractor : 'bez wykonawcy'"></span>
                        </td>
                        <td>
                          <div class="input-group">
                            <input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" :class="{ 'is-invalid': qtyError[j.id] }" :id="'qty-' + j.id" x-effect="show($el, Number(j.quantity))" :aria-label="'Ilość: ' + j.name" @input="liveQty(j, $event.target)" @change="setQty(j, room, $event.target)">
                            <span class="input-group-text" x-text="j.unit"></span>
                          </div>
                          <div class="text-danger-emphasis small" x-show="qtyError[j.id]" x-text="qtyError[j.id]"></div>
                        </td>
                        <td>
                          <div class="input-group">
                            <input type="number" inputmode="decimal" step="any" min="0" class="form-control ikpm-num" placeholder="śr." x-effect="show($el, j.contractor_price === null ? '' : Number(j.contractor_price))" :aria-label="'Cena ekipy za jednostkę: ' + j.name" @input="livePrice(j, $event.target)" @change="setPrice(j, $event.target)">
                            <span class="input-group-text">zł</span>
                          </div>

                        </td>

                      </tr>
                    </template>
                  </tbody>
                </template>
              </table>
            </div>
            <!-- Prace pokoju: lista (telefon), edycja w oknie dolnym -->
            <div class="d-md-none mt-3 border-top" x-show="room.jobs.length">
              <template x-for="g in ik.byStage(room.jobs)" :key="g.stage">
                <div>
                  <p class="k-group-label" x-text="g.stage"></p>
                  <template x-for="j in g.jobs" :key="j.id">
                    <button type="button" class="k-job-btn" @click="openJob(j, room)">
                      <span class="flex-grow-1 min-w-0">
                        <span class="d-block fw-semibold" x-text="j.name"></span>
                        <span class="ikpm-meta d-block ikpm-num text-start" x-text="ik.dec(j.quantity) + ' ' + j.unit + ' × ' + ik.pln(ik.clientUnitPrice(j, q.markup_percent))"></span>
                        <span class="ikpm-meta d-block" x-text="j.contractor ? 'Wykonawca: ' + j.contractor : 'bez wykonawcy'"></span>

            <p class="px-3 pt-3 mb-0 ikpm-muted" x-show="!room.jobs.length">Brak prac w tym pokoju — dodaj je szablonem albo wyszukaj poniżej.</p>

            <!-- Dodaj pracę: wyszukiwanie w cenniku -->

      <button type="button" class="btn btn-outline-primary btn-lg mb-4" @click="addRoom()" x-show="q.rooms.length"><i class="bi bi-plus-lg" aria-hidden="true"></i>Dodaj pokój</button>

      <!-- Zestawienie całej wyceny wg etapów (widok „Wszystkie”) -->

        <summary class="card-header d-flex align-items-center gap-2" style="min-height: var(--ikpm-control-h); cursor: pointer">Wszystkie prace w wycenie <span class="ikpm-chip" x-text="ik.jobsOf(q).length"></span></summary>

    <!-- Podsumowanie i notatki: pod dokumentem, od 1600 px kolumna z prawej -->
    <aside class="ikpm-pane ikpm-pane-aside k-aside" id="summary" aria-label="Podsumowanie i notatki">

  <!-- Pasek sum: netto i brutto na żywo, dobór i wysyłka -->
  <div class="ikpm-actionbar k-bleed">

      <span>Razem netto</span>

    </div>
    <div class="k-bar-extra ikpm-meta"><span>Prace: <strong x-text="ik.jobsOf(q).length"></strong> · Pokoje: <strong x-text="q.rooms.length"></strong></span><span>Koszt: <strong class="ikpm-num" x-text="ik.pln(cost)"></strong> · Marża: <strong class="ikpm-num" x-text="ik.pln(totals.net - cost)"></strong></span></div>
    <span class="ikpm-save" data-state="saved" role="status" x-show="savedAt">Zapisano</span>
    <div class="ikpm-actionbar-actions d-none d-sm-flex">

      <button type="button" class="btn btn-primary btn-lg" @click="send()"><i class="bi bi-send" aria-hidden="true"></i>Wyślij do klienta</button>

<dialog class="ikpm-dialog ikpm-sheet" id="tpl-sheet" aria-labelledby="tpl-sheet-title">
  <div class="ikpm-sheet-head"><h2 id="tpl-sheet-title">Zapisz jako szablon</h2><form method="dialog"><button class="btn-close" aria-label="Zamknij"></button></form></div>
  <form @submit.prevent="saveTemplate()" novalidate>
    <div class="ikpm-dialog-body d-grid gap-2">
      <div class="alert alert-danger mb-0" role="alert" x-show="tplError" x-text="tplError"></div>
      <label class="form-label mb-0" for="tpl-name">Nazwa szablonu</label>

      <p id="tpl-hint" class="form-text mb-0">Nowy szablon z wymiarami i pracami pokoju (ilości tylko prac ręcznych).</p>
    </div>
    <div class="ikpm-dialog-actions"><button type="button" class="btn btn-outline-secondary btn-lg" @click="document.getElementById('tpl-sheet').close()">Wróć</button><button class="btn btn-primary btn-lg">Zapisz szablon</button></div>
  </form>
</dialog>
</main>
<script type="module">
import { boot, db, save, nextId, go, toast, alertError, ask, idParam } from '../assets/app.js';

boot(() => ({
  // save / toast — także dla krótkich obsług w znacznikach (@change="…; save()").
  save, toast,
  q: null, closed: {}, openEdit: {}, sheetJob: null, savedAt: 0, qtyError: {}, endError: '',
  newClient: {}, clientErrors: [], tplRoom: null, tplName: '', tplError: '',
  DIMS: [], OVERRIDES: [['floor_area_override', 'Podłoga (m²)'], ['ceiling_area_override', 'Sufit (m²)'], ['wall_area_override', 'Ściany (m²)'], ['perimeter_override', 'Obwód (mb)']],
  init() {
    const id = idParam(1);
    const q = db.quotes.find((x) => x.id === id);
    if (!q) { location.replace(ik.href('screens/error-404.html')); return; }
    if (q.status !== 'draft') { go(`screens/quote-show.html?id=${id}`, 'Wycena jest u klienta — przywróć ją do edycji, aby ją zmienić.', 'error', true); return; }
    this.DIMS = Object.entries(ik.labels().dimension);
    this.q = q;
    // Telefon: pokój bez prac (nowa wycena) od razu z polami wymiarów.
    q.rooms.forEach((r) => { if (!r.jobs.length) this.openEdit[r.id] = true; });
    window.addEventListener('ikpm-saved', () => { this.savedAt = Date.now(); });
  },
  // Pole liczbowe pokazuje wartość z modelu, chyba że ktoś w nim pisze (wtedy zostaje wpisany tekst, np. „3,”).
  show(el, value) { if (el !== document.activeElement) el.value = value; },
  get clients() { return db.clients; },
  get clientId() { return this.q.client ? ik.clientByName(this.q.client.name)?.id : null; },
  get templates() { return [...db.templates].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'pl')); },
  get totals() { return ik.quoteTotals(this.q); },
  get cost() { return ik.quoteCost(this.q); },
  get suggested() { return ik.suggestedEnd(this.q.planned_start_on, this.q.suggested_work_days); },
  get allByStage() {
    const rows = this.q.rooms.flatMap((room) => room.jobs.map((j) => ({ j, room })));
    const groups = [];
    ik.byStage(rows.map((r) => r.j)).forEach((g) => groups.push({ stage: g.stage, jobs: g.jobs.map((j) => rows.find((r) => r.j === j)) }));
    return groups;
  },

  // Metryczka
  setClient(name) { const c = db.clients.find((x) => x.name === name); this.q.client = c ? { name: c.name, email: c.email, phone: c.phone } : null; save(); },
  openClient() { this.newClient = { name: '', email: '', phone: '', notes: '' }; this.clientErrors = []; document.getElementById('client-sheet').showModal(); },
  createClient() {
    const c = this.newClient; const errors = [];
    if (!c.name.trim()) errors.push('Nazwa nie może być pusta');
    if (c.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) errors.push('Email jest nieprawidłowy');
    if (c.phone && !/^[0-9 +()-]{7,20}$/.test(c.phone)) errors.push('Telefon jest nieprawidłowy');
    this.clientErrors = errors;
    if (errors.length) return;
    const client = { id: nextId('client'), name: c.name.trim(), email: c.email.trim() || null, phone: c.phone.trim() || null, notes: c.notes.trim() };
    db.clients.push(client);
    this.q.client = { name: client.name, email: client.email, phone: client.phone };
    save(); document.getElementById('client-sheet').close(); toast('Klient utworzony i przypisany do wyceny.');
  },
  // Termin zapisuje się po zmianie pola; koniec przed startem jest odrzucany (pole wraca do zapisanej daty). Chromium
  // wysyła change po każdej cyfrze roku („0002-12-11”) — data spoza 2000–2099 to rok w trakcie pisania: bez zapisu
  // i bez cofania pola (cofnięcie gubiło resztę wpisywanego roku).
  setTerm(field, el) {
    const next = { planned_start_on: this.q.planned_start_on, planned_end_on: this.q.planned_end_on, [field]: el.value || null };
    if (next[field] && (next[field] < '2000-01-01' || next[field] > '2099-12-31')) return;
    if (next.planned_start_on && next.planned_end_on && next.planned_end_on < next.planned_start_on) {
      el.value = this.q[field] || ''; this.endError = 'Termin zakończenia nie może być wcześniejszy niż planowany start'; return;
    }
    this.endError = ''; this.q[field] = next[field]; save();
  },
  useSuggestion() { this.q.planned_end_on = this.suggested; this.endError = ''; save(); toast(`Termin zakończenia: ${ik.date(this.suggested)}.`); },
  setMarkup(el) {
    const v = ik.parseNumber(el.value);
    if (Number.isNaN(v) || v < 0 || v > 1000) { el.value = Number(this.q.markup_percent); alertError(Number.isNaN(v) ? 'Narzut nie może być pusty' : v < 0 ? 'Narzut musi być większy lub równy 0' : 'Narzut musi być mniejszy lub równy 1000'); return; }
    this.q.markup_percent = String(v); save();
  },

  // Pokoje
  isIrregular(room) { if (room._irr === undefined) room._irr = ik.irregular(room); return room._irr; },
  toggleIrregular(room, on) { room._irr = on; if (!on) { this.OVERRIDES.forEach(([f]) => { room[f] = null; }); ik.recalcRoom(room); } save(); },
  hintFor(room, field) {
    const r = { ...room, [field]: null };
    const v = { floor_area_override: ik.floorArea(r), ceiling_area_override: ik.ceilingArea(r), wall_area_override: ik.wallArea(r), perimeter_override: ik.perimeter(r) }[field];
    return ik.dec(v);
  },
  roomError(room) {
    const fields = [...this.DIMS.map((d) => d[0]), ...this.OVERRIDES.map((o) => o[0])];
    if (fields.some((f) => ik.num(room[f]) !== null && Number(room[f]) < 0)) return 'Wymiary i powierzchnie nie mogą być ujemne.';
    if (ik.num(room.wall_area_override) === null && ik.wallArea(room) < 0) return 'Powierzchnia otworów przekracza powierzchnię ścian — popraw wymiary.';
    return '';
  },
  setName(room, el) { const v = el.value.trim(); if (!v) { el.value = room.name; alertError('Nazwa nie może być pusta'); return; } room.name = v; save(); },
  // W trakcie pisania: model i sumy od razu, stan pośredni („2,”, puste pole, ujemna) pominięty bez komunikatu.
  // Wartość sprzed pisania zostaje w polu (remember) — błędna liczba na końcu wraca do niej (recall), nie do stanu
  // pośredniego, którego nikt nie zatwierdził.
  remember(el, value) { if (!('was' in el.dataset)) el.dataset.was = JSON.stringify(value ?? null); },
  recall(el, fallback) { const v = 'was' in el.dataset ? JSON.parse(el.dataset.was) : fallback; delete el.dataset.was; return v; },
  liveMeasure(room, field, el) { this.remember(el, room[field]); const v = ik.parseNumber(el.value); if (v >= 0) { room[field] = ik.roundHalfUp(v); ik.recalcRoom(room); } },
  liveQty(j, el) { this.remember(el, [j.quantity, j.typed]); const v = ik.parseNumber(el.value); if (v > 0 && v <= 1000000) { j.quantity = ik.roundHalfUp(v); if (j.area_type !== 'manual') j.typed = true; } },
  livePrice(j, el) { this.remember(el, j.contractor_price); const v = ik.parseNumber(el.value); if (v > 0 && v <= 1000000) j.contractor_price = String(ik.roundHalfUp(v)); },
  setMeasure(room, field, el) {
    const v = el.value === '' ? null : ik.parseNumber(el.value);
    if (Number.isNaN(v) || (v !== null && v < 0)) { room[field] = this.recall(el, room[field]); ik.recalcRoom(room); el.value = room[field] ?? ''; alertError('Wymiary i powierzchnie nie mogą być ujemne.'); return; }
    this.recall(el);
    room[field] = v === null ? null : ik.roundHalfUp(v);
    if (field === 'height') room._defaultHeight = false;
    ik.recalcRoom(room); save();
  },
  // Telefon: pomiary, szablony i notatka rozwijane w pokoju (od 768 px zawsze widoczne).
  toggleEdit(room) { this.openEdit[room.id] = !this.openEdit[room.id]; if (this.openEdit[room.id]) this.$nextTick(() => document.getElementById(`rn-${room.id}`)?.focus()); },
  addRoom() {
    const room = { id: nextId('room'), name: ik.nextRoomName(this.q), notes: null, client_comment: null, length: null, width: null, height: 2.8, holes_area: null,
      floor_area_override: null, ceiling_area_override: null, wall_area_override: null, perimeter_override: null, jobs: [], _defaultHeight: true };
    this.q.rooms.push(room); save(); toast(`Pokój '${room.name}' utworzony.`);
    this.$nextTick(() => {
      document.getElementById(`room-${room.id}`)?.scrollIntoView({ block: 'start' });
      this.openEdit[room.id] = true;
      this.$nextTick(() => document.getElementById(`rn-${room.id}`)?.focus({ preventScroll: true }));
    });
  },
  async removeRoom(room) {
    const ok = await ask({ title: 'Usuń pokój', text: 'Czy na pewno usunąć ten pokój i wszystkie jego prace?', points: [`Pokój „${room.name}” i ${ik.jobsCount(room.jobs.length)} znikną z wyceny i z sumy.`, 'Tego nie da się cofnąć.'], ok: 'Usuń pokój', okClass: 'danger' });
    if (!ok) return;
    this.q.rooms.splice(this.q.rooms.indexOf(room), 1); save(); toast('Pokój usunięty.');
  },
  useTemplate(room, t) {
    const added = ik.applyTemplate(room, t); save();
    toast(`Szablon „${t.name}”: dodano ${ik.jobsAccusative(added)}.`);
  },
  openTplSave(room) { this.tplRoom = room; this.tplName = room.name; this.tplError = ''; document.getElementById('tpl-sheet').showModal(); },
  saveTemplate() {
    const room = this.tplRoom; const name = this.tplName.replace(/\s+/g, ' ').trim() || room.name;
    if (db.templates.some((t) => t.name.replace(/\s+/g, ' ').trim().toLowerCase() === name.toLowerCase())) { this.tplError = 'Nie można zapisać szablonu: Szablon o tej nazwie już istnieje — zmień nazwę.'; return; }
    const jobs = ik.sortJobs(room.jobs).map((j, i) => ({ job_id: j.job_id, name: j.name, unit: j.unit, area_type: j.area_type, area_type_label: j.area_type_label, quantity: j.area_type === 'manual' ? String(j.quantity) : null, order: i + 1 }));
    db.templates.push({ id: nextId('template'), name, description: '', order: db.templates.length + 1, length: room.length, width: room.width, height: room.height, holes_area: room.holes_area, jobs });
    save(); document.getElementById('tpl-sheet').close(); toast(`Szablon '${name}' został utworzony.`);
  },

  // Prace
  candidates(room, term, stage) {
    const t = term.trim().toLowerCase(); const have = new Set(room.jobs.map((j) => j.job_id)); const out = [];
    db.catalogue.forEach((s) => { if (stage && s.name !== stage) return; s.jobs.forEach((job) => { if (!have.has(job.id) && (!t || job.name.toLowerCase().includes(t))) out.push({ stage: s, job }); }); });
    return out.slice(0, 40);
  },
  addJob(room, c) {
    const line = ik.newJobLine(c.job, c.stage.name, room);
    room.jobs.push(line); save(); toast('Praca dodana.');
    this.$nextTick(() => {
      if (window.innerWidth < 768) { this.openJob(line, room, line.area_type === 'manual'); return; }
      const el = document.getElementById(`qty-${line.id}`); if (el) { el.focus(); el.select(); }
    });
  },
  // focusQty: praca ręczna dodana na telefonie — pole „Ilość” od razu z fokusem (klawiatura numeryczna).
  openJob(j, room, focusQty = false) {
    this.sheetJob = { j, room };
    this.$nextTick(() => {
      const d = document.getElementById('job-sheet'); if (!d.open) d.showModal();
      if (focusQty) requestAnimationFrame(() => { const el = document.getElementById('sheet-qty'); el?.focus(); el?.select(); });
    });
  },
  setQty(j, room, el) {
    const v = ik.parseNumber(el.value);
    if (Number.isNaN(v) || v <= 0 || v > 1000000) { [j.quantity, j.typed] = this.recall(el, [j.quantity, j.typed]); this.qtyError[j.id] = v > 1000000 ? 'Ilość musi być mniejsza lub równa 1000000' : 'Ilość musi być większa od 0'; el.value = Number(j.quantity); return; }
    this.recall(el); this.qtyError[j.id] = '';
    j.quantity = ik.roundHalfUp(v); el.value = j.quantity;
    if (j.area_type !== 'manual') j.typed = true;
    save();
  },
  setPrice(j, el) {
    if (el.value === '') { this.recall(el); j.contractor_price = null; save(); return; }
    const v = ik.parseNumber(el.value);
    if (Number.isNaN(v) || v <= 0 || v > 1000000) { j.contractor_price = this.recall(el, j.contractor_price); el.value = j.contractor_price === null ? '' : Number(j.contractor_price); alertError('Cena musi być większa od 0'); return; }
    this.recall(el); j.contractor_price = String(ik.roundHalfUp(v)); el.value = ik.roundHalfUp(v); save();
  },
  async removeJob(j, room) {
    const ok = await ask({ title: 'Usuń pracę', text: 'Usunąć tę pracę z wyceny?', points: [`„${j.name}” zniknie z pokoju „${room.name}” i z sumy wyceny.`], ok: 'Usuń pracę', okClass: 'danger' });
    if (!ok) return;
    room.jobs.splice(room.jobs.indexOf(j), 1); save(); toast('Praca usunięta.');
  },

  // Wysyłka
  async send() {
    const q = this.q; const err = ik.sendError(q);
    if (err) { alertError(err); return; }
    const until = ik.addDays(ik.todayISO(), 30);
    const ok = await ask({
      title: 'Wyślij do klienta',
      text: `Wysłać wycenę do ${q.client.email}? Termin zakończenia: ${ik.date(q.planned_end_on)}.${ik.clientComments(q) ? ' Uwagi klienta trafią do notatek wyceny.' : ''}`,
      points: [
        `Klient dostanie e-mail z ofertą w PDF (wycena-${q.id}.pdf) i linkiem do strony oferty — link działa 30 dni (do ${ik.date(until)}).`,
        `Klient zobaczy Razem netto ${ik.pln(this.totals.net)} i Razem brutto ${ik.pln(this.totals.gross)}.`,
        'Ceny zostaną zamrożone — późniejsze zmiany cennika nie zmienią oferty.',
        'Status zmieni się na „Wysłana”; zmiany tylko po „Przywróć do edycji”.',
      ],
      ok: 'Wyślij do klienta',
    });
    if (!ok) return;
    const email = q.client.email;
    ik.sendQuote(q);
    go(`screens/quote-show.html?id=${q.id}`, `Wycena wysłana do ${email}.`, undefined, true);
  },
}));
</script>
