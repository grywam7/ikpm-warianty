<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klient — formularz — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-nav="clients">
<div id="nav"></div>
<main id="main" x-data="page" x-cloak class="ikpm-content">
  <div class="ikpm-page-head">
    <a class="ikpm-back" :href="backHref" x-text="backLabel"></a>
    <div class="ikpm-page-heading"><h1 class="ikpm-page-title" x-text="client ? 'Edycja klienta ' + client.name : 'Nowy klient'"></h1></div>
  </div>
  <form class="k-form" @submit.prevent="submit()" novalidate aria-label="Dane klienta">
    <div class="alert alert-danger" role="alert" x-show="errors.length"><ul class="mb-0"><template x-for="e in errors" :key="e"><li x-text="e"></li></template></ul></div>
    <div class="ikpm-grid k-fields">
      <div><label class="form-label" for="f-name">Nazwa *</label><input id="f-name" class="form-control" maxlength="100" x-model="form.name" required></div>
      <div><label class="form-label" for="f-email">Email</label><input id="f-email" type="email" class="form-control" maxlength="254" autocomplete="off" x-model="form.email"></div>
      <div><label class="form-label" for="f-phone">Telefon</label><input id="f-phone" type="tel" class="form-control" placeholder="+48 600 000 000" title="Numer telefonu: cyfry, spacje oraz + ( ) -" x-model="form.phone"></div>
      <div class="ikpm-span-all"><label class="form-label" for="f-notes">Notatki</label><textarea id="f-notes" class="form-control" rows="3" x-model="form.notes"></textarea></div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary btn-lg">Zapisz</button><a class="btn btn-outline-secondary btn-lg" :href="backHref">Anuluj</a></div>
  </form>
</main>
<script type="module">
import { boot, db, save, nextId, go, param } from '../assets/app.js';

boot(() => ({
  client: null, form: { name: '', email: '', phone: '', notes: '' }, errors: [],
  // Z edytora wyceny („Aktualny klient:”) — powrót do tej wyceny.
  get fromQuote() { return param('back') === 'builder' && param('quote') ? Number(param('quote')) : null; },
  get backHref() { return ik.href(this.fromQuote ? `screens/builder.html?id=${this.fromQuote}` : (this.client ? `screens/client-show.html?id=${this.client.id}` : 'screens/clients.html')); },
  get backLabel() { return this.fromQuote ? `Wycena #${this.fromQuote}` : (this.client ? this.client.name : 'Klienci'); },
  init() {
    if (param('id')) { this.client = db.clients.find((c) => c.id === Number(param('id'))); if (this.client) this.form = { name: this.client.name, email: this.client.email || '', phone: this.client.phone || '', notes: this.client.notes || '' }; }
  },
  submit() {
    const f = this.form; const e = [];
    if (!f.name.trim()) e.push('Nazwa nie może być pusta');
    if (f.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.push('Email jest nieprawidłowy');
    if (f.phone && !/^[0-9 +()-]{7,20}$/.test(f.phone)) e.push('Telefon jest nieprawidłowy');
    this.errors = e; if (e.length) return;
    const data = { name: f.name.trim(), email: f.email.trim() || null, phone: f.phone.trim() || null, notes: f.notes.trim() };
    if (this.client) {
      const old = this.client.name;
      [...db.quotes, ...db.realizations].forEach((x) => { if (x.client && x.client.name === old) Object.assign(x.client, { name: data.name, email: data.email, phone: data.phone }); });
      Object.assign(this.client, data); save(); go(this.fromQuote ? `screens/builder.html?id=${this.fromQuote}` : `screens/client-show.html?id=${this.client.id}`, 'Klient zaktualizowany.');
    } else {
      const id = nextId('client'); db.clients.push({ id, ...data }); save(); go(`screens/client-show.html?id=${id}`, 'Klient utworzony.');
    }
  },
}));
</script>
</body>
</html>
