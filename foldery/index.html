<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start — IKPM</title>
<link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-screen="start" data-nav="start" data-tab="start">
<main x-data="page" x-cloak>
  <div class="page"><div class="pane-inner">
    <div class="pane-head"><h1 class="pane-title">Start</h1>
      <div class="pane-sub">Bieżąca praca: realizacje w toku i wyceny, które czekają na następny krok.</div></div>

    <div class="group">
      <a class="row-link" :href="link('quotes-new', {mode: 'rooms'})"><span class="row-icon"><i class="bi bi-plus-square" aria-hidden="true"></i></span><span class="row-main row-add">Nowa wycena (pokoje)</span></a>
      <a class="row-link" :href="link('quotes-new', {mode: 'simple'})"><span class="row-icon"><i class="bi bi-plus-lg" aria-hidden="true"></i></span><span class="row-main row-add">Nowa wycena (prosta)</span></a>
    </div>

    <div class="row g-4">
      <div class="col-12 col-xl-6">
        <template x-for="sec in realizationSections()" :key="sec.title">
          <section>
            <h2 class="group-title" x-text="sec.title + ' (' + sec.items.length + ')'"></h2>
            <ul class="group">
              <template x-for="r in sec.items" :key="r.id">
                <li><a class="row-link" :href="link('realization-show', {id: r.id})">
                  <span class="row-main"><div class="fw-semibold">Realizacja #<span x-text="r.id"></span> · <span x-text="clientName(r)"></span></div>
                    <div class="small text-body-secondary" x-text="r.site_address"></div>
                    <div class="d-flex align-items-center gap-2 mt-1">
                      <div class="progress mini-progress flex-grow-1" role="progressbar" :aria-label="'Postęp prac realizacji #' + r.id" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressOf(rJobs(r)).pct">
                        <div class="progress-bar bg-success" :style="'width:' + progressOf(rJobs(r)).pct + '%'"></div></div>
                      <span class="small" x-text="progressOf(rJobs(r)).pct + '%'"></span></div>
                    <div class="small mt-1" x-show="rJobs(r).some(j => j.status === 'remake')"><span x-html="jobBadge('remake')"></span> <span x-text="rJobs(r).filter(j => j.status === 'remake').length"></span></div></span>
                  <span class="row-end small"><span x-html="realBadge(r)"></span>
                    <div class="mt-1">Termin</div><div class="fw-semibold" :class="endDelayed(r) && 'text-danger-emphasis'" x-text="date(r.expected_end_on || r.promised_end_on)"></div>
                    <div class="text-danger-emphasis" x-show="endDelayed(r)" x-text="'obiecany ' + date(r.promised_end_on)"></div></span>
                  <i class="bi bi-chevron-right chev" aria-hidden="true"></i></a></li>
              </template>
            </ul>
          </section>
        </template>
      </div>
      <div class="col-12 col-xl-6">
        <template x-for="sec in quoteSections()" :key="sec.title">
          <section x-show="sec.items.length">
            <h2 class="group-title" x-text="sec.title + ' (' + sec.items.length + ')'"></h2>
            <ul class="group">
              <template x-for="sq in sec.items" :key="sq.id">
                <li><a class="row-link" :href="quoteHref(sq)">
                  <span class="row-main"><div class="fw-semibold">Wycena #<span x-text="sq.id"></span> · <span x-text="clientName(sq)"></span></div>
                    <div class="small text-body-secondary" x-text="sq.site_address"></div>
                    <div class="small" x-show="sec.hint !== undefined" x-text="sec.hint ? sec.hint(sq) : ''"></div></span>
                  <span class="row-end small"><span x-html="quoteBadge(sq)"></span><div class="mt-1" x-text="pln(netTotal(sq))"></div></span>
                  <i class="bi bi-chevron-right chev" aria-hidden="true"></i></a></li>
              </template>
            </ul>
          </section>
        </template>
        <h2 class="group-title">Na skróty</h2>
        <div class="group">
          <a class="row-link" :href="link('quotes-index')"><span class="row-icon"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></span><span class="row-main">Lista wycen</span><i class="bi bi-chevron-right chev" aria-hidden="true"></i></a>
          <a class="row-link" :href="link('realizations-index')"><span class="row-icon"><i class="bi bi-cone-striped" aria-hidden="true"></i></span><span class="row-main">Lista realizacji</span><i class="bi bi-chevron-right chev" aria-hidden="true"></i></a>
          <a class="row-link" :href="link('stages')"><span class="row-icon"><i class="bi bi-list-task" aria-hidden="true"></i></span><span class="row-main">Prace i Etapy</span><i class="bi bi-chevron-right chev" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>
  </div></div>
</main>
<script type="module">
import { boot } from './assets/app.js';
boot(() => ({
  realizationSections() {
    const _r = this.realizationsSorted();
    return [
      { title: 'Realizacje w trakcie', items: _r.filter((r) => r.status === 'in_progress') },
      { title: 'Planowane realizacje', items: _r.filter((r) => r.status === 'planned') },
    ];
  },
  quoteSections() {
    const _q = this.quotesSorted();
    return [
      { title: 'Oczekuje zmiany — uwagi klienta do poprawy', items: _q.filter((q) => q.status === 'changes_requested'),
        hint: (q) => q.rooms.filter((r) => r.client_comment).map((r) => `${r.name}: ${r.client_comment}`)[0] ?? q.client_general_comment },
      { title: 'Zaakceptowane — do przekształcenia w realizację', items: _q.filter((q) => q.status === 'accepted' && !this.realizationOf(q)) },
      { title: 'Szkice', items: _q.filter((q) => q.status === 'draft'),
        hint: (q) => (q.applied_profile_name ? (q.planned_end_on ? `Termin: ${this.date(q.planned_end_on)}` : 'brak terminu zakończenia') : 'bez wykonawców') },
      { title: 'Wysłane — czekają na odpowiedź klienta', items: _q.filter((q) => q.status === 'sent') },
    ];
  },
}));
</script>
</body>
</html>
