<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start — IKPM</title>
<link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/ikpm-ui.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-screen="start" data-nav="start" data-tab="start">
<main x-data="page" x-cloak>
  <div class="ikpm-content">
    <div class="ikpm-page-head">
      <div class="ikpm-page-heading"><h1 class="ikpm-page-title">Start</h1>
        <p class="ikpm-page-meta mb-0">Bieżąca praca: realizacje w toku i wyceny, które czekają na następny krok.</p></div>
      <div class="ikpm-page-actions">
        <a class="btn btn-primary btn-lg" :href="link('quotes-new', {mode: 'rooms'})"><i class="bi bi-plus-square" aria-hidden="true"></i>Nowa wycena (pokoje)</a>
        <a class="btn btn-outline-primary btn-lg" :href="link('quotes-new', {mode: 'simple'})"><i class="bi bi-plus-lg" aria-hidden="true"></i>Nowa wycena (prosta)</a>
      </div>
    </div>

    <div class="start-grid">
      <div class="start-col">
        <template x-for="sec in realizationSections()" :key="sec.title">
          <section>
            <h2 class="ikpm-section-title" x-text="sec.title + ' (' + sec.items.length + ')'"></h2>
            <div class="ikpm-empty py-3" x-show="!sec.items.length"><p>Brak realizacji w tym stanie.</p></div>
            <ul class="ikpm-list" x-show="sec.items.length">
              <template x-for="r in sec.items" :key="r.id">
                <li><a class="ikpm-row" :href="link('realization-show', {id: r.id})">
                  <span class="ikpm-row-main"><span class="ikpm-row-title">Realizacja #<span x-text="r.id"></span> · <span x-text="clientName(r)"></span></span>
                    <span class="ikpm-row-meta" x-text="r.site_address"></span>
                    <span class="row-progress"><span class="progress" role="progressbar" :aria-label="'Postęp prac realizacji #' + r.id" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressOf(rJobs(r)).pct">
                        <span class="progress-bar" :style="'width:' + progressOf(rJobs(r)).pct + '%'"></span></span><span x-text="progressOf(rJobs(r)).pct + '%'"></span></span>
                    <span class="row-tags" x-show="rJobs(r).some(j => j.status === 'remake')"><span x-html="jobBadge('remake', 'Do poprawy: ' + rJobs(r).filter(j => j.status === 'remake').length)"></span></span></span>
                  <span class="ikpm-row-end"><span x-html="realBadge(r)"></span>
                    <span class="ikpm-meta" :class="endDelayed(r) && 'row-late'" x-text="'Termin: ' + date(r.expected_end_on || r.promised_end_on)"></span>
                    <span class="ikpm-meta row-late" x-show="endDelayed(r)" x-text="'obiecany ' + date(r.promised_end_on)"></span></span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
              </template>
            </ul>
          </section>
        </template>
      </div>
      <div class="start-col start-quotes">
        <template x-for="sec in quoteSections()" :key="sec.title">
          <section x-show="sec.items.length">
            <h2 class="ikpm-section-title" x-text="sec.title + ' (' + sec.items.length + ')'"></h2>
            <ul class="ikpm-list">
              <template x-for="sq in sec.items" :key="sq.id">
                <li><a class="ikpm-row" :href="quoteHref(sq)">
                  <span class="ikpm-row-main"><span class="ikpm-row-title">Wycena #<span x-text="sq.id"></span> · <span x-text="clientName(sq)"></span></span>
                    <span class="ikpm-row-meta" x-text="sq.site_address"></span>
                    <span class="d-block mt-1" :class="sec.warn && sec.warn(sq) ? 'row-late' : ''" x-show="!!sec.hint" x-text="sec.hint ? sec.hint(sq) : ''"></span></span>
                  <span class="ikpm-row-end"><span x-html="quoteBadge(sq)"></span><span class="ikpm-amount" x-text="pln(netTotal(sq))"></span></span>
                  <i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
              </template>
            </ul>
          </section>
        </template>
        <section>
          <h2 class="ikpm-section-title">Na skróty</h2>
          <ul class="ikpm-list">
            <li><a class="ikpm-row" :href="link('quotes-index')"><span class="row-icon"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></span><span class="ikpm-row-main">Lista wycen</span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
            <li><a class="ikpm-row" :href="link('realizations-index')"><span class="row-icon"><i class="bi bi-cone-striped" aria-hidden="true"></i></span><span class="ikpm-row-main">Lista realizacji</span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
            <li><a class="ikpm-row" :href="link('stages')"><span class="row-icon"><i class="bi bi-list-task" aria-hidden="true"></i></span><span class="ikpm-row-main">Prace i Etapy</span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
          </ul>
        </section>
      </div>
    </div>
  </div>
</main>
<script type="module">
import { boot } from './assets/app.js';
boot(() => ({
  realizationSections() {
    const _r = this.realizationsSorted();
    return [
      { title: 'Realizacje w trakcie', items: _r.filter((r) => r.status === 'in_progress') },
      { title: 'Planowane realizacje', items: _r.filter((r) => r.status === 'planned') },
    ];
  },
  quoteSections() {
    const _q = this.quotesSorted();
    return [
      { title: 'Oczekuje zmiany — uwagi klienta do poprawy', items: _q.filter((q) => q.status === 'changes_requested'),
        hint: (q) => q.rooms.filter((r) => r.client_comment).map((r) => `${r.name}: ${r.client_comment}`)[0] ?? q.client_general_comment },
      { title: 'Zaakceptowane — do przekształcenia w realizację', items: _q.filter((q) => q.status === 'accepted' && !this.realizationOf(q)) },
      { title: 'Szkice', items: _q.filter((q) => q.status === 'draft'),
        hint: (q) => (q.applied_profile_name ? (q.planned_end_on ? `Termin: ${this.date(q.planned_end_on)}` : 'brak terminu zakończenia') : 'bez wykonawców'),
        warn: (q) => q.applied_profile_name && !q.planned_end_on },
      { title: 'Wysłane — czekają na odpowiedź klienta', items: _q.filter((q) => q.status === 'sent') },
    ];
  },
}));
</script>
</body>
</html>
