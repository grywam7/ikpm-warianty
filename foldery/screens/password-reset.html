<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przypomnienie hasła — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="password-reset">
<main x-data="page" x-cloak>
<div class="guest"><div class="card-plain p-4">
  <div class="mb-3"><strong class="fs-4">IKPM</strong><div class="small text-body-secondary">System kosztorysów</div></div>
  <template x-if="step !== 'new'"><div>
    <h1 class="h3 mb-3">Zapomniałeś swojego hasła?</h1>
    <form @submit.prevent="send()" novalidate>
      <label class="form-label" for="r-email">Email</label><input id="r-email" class="form-control mb-3" type="email" autocomplete="email" x-model="email">
      <button class="btn btn-primary btn-main w-100" type="submit">Wyślij instrukcje zmiany hasła</button></form>
    <div class="d-flex flex-wrap gap-3 mt-3"><a class="tap" :href="link('login')">Zaloguj się</a><a class="tap gap-2" :href="link('password-reset', {krok: 'nowe'})">Nowe hasło (z linku w mailu) <span class="koncepcja">prototyp</span></a></div></div></template>
  <template x-if="step === 'new'"><div>
    <h1 class="h3 mb-3">Zmień swoje hasło</h1>
    <form @submit.prevent="change()" novalidate>
      <label class="form-label" for="r-pass">Nowe hasło</label><input id="r-pass" class="form-control" type="password" autocomplete="new-password" aria-describedby="r-hint" x-model="pass">
      <div class="small text-body-secondary mb-2" id="r-hint">(minimum 6 znaków)</div>
      <label class="form-label" for="r-pass2">Powtórz nowe hasło</label><input id="r-pass2" class="form-control mb-3" type="password" autocomplete="new-password" x-model="pass2">
      <button class="btn btn-primary btn-main w-100" type="submit">Zmień moje hasło</button></form>
    <div class="d-flex flex-wrap gap-3 mt-3"><a class="tap" :href="link('login')">Zaloguj się</a><a class="tap" :href="link('password-reset')">Zapomniałeś hasła?</a></div></div></template>
</div></div>
</main>
<script type="module">
import { boot, alertBox, flashNext, go } from '../assets/app.js';
boot(() => ({
  step: new URLSearchParams(location.search).get('krok') === 'nowe' ? 'new' : 'send', email: '', pass: '', pass2: '',
  init() { if (this.step === 'new') document.title = 'Nowe hasło — IKPM'; },
  send() { flashNext('notice', 'Instrukcja zmiany hasła zostanie niezwłocznie wysłana na podany adres e-mail.'); go('login'); },
  change() {
    if (this.pass.length < 6) { alertBox('Hasło jest za krótkie (przynajmniej 6 znaków)'); return; }
    if (this.pass !== this.pass2) { alertBox('Powtórz nowe hasło musi być takie samo jak hasło'); return; }
    flashNext('notice', 'Hasło zmienione poprawnie. Zostałeś automatycznie zalogowany.'); go('start');
  },
}), { shell: false });
</script>
</body>
</html>
