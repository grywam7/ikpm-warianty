<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oferta — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="public-quote">
<header class="ikpm-public-bar"><strong>IKPM</strong></header>
<main x-data="page" x-cloak class="ikpm-public" id="main">
<template x-if="q && q.status === 'draft'">
  <div class="ikpm-empty"><i class="bi bi-hourglass-split" aria-hidden="true"></i><h1 class="ikpm-empty-title">Oferta jest aktualizowana</h1><p>Otrzymają Państwo nową wiadomość, gdy będzie gotowa.</p></div>
</template>
<template x-if="q && q.status !== 'draft'">
  <div>
    <h1 class="ikpm-page-title">Wycena #<span x-text="q.id"></span></h1>
    <p class="ikpm-meta mb-2" x-text="'Wysłana: ' + dateTime(q.sent_at)"></p>
    <div class="ikpm-contact mb-3"><span class="fw-semibold" x-text="q.user || 'Zespół IKPM'"></span>
      <a :href="'mailto:' + senderEmail()" x-show="senderEmail()"><i class="bi bi-envelope" aria-hidden="true"></i><span x-text="senderEmail()"></span></a></div>
    <div class="card"><div class="card-body">
      <div class="mb-3"><span class="ikpm-status ikpm-status-lg" :class="'ikpm-st-quote-' + q.status" x-text="CLIENT_STATUS[q.status]"></span></div>
      <dl class="ikpm-dl dl-stack">
        <dt>Klient</dt><dd><span x-text="clientName(q)"></span><span class="d-block ikpm-meta" x-text="client(q.client_id)?.email"></span></dd>
        <template x-if="q.site_address"><dt>Adres inwestycji</dt></template><template x-if="q.site_address"><dd x-text="q.site_address"></dd></template>
        <template x-if="q.planned_start_on"><dt>Planowany start</dt></template><template x-if="q.planned_start_on"><dd x-text="date(q.planned_start_on)"></dd></template>
        <template x-if="q.planned_end_on"><dt>Termin zakończenia</dt></template><template x-if="q.planned_end_on"><dd x-text="date(q.planned_end_on)"></dd></template>
      </dl>
    </div></div>
    <section class="card mt-3" aria-labelledby="sum-title"><div class="card-body">
      <h2 class="h5 mb-3" id="sum-title">Podsumowanie</h2>
      <dl class="ikpm-totals">
        <div><dt>Razem netto</dt><dd x-text="pln(totals(q).net)"></dd></div>
        <div><dt x-text="'VAT ' + Number(q.vat_rate) + '%'"></dt><dd x-text="pln(totals(q).vat)"></dd></div>
        <div class="ikpm-totals-grand"><dt>Razem brutto</dt><dd x-text="pln(totals(q).gross)"></dd></div>
      </dl>
    </div></section>
    <div class="alert alert-success d-flex gap-2 mt-3" x-show="['accepted', 'rejected'].includes(q.status)"><i class="bi bi-check-circle-fill" aria-hidden="true"></i><span x-text="'Wycena ma już zapisaną odpowiedź z dnia ' + date(q.responded_at) + '. Dziękujemy.'"></span></div>
    <template x-if="trackable()"><div class="alert alert-info mt-3"><p class="mb-2" x-text="trackable().status === 'done' ? 'Prace z tej wyceny zostały zakończone —' : 'Prace z tej wyceny są w realizacji —'"></p>
      <a class="btn btn-primary btn-lg" :href="link('public-realization', {id: trackable().id})"><i class="bi bi-cone-striped" aria-hidden="true"></i>Śledź postęp prac</a></div></template>
    <h2 class="ikpm-section-title">Zakres prac</h2>
    <template x-for="pr in q.rooms" :key="pr.id">
      <section class="pub-card" :aria-label="pr.name">
        <div class="pub-room"><h3 x-text="pr.name"></h3><span class="ikpm-meta" x-text="sizeLine(pr)"></span></div>
        <div class="pub-table-box">
        <table class="table pub-table mb-0">
          <thead><tr><th scope="col">Praca</th><th scope="col" class="c-wide">Etap</th><th scope="col" class="c-wide ikpm-num">Ilość</th><th scope="col" class="c-wide ikpm-num">Cena jedn. netto</th><th scope="col" class="ikpm-num">Wartość netto</th></tr></thead>
          <tbody>
            <template x-for="j in sortJobs(pr.jobs)" :key="j.id">
              <tr><td class="c-name"><span x-text="j.name"></span><span class="c-sub" x-text="j.stage + ' · ' + dec(j.quantity) + ' ' + j.unit + ' × ' + pln(jobUnitPrice(j, q))"></span></td>
                <td class="c-wide" x-text="j.stage"></td><td class="c-wide ikpm-num" x-text="dec(j.quantity) + ' ' + j.unit"></td><td class="c-wide ikpm-num" x-text="pln(jobUnitPrice(j, q))"></td>
                <td class="ikpm-num fw-semibold" x-text="pln(jobValue(j, q))"></td></tr>
            </template>
            <tr x-show="!pr.jobs.length"><td colspan="5" class="text-body-secondary">(brak prac w tym pokoju)</td></tr>
          </tbody>
        </table>
        </div>
        <template x-if="respondable()"><div class="p-3 border-top"><label class="form-label" :for="'cc-' + pr.id">Komentarz do pokoju</label>
          <textarea class="form-control" rows="2" maxlength="5000" placeholder="Opcjonalnie..." :id="'cc-' + pr.id" x-model="comments[pr.id]"></textarea></div></template>
        <template x-if="!respondable() && pr.client_comment"><div class="p-3 border-top"><b>Komentarz do pokoju:</b> <span x-text="pr.client_comment"></span></div></template>
      </section>
    </template>
    <div class="mt-4"><template x-if="respondable()"><div><label class="form-label" for="cc-general">Komentarz ogólny</label>
      <textarea id="cc-general" class="form-control" rows="3" maxlength="5000" placeholder="Uwagi do całej wyceny..." x-model="general"></textarea></div></template>
      <template x-if="!respondable() && q.client_general_comment"><div><b>Komentarz ogólny:</b> <span x-text="q.client_general_comment"></span></div></template></div>
    <template x-if="respondable()">
      <div class="ikpm-actionbar pub-decide">
        <div class="ikpm-actionbar-total"><span>Razem brutto</span><span class="ikpm-amount-lg" x-text="pln(totals(q).gross)"></span></div>
        <div class="ikpm-actionbar-actions">
          <button type="button" class="btn btn-outline-secondary btn-lg" @click="answer('changes_requested')"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Oczekuję zmiany</button>
          <button type="button" class="btn btn-success btn-lg" @click="answer('accepted')"><i class="bi bi-check-circle" aria-hidden="true"></i>Akceptuję wycenę</button></div>
      </div>
    </template>
  </div>
</template>
</main>
<footer class="ikpm-public-footer">Wygenerowane przez system IKPM.</footer>
<script type="module">
import { boot, db, save, intParam, link, todayISO, toast, alertBox, confirmBox } from '../assets/app.js';
boot(() => ({
  q: null, comments: {}, general: '',
  init() {
    const _q = db.quotes.find((x) => x.id === intParam('id')) ?? null;
    if (!_q || (_q.link_valid_until && _q.link_valid_until < todayISO())) { location.replace(link('error-404')); return; }
    for (const r of _q.rooms) this.comments[r.id] = r.client_comment ?? '';
    this.general = _q.client_general_comment ?? ''; this.q = _q; document.title = `Wycena #${_q.id} — IKPM`;
  },
  senderEmail() { const _u = db.users.find((u) => `${u.first_name} ${u.last_name}`.trim() === this.q.user); return _u?.email ?? ''; },
  respondable() { return ['sent', 'changes_requested'].includes(this.q.status); },
  trackable() { const _r = this.q.status === 'accepted' && this.realizationOf(this.q); return _r && _r.status !== 'cancelled' && (!_r.link_valid_until || _r.link_valid_until >= todayISO()) ? _r : null; },
  async answer(decision) {
    const _ok = await confirmBox(decision === 'accepted'
      ? { title: 'Zaakceptować wycenę?', consequences: ['Wykonawca dostanie Państwa akceptację; odpowiedzi nie da się potem zmienić.'], ok: 'Akceptuję wycenę', okClass: 'btn-success' }
      : { title: 'Wysłać prośbę o zmianę wyceny?', consequences: ['Wykonawca dostanie Państwa komentarze i przygotuje nową wersję oferty.'], ok: 'Oczekuję zmiany' });
    if (!_ok) return;
    if ([this.general, ...Object.values(this.comments)].some((t) => (t ?? '').length > 5000)) { alertBox('Uwaga jest za długa — najwyżej 5000 znaków.'); return; }
    for (const r of this.q.rooms) r.client_comment = (this.comments[r.id] ?? '').trim() || null;
    this.q.client_general_comment = this.general.trim() || null;
    this.q.status = decision; this.q.responded_at = new Date().toISOString(); save('quotes');
    toast(decision === 'accepted' ? 'Dziękujemy za akceptację wyceny!' : 'Dziękujemy — odpowiedź z prośbą o zmianę została wysłana do wykonawcy.');
  },
}), { shell: false });
</script>
</body>
</html>
