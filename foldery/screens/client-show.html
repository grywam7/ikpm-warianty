<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klient — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="client-show" data-nav="clients" data-tab="wyceny">
<main x-data="page" x-cloak>
<template x-if="c">
<div class="panes" data-level="2">
  <section class="pane pane-list" aria-label="Klienci" data-partial="client-list"></section>
  <section class="pane pane-folder" aria-label="Klient">
    <div class="ikpm-content">
      <div class="pane-head"><a class="ikpm-back" :href="link('clients')">Klienci</a><h1 class="ikpm-page-title" x-text="c.name"></h1></div>
      <div class="d-flex flex-wrap gap-2 mb-3"><a class="btn btn-outline-primary" :href="link('client-form', {id: c.id})"><i class="bi bi-pencil" aria-hidden="true"></i>Edytuj</a>
        <button type="button" class="btn btn-outline-danger" @click="destroy()"><i class="bi bi-trash" aria-hidden="true"></i>Usuń</button></div>
      <ul class="ikpm-list info-list">
        <li class="ikpm-row"><span class="ikpm-row-main">Email</span><span class="ikpm-row-end overflow-anywhere"><a class="tap" x-show="c.email" :href="'mailto:' + c.email" x-text="c.email"></a><span x-show="!c.email">—</span></span></li>
        <li class="ikpm-row"><span class="ikpm-row-main">Telefon</span><span class="ikpm-row-end"><a class="tap" x-show="c.phone" :href="'tel:' + c.phone.replace(/\s/g, '')" x-text="c.phone"></a><span x-show="!c.phone">—</span></span></li>
        <li class="ikpm-row"><span class="ikpm-row-main">Notatki</span><span class="ikpm-row-end" x-text="c.notes || '—'"></span></li>
      </ul>
      <h2 class="ikpm-section-title">Wyceny</h2>
      <ul class="ikpm-list">
        <template x-for="q in quotesSorted().filter(x => x.client_id === c.id)" :key="q.id">
          <li><a class="ikpm-row" :href="quoteHref(q)"><span class="ikpm-row-main"><div class="ikpm-row-title">Wycena #<span x-text="q.id"></span></div>
            <div class="ikpm-meta" x-text="'Utworzona: ' + date(q.created_on) + ' · Wysłana: ' + date(q.sent_at)"></div></span>
            <span class="ikpm-row-end"><span x-html="quoteBadge(q)"></span><span class="ikpm-amount" x-text="pln(netTotal(q))"></span></span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
        </template>
        <li class="ikpm-row" x-show="!db.quotes.some(x => x.client_id === c.id)"><span class="text-body-secondary">Brak wycen.</span></li>
      </ul>
      <h2 class="ikpm-section-title">Realizacje</h2>
      <ul class="ikpm-list">
        <template x-for="r in realizationsSorted().filter(x => x.client_id === c.id)" :key="r.id">
          <li><a class="ikpm-row" :href="link('realization-show', {id: r.id})"><span class="ikpm-row-main"><div class="ikpm-row-title">Realizacja #<span x-text="r.id"></span></div>
            <div class="ikpm-meta" x-text="'Wartość (z wyceny): ' + pln(r.total_price)"></div>
            <div class="progress mt-1" role="progressbar" :aria-label="'Postęp prac realizacji #' + r.id" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressOf(rJobs(r)).pct"><div class="progress-bar" :style="'width:' + progressOf(rJobs(r)).pct + '%'"></div></div></span>
            <span class="ikpm-row-end"><span x-html="realBadge(r)"></span><div class="ikpm-meta" x-text="progressOf(rJobs(r)).pct + '%'"></div></span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
        </template>
        <li class="ikpm-row" x-show="!db.realizations.some(x => x.client_id === c.id)"><span class="text-body-secondary">Brak realizacji.</span></li>
      </ul>
    </div>
  </section>
</div>
</template>
</main>
<script type="module">
import { boot, db, save, intParam, link, go, alertBox, confirmBox, flashNext } from '../assets/app.js';
boot(() => ({
  c: null,
  init() {
    const _c = db.clients.find((x) => x.id === intParam('id')) ?? null;
    if (!_c) { location.replace(link('error-404')); return; }
    this.currentClientId = _c.id; this.c = _c; document.title = `${_c.name} — Klienci — IKPM`;
  },
  async destroy() {
    const _ok = await confirmBox({ title: `Usunąć klienta „${this.c.name}”?`, consequences: ['Klient zniknie z bazy — klienta z wycenami lub realizacjami nie da się usunąć.'], ok: 'Usuń', okClass: 'btn-danger' }); if (!_ok) return;
    if (db.quotes.some((q) => q.client_id === this.c.id)) { alertBox('Nie można usunąć, gdyż istnieją zależne od niego wyceny'); return; }
    if (db.realizations.some((r) => r.client_id === this.c.id)) { alertBox('Nie można usunąć, gdyż istnieją zależne od niego realizacje'); return; }
    const _i = db.clients.findIndex((x) => x.id === this.c.id); if (_i < 0) return; db.clients.splice(_i, 1); save('clients'); flashNext('notice', 'Klient usunięty.'); go('clients');
  },
}));
</script>
</body>
</html>
