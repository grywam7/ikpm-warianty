<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd wyceny — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="quote-show" data-nav="quotes-index" data-tab="wyceny">
<main x-data="page" x-cloak>
<template x-if="q">
<div class="panes" data-level="2">
  <section class="pane pane-list" aria-label="Lista wycen" data-partial="quote-list"></section>
  <section class="pane pane-folder" aria-label="Podgląd wyceny">
    <div class="pane-inner">
      <div class="pane-head">
        <a class="back-link" :href="link('quotes-index')"><i class="bi bi-chevron-left" aria-hidden="true"></i>Wyceny</a>
        <h1 class="pane-title">Wycena #<span x-text="q.id"></span></h1>
        <div class="d-flex flex-wrap gap-2 align-items-center"><span x-html="quoteBadge(q)"></span><span class="pane-sub" x-text="clientName(q)"></span></div>
      </div>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <template x-if="q.status === 'draft'"><a class="btn btn-primary btn-main" :href="link('builder', {id: q.id})"><i class="bi bi-pencil" aria-hidden="true"></i> Edytuj</a></template>
        <template x-if="q.status === 'draft'"><a class="btn btn-outline-primary btn-main" :href="link('match-contractors', {id: q.id})"><i class="bi bi-people" aria-hidden="true"></i> Dobierz wykonawców</a></template>
        <template x-if="q.status !== 'draft' && !realizationOf(q)"><button type="button" class="btn btn-warning btn-main" @click="doReopen()"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Przywróć do edycji</button></template>
        <template x-if="q.status === 'accepted' && !realizationOf(q)"><button type="button" class="btn btn-success btn-main" @click="doConvert()"><i class="bi bi-cone-striped" aria-hidden="true"></i> Przekształć w realizację</button></template>
        <template x-if="realizationOf(q)"><a class="btn btn-success btn-main" :href="link('realization-show', {id: realizationOf(q).id})"><i class="bi bi-cone-striped" aria-hidden="true"></i> Realizacja</a></template>
        <a class="btn btn-outline-secondary btn-main" :href="link('quote-pdf', {id: q.id})" target="_blank" rel="noopener"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> PDF</a>
        <button type="button" class="btn btn-outline-secondary btn-main" @click="doCopy()"><i class="bi bi-copy" aria-hidden="true"></i> Kopiuj</button>
      </div>

      <template x-if="hasClientComments(q)">
        <div class="alert alert-warning" role="note"><div class="fw-bold"><i class="bi bi-chat-left-text" aria-hidden="true"></i> Uwagi klienta</div>
          <div x-text="q.client_general_comment || '(brak komentarza ogólnego — sprawdź komentarze przy pokojach)'"></div></div>
      </template>

      <ul class="group">
        <li class="row-item"><span class="row-main text-body-secondary">Klient</span><span class="row-end">
          <template x-if="client(q.client_id)"><span><a class="tap" :href="link('client-show', {id: q.client_id})" x-text="client(q.client_id).name"></a>
            <div class="small" x-text="client(q.client_id).email"></div><div class="small" x-text="client(q.client_id).phone"></div></span></template>
          <template x-if="!client(q.client_id)"><span>(nie przypisano)</span></template></span></li>
        <li class="row-item"><span class="row-main text-body-secondary">Status</span><span class="row-end" x-html="quoteBadge(q)"></span></li>
        <li class="row-item"><span class="row-main text-body-secondary">Data utworzenia</span><span class="row-end" x-text="date(q.created_on)"></span></li>
        <li class="row-item" x-show="q.sent_at"><span class="row-main text-body-secondary">Wysłana</span><span class="row-end" x-text="date(q.sent_at)"></span></li>
        <li class="row-item" x-show="q.site_address"><span class="row-main text-body-secondary">Adres inwestycji</span><span class="row-end" x-text="q.site_address"></span></li>
        <li class="row-item" x-show="q.planned_start_on"><span class="row-main text-body-secondary">Planowany start</span><span class="row-end" x-text="date(q.planned_start_on)"></span></li>
        <li class="row-item" x-show="q.planned_end_on"><span class="row-main text-body-secondary">Termin zakończenia</span><span class="row-end" x-text="date(q.planned_end_on)"></span></li>
      </ul>

      <template x-for="pr in q.rooms" :key="pr.id">
        <section class="mt-3" :aria-labelledby="'room-h-' + pr.id">
          <div class="d-flex flex-wrap align-items-baseline gap-2 mt-4 mb-2">
            <h2 class="h5 mb-0 me-auto" :id="'room-h-' + pr.id"><i class="bi bi-door-open" aria-hidden="true"></i> <span x-text="pr.name"></span></h2>
            <span class="small text-body-secondary" x-text="sizeLine(pr)"></span>
          </div>
          <div class="alert alert-warning py-2" x-show="pr.client_comment" role="note"><b>Komentarz klienta:</b> <span x-text="pr.client_comment"></span></div>
          <div class="small mb-2" x-show="pr.notes"><i class="bi bi-lock" aria-hidden="true"></i> <b>Notatka:</b> <span x-text="pr.notes"></span></div>
          <ul class="group">
            <template x-for="j in sortJobs(pr.jobs)" :key="j.id">
              <li class="row-item"><span class="row-main"><div x-text="j.name"></div><div class="small text-body-secondary" x-text="j.stage + ' · ' + dec(j.quantity) + ' ' + j.unit + ' × ' + pln(jobUnitPrice(j, q))"></div></span>
                <span class="row-end fw-semibold" x-text="pln(jobValue(j, q))"></span></li>
            </template>
            <li class="row-item" x-show="!pr.jobs.length"><span class="text-body-secondary">(brak prac w tym pokoju)</span></li>
            <li class="row-item"><span class="row-main fw-semibold">Suma pokoju:</span><span class="row-end fw-bold" x-text="pln(roomTotal(pr, q))"></span></li>
          </ul>
          <details class="mt-2"><summary class="btn btn-outline-secondary"><i class="bi bi-bookmark-plus" aria-hidden="true"></i> Zapisz jako szablon</summary>
            <div class="card-plain mt-2">
              <label class="form-label" :for="'tpl-' + pr.id">Nazwa szablonu</label>
              <input class="form-control" :id="'tpl-' + pr.id" maxlength="100" :value="pr.name" :aria-describedby="'tplh-' + pr.id">
              <div class="small text-body-secondary mb-2" :id="'tplh-' + pr.id">Nowy szablon z wymiarami i pracami pokoju (ilości tylko prac ręcznych).</div>
              <button type="button" class="btn btn-primary" @click="saveTpl(pr, document.getElementById('tpl-' + pr.id).value)">Zapisz szablon</button>
            </div></details>
        </section>
      </template>

      <h2 class="group-title mt-4">Podsumowanie</h2>
      <ul class="group">
        <li class="row-item"><span class="row-main">Pokoje:</span><span class="row-end" x-text="q.rooms.length"></span></li>
        <li class="row-item"><span class="row-main">Prace:</span><span class="row-end" x-text="qJobs(q).length"></span></li>
        <li class="row-item"><span class="row-main">Koszt (ekipy + materiały):</span><span class="row-end" x-text="pln(quoteCost(q))"></span></li>
        <li class="row-item"><span class="row-main">Narzut:</span><span class="row-end" x-text="dec(q.markup_percent) + ' %'"></span></li>
        <li class="row-item"><span class="row-main">Marża:</span><span class="row-end" x-text="pln(totals(q).net - quoteCost(q))"></span></li>
        <li class="row-item"><span class="row-main">Razem netto</span><span class="row-end fw-semibold" data-total-net x-text="pln(totals(q).net)"></span></li>
        <li class="row-item"><span class="row-main" x-text="'VAT ' + Number(q.vat_rate) + '%'"></span><span class="row-end" x-text="pln(totals(q).vat)"></span></li>
        <li class="row-item"><span class="row-main fw-bold">Razem brutto</span><span class="row-end fw-bold fs-5" x-text="pln(totals(q).gross)"></span></li>
      </ul>
      <h2 class="group-title">Notatki</h2>
      <div class="card-plain" style="white-space:pre-line" x-text="q.notes || '—'"></div>
      <a class="btn btn-outline-secondary mt-3" :href="link('quotes-index')">Wróć do listy</a>
    </div>
  </section>
</div>
</template>
</main>
<script type="module">
import { boot, db, quoteOps, intParam, link, saveRoomAsTemplate, toast, alertBox } from '../assets/app.js';
boot(() => ({
  ...quoteOps(),
  init() {
    const _q = db.quotes.find((x) => x.id === intParam('id')) ?? null;
    if (!_q) { location.replace(link('error-404')); return; }
    this.currentQuoteId = _q.id; this.q = _q;
    document.title = `Wycena #${_q.id} — IKPM`;
  },
  saveTpl(room, name) { const _r = saveRoomAsTemplate(room, name); if (_r.ok) toast(_r.notice); else alertBox(_r.error); },
}));
</script>
</body>
</html>
