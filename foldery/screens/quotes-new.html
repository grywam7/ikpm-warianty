<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nowa wycena — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="quotes-new" data-nav="quotes-new" data-tab="wyceny">
<main x-data="page" x-cloak>
<div class="panes" data-level="2">
  <section class="pane pane-list" aria-label="Lista wycen" data-partial="quote-list"></section>
  <section class="pane pane-folder" aria-label="Nowa wycena">
    <div class="ikpm-content">
      <div class="pane-head"><a class="ikpm-back" :href="link('quotes-index')">Wyceny</a>
        <h1 class="ikpm-page-title">Nowa wycena</h1></div>
      <form class="card card-body" @submit.prevent="create()">
        <div class="ikpm-grid" style="--ikpm-grid-min: 18rem">
          <div><label class="form-label" for="new-client">Klient (opcjonalnie)</label>
            <select id="new-client" class="form-select" x-model="clientId" aria-describedby="new-client-hint">
              <option value="">-- wybierz później --</option>
              <template x-for="c in clientsSorted()" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
            </select>
            <div class="form-text" id="new-client-hint">Możesz przypisać klienta później</div></div>
          <div><label class="form-label" for="new-notes">Notatki</label>
            <textarea id="new-notes" class="form-control" rows="3" placeholder="Dodatkowe informacje o wycenie..." x-model="notes"></textarea></div>
        </div>
        <fieldset class="mt-3 mb-3">
          <legend class="form-label">Tryb</legend>
          <div class="ikpm-grid" style="--ikpm-grid-min: 18rem">
            <label class="ikpm-choice" for="mode-rooms"><input type="radio" id="mode-rooms" name="mode" value="rooms" x-model="mode"><i class="bi bi-plus-square" aria-hidden="true"></i>
              <span><span class="ikpm-row-title">Tryb z pokojami</span><span class="ikpm-row-meta">Po utworzeniu wyceny zostaniesz przeniesiony do edytora, gdzie możesz dodawać pokoje i prace.</span></span></label>
            <label class="ikpm-choice" for="mode-simple"><input type="radio" id="mode-simple" name="mode" value="simple" x-model="mode"><i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span><span class="ikpm-row-title">Tryb prosty</span><span class="ikpm-row-meta">Wycena bez podziału na pokoje. Wszystkie prace będą przypisane do jednego "wirtualnego" pokoju.</span></span></label>
          </div>
        </fieldset>
        <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary btn-lg px-4">Utwórz wycenę</button>
          <a class="btn btn-outline-secondary btn-lg px-4" :href="link('quotes-index')">Anuluj</a></div>
      </form>
    </div>
  </section>
</div>
</main>
<script type="module">
import { boot, newQuote, flashNext, go, param } from '../assets/app.js';
boot(() => ({
  clientId: '', notes: '', mode: param('mode') === 'simple' ? 'simple' : 'rooms',
  init() { document.title = `${this.mode === 'simple' ? 'Nowa wycena (prosta)' : 'Nowa wycena (pokoje)'} — IKPM`; },
  create() {
    const _q = newQuote({ client_id: this.clientId ? Number(this.clientId) : null, notes: this.notes, mode: this.mode });
    flashNext('notice', 'Wycena utworzona. Możesz teraz dodawać pokoje i prace.');
    go('builder', { id: _q.id, room: _q.rooms[0].id });
  },
}));
</script>
</body>
</html>
