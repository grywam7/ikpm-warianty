<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowa wycena — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="quotes-new" data-nav="quotes-new" data-tab="wyceny">
<main x-data="page" x-cloak>
<div class="panes" data-level="2">
  <section class="pane pane-list" aria-label="Lista wycen" data-partial="quote-list"></section>
  <section class="pane pane-folder" aria-label="Nowa wycena">
    <div class="pane-inner">
      <div class="pane-head"><a class="back-link" :href="link('quotes-index')"><i class="bi bi-chevron-left" aria-hidden="true"></i>Wyceny</a>
        <h1 class="pane-title">Nowa wycena</h1></div>
      <form class="card-plain" @submit.prevent="create()">
        <label class="form-label" for="new-client">Klient (opcjonalnie)</label>
        <select id="new-client" class="form-select" x-model="clientId" aria-describedby="new-client-hint">
          <option value="">-- wybierz później --</option>
          <template x-for="c in clientsSorted()" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
        <div class="small text-body-secondary mb-3" id="new-client-hint">Możesz przypisać klienta później</div>
        <label class="form-label" for="new-notes">Notatki</label>
        <textarea id="new-notes" class="form-control mb-3" rows="3" placeholder="Dodatkowe informacje o wycenie..." x-model="notes"></textarea>
        <fieldset class="mb-3">
          <legend class="form-label fs-6">Tryb</legend>
          <div class="group">
            <label class="row-link" for="mode-rooms"><input class="form-check-input m-0" type="radio" id="mode-rooms" value="rooms" x-model="mode" style="width:1.4rem;height:1.4rem">
              <span class="row-main"><div class="fw-semibold">Tryb z pokojami</div><div class="small text-body-secondary">Po utworzeniu wyceny zostaniesz przeniesiony do edytora, gdzie możesz dodawać pokoje i prace.</div></span></label>
            <label class="row-link" for="mode-simple"><input class="form-check-input m-0" type="radio" id="mode-simple" value="simple" x-model="mode" style="width:1.4rem;height:1.4rem">
              <span class="row-main"><div class="fw-semibold">Tryb prosty</div><div class="small text-body-secondary">Wycena bez podziału na pokoje. Wszystkie prace będą przypisane do jednego "wirtualnego" pokoju.</div></span></label>
          </div>
        </fieldset>
        <div class="d-flex gap-2"><a class="btn btn-outline-secondary btn-main flex-fill" :href="link('quotes-index')">Anuluj</a>
          <button type="submit" class="btn btn-primary btn-main flex-fill">Utwórz wycenę</button></div>
      </form>
    </div>
  </section>
</div>
</main>
<script type="module">
import { boot, newQuote, flashNext, go, param } from '../assets/app.js';
boot(() => ({
  clientId: '', notes: '', mode: param('mode') === 'simple' ? 'simple' : 'rooms',
  init() { document.title = `${this.mode === 'simple' ? 'Nowa wycena (prosta)' : 'Nowa wycena (pokoje)'} — IKPM`; },
  create() {
    const _q = newQuote({ client_id: this.clientId ? Number(this.clientId) : null, notes: this.notes, mode: this.mode });
    flashNext('notice', 'Wycena utworzona. Możesz teraz dodawać pokoje i prace.');
    go('builder', { id: _q.id, room: _q.rooms[0].id });
  },
}));
</script>
</body>
</html>
