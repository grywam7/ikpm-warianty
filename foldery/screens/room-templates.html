<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szablony pokoi — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="room-templates" data-nav="room-templates" data-tab="dane">
<main x-data="page" x-cloak>
<div class="panes" :data-level="level">
  <section class="pane pane-list" aria-label="Szablony pokoi">
    <div class="ikpm-content">
      <div class="pane-head"><a class="ikpm-back back-only-phone" :href="link('data')">Dane</a><h1 class="ikpm-page-title">Szablony pokoi</h1></div>
      <ul class="ikpm-list list-tiles">
        <li><a class="ikpm-row ikpm-row-add" :href="link('room-templates', {id: 'new'})" :aria-current="isNew ? 'page' : null"><span class="row-icon"><i class="bi bi-plus-lg" aria-hidden="true"></i></span>Nowy szablon</a></li>
      </ul>
      <h2 class="ikpm-section-title">Szablony</h2>
      <ul class="ikpm-list list-cols">
        <template x-for="t in sorted()" :key="t.id">
          <li><a class="ikpm-row" :href="link('room-templates', {id: t.id})" :aria-current="cur && cur.id === t.id ? 'page' : null">
            <span class="ikpm-row-main"><div class="ikpm-row-title" x-text="t.name"></div><div class="ikpm-meta" x-text="t.description"></div></span>
            <span class="ikpm-row-end"><span class="ikpm-chip" title="Liczba prac" x-text="jobsNom(t.jobs.length)"></span></span><i class="bi bi-chevron-right ikpm-chevron" aria-hidden="true"></i></a></li>
        </template>
      </ul>
      <p class="ikpm-meta mt-2" x-show="!db.templates.length">Brak szablonów. Dodaj pierwszy szablon klikając przycisk powyżej.</p>
    </div>
  </section>
  <section class="pane pane-folder" aria-label="Szablon pokoju">
    <template x-if="cur || isNew">
      <div class="ikpm-content">
        <div class="pane-head"><a class="ikpm-back" :href="link('room-templates')">Szablony pokoi</a>
          <h1 class="ikpm-page-title" x-text="isNew ? 'Nowy szablon' : cur.name"></h1></div>
        <div class="fold-grid">
        <form class="card card-body align-self-start" :data-dirty-watch="isNew ? null : 'Szablon'" @submit.prevent="submit()">
          <label class="form-label" for="t-name">Nazwa szablonu</label><input id="t-name" class="form-control mb-2" maxlength="100" placeholder="np. Łazienka standardowa" x-model="form.name">
          <label class="form-label" for="t-order">Kolejność</label><input id="t-order" class="form-control ikpm-num mb-2" type="number" inputmode="decimal" min="0" max="10000" x-model="form.order">
          <label class="form-label" for="t-desc">Opis (opcjonalnie)</label><textarea id="t-desc" class="form-control mb-2" rows="2" placeholder="Opis..." x-model="form.description"></textarea>
          <p class="ikpm-meta mb-1">Typowe wymiary (opcjonalnie) — wybór szablonu w oknie pokoju wpisze je w puste pola.</p>
          <div class="dim-grid mb-3"><template x-for="[f, label] in DIMENSIONS" :key="f">
            <div><label class="form-label small" :for="'t-' + f" x-text="label"></label><input class="form-control ikpm-num" :id="'t-' + f" type="number" inputmode="decimal" step="any" min="0" x-model="form[f]"></div></template></div>
          <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" type="submit" x-text="isNew ? 'Dodaj szablon' : 'Zapisz'"></button><span class="ikpm-save form-dirty align-self-center" data-state="dirty" hidden>Niezapisane zmiany</span>
            <template x-if="cur"><button type="button" class="btn btn-outline-danger" @click="destroy()"><i class="bi bi-trash" aria-hidden="true"></i> Usuń</button></template></div>
        </form>
        <template x-if="cur">
          <div>
            <h2 class="ikpm-section-title d-flex align-items-center gap-2">Prace <span class="ikpm-chip" x-text="jobsNom(cur.jobs.length)"></span></h2>
            <ul class="ikpm-list">
              <template x-for="tj in [...cur.jobs].sort((a, b) => a.order - b.order)" :key="tj.job_id">
                <li class="ikpm-row flex-wrap">
                  <span class="ikpm-row-main"><div class="ikpm-row-title" x-text="catJob(tj.job_id)?.name + ' (' + catJob(tj.job_id)?.unit + ')'"></div>
                    <div class="row-tags"><span class="ikpm-chip" x-text="stageOfJob(tj.job_id)?.name"></span>
                      <template x-if="catJob(tj.job_id)?.area_type !== 'manual'"><span class="ikpm-chip" x-text="AREA_LABELS[catJob(tj.job_id)?.area_type]"></span></template></div></span>
                  <template x-if="catJob(tj.job_id)?.area_type === 'manual'"><span><label class="form-label small" :for="'tq-' + tj.job_id">Ilość</label>
                    <input class="form-control ikpm-num" style="width:7rem" :id="'tq-' + tj.job_id" type="number" inputmode="decimal" step="any" min="0" placeholder="1" :value="tj.quantity ?? ''" @change="setQty(tj, $event.target)"></span></template>
                  <button type="button" class="btn btn-outline-danger ikpm-btn-icon" :aria-label="'Usuń pracę: ' + catJob(tj.job_id)?.name" @click="removeJob(tj)"><i class="bi bi-trash" aria-hidden="true"></i></button>
                </li>
              </template>
              <li><button type="button" class="ikpm-row ikpm-row-add" @click="addOpen = !addOpen" :aria-expanded="addOpen"><span class="row-icon"><i class="bi bi-plus-lg" aria-hidden="true"></i></span>Dodaj pracę</button></li>
            </ul>
            <p class="ikpm-meta mt-2" x-show="!cur.jobs.length">Brak prac w szablonie. Dodaj prace poniżej.</p>
            <form class="card card-body mt-2" x-show="addOpen" @submit.prevent="addJob()">
              <label class="form-label" for="tj-job">Praca</label>
              <select id="tj-job" class="form-select mb-2" x-model="addJobId"><option value="">-- Wybierz pracę --</option>
                <template x-for="s in stagesSorted()" :key="s.id"><optgroup :label="s.name"><template x-for="j in s.jobs.filter(j => !cur.jobs.some(x => x.job_id === j.id))" :key="j.id"><option :value="String(j.id)" x-text="j.name + ' (' + j.unit + ')'"></option></template></optgroup></template></select>
              <label class="form-label" for="tj-order">Kolejność</label><input id="tj-order" class="form-control ikpm-num mb-3" type="number" inputmode="decimal" min="0" max="10000" x-model="addOrder">
              <button class="btn btn-primary" type="submit">Dodaj</button></form>
          </div>
        </template>
        </div>
      </div>
    </template>
  </section>
</div>
</main>
<script type="module">
import { boot, db, save, intParam, param, link, go, toast, alertBox, confirmBox, flashNext, roundHalfUp, catJob, DIMENSIONS } from '../assets/app.js';
boot(() => ({
  level: 1, cur: null, isNew: false, form: {}, addOpen: false, addJobId: '', addOrder: '',
  init() {
    this.isNew = param('id') === 'new';
    this.cur = db.templates.find((t) => t.id === intParam('id')) ?? null;
    this.level = this.cur || this.isNew ? 2 : 1;
    const _t = this.cur ?? { name: '', order: db.templates.length + 1, description: '' };
    this.form = { name: _t.name, order: String(_t.order), description: _t.description };
    for (const [f] of DIMENSIONS) this.form[f] = _t[f] ?? '';
    this.addOrder = String((this.cur?.jobs.length ?? 0) + 1);
    document.title = `${this.cur ? `${this.cur.name} — ` : ''}Szablony pokoi — IKPM`;
  },
  sorted() { return [...db.templates].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'pl')); },
  submit() {
    const _name = this.form.name.trim().replace(/\s+/g, ' ');
    if (!_name) { alertBox('Nazwa nie może być pusta'); return; }
    if (db.templates.some((t) => t !== this.cur && t.name.trim().replace(/\s+/g, ' ').toLowerCase() === _name.toLowerCase())) { alertBox('Szablon o tej nazwie już istnieje — zmień nazwę'); return; }
    const _data = { name: _name, order: Number(this.form.order) || 0, description: this.form.description };
    for (const [f] of DIMENSIONS) { const _v = this.form[f] === '' ? null : Number(this.form[f]); if (_v !== null && !(_v >= 0)) { alertBox('Wymiary i powierzchnie nie mogą być ujemne.'); return; } _data[f] = _v === null ? null : roundHalfUp(_v); }
    if (this.isNew) {
      const _t = { id: Math.max(0, ...db.templates.map((t) => t.id)) + 1, ..._data, jobs: [] };
      db.templates.push(_t); save('templates'); flashNext('notice', `Szablon '${_name}' został utworzony.`); go('room-templates', { id: _t.id }); return;
    }
    Object.assign(this.cur, _data); save('templates'); toast(`Szablon '${_name}' został zaktualizowany.`);
  },
  setQty(tj, el) {
    const _v = this.readNumber(el);
    if (_v !== null && (Number.isNaN(_v) || _v <= 0 || _v > 1e6)) { alertBox('Ilość musi być większa od 0'); el.value = tj.quantity ?? ''; return; }
    tj.quantity = _v === null ? null : roundHalfUp(_v); save('templates'); toast(`Zapisano ilość pracy „${catJob(tj.job_id)?.name}”.`);
  },
  addJob() {
    if (!this.addJobId) { alertBox('Praca musi istnieć'); return; }
    this.cur.jobs.push({ job_id: Number(this.addJobId), order: Number(this.addOrder) || 0, quantity: null });
    save('templates'); this.addJobId = ''; this.addOrder = String(this.cur.jobs.length + 1); toast('Praca została dodana do szablonu.');
  },
  async removeJob(tj) {
    const _ok = await confirmBox({ title: `Usunąć pracę '${catJob(tj.job_id)?.name}' z szablonu?`, ok: 'Usuń', okClass: 'btn-danger' }); if (!_ok) return;
    this.cur.jobs.splice(this.cur.jobs.indexOf(tj), 1); save('templates'); toast('Praca została usunięta z szablonu.');
  },
  async destroy() {
    const _ok = await confirmBox({ title: `Usunąć szablon '${this.cur.name}'?`, consequences: ['Szablon zniknie z okna pokoju; pokoje wycen zostają bez zmian.'], ok: 'Usuń', okClass: 'btn-danger' }); if (!_ok) return;
    const _i = db.templates.findIndex((x) => x.id === this.cur.id); if (_i < 0) return; db.templates.splice(_i, 1); save('templates'); flashNext('notice', `Szablon '${this.cur.name}' został usunięty.`); go('room-templates');
  },
}));
</script>
</body>
</html>
