<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dobieranie wykonawców — IKPM</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/ikpm-ui.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-screen="match-contractors" data-nav="quotes-index" data-tab="wyceny">
<main x-data="page" x-cloak>
<template x-if="q">
<div class="panes" data-level="3">
  <section class="pane pane-list" aria-label="Lista wycen" data-partial="quote-list"></section>
  <section class="pane pane-folder" aria-label="Wycena" data-partial="quote-folder"></section>
  <section class="pane pane-detail" aria-label="Dobieranie wykonawców">
    <div class="ikpm-content">
      <div class="pane-head">
        <a class="ikpm-back" :href="link('builder', {id: q.id})"><span x-text="'Wycena #' + q.id"></span></a>
        <div class="pane-context" x-text="'Wycena #' + q.id + ' · ' + clientName(q)"></div>
        <h1 class="ikpm-page-title">Dobieranie wykonawców — Wycena #<span x-text="q.id"></span></h1>
        <a class="btn btn-outline-secondary mt-2 d-none d-md-inline-flex" :href="link('builder', {id: q.id})"><i class="bi bi-arrow-left" aria-hidden="true"></i>Wróć do edytora</a>
      </div>
      <div x-show="!qJobs(q).length" class="ikpm-empty"><i class="bi bi-people" aria-hidden="true"></i><p class="ikpm-empty-title">Wycena nie ma jeszcze żadnych prac. Dodaj prace w edytorze.</p><a class="btn btn-primary" :href="link('builder', {id: q.id})">Wróć do edytora</a></div>
      <div x-show="qJobs(q).length && !src" class="alert alert-warning" role="note"><span class="ikpm-koncepcja">prototyp</span>
        Plany doboru pochodzą z prawdziwego doboru wykonawców i są policzone tylko dla ilości z danych testowych tej wyceny. Dla obecnych ilości prototyp nie ma planu — w aplikacji plan liczy się zawsze.</div>
      <template x-if="src">
        <div>
          <p class="ikpm-meta ikpm-measure">Plany pomijają ekipy o nietypowej dla danej pracy cenie, tempie lub jakości. Poza „Najszybszym” żaden etap nie trwa ponad 2 × tyle, co przy najszybszym podziale prac na najwyżej 3 ekipy naraz (o ile ekipy na to pozwalają) — dlatego „Najtańszy” nie zawsze bierze najtańsze ekipy, a „Minimum ekip” dobiera kolejną ekipę, gdy jedna robiłaby etap za długo. Plan najlepszy w kilku miarach widać na kilku kartach.</p>
          <div class="plan-grid">
            <template x-for="key in Object.keys(PROFILES)" :key="key">
              <article class="card card-body d-flex flex-column" :class="q.applied_profile_name === key && 'ikpm-selected'" :aria-labelledby="'plan-' + key">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                  <h2 class="h5 mb-0 me-auto" :id="'plan-' + key"><i class="bi" :class="PROFILE_ICONS[key]" aria-hidden="true"></i> <span x-text="PROFILES[key]"></span></h2>
                  <template x-if="q.applied_profile_name === key"><span class="ikpm-chip ikpm-tone-accent"><i class="bi bi-check-circle-fill" aria-hidden="true"></i>Zastosowany</span></template>
                  <span class="ikpm-chip" :class="plan(key).summary.coverage_pct === 100 ? 'ikpm-tone-success' : 'ikpm-tone-danger'" x-text="plan(key).summary.coverage_pct + '%'"></span>
                </div>
                <dl class="ikpm-dl ikpm-dl-num mb-3">
                  <dt>Koszt ekip:</dt><dd class="fw-bold" x-text="pln(plan(key).summary.total_cost)"></dd>
                  <dt>Liczba ekip:</dt><dd class="fw-bold" x-text="plan(key).summary.contractor_count"></dd>
                  <dt>Czas realizacji:</dt>
                  <dd class="fw-bold" x-text="hoursText(plan(key).summary.makespan_hours)"></dd>
                  <dd class="plan-days ikpm-meta" x-show="plan(key).work_days" x-text="workDaysText(plan(key).work_days) + ' z odbiorami etapów'"></dd>
                  <dt>Łącznie roboczogodzin:</dt><dd class="fw-bold" x-text="hoursText(plan(key).summary.total_work_hours)"></dd>
                  <dt>Śr. jakość:</dt><dd><b x-text="pct1(plan(key).summary.avg_quality)"></b> /10</dd>
                </dl>
                <div class="ikpm-progress mb-3">
                  <div class="ikpm-progress-head"><span :id="'cov-' + key">Pokrycie:</span><span x-text="plan(key).summary.coverage_pct + '%'"></span></div>
                  <div class="progress" role="progressbar" :aria-labelledby="'cov-' + key" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="plan(key).summary.coverage_pct">
                    <div class="progress-bar" :class="plan(key).summary.coverage_pct === 100 ? 'bg-success' : 'bg-danger'" :style="'width:' + plan(key).summary.coverage_pct + '%'"></div></div>
                </div>
                <h3 class="h6 mb-2">Harmonogram etapów:</h3>
                <ul class="list-unstyled mb-3 d-grid gap-2">
                  <template x-for="(st, i) in plan(key).stage_schedule" :key="st.stage">
                    <li><div class="d-flex justify-content-between gap-2 ikpm-meta mb-1"><span x-text="st.stage"></span><span class="text-nowrap ikpm-num" x-text="hoursText(st.duration_hours) + ' → ' + hoursText(cumulative(key, i))"></span></div>
                      <div class="progress" role="progressbar" :aria-label="'Etap ' + st.stage" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="Math.round(st.duration_hours / Math.max(plan(key).summary.makespan_hours, 0.1) * 100)">
                        <div class="progress-bar" :style="'width:' + (st.duration_hours / Math.max(plan(key).summary.makespan_hours, 0.1) * 100) + '%'"></div></div></li>
                  </template>
                </ul>
                <p class="row-late" x-show="plan(key).summary.unassigned_job_names.length" x-text="'Bez wykonawcy (brak w cenniku ekipy z ceną): ' + plan(key).summary.unassigned_job_names.join(', ')"></p>
                <h3 class="h6 mb-2">Wykonawcy:</h3>
                <div class="d-flex flex-wrap gap-1 mb-3"><template x-for="c in plan(key).summary.contractors_used" :key="c"><span class="ikpm-chip"><i class="bi bi-person" aria-hidden="true"></i><span x-text="c"></span></span></template></div>
                <button type="button" class="btn btn-lg mt-auto" :class="q.applied_profile_name === key ? 'btn-outline-success' : 'btn-primary'" @click="apply(key)">
                  <i class="bi" :class="q.applied_profile_name === key ? 'bi-arrow-clockwise' : 'bi-check-lg'" aria-hidden="true"></i>
                  <span x-text="q.applied_profile_name === key ? 'Zastosuj ponownie' : 'Zastosuj ten plan'"></span></button>
              </article>
            </template>
          </div>
          <details class="mt-4"><summary class="btn btn-outline-secondary">Harmonogram etapów — porównanie planów</summary>
            <div class="ikpm-table-box mt-2" tabindex="0"><table class="table mb-0">
              <thead><tr><th scope="col">Etap</th><template x-for="key in Object.keys(PROFILES)" :key="key"><th scope="col" class="ikpm-num" x-text="PROFILES[key]"></th></template></tr></thead>
              <tbody><template x-for="stage in stageNames()" :key="stage"><tr><th scope="row" class="fw-normal" x-text="stage"></th>
                <template x-for="key in Object.keys(PROFILES)" :key="key"><td class="ikpm-num" x-text="stageCell(key, stage)"></td></template></tr></template></tbody>
              <tfoot><tr><th scope="row">RAZEM</th><template x-for="key in Object.keys(PROFILES)" :key="key"><td class="ikpm-num fw-bold" x-text="hoursText(plan(key).summary.makespan_hours)"></td></template></tr></tfoot>
            </table></div></details>
          <details class="mt-3"><summary class="btn btn-outline-secondary">Porównanie — kto robi co w każdym planie</summary>
            <div class="ikpm-table-box mt-2" tabindex="0"><table class="table mb-0">
              <thead><tr><th scope="col">Pokój</th><th scope="col">Praca</th><th scope="col" class="ikpm-num">Ilość</th><template x-for="key in Object.keys(PROFILES)" :key="key"><th scope="col" x-text="PROFILES[key]"></th></template></tr></thead>
              <tbody><template x-for="row in whoDoesWhat()" :key="row.id"><tr><td x-text="row.room"></td><td x-text="row.job"></td><td class="ikpm-num" x-text="row.qty"></td>
                <template x-for="cell in row.cells"><td x-text="cell"></td></template></tr></template></tbody>
            </table></div></details>
        </div>
      </template>
    </div>
  </section>
</div>
</template>
</main>
<script type="module">
import { boot, db, quoteOps, intParam, link, go, flashNext, alertBox, confirmBox, planSource, applyPlan, PROFILES, jobsGen, pln, hoursText, dec, sortJobs } from '../assets/app.js';
boot(() => ({
  ...quoteOps(),
  room: null, view: null, src: null,
  init() {
    const _id = intParam('id');
    const _q = db.quotes.find((x) => x.id === _id) ?? null;
    if (!_q) { location.replace(link('error-404')); return; }
    if (_q.status !== 'draft') { flashNext('alert', 'Wycena jest u klienta — przywróć ją do edycji, aby ją zmienić.'); location.replace(link('quote-show', { id: _id })); return; }
    this.currentQuoteId = _id; this.src = planSource(_q); this.q = _q;
    document.title = `Dobieranie wykonawców — Wycena #${_id} — IKPM`;
  },
  plan(key) { return this.src.plans[key]; },
  cumulative(key, i) { return this.plan(key).stage_schedule.slice(0, i + 1).reduce((s, st) => s + st.duration_hours, 0); },
  stageNames() { return [...new Set(Object.keys(PROFILES).flatMap((k) => this.plan(k).stage_schedule.map((s) => s.stage)))]; },
  stageCell(key, stage) {
    const _s = this.plan(key).stage_schedule.find((x) => x.stage === stage);
    return _s ? `${hoursText(_s.duration_hours)} (${_s.crews.map((c) => `${c.contractor}: ${hoursText(c.hours)}`).join(', ')})` : '—';
  },
  whoDoesWhat() {
    return this.q.rooms.flatMap((r) => sortJobs(r.jobs).map((j) => ({
      id: j.id, room: r.name, job: j.name, qty: `${dec(j.quantity)} ${j.unit}`,
      cells: Object.keys(PROFILES).map((k) => {
        const _a = this.plan(k).assignments.find((x) => x.quote_job_id === j.id) ?? this.plan(k).assignments.find((x) => x.room === r.name && x.job === j.name);
        return _a ? `${_a.contractor} · ${pln(_a.price)} · ${hoursText(_a.job_hours)}` : 'brak';
      }),
    })));
  },
  async apply(key) {
    const _again = this.q.applied_profile_name === key;
    const _ok = await confirmBox({
      title: `${_again ? 'Zastosować ponownie' : 'Zastosować'} plan '${PROFILES[key]}'? Przypisze wykonawców do ${jobsGen(this.plan(key).assignments.length)}; cennik zastąpi ręcznie wpisane ceny ekipy.`,
      consequences: ['Ceny ekip i koszt materiałów zostaną zamrożone w wycenie — zmiany cennika ich nie przesuną.',
        `Sugerowany termin: ${this.plan(key).work_days ? `${this.workDaysText(this.plan(key).work_days)} od planowanego startu` : '—'}.`],
      ok: _again ? 'Zastosuj ponownie' : 'Zastosuj ten plan',
    });
    if (!_ok) return;
    const _r = applyPlan(this.q, key);
    if (!_r.ok) { alertBox(_r.error); return; }
    flashNext('notice', _r.notice); go('builder', { id: this.q.id });
  },
}));
</script>
</body>
</html>
